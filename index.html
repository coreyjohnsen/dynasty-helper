<style>
/* ============ tokens ============ */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --surface-2:#f9f9f7; --surface-3:#f2f2ee; --plane:#f4f4f1;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10); --border-strong:rgba(11,11,11,0.18);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --seq-100:#cde2fb; --seq-150:#b7d3f6; --seq-200:#9ec5f4; --seq-250:#86b6ef; --seq-300:#6da7ec;
  --seq-350:#5598e7; --seq-400:#3987e5; --seq-450:#2a78d6; --seq-500:#256abf; --seq-550:#1c5cab;
  --seq-600:#184f95; --seq-650:#104281; --seq-700:#0d366b;
  --div-neutral:#f0efec;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300; --bad-text:#a92f2f;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
  --r:10px; --r-sm:7px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1a1a19; --surface-2:#141413; --surface-3:#232322; --plane:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --div-neutral:#383835;
    --good-text:#0ca30c; --bad-text:#e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --surface-2:#141413; --surface-3:#232322; --plane:#0d0d0d;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --div-neutral:#383835;
  --good-text:#0ca30c; --bad-text:#e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--text-primary);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:620;letter-spacing:-.011em}
a{color:var(--s1)}
button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--axis);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--surface-2);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--s1),var(--s7));flex:none}
.brand b{font-size:13.5px;letter-spacing:-.015em;line-height:1.15}
.brand small{display:block;color:var(--text-muted);font-size:10.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--text-secondary);cursor:pointer;text-align:left;width:100%;font-size:13px;font-weight:500;transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface-3);color:var(--text-primary)}
.navbtn.on{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:var(--shadow)}
.navbtn .ic{width:16px;text-align:center;font-size:13px;opacity:.9;flex:none}
.navbtn.on .ic{color:var(--s1)}
.side .spacer{flex:1}
.side .foot{padding:8px;border-top:1px solid var(--border);margin-top:8px;font-size:11px;color:var(--text-muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface-1);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .lg{font-weight:640;letter-spacing:-.012em}
.topbar .sub{color:var(--text-muted);font-size:12px}
.topbar .grow{flex:1}
.content{padding:20px;max-width:1500px;width:100%}

/* ============ atoms ============ */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card .hd{padding:13px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .hd h3{font-size:14px}
.card .hd .note{color:var(--text-muted);font-size:11.5px}
.card .bd{padding:14px 16px 16px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.grid.split{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media (max-width:860px){ .grid.split{grid-template-columns:minmax(0,1fr)} }
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row>*{min-width:0}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:11.5px}
.big{font-size:26px;font-weight:660;letter-spacing:-.02em}
.hero{font-size:34px;font-weight:660;letter-spacing:-.025em;line-height:1.1}

.btn{padding:6px 11px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-1);cursor:pointer;font-size:12.5px;font-weight:520;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:11.5px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:2px;gap:2px;border:1px solid var(--border)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:520;color:var(--text-secondary)}
.seg button.on{background:var(--surface-1);color:var(--text-primary);font-weight:620;box-shadow:0 1px 2px rgba(0,0,0,.08)}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary)}
input:focus,select:focus{outline:2px solid var(--s1);outline-offset:-1px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text-muted);font-weight:560}

.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:620;border:1px solid var(--border)}
.pos-QB{background:#e34948;color:#fff;border-color:transparent}
.pos-RB{background:#1baf7a;color:#fff;border-color:transparent}
.pos-WR{background:#2a78d6;color:#fff;border-color:transparent}
.pos-TE{background:#eb6834;color:#fff;border-color:transparent}
.pos-K{background:#8a8880;color:#fff;border-color:transparent}
.pos-DEF{background:#4a3aa7;color:#fff;border-color:transparent}
.pos-PICK{background:#eda100;color:#231a00;border-color:transparent}
.pos-FLEX,.pos-NA{background:var(--surface-3);color:var(--text-secondary)}
.hypbar{border:1px dashed var(--s7);border-radius:var(--r);background:color-mix(in srgb, var(--s7) 6%, var(--surface-1));padding:13px 15px;margin-bottom:14px;min-width:0}
.hypbar.quiet{padding:9px 13px}
.hyp-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;background:#4a3aa7;color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;flex:none;white-space:nowrap}
:root[data-hyp] .topbar{box-shadow:inset 0 -2px 0 var(--s7)}
.btn.hypon{background:var(--s7);border-color:var(--s7);color:#fff}
.btn.hypon:hover{filter:brightness(1.08)}
tr.hyp-out td{opacity:.42}
.plink{cursor:pointer;border-bottom:1px solid color-mix(in srgb, var(--s1) 45%, transparent);transition:color .12s,border-color .12s}
.plink:hover{color:var(--s1);border-bottom-color:var(--s1)}
.plink:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-1);cursor:pointer;font-size:12px;font-weight:560;user-select:none;transition:background .12s,border-color .12s,color .12s}
.chip:hover{background:var(--surface-3)}
.chip.on{background:var(--s1);border-color:var(--s1);color:#fff}
.chip.on .dot{background:#fff}
.chipwrap{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--surface-3);border:1px solid var(--border);font-size:10.5px;font-weight:600;color:var(--text-secondary)}
.up{color:var(--good-text);font-weight:620}
.down{color:var(--bad-text);font-weight:620}
.flat{color:var(--text-muted)}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-weight:600;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--grid);position:sticky;top:0;background:var(--surface-1);z-index:2;white-space:nowrap}
table.tbl th.num,table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--surface-3)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--text-primary)}
.scroll-x{overflow-x:auto;max-width:100%}
/* A table wider than its card scrolls sideways. Without a cue that reads as a
   column someone simply cut off, so the fade is driven by measurement: it is
   there only while there is genuinely more to the right, and it fades out as
   you reach the end. */
.sx{position:relative;min-width:0}
.sx::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:38px;pointer-events:none;
  opacity:0;transition:opacity .16s;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:linear-gradient(to left, var(--surface-1) 18%, color-mix(in srgb, var(--surface-1) 55%, transparent) 62%, transparent);
}
.sx.more::after{opacity:1}
.sx .sx-hint{
  position:absolute;right:6px;bottom:1px;pointer-events:none;opacity:0;transition:opacity .16s;
  background:var(--surface-3);border:1px solid var(--border);border-radius:99px;
  padding:1px 8px;font-size:10.5px;font-weight:620;color:var(--text-secondary);white-space:nowrap;
}
/* The worded hint is for touch, where there is no scrollbar to see and no
   wheel to try; on a desktop the fade plus a scrollbar already says it, so the
   chip and the strip it needs stay off there and the layout is untouched. */
@media (max-width: 900px){
  .sx.more.hintable .sx-hint{opacity:.94}
  /* its own strip under the rows, so it never sits on top of a number. The class
     is set from a measurement and does not toggle with scroll position, so
     nothing reflows as you swipe. */
  .sx.canscroll.hintable>.scroll-x{padding-bottom:19px}
}

.bar-track{background:var(--surface-3);border-radius:4px;height:8px;overflow:hidden;min-width:40px}
.bar-fill{height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.meter{display:flex;align-items:center;gap:8px}

.tt{position:fixed;z-index:200;pointer-events:none;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--r-sm);box-shadow:0 4px 20px rgba(0,0,0,.18);padding:8px 10px;font-size:12px;max-width:280px;opacity:0;transition:opacity .09s}
.tt.on{opacity:1}
.tt .k{color:var(--text-muted);font-size:11px}
.tt b{font-weight:640}

.avatar{width:22px;height:22px;border-radius:6px;background:var(--surface-3);flex:none;object-fit:cover}
.tm{display:flex;align-items:center;gap:7px;min-width:0}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}

.empty{padding:40px 20px;text-align:center;color:var(--text-muted)}
.kpi{display:flex;flex-direction:column;gap:1px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-1)}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:620}
.kpi .val{font-size:21px;font-weight:650;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--text-secondary)}

.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font)}
.ax{font-size:10.5px;fill:var(--text-muted);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.axline{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);align-items:center}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

.splash{min-height:100vh;display:grid;place-items:center;padding:26px;background:var(--plane)}
.splash .box{width:100%;max-width:520px}
.loadbar{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.loadbar i{display:block;height:100%;background:var(--s1);width:0;transition:width .3s}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--s1);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.stale{opacity:.45;transition:opacity .2s}

.tradebox{border:1px dashed var(--border-strong);border-radius:var(--r);min-height:78px;padding:8px;display:flex;flex-direction:column;gap:5px;background:var(--surface-2)}
.asset{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:6px;background:var(--surface-1);border:1px solid var(--border);font-size:12px;cursor:pointer;min-width:0}
.asset>*{min-width:0}
.asset>span:not(.pill):not(.v):not(.x){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset .v,.asset .pill{flex:none}
.asset:hover{border-color:var(--s1)}
.asset .x{margin-left:auto;color:var(--text-muted);font-weight:700;padding:0 3px}
.asset .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:11.5px}
.asset.pickable:hover{background:var(--surface-3)}
.picker{max-height:330px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);padding:5px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2)}

.board{display:grid;gap:3px;min-width:760px}
.cell{border-radius:6px;padding:5px 6px;font-size:11px;border:1px solid var(--border);background:var(--surface-1);min-height:46px;overflow:hidden}
.cell .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .mt{color:var(--text-muted);font-size:10px;display:flex;gap:4px;align-items:center}

/* ============ narrow screens ============
   Everything below is scoped to a width or pointer query, so the desktop
   layout above is untouched. */
@media (max-width: 900px){
  /* auto rows in a min-height grid stretch to fill it, which turned the nav
     strip into a tall empty band on any page shorter than the screen */
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  /* the sidebar becomes one sticky, horizontally scrolling tab strip: five
     wrapped rows of nav pushed every page a third of a screen down, and the
     nav went out of reach the moment you scrolled */
  .side{
    position:sticky;top:0;z-index:40;height:auto;max-width:100%;min-width:0;
    flex-direction:row;flex-wrap:nowrap;gap:4px;padding:6px 8px;
    border-right:0;border-bottom:1px solid var(--border);
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;scrollbar-width:none;
  }
  .side::-webkit-scrollbar{display:none}
  .brand,.side .spacer,.side .foot{display:none}
  .navbtn{width:auto;white-space:nowrap;flex:0 0 auto;scroll-snap-align:center;padding:8px 11px}
  /* the top bar stops competing with the nav for the sticky slot */
  .topbar{position:static;padding:10px 14px;gap:8px}
  .topbar .lg{font-size:15px}
  .topbar>div:first-child{flex:1 1 100%}
  .topbar .grow{display:none}
  .content{padding:12px;max-width:100%}
  .card .hd{padding:12px 13px 0}
  .card .bd{padding:12px 13px 14px}
  /* a five-option segmented control is wider than a phone; let it wrap rather
     than push the page sideways */
  .seg{flex-wrap:wrap;max-width:100%}
  .kpi{padding:10px 12px}
  .kpi .val{font-size:19px}
  .hero{font-size:27px}
  .big{font-size:22px}
  .hypbar{padding:11px 12px}
  .picker{max-height:46vh}
  .tt{max-width:min(280px, calc(100vw - 24px))}
  .board{min-width:660px}
  .scroll-x{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
}
@media (max-width: 560px){
  .content{padding:10px}
  .card .hd{padding:11px 11px 0}
  .card .bd{padding:11px 11px 13px}
  table.tbl{font-size:12px}
  /* a long franchise name should not push every number off the screen */
  table.tbl .tm{max-width:112px}
  /* inside a table cell a wrapping row puts the position pill on its own line
     and doubles the row height; the name should ellipsise instead */
  /* a two-line header is worth far more than a column pushed off the screen */
  table.tbl th{white-space:normal;line-height:1.2}
  table.tbl .row{flex-wrap:nowrap}
  table.tbl .pill,table.tbl .tag{flex:none}
  table.tbl .plink{min-width:0;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.tbl th,table.tbl td{padding:7px 5px}
  table.tbl th:first-child,table.tbl td:first-child{padding-left:2px}
  table.tbl th:last-child,table.tbl td:last-child{padding-right:2px}
  .grid{gap:11px}
  .topbar{padding:9px 11px}
}
/* Touch devices and phone widths: fingers are not cursors. A desktop window is
   never below 560px in practice, so nothing here reaches a machine with a mouse. */
@media (pointer: coarse), (max-width: 560px){
  .btn{min-height:38px;padding:8px 13px}
  .btn.sm{min-height:32px;padding:6px 11px;font-size:12px}
  .chip{min-height:34px;padding:6px 12px}

/* ================= gamma sampling =================

  if (nDiv > 1) {
    const seen = new Set(), winners = [];
    for (const r of order) { const d = r.team.division; if (d && !seen.has(d)) { seen.add(d); winners.push(r); } }
    const ws = new Set(winners);
    order = winners.concat(order.filter(r => !ws.has(r)));
  }
  order.forEach((r, i) => { r.seed = i + 1; r.divWinner = nDiv > 1 && i < nDiv; });
  const standings = order;
  const field = order.slice(0, playoffTeams);
  const seedOf = {}; field.forEach((r, i) => seedOf[r.rosterId] = i + 1);

  const playRound = (list, wk) => {
    const games = [], winners = [];
    const arr = list.slice();
    for (let i = 0; i < arr.length / 2; i++) {
      const A = arr[i], B = arr[arr.length - 1 - i];
      const ra = scoreDetail(A.i, wk), rb = scoreDetail(B.i, wk);
      const win = ra.total >= rb.total ? A : B;
      games.push({ a: A, b: B, aPts: ra.total, bPts: rb.total, win, aTop: ra.top, bTop: rb.top, margin: Math.abs(ra.total - rb.total) });
      winners.push(win);
    }
    return { games, winners };
  };
  const bracket = [];
  let alive = field.slice();
  let wk = S.regEnd + 1;
  const byes = (1 << Math.ceil(Math.log2(Math.max(2, playoffTeams)))) - playoffTeams;
  if (byes > 0 && alive.length > 2) {
    const seeded = alive.slice(0, byes), rest = alive.slice(byes);
    const r = playRound(rest, wk);
    bracket.push({ name: roundName(alive.length), week: wk, games: r.games, byes: seeded });
    alive = seeded.concat(r.winners).sort((x, y) => seedOf[x.rosterId] - seedOf[y.rosterId]);
    wk++;
  }
  let guard = 0;
  while (alive.length > 1 && guard++ < 6) {
    const r = playRound(alive, wk);
    bracket.push({ name: roundName(alive.length), week: wk, games: r.games });
    alive = r.winners.sort((x, y) => seedOf[x.rosterId] - seedOf[y.rosterId]);
    wk++;
  }
  const champion = alive[0] || null;
  const lastRound = bracket[bracket.length - 1];
  const runnerUp = lastRound && lastRound.games[0]
    ? (lastRound.games[0].win === champion ? (lastRound.games[0].a === champion ? lastRound.games[0].b : lastRound.games[0].a) : null) : null;

  // storylines
  const allGames = weeks.reduce((acc, w) => acc.concat(w.games.map(g => Object.assign({ week: w.week }, g))), []);
  const simGames = allGames.filter(g => !weeks[g.week - 1].actual);
  const byScore = [];
  weeks.forEach(w => w.games.forEach(g => { byScore.push({ week: w.week, rid: g.a, pts: g.aPts, top: g.aTop }); byScore.push({ week: w.week, rid: g.b, pts: g.bPts, top: g.bTop }); }));
  byScore.sort((a, b) => b.pts - a.pts);
  const blowout = allGames.slice().sort((a, b) => b.margin - a.margin)[0];
  const nailBiter = allGames.filter(g => g.margin > 0).sort((a, b) => a.margin - b.margin)[0];
  const streakOf = (r) => {
    let best = 0, cur = 0;
    r.form.forEach(f => { if (f === 'W') { cur++; best = Math.max(best, cur); } else cur = 0; });
    return best;
  };
  rec.forEach(r => r.streak = streakOf(r));
  const awards = {
    highScore: byScore[0] || null,
    blowout, nailBiter,
    mostPF: standings.slice().sort((a, b) => b.pf - a.pf)[0],
    bestRecord: standings[0],
    longestStreak: rec.slice().sort((a, b) => b.streak - a.streak)[0],
    unluckiest: standings.slice().sort((a, b) => (a.w - a.pfRank) - (b.w - b.pfRank))[0]
  };
  const pfOrder = standings.slice().sort((a, b) => b.pf - a.pf);
  pfOrder.forEach((r, i) => r.pfRank = i + 1);
  awards.unluckiest = standings.slice().sort((a, b) => (a.seed - a.pfRank) - (b.seed - b.pfRank)).reverse()[0];

  return { seed, weeks, standings, field, bracket, champion, runnerUp, awards, playoffTeams, nDiv, simulatedFrom: S.lastWeek + 1 };
}

/* actual weekly scoring for one player, straight out of Sleeper's matchup rows */
function playerGameLog(id) {
  const out = [];

    const ms = S.matchups[w] || [];
    const row = ms.find(m => (m.players || []).map(String).includes(String(id)));
    if (!row) { out.push({ week: w, pts: null, started: false, rostered: false }); continue; }
    const pp = row.players_points || {};
    const pts = pp[id] === undefined ? null : pp[id];
    out.push({ week: w, pts, started: (row.starters || []).map(String).includes(String(id)), rostered: true, rosterId: row.roster_id });
  }

}

const TT = () => $('#tt');
function ttShow(evt, html) {
  const t = TT(); t.innerHTML = html; t.classList.add('on');
  const r = t.getBoundingClientRect();
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - 12;
  t.style.left = Math.max(6, x) + 'px'; t.style.top = Math.max(6, y) + 'px';
}
function ttHide() { TT().classList.remove('on'); }
function bindTT(el, htmlFn) {
  el.addEventListener('mousemove', e => ttShow(e, typeof htmlFn === 'function' ? htmlFn(e) : htmlFn));
  el.addEventListener('mouseleave', ttHide);

  // unreachable on a phone
  el.addEventListener('touchstart', e => {
    const t = e.touches[0]; if (!t) return;
    ttShow({ clientX: t.clientX, clientY: t.clientY }, typeof htmlFn === 'function' ? htmlFn(e) : htmlFn);
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    const t = e.touches[0]; if (!t) return;
    ttShow({ clientX: t.clientX, clientY: t.clientY }, typeof htmlFn === 'function' ? htmlFn(e) : htmlFn);
  }, { passive: true });
  el.addEventListener('touchend', ttHide);
  el.addEventListener('touchcancel', ttHide);

  el.addEventListener('blur', ttHide);
  return el;
}

/* line chart with crosshair — series: [{name,color,points:[{x,y,label}]}] */
function lineChart(series, opts) {
  opts = opts || {};
  const narrow = isNarrow();
  const W = opts.w || chartW(760, 400), H = opts.h || 230;
  const m = Object.assign(narrow ? { t: 10, r: 9, b: 24, l: 36 } : { t: 12, r: 14, b: 26, l: 46 }, opts.margin || {});
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = [].concat(...series.map(s => s.points));
  if (!all.length) return h('div.empty', 'No data yet');
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  let y0 = opts.y0 !== undefined ? opts.y0 : Math.min(...ys), y1 = opts.y1 !== undefined ? opts.y1 : Math.max(...ys);
  if (y1 === y0) { y1 = y0 + 1; }
  const padY = (y1 - y0) * 0.10; y0 -= padY; y1 += padY;
  if (opts.zero) y0 = Math.min(0, y0);
  // padding a series that bottoms out near zero pushes the axis negative, which
  // is nonsense for a quantity that cannot go below zero
  if (opts.floorAtZero && y0 < 0 && Math.min(...ys) >= 0) y0 = 0;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = v => m.l + (x1 === x0 ? iw / 2 : (v - x0) / (x1 - x0) * iw);
  const Y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
  const g = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img', 'aria-label': opts.aria || 'line chart' });
  g.style.height = H + 'px';
  const ticks = narrow ? 3 : 4;
  for (let i = 0; i <= ticks; i++) {
    const v = y0 + (y1 - y0) * i / ticks, y = Y(v);
    g.appendChild(svg('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    const tx = svg('text', { class: 'ax', x: m.l - 7, y: y + 3.5, 'text-anchor': 'end' });
    tx.textContent = opts.yFmt ? opts.yFmt(v) : fmt(v, 0); g.appendChild(tx);
  }
  g.appendChild(svg('line', { class: 'axline', x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
  const xt = opts.xTicks || (narrow ? 3 : 6);
  for (let i = 0; i <= xt; i++) {
    const v = x0 + (x1 - x0) * i / xt;
    const tx = svg('text', { class: 'ax', x: X(v), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === xt ? 'end' : 'middle' });
    tx.textContent = opts.xFmt ? opts.xFmt(v) : fmt(v, 0); g.appendChild(tx);
  }
  series.forEach(s => {
    const pts = s.points.slice().sort((a, b) => a.x - b.x);
    if (s.area) {
      const d = 'M' + X(pts[0].x) + ',' + (m.t + ih) + pts.map(p => 'L' + X(p.x) + ',' + Y(p.y)).join('') + 'L' + X(pts[pts.length - 1].x) + ',' + (m.t + ih) + 'Z';
      g.appendChild(svg('path', { d, fill: s.color, opacity: .10, stroke: 'none' }));
    }
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x) + ',' + Y(p.y)).join('');
    g.appendChild(svg('path', {
      d, fill: 'none', stroke: s.color, 'stroke-width': s.width || 2,
      opacity: s.opacity === undefined ? 1 : s.opacity,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke'
    }));
    if (opts.dots !== false && pts.length <= 30) pts.forEach(p => g.appendChild(svg('circle', { cx: X(p.x), cy: Y(p.y), r: 3.2, fill: s.color, stroke: 'var(--surface-1)', 'stroke-width': 2 })));
    if (s.endLabel === true && pts.length) {
      const last = pts[pts.length - 1];
      const t = svg('text', { class: 'ax', x: X(last.x) + 6, y: Y(last.y) + 3.5, fill: 'var(--text-secondary)', 'font-weight': 600 });
      t.textContent = s.name; if (opts.endLabels) g.appendChild(t);
    }
  });
  const cross = svg('line', { class: 'axline', x1: 0, x2: 0, y1: m.t, y2: m.t + ih, opacity: 0, stroke: 'var(--axis)' });
  g.appendChild(cross);
  const hit = svg('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' });
  g.appendChild(hit);
  const probe = (clientX, e) => {
    const bb = g.getBoundingClientRect();
    const px = (clientX - bb.left) / bb.width * W;
    const xv = x0 + (px - m.l) / iw * (x1 - x0);
    let near = null;
    series.forEach(s => s.points.forEach(p => { if (!near || Math.abs(p.x - xv) < Math.abs(near.x - xv)) near = p; }));
    if (!near) return;
    cross.setAttribute('x1', X(near.x)); cross.setAttribute('x2', X(near.x)); cross.setAttribute('opacity', .55);
    const cap = opts.maxTip || 12;
    const hits = series.map(s => ({ s, p: s.points.find(p => p.x === near.x) })).filter(x => x.p);
    hits.sort((a, b) => b.p.y - a.p.y);
    const rows = hits.slice(0, cap).map(({ s, p }) =>
      `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${s.name}: <b>${opts.yFmt ? opts.yFmt(p.y) : fmt(p.y, 1)}</b></div>`
    ).join('') + (hits.length > cap ? `<div class="k">+${hits.length - cap} more</div>` : '');
    ttShow(e, `<div class="k">${near.label || (opts.xFmt ? opts.xFmt(near.x) : near.x)}</div>${rows}`);
  };
  hit.addEventListener('mousemove', e => probe(e.clientX, e));
  hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); ttHide(); });
  // dragging a finger along the plot moves the crosshair, the way it would a cursor
  const touch = e => { const t = e.touches[0]; if (t) probe(t.clientX, { clientX: t.clientX, clientY: t.clientY }); };
  hit.addEventListener('touchstart', touch, { passive: true });
  hit.addEventListener('touchmove', touch, { passive: true });
  const endTouch = () => { cross.setAttribute('opacity', 0); ttHide(); };
  hit.addEventListener('touchend', endTouch);
  hit.addEventListener('touchcancel', endTouch);
  return g;
}

/* vertical histogram */

/* sequential heatmap, teams × positions */
const SEQ = ['#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95'];

  opts = opts || {};

function sparkline(pts, opts) {

/* ================= week-by-week bars (actual vs projected) ================= */
function weeklyBars(items, opts) {
  opts = opts || {};
  const W = opts.w || chartW(720, 400), H = opts.h || 190,
    m = isNarrow() ? { t: 10, r: 8, b: 24, l: 28 } : { t: 10, r: 10, b: 26, l: 36 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = items.filter(i => i.v !== null && i.v !== undefined).map(i => i.v);
  const max = Math.max(...vals, 1) * 1.08;
  const bw = iw / Math.max(1, items.length);
  const g = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.aria || 'weekly points' });
  g.style.height = H + 'px';
  for (let i = 0; i <= 3; i++) {
    const v = max * i / 3, y = m.t + ih - (v / max) * ih;
    g.appendChild(svg('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    const t = svg('text', { class: 'ax', x: m.l - 6, y: y + 3.5, 'text-anchor': 'end' }); t.textContent = fmt(v, 0); g.appendChild(t);
  }
  items.forEach((it, i) => {
    const x = m.l + i * bw;
    if (it.v === null || it.v === undefined) {
      const t = svg('text', { class: 'ax', x: x + bw / 2, y: m.t + ih - 4, 'text-anchor': 'middle', opacity: .5 });
      t.textContent = it.bye ? 'BYE' : '–';
      if (it.bye) t.setAttribute('font-size', '8');
      g.appendChild(t);
    } else {
      const hgt = Math.max(1.5, (it.v / max) * ih);
      g.appendChild(svg('rect', {
        x: x + 2, y: m.t + ih - hgt, width: Math.max(1, bw - 4), height: hgt, rx: Math.min(4, (bw - 4) / 2),
        fill: it.kind === 'proj' ? 'var(--seq-200)' : 'var(--s1)'
      }));
    }
    const hit = svg('rect', { x, y: m.t, width: bw, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', e => ttShow(e, `<div class="k">Week ${it.x}${it.kind === 'proj' ? ' · projected' : ''}</div>` +
      (it.v === null || it.v === undefined
        ? '<b>' + (it.note || 'Did not play') + '</b>'
        : `<b>${fmt(it.v, 1)}</b> pts` + (it.note ? '<br>' + it.note : ''))));
    hit.addEventListener('mouseleave', ttHide);
    g.appendChild(hit);
    if (items.length <= 20 || i % 2 === 0) {
      const t = svg('text', { class: 'ax', x: x + bw / 2, y: H - 8, 'text-anchor': 'middle' }); t.textContent = it.x; g.appendChild(t);
    }
  });
  g.appendChild(svg('line', { class: 'axline', x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
  return g;
}

    yFmt: v => indexed ? fmt(v, 0) : kfmt(Math.round(v)),

      ? new Date(dates[clamp(Math.round(i), 0, dates.length - 1)]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
      : '',
    aria: 'every player on this roster, value over time'
  });
  const modeRow = h('div.row', { style: { justifyContent: 'flex-end', marginBottom: '6px' } },
    segmented([{ k: 'index', label: 'Indexed to 100' }, { k: 'value', label: 'Absolute value' }], StockUI.lines,
      k => { StockUI.lines = k; render(); }));
  const legend = h('div.legend', { style: { marginTop: '8px' } }, featured.map(r =>
    h('span', h('i', { style: { background: colorOf[r.p.id] } }), r.p.name))
    .concat(bg.length ? [h('span', h('i', { style: { background: 'var(--text-muted)', opacity: .3 } }), bg.length + ' more')] : []));

  const tbl = table([
    { k: 'name', h: 'Player', sort: r => r.p.name, f: r => h('div.row', { style: { gap: '6px' } }, posPill(r.p.pos), pname(r.p, { style: { fontWeight: 540 } })) },
    { k: 'first', prio: 2, h: 'Start', num: true, f: r => kfmt(r.first) },
    { k: 'last', h: 'Now', num: true, f: r => h('b.mono', kfmt(r.last)) },
    { k: 'chg', h: 'Change', num: true, f: r => deltaTag(r.chg, 0) },
    { k: 'pctc', h: '%', num: true, f: r => h('span', { class: r.pctc > 0 ? 'up mono' : r.pctc < 0 ? 'down mono' : 'mono' }, sgn(r.pctc * 100, 1) + '%') },
    { k: 'share', prio: 2, h: 'Share', num: true, sort: r => r.last, f: r => pct(r.last / Math.max(1, sum(rows.map(x => x.last))), 1) }
  ], rows, { sortKey: 'chg', sortDir: -1 });
  const wt = withTable(h('div', modeRow, chart, legend), tbl);
  const up = rows.filter(r => r.chg > 0).length;
  return card('Players behind the ticker',
    `${rows.length} priced players over the same ${StockUI.range} days · ${up} up, ${rows.length - up} down · `
    + (indexed ? 'every line starts at 100, so the shape is the percentage move' : 'absolute trade value') + ' · picks are not shown here',
    wt.body, wt.btn);
}

/* ================= 8. STOCK MODE ================= */

function viewStock() {
  const wrap = h('div.grid');
  const isTeam = StockUI.kind === 'team';
  const rostered = new Set(); S.teams.forEach(t => t.players.forEach(p => rostered.add(p.id)));
  const universe = Object.values(S.index).filter(p => p.dv > 200).sort((a, b) => b.dv - a.dv);
  if (StockUI.id === null) StockUI.id = isTeam ? S.teams[0].rosterId : (universe[0] || {}).id;

  wrap.appendChild(card('Pick a ticker', null, h('div.row', { style: { gap: '14px' } },
    h('label.fld', 'Type', segmented([{ k: 'player', label: 'Players' }, { k: 'team', label: 'Teams' }], StockUI.kind,
      k => { StockUI.kind = k; StockUI.id = k === 'team' ? S.teams[0].rosterId : universe[0].id; render(); })),
    isTeam
      ? h('label.fld', { style: { minWidth: '260px' } }, 'Team', h('select', { onchange: e => { StockUI.id = +e.target.value; render(); } },

        universe.slice(0, 500).map(p => h('option', { value: p.id, selected: p.id === StockUI.id },
          `${p.name} · ${p.pos}${p.posRank || ''}${rostered.has(p.id) ? '' : ' (FA)'}`)))),
    h('label.fld', 'Window', segmented([{ k: 30, label: '30d' }, { k: 90, label: '90d' }, { k: 180, label: '6m' }], StockUI.range, r => { StockUI.range = r; render(); })),
    h('span', { style: { flex: 1 } }),
    isTeam ? null : h('label.fld', ' ', h('button.btn.sm', { onclick: () => openPlayer(StockUI.id, 'stock') }, 'Player page →'))
  )));

  const series = isTeam ? teamSeries(StockUI.id, StockUI.range) : playerSeries(StockUI.id, StockUI.range);
  const subject = isTeam ? S.teamById[StockUI.id] : S.index[StockUI.id];
  if (!subject || !series.length) return wrap.appendChild(card(null, null, h('div.empty', 'No value history for this selection.'))), wrap;
  const first = series[0].v, last = series[series.length - 1].v;
  const chg = last - first, chgPct = first ? chg / first : 0;
  const observed = series.filter(s => s.real).length;
  const hi = Math.max(...series.map(s => s.v)), lo = Math.min(...series.map(s => s.v));

  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } },
    kpi(isTeam ? 'Franchise value' : 'Trade value', kfmt(last), (isTeam ? subject.name : subject.name)),
    kpi(StockUI.range + '-day change', sgn(chg, 0), sgn(chgPct * 100, 1) + '%'),
    kpi('30-day trend', isTeam ? sgn(sum(subject.players.map(p => p.trend30 || 0)), 0) : sgn(subject.trend30 || 0, 0), 'from FantasyCalc'),
    kpi('Range', kfmt(lo) + '–' + kfmt(hi), 'low to high in window'),
    isTeam ? kpi('League rank', '#' + subject.valueRank, 'by dynasty capital')
      : kpi('Position rank', (subject.pos || '') + (subject.posRank || '—'), 'overall #' + (subject.rank || '—'))
  ));

  const chart = lineChart([{
    name: isTeam ? subject.name : subject.name, color: chg >= 0 ? 'var(--s1)' : 'var(--s8)', area: true,
    points: series.map((s, i) => ({ x: i, y: s.v, label: new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) }))
  }], {
    h: 260, dots: false, yFmt: v => kfmt(Math.round(v)),
    xFmt: i => { const s = series[clamp(Math.round(i), 0, series.length - 1)]; return s ? new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''; },
    aria: 'value over time'
  });
  const tbl = table([
    { k: 'd', h: 'Date', f: r => new Date(r.d).toLocaleDateString() },
    { k: 'v', h: 'Value', num: true, f: r => kfmt(r.v) },
    { k: 'src', h: 'Source', sortable: false, f: r => r.real ? h('span.tag', 'observed') : h('span.tag', { style: { opacity: .7 } }, 'modelled') }
  ], series.slice().reverse(), {});
  const wt = withTable(chart, tbl);
  wrap.appendChild(card((isTeam ? 'Franchise' : 'Player') + ' value — ' + subject.name,
    `${observed} observed snapshot${observed === 1 ? '' : 's'} · the rest is modelled from FantasyCalc's published 30-day trend`,
    wt.body, wt.btn));

  if (isTeam) wrap.appendChild(stockTeamLines(subject, series));

  // movers
  const pool = Object.values(S.index).filter(p => p.dv > 500 && p.trend30);
  const risers = pool.slice().sort((a, b) => b.trend30 - a.trend30).slice(0, 12);
  const fallers = pool.slice().sort((a, b) => a.trend30 - b.trend30).slice(0, 12);
  const ownerOf = {}; S.teams.forEach(t => t.players.forEach(p => ownerOf[p.id] = t));
  const moverCols = [
    { k: 'name', h: 'Player', sort: r => r.name, f: r => h('div.row', { style: { gap: '6px' } }, posPill(r.pos), pname(r, { style: { fontWeight: 540 } })) },
    { k: 'owner', prio: 2, h: 'Roster', sort: r => (ownerOf[r.id] || {}).name || 'zz', f: r => ownerOf[r.id] ? h('span.tiny', ownerOf[r.id].short) : h('span.tiny.muted', 'FA') },
    { k: 'dv', h: 'Value', num: true, f: r => kfmt(Math.round(r.dv)) },
    { k: 'trend30', h: '30 days', num: true, f: r => deltaTag(r.trend30, 0) },
    { k: 'pctc', prio: 2, h: '%', num: true, sort: r => r.trend30 / Math.max(1, r.dv - r.trend30), f: r => h('span', { class: r.trend30 > 0 ? 'up mono' : 'down mono' }, sgn(r.trend30 / Math.max(1, r.dv - r.trend30) * 100, 1) + '%') },
    { k: 'spark', prio: 2, h: '', sortable: false, f: r => sparkline(playerSeries(r.id, 30), { w: 66, h: 20 }) }
  ];
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(340px,1fr))' } },
    card('Rising', 'biggest 30-day value gains league-wide', table(moverCols, risers, { sortKey: 'trend30', sortDir: -1 })),
    card('Falling', 'biggest 30-day value losses', table(moverCols, fallers, { sortKey: 'trend30', sortDir: 1 }))));

  const tv = S.teams.slice().sort((a, b) => b.totalValue - a.totalValue);
  wrap.appendChild(card('Franchise values', 'every team as a ticker — click a row to chart it',
    table([
      { k: 'name', h: 'Team', sort: r => r.name, f: r => teamCell(r) },
      { k: 'totalValue', h: 'Value', num: true, f: r => h('b.mono', kfmt(Math.round(r.totalValue))) },
      { k: 'rosterValue', prio: 2, h: 'Players', num: true, f: r => kfmt(Math.round(r.rosterValue)) },
      { k: 'pickCapital', prio: 2, h: 'Picks', num: true, f: r => kfmt(Math.round(r.pickCapital)) },
      { k: 'trend', h: '30 days', num: true, sort: r => sum(r.players.map(p => p.trend30 || 0)), f: r => deltaTag(sum(r.players.map(p => p.trend30 || 0)), 0) },
      { k: 'age', prio: 2, h: 'Avg age', num: true, f: r => r.age ? fmt(r.age, 1) : '—' },
      { k: 'spark', prio: 2, h: '', sortable: false, f: r => sparkline(teamSeries(r.rosterId, 30), { w: 70, h: 20 }) }
    ], tv, {
      sortKey: 'totalValue', sortDir: -1,
      onRow: r => { StockUI.kind = 'team'; StockUI.id = r.rosterId; render(); window.scrollTo(0, 0); }
    })));
  return wrap;
}

function openPlayer(id, back) {

/** A player's name, rendered as a link into the player page. */
function pname(p, opts) {
  opts = opts || {};
  if (!p || p.pos === 'PICK' || !p.id) return h('span', (p && (p.name || p.label)) || '—');
  const el = h('span.plink', {
    tabindex: 0, role: 'link',
    style: opts.style || null,
    onclick: (e) => { e.stopPropagation(); openPlayer(p.id); },
    onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openPlayer(p.id); } }
  }, p.name);
  return el;
}

/* ================= 9. PLAYER PAGE ================= */
const PlayerUI = { id: null, back: 'roster', range: 90 };
function viewPlayer() {

  wrap.appendChild(card(null, null, h('div.row', { style: { gap: '15px', alignItems: 'center' } },
    headshot ? h('img', {

    }) : h('div', { style: { width: '66px', height: '66px', borderRadius: '12px', background: 'var(--surface-3)', flex: 'none' } }),
    h('div', { style: { minWidth: 0 } },
      h('div.row', { style: { gap: '8px' } }, posPill(p.pos),
        h('h2', { style: { fontSize: '22px', letterSpacing: '-.02em' } }, p.name),
        injuryTag(p.injury)),
      h('div.tiny.sec', { style: { marginTop: '2px' } },
        [p.team || 'Free agent', p.age ? fmt(p.age, 1) + ' years old' : null,
        p.exp !== null && p.exp !== undefined ? (p.exp === 0 ? 'rookie' : p.exp + ' yrs exp') : null,
        p.college || null,
        p.draft ? `${p.draft.year} round ${p.draft.round}, pick ${p.draft.pick}` : null].filter(Boolean).join(' · ')),
      h('div.tiny.muted', { style: { marginTop: '3px' } },
        owner ? `Rostered by ${owner.name}` + (owner.taxi.has(p.id) ? ' — taxi squad' : owner.ir.has(p.id) ? ' — injured reserve' : owner.starterIds.has(p.id) ? ' — projected starter' : ' — bench') : 'Not on any roster in this league')))));

  // ---- headline numbers ----
  const trendPct = p.trend30 && (p.dv - p.trend30) > 0 ? p.trend30 / (p.dv - p.trend30) : 0;
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(146px,1fr))' } },
    kpi('Dynasty value', kfmt(Math.round(p.dv || 0)), p.rank ? 'overall #' + p.rank : 'unranked',

    kpi('Position rank', (p.pos || '') + (p.posRank || (myIdx >= 0 ? myIdx + 1 : '—')), p.tier ? 'tier ' + p.tier : 'of ' + posPeers.length + ' ranked'),
    kpi('30-day trend', p.trend30 ? sgn(p.trend30, 0) : 'flat', p.trend30 ? sgn(trendPct * 100, 1) + '%' : 'no movement'),
    kpi('Projected', fmt(p.ppg || 0, 1), p.wk ? 'pts / week remaining' : 'pts / week now',
      p.wk
        ? `<div class="k">Sleeper weekly projections</div>Average over the weeks still to play, byes excluded. Each week's projected stat line is scored with this league's own settings, so custom scoring is respected.`
        : `<div class="k">Estimated</div>Sleeper publishes no weekly projection for this player, so this comes from the redraft value's positional rank adjusted for league scoring.` + (p.injury ? '<br>Discounted for the <b>' + p.injury + '</b> tag.' : '')),
    kpi('Projected 2–3 yrs', fmt(p.fppg || 0, 1), 'pts / week',
      `<div class="k">Future outlook</div>Dynasty-value rank run through the same curve, then aged with a ${p.pos}-specific decline profile.`),
    kpi('Redraft value', kfmt(Math.round(p.rv || 0)), p.rv && p.dv ? (p.rv > p.dv ? 'win-now premium' : 'dynasty premium') : '—',

  }));

        : { x: w, v: null, kind: 'proj', bye: true, note: 'Bye week' });

      bars.push({ x: w, v: Math.round((p.ppg || 0) * 10) / 10, kind: 'proj', note: 'Projection, not a result' });
    }
  }
  const logTable = table([
    { k: 'week', h: 'Week', num: true, f: r => r.x },
    { k: 'kind', h: 'Type', f: r => r.kind === 'proj' ? h('span.tag', 'projected') : h('span.tag', { style: { borderColor: 'var(--s1)', color: 'var(--s1)' } }, 'actual') },
    { k: 'v', h: 'Points', num: true, f: r => r.v === null ? '—' : h('b.mono', fmt(r.v, 1)) },

  wrap.appendChild(card('Weekly scoring',
    (S.lastWeek ? `weeks 1–${S.lastWeek} actual, the rest projected` : 'all projected — the season has not started')

    + (byeList.length ? ' · bye week ' + byeList.join(', ') : ''),
    wt.body, wt.btn));

  // ---- value history ----
  const series = playerSeries(p.id, PlayerUI.range);
  if (series.length > 1) {
    const first = series[0].v, last = series[series.length - 1].v;
    wrap.appendChild(card('Value over time', `${series.filter(s => s.real).length} observed snapshot${series.filter(s => s.real).length === 1 ? '' : 's'} · earlier points modelled from the published 30-day trend`,
      h('div', lineChart([{
        name: p.name, color: last >= first ? 'var(--s1)' : 'var(--s8)', area: true,
        points: series.map((s, i) => ({ x: i, y: s.v, label: new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) }))
      }], {
        h: 220, dots: false, yFmt: v => kfmt(Math.round(v)),
        xFmt: i => { const s = series[clamp(Math.round(i), 0, series.length - 1)]; return s ? new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''; },
        aria: 'value over time'
      })),
      segmented([{ k: 30, label: '30d' }, { k: 90, label: '90d' }, { k: 180, label: '6m' }], PlayerUI.range, r => { PlayerUI.range = r; render(); })));
  }

  // ---- comparables ----
  const lo = Math.max(0, myIdx - 4), peers = posPeers.slice(lo, lo + 9);
  wrap.appendChild(card('Around him at ' + p.pos, 'nearest players by dynasty value — click any name',
    table([
      { k: 'rk', h: '#', num: true, sortable: false, f: (r) => posPeers.indexOf(r) + 1 },
      { k: 'name', h: 'Player', sort: r => r.name, f: r => h('div.row', { style: { gap: '6px' } }, pname(r, { style: r.id === p.id ? { fontWeight: '700' } : null }), r.id === p.id ? h('span.tag', 'this player') : null) },
      { k: 'team', prio: 2, h: 'NFL', f: r => r.team || '—' },
      { k: 'age', h: 'Age', num: true, f: r => r.age ? fmt(r.age, 1) : '—' },
      { k: 'dv', h: 'Value', num: true, f: r => h('b.mono', kfmt(Math.round(r.dv || 0))) },
      { k: 'ppg', h: 'Proj', num: true, f: r => fmt(r.ppg || 0, 1) },
      { k: 'fppg', prio: 2, h: 'Proj ’28', num: true, f: r => fmt(r.fppg || 0, 1) },

      { k: 'own', prio: 2, h: 'Roster', sortable: false, f: r => { const o = ownerOfPlayer(r.id); return o ? h('span.tiny', o.short) : h('span.tiny.muted', 'FA'); } }
    ], peers, { onRow: r => openPlayer(r.id) })));
  return wrap;
}

/* ==================================================================
   Analysis layer — free agents, roster scouting, trade history
   ================================================================== */

/* ---------- free agents ---------- */
/** Everyone with a projection who is not on a roster in this league. */
function freeAgents() {
  if (S._fa) return S._fa;
  const owned = new Set();
  S.teams.forEach(t => t.players.forEach(p => owned.add(p.id)));
  S._fa = Object.values(S.index)
    .filter(p => !owned.has(p.id) && POS_ALL.indexOf(p.pos) >= 0)
    .sort((a, b) => (b.ppg || 0) - (a.ppg || 0));
  return S._fa;
}
const POS_ALL = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
/** What adding this player would add to a team's optimal lineup. */
function marginalAdd(players, taxi, ir, player, key) {
  const act = players.filter(p => !taxi.has(p.id) && !ir.has(p.id));
  return lineupPoints(act.concat([player]), key) - lineupPoints(act, key);
}

/* ---------- roster scouting ---------- */
/** How many lineup slots a position can occupy: dedicated slots plus a share of
 *  every flex that accepts it. */
function slotDemand() {
  if (S._slotDemand) return S._slotDemand;
  const rp = (S.cfg.rosterPositions || []).filter(p => !['BN', 'IR', 'TAXI'].includes(p));
  const d = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DEF: 0 };
  rp.forEach(slot => {
    const elig = SLOT_ELIG[slot] || [slot];
    if (elig.length === 1) { if (d[elig[0]] !== undefined) d[elig[0]] += 1; return; }
    elig.forEach(pos => { if (d[pos] !== undefined) d[pos] += 1 / elig.length; });
  });
  S._slotDemand = d;
  return d;
}
/** A player good enough to be worth starting over a waiver-wire replacement. */
function startable(p) { return (p.ppg || 0) > (STREAM[p.pos] !== undefined ? STREAM[p.pos] : 5) * 1.05; }

function scoutTeam(t) {
  const demand = slotDemand();
  const act = activePlayers(t);
  const zNow = {}, zVal = {};
  POS4.forEach(pos => {
    const arr = S.teams.map(x => x.posNow[pos]);
    const m = mean(arr), sd = sd_(arr) || 1;
    zNow[pos] = (t.posNow[pos] - m) / sd;
    const av = S.teams.map(x => x.posValue[pos]);
    const mv = mean(av), sv = sd_(av) || 1;
    zVal[pos] = (t.posValue[pos] - mv) / sv;
  });
  const pos = POS_ALL.filter(p => (demand[p] || 0) > 0).map(p => {
    const group = act.filter(x => x.pos === p).sort((a, b) => (b.ppg || 0) - (a.ppg || 0));
    const good = group.filter(startable);
    const need = demand[p] || 0;
    const depth = good.length - need;              // spare startable bodies
    return {
      pos: p, need: Math.round(need * 10) / 10, count: group.length, startable: good.length, depth,
      output: t.posNow[p] || 0, rank: (t.posNow[p + 'Rank'] || null),
      valueRank: (t.posValue[p + 'Rank'] || null),
      z: zNow[p] !== undefined ? zNow[p] : 0,
      best: group[0] || null,
      // a hole is thin bodies OR clearly below the league at that spot
      hole: depth < 0 || (zNow[p] !== undefined && zNow[p] < -0.85),
      surplus: depth >= 1 && (zNow[p] === undefined || zNow[p] > 0.25)
    };
  });
  const holes = pos.filter(p => p.hole).sort((a, b) => a.z - b.z);
  const surplus = pos.filter(p => p.surplus).sort((a, b) => b.z - a.z);
  const strengths = pos.slice().sort((a, b) => b.z - a.z).filter(p => p.z > 0.6).slice(0, 3);
  const weaknesses = pos.slice().sort((a, b) => a.z - b.z).filter(p => p.z < -0.6).slice(0, 3);
  const young = act.filter(p => p.age && p.age <= 25 && (p.dv || 0) > 1500).length;
  const old = act.filter(p => p.age && p.age >= 29 && (p.dv || 0) > 1500).length;
  return { team: t, pos, holes, surplus, strengths, weaknesses, young, old, demand };
}

/* ---------- trade history ---------- */
/** Turn Sleeper's transaction feed into two-sided trades with assets per team. */
function parseTrades() {
  if (S._trades) return S._trades;
  const out = [];
  (S.transactions || []).forEach(tx => {
    if (tx.type !== 'trade' || tx.status !== 'complete') return;
    const rosters = (tx.roster_ids || []).slice();
    if (rosters.length < 2) return;
    const sides = {};
    rosters.forEach(r => sides[r] = { rosterId: r, team: S.teamById[r] || null, got: [], sent: [] });
    for (const pid in (tx.adds || {})) {
      const to = tx.adds[pid];
      const p = S.index[pid] || ensurePlayer(pid);
      if (sides[to]) sides[to].got.push({ kind: 'player', id: pid, name: p.name, pos: p.pos, ref: p, value: p.dv || 0 });
    }
    for (const pid in (tx.drops || {})) {
      const from = tx.drops[pid];
      const p = S.index[pid] || ensurePlayer(pid);
      if (sides[from]) sides[from].sent.push({ kind: 'player', id: pid, name: p.name, pos: p.pos, ref: p, value: p.dv || 0 });
    }
    (tx.draft_picks || []).forEach(dp => {
      const season = +dp.season, round = +dp.round;
      const key = season + '|' + round + '|' + dp.roster_id;
      // price it the way the app prices any pick: off the original owner's outlook
      let value = 0, slotLabel = null;
      try {
        const q = pickPricer(null)({ season, round, origRosterId: +dp.roster_id });
        value = q.value; slotLabel = round + '.' + String(q.slot).padStart(2, '0');
      } catch (e) { value = pickValue(season, round, 'Mid'); }
      const orig = S.teamById[+dp.roster_id];
      const label = season + ' ' + (ROUND_WORD[round] || round + 'th') + (orig ? ' (' + orig.short + ')' : '');
      const asset = { kind: 'pick', id: 'PK|' + key, name: label, pos: 'PICK', value, slotLabel, season, round };
      if (sides[dp.owner_id]) sides[dp.owner_id].got.push(asset);
      if (sides[dp.previous_owner_id]) sides[dp.previous_owner_id].sent.push(asset);
    });
    (tx.waiver_budget || []).forEach(wb => {
      const a = { kind: 'faab', id: 'FAAB' + wb.amount + '-' + wb.sender + '-' + wb.receiver, name: '$' + wb.amount + ' FAAB', pos: 'NA', value: 0 };
      if (sides[wb.receiver]) sides[wb.receiver].got.push(a);
      if (sides[wb.sender]) sides[wb.sender].sent.push(a);
    });
    const list = Object.values(sides);
    if (!list.some(s => s.got.length || s.sent.length)) return;
    out.push({
      id: tx.transaction_id, when: tx.created ? new Date(tx.created) : null,
      week: tx._week || tx.leg || null, creator: tx.creator, sides: list
    });
  });
  out.sort((a, b) => (b.when ? b.when.getTime() : 0) - (a.when ? a.when.getTime() : 0));
  out.forEach(tr => gradeTrade(tr));
  S._trades = out;
  return out;
}

const GRADES = [
  [0.55, 'A+'], [0.38, 'A'], [0.24, 'A−'], [0.14, 'B+'], [0.05, 'B'], [-0.05, 'B−'],
  [-0.14, 'C+'], [-0.24, 'C'], [-0.38, 'C−'], [-0.55, 'D'], [-Infinity, 'F']
];
function gradeLetter(score) {
  for (const [thr, g] of GRADES) if (score >= thr) return g;
  return 'F';
}
/** Score each side on value swing and on how well the pieces fit the roster.
 *  Values are today's market, so this reads a trade with hindsight — it is not a
 *  verdict on the decision at the time it was made. */
function gradeTrade(tr) {
  const demand = slotDemand();
  tr.sides.forEach(s => {
    s.gotValue = sum(s.got.map(a => a.value));
    s.sentValue = sum(s.sent.map(a => a.value));
    s.net = s.gotValue - s.sentValue;
    const base = Math.max(400, (s.gotValue + s.sentValue) / 2);
    s.valueEdge = clamp(s.net / base, -1.6, 1.6);
    // need fit: did the incoming pieces land where this roster is thin, and did
    // the outgoing pieces come from a spot it could afford to sell from?
    let fit = 0, n = 0;
    if (s.team) {
      const sc = scoutTeam(s.team);
      const zOf = (p) => { const e = sc.pos.find(x => x.pos === p); return e ? e.z : 0; };
      s.got.filter(a => a.kind === 'player').forEach(a => { fit += clamp(-zOf(a.pos), -1, 1); n++; });
      s.sent.filter(a => a.kind === 'player').forEach(a => { fit += clamp(zOf(a.pos), -1, 1) * 0.6; n++; });
    }
    s.needFit = n ? fit / n : 0;
    s.score = s.valueEdge + 0.3 * s.needFit;
    s.grade = gradeLetter(s.score);
  });
  const best = tr.sides.slice().sort((a, b) => b.score - a.score);
  tr.winner = best.length > 1 && Math.abs(best[0].score - best[1].score) > 0.08 ? best[0] : null;
  tr.margin = best.length > 1 ? best[0].score - best[1].score : 0;
  tr.totalValue = sum(tr.sides.map(s => s.gotValue));
  return tr;
}
/** Per-manager trading record. */
function traderStats() {
  const trades = parseTrades();
  const by = {};
  S.teams.forEach(t => by[t.rosterId] = {
    team: t, n: 0, net: 0, scores: [], wins: 0, losses: 0, partners: {},
    playersIn: 0, playersOut: 0, picksIn: 0, picksOut: 0, ageIn: [], ageOut: [], valueIn: 0, valueOut: 0
  });
  trades.forEach(tr => tr.sides.forEach(s => {
    const b = by[s.rosterId]; if (!b) return;
    b.n++; b.net += s.net; b.scores.push(s.score);
    if (tr.winner === s) b.wins++; else if (tr.winner) b.losses++;
    tr.sides.forEach(o => { if (o !== s) b.partners[o.rosterId] = (b.partners[o.rosterId] || 0) + 1; });
    s.got.forEach(a => {
      if (a.kind === 'player') { b.playersIn++; b.valueIn += a.value; if (a.ref && a.ref.age) b.ageIn.push(a.ref.age); }
      if (a.kind === 'pick') { b.picksIn++; b.valueIn += a.value; }
    });
    s.sent.forEach(a => {
      if (a.kind === 'player') { b.playersOut++; b.valueOut += a.value; if (a.ref && a.ref.age) b.ageOut.push(a.ref.age); }
      if (a.kind === 'pick') { b.picksOut++; b.valueOut += a.value; }
    });
  }));
  const list = Object.values(by);
  list.forEach(b => {
    b.avgScore = b.scores.length ? mean(b.scores) : null;
    b.grade = b.scores.length ? gradeLetter(b.avgScore) : null;
    const pk = Object.keys(b.partners).sort((x, y) => b.partners[y] - b.partners[x])[0];
    b.topPartner = pk ? { team: S.teamById[+pk], n: b.partners[pk] } : null;
    b.pickFlow = b.picksIn - b.picksOut;
    b.ageFlow = (b.ageIn.length ? mean(b.ageIn) : null);
    b.ageSent = (b.ageOut.length ? mean(b.ageOut) : null);
  });
  return { list, trades };
}
/** Which way a manager's actual moves point, independent of their roster. */
function tradeDirection(stat) {
  if (!stat || !stat.n) return { label: 'Quiet', detail: 'No completed trades to read.' };
  const bits = [];
  let score = 0;
  if (stat.pickFlow >= 2) { score -= 1; bits.push('collecting picks'); }
  else if (stat.pickFlow <= -2) { score += 1; bits.push('spending picks'); }
  if (stat.ageFlow !== null && stat.ageSent !== null) {
    const d = stat.ageFlow - stat.ageSent;
    if (d >= 1.2) { score += 1; bits.push('taking on older players'); }
    else if (d <= -1.2) { score -= 1; bits.push('getting younger'); }
  }
  const label = score >= 1 ? 'Buying' : score <= -1 ? 'Selling' : 'Balanced';
  return { label, detail: bits.length ? bits.join(', ') : 'no clear directional pattern yet', score };
}
/** Roster window plus actual behaviour, reconciled. */
function projectedStrategy(t, stat) {
  const dir = tradeDirection(stat);
  const win = t.window;
  const contending = ['Contend', 'Win-now'].includes(win);
  const rebuilding = ['Rebuild', 'Retool'].includes(win);
  let headline, detail;
  if (contending && dir.label === 'Buying') { headline = 'All-in'; detail = 'A contending roster and they are spending future capital to push it further.'; }
  else if (contending && dir.label === 'Selling') { headline = 'Selling high'; detail = 'Good enough to win now, but cashing pieces in — either hedging or they do not rate their own window.'; }
  else if (rebuilding && dir.label === 'Selling') { headline = 'Committed rebuild'; detail = 'Weak roster, moving veterans out for picks and youth. Expect them to keep selling.'; }
  else if (rebuilding && dir.label === 'Buying') { headline = 'Buying against the window'; detail = 'Adding win-now pieces to a roster that is not close. Often a source of value if they overpay.'; }
  else if (contending) { headline = 'Standing pat'; detail = 'Contending roster, no directional trading yet. Likely to buy if the price is right.'; }
  else if (rebuilding) { headline = 'Rebuilding quietly'; detail = 'Bottom of the table and not yet trading. A candidate to start selling veterans.'; }
  else headline = 'Middling', detail = 'Neither clearly contending nor rebuilding — the hardest kind of team to read.';
  return { headline, detail, direction: dir, window: win };
}
/* ================= weekly outlook helpers ================= */
/** Floor / median / ceiling for one player in one week. Seeded per player so the
 *  numbers hold still between renders instead of jittering on every click. */
function weekOutlook(p, wk) {
  const m = pw(p, wk);
  if (!(m > 0.05)) return { mean: 0, floor: 0, median: 0, ceil: 0, bye: true, opp: null };
  const sd = volFromMean(p.pos, m), n = 3000;
  seedRng(hashStr(p.id + '|' + wk));
  const s = new Array(n);
  for (let i = 0; i < n; i++) s[i] = rnd() < BUST_RATE ? 0 : drawScore(m, sd);
  s.sort((a, b) => a - b);
  return {
    mean: m, sd, bye: false, opp: pwOpp(p, wk),
    floor: s[Math.floor(n * 0.1)], median: s[n >> 1], ceil: s[Math.floor(n * 0.9)],
    bust: s.filter(x => x < m * 0.5).length / n, boom: s.filter(x => x > m * 1.5).length / n
  };
}
/** Probability a outscores b in a given week, from independent paired draws. */
function pBeats(a, b, wk) {
  const ma = pw(a, wk), mb = pw(b, wk);
  if (!(ma > 0.05) && !(mb > 0.05)) return 0.5;
  const sa = volFromMean(a.pos, ma), sb = volFromMean(b.pos, mb);
  const n = 12000; let w = 0;
  seedRng(hashStr(a.id + '|' + b.id + '|' + wk));
  for (let i = 0; i < n; i++) {
    const x = ma > 0.05 ? (rnd() < BUST_RATE ? 0 : drawScore(ma, sa)) : 0;
    const y = mb > 0.05 ? (rnd() < BUST_RATE ? 0 : drawScore(mb, sb)) : 0;
    if (x > y) w++; else if (x === y) w += 0.5;
  }
  return w / n;
}

/* ================= 10. START / SIT ================= */
const LineupUI = { team: null, week: null, compare: [], openSlot: null };
function viewLineup() {
  const wrap = h('div.grid');
  const teams = S.teams;
  if (LineupUI.team === null || !S.teamById[LineupUI.team]) LineupUI.team = S.myRosterId || teams[0].rosterId;

  const T = S.teamById[LineupUI.team];
  const wk = LineupUI.week;
  const act = activePlayers(T);
  const lineup = optimalLineup(act, p => pw(p, wk));
  const startIds = new Set(lineup.filter(s => s.player).map(s => s.player.id));
  const bench = act.filter(p => !startIds.has(p.id)).sort((a, b) => pw(b, wk) - pw(a, wk));
  const total = sum(lineup.map(s => s.player ? pw(s.player, wk) : 0));
  const played = wk <= S.lastWeek;

  const weeks = []; for (let w = 1; w <= S.regEnd; w++) weeks.push(w);
  wrap.appendChild(card('Week ' + wk, null, h('div.row', { style: { gap: '14px' } },
    h('label.fld', { style: { minWidth: '230px' } }, 'Team',
      h('select', { onchange: e => { LineupUI.team = +e.target.value; LineupUI.compare = []; render(); } },
        teams.map(t => h('option', { value: t.rosterId, selected: t.rosterId === T.rosterId }, t.name)))),
    h('label.fld', 'Week', h('select', { onchange: e => { LineupUI.week = +e.target.value; LineupUI.compare = []; render(); } },
      weeks.map(w => h('option', { value: w, selected: w === wk }, 'Week ' + w + (w <= S.lastWeek ? ' (played)' : w === S.lastWeek + 1 ? ' (next)' : ''))))),
    h('span', { style: { flex: 1 } }),
    played ? h('span.tag', 'This week has already been played — projections are shown for reference') : null)));

  // ---- the optimal lineup ----
  const byes = act.filter(p => p.wk && !p.wk[wk]);
  const rows = lineup.map(s => {
    const p = s.player;

function toggleCompare(id) {

function compareGrid(players, wk) {
  const outs = players.map(p => ({ p, o: weekOutlook(p, wk) }));
  const max = Math.max(...outs.map(x => x.o.ceil), 1);
  const cards = outs.map(({ p, o }) => h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', padding: '11px 12px', background: 'var(--surface-1)', display: 'grid', gap: '7px', minWidth: 0 } },
    h('div.row', { style: { gap: '6px', minWidth: 0 } }, posPill(p.pos), pname(p, { style: { fontWeight: 640 } }),
      h('span', { style: { flex: 1 } }),
      h('button.btn.sm', { onclick: () => { toggleCompare(p.id); render(); } }, '×')),
    h('div.tiny.muted', o.bye ? 'On bye in week ' + wk : (o.opp ? 'vs ' + o.opp : 'no opponent listed')),
    h('div.row', { style: { alignItems: 'baseline', gap: '7px' } }, h('b', { style: { fontSize: '21px' } }, fmt(o.mean, 1)), h('span.tiny.muted', 'projected')),
    // floor → ceiling range bar, on a shared scale so the cards compare directly
    h('div', { style: { position: 'relative', height: '9px', background: 'var(--surface-3)', borderRadius: '3px' } },
      h('div', { style: { position: 'absolute', top: 0, bottom: 0, borderRadius: '3px', background: 'var(--seq-200)', left: (o.floor / max * 100) + '%', width: (Math.max(0, o.ceil - o.floor) / max * 100) + '%' } }),
      h('div', { style: { position: 'absolute', top: '-2px', bottom: '-2px', width: '2px', background: 'var(--s1)', left: (o.mean / max * 100) + '%' } })),
    h('div.row', { style: { justifyContent: 'space-between' } },
      h('span.tiny.muted.mono', fmt(o.floor, 0)),
      h('span.tiny.muted', 'floor · ceiling'),
      h('span.tiny.muted.mono', fmt(o.ceil, 0))),
    o.bye ? null : h('div.tiny.muted', pct(o.boom, 0) + ' chance of a big week · ' + pct(o.bust, 0) + ' chance of a dud')));

  const pairs = [];
  for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
    const pr = pBeats(players[i], players[j], wk);
    pairs.push(h('div.row', { style: { gap: '8px', justifyContent: 'space-between', padding: '4px 0', borderBottom: '1px solid var(--grid)' } },

        h('b.mono.tiny', pct(pr, 0)))));
  }
  return h('div', { style: { display: 'grid', gap: '12px' } },
    h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(210px,1fr))' } }, cards),
    pairs.length ? h('div', h('div.lbl', { style: { fontSize: '10px', marginBottom: '4px' } }, 'Head to head'), pairs) : null);
}

/* ================= hypothetical roster sandbox =================
   Release, sign and swap players and picks, then look at any page as if those
   moves had happened. Nothing here touches Sleeper — it is a local rebuild of

var HYP = {
  on: false,
  moves: {},          // playerId -> rosterId, or null to release to free agency
  picks: {},          // pickKey  -> rosterId, or null
  team: null,         // whose roster you are editing
  open: true,         // editor expanded
  q: '',              // player search
  seed: null,         // shared seed, so before/after odds are a paired comparison
  strict: true,       // every acquisition must be matched by something sent back
  base: null,         // metrics for the real league
  after: null,        // metrics for the current what-if
  sig: null
};
const HYP_SIMS = 1200;

function hypTeamId() {
  if (HYP.team && S.teamById[HYP.team]) return HYP.team;
  return S.myRosterId || (S.teams[0] && S.teams[0].rosterId);
}
function hypCount() { return Object.keys(HYP.moves).length + Object.keys(HYP.picks).length; }
function hypSig() {
  return JSON.stringify([HYP.moves, HYP.picks, hypTeamId()]);
}
/** Snapshot the metrics every view compares against. */
function hypMetrics(sim) {
  const out = {};
  S.teams.forEach(t => {
    const s = sim ? sim.by[t.rosterId] : null;
    out[t.rosterId] = {
      now: t.now, future: t.future, power: t.power, futurePower: t.futurePower, powerRank: t.powerRank,
      futureRank: t.futureRank, totalValue: t.totalValue, valueRank: t.valueRank,
      pickCapital: t.pickCapital, window: t.window, age: t.age,
      posNow: Object.assign({}, t.posNow),
      playoff: s ? s.playoff : null, title: s ? s.title : null, wins: s ? s.wins : null

  });

}
function hypEnter() {
  if (HYP.on) return;
  HYP.seed = (Math.random() * 4294967296) >>> 0;
  HYP.moves = {}; HYP.picks = {}; HYP.sig = null; HYP.after = null;
  HYP.team = hypTeamId();
  HYP.base = hypMetrics(simulate(HYP_SIMS, { seed: HYP.seed }));
  HYP.on = true;

}
function hypExit() {
  HYP.on = false; HYP.moves = {}; HYP.picks = {}; HYP.after = null; HYP.sig = null;
  document.documentElement.removeAttribute('data-hyp');

}
function hypReset() {
  HYP.moves = {}; HYP.picks = {}; HYP.after = null; HYP.sig = null;
  applyOwnership({}, {});
}
/** Recompute the league under the current moves, and refresh the after-metrics. */
function hypSync() {
  if (!HYP.on) return;
  const sig = hypSig();
  if (sig === HYP.sig && HYP.after) return;
  applyOwnership(HYP.moves, HYP.picks);
  HYP.after = hypMetrics(simulate(HYP_SIMS, { seed: HYP.seed }));
  HYP.sig = sig;
}
function hypMove(playerId, toRosterId) {
  const baseOwner = S.base.own[playerId];
  if (toRosterId === baseOwner) delete HYP.moves[playerId];
  else HYP.moves[playerId] = toRosterId;
  HYP.after = null; hypSync();
}
function hypMovePick(key, toRosterId) {
  const baseOwner = S.base.pickOwn[key];

/* which views actually change when a roster changes */
const HYP_VIEWS = { roster: 1, lineup: 1, power: 1, sim: 1, finder: 1, trade: 1, scout: 1, stock: 1, player: 1 };
const HYP_UNAFFECTED = {
  standings: 'Active Rankings is pure results — wins, losses and points actually scored. A hypothetical roster cannot change games that have already been played.',
  draft: 'The draft board is a historical record of picks that were actually made, so a hypothetical roster does not change it.',
  trades: 'Trade History is a record of deals that actually happened, so a hypothetical roster does not change it. The grades already use live market values.'
};

/* ---------- trade bookkeeping ----------
   A player can only arrive from somewhere. In strict mode every partner you take
   from must also receive something, otherwise the "after" league is not one that
   could actually exist and the comparison is worthless. */
function assetLabel(id, isPick) {
  if (isPick) {
    const parts = id.split('|');
    return parts[0] + ' round ' + parts[1] + (S.teamById[+parts[2]] ? ' (' + S.teamById[+parts[2]].short + ')' : '');
  }
  const p = S.index[id] || ensurePlayer(id);
  return p.name;
}
function assetValue(id, isPick) {
  if (!isPick) { const p = S.index[id]; return p ? (p.dv || 0) : 0; }
  for (const t of S.teams) { const a = (t.pickAssets || []).find(x => pickKeyOf(x) === id); if (a) return a.dv || 0; }
  const parts = id.split('|');
  return pickValue(+parts[0], +parts[1], 'Mid');
}
function hypLedgers() {
  const me = hypTeamId();
  const partners = {}, fa = { added: [], dropped: [] }, thirdParty = [];
  const consider = (id, isPick, from, to) => {
    if (from === me && to !== me) {
      if (to === null || to === undefined) { fa.dropped.push({ id, isPick }); return; }
      (partners[to] = partners[to] || { out: [], in: [] }).out.push({ id, isPick });
    } else if (to === me && from !== me) {
      if (from === null || from === undefined) { fa.added.push({ id, isPick }); return; }
      (partners[from] = partners[from] || { out: [], in: [] }).in.push({ id, isPick });
    } else if (from !== me && to !== me) {
      thirdParty.push({ id, isPick, from, to });
    }
  };
  for (const id in HYP.moves) consider(id, false, S.base.own[id], HYP.moves[id]);
  for (const k in HYP.picks) consider(k, true, S.base.pickOwn[k], HYP.picks[k]);
  const list = Object.keys(partners).map(rid => {
    const L = partners[rid];
    const outVal = sum(L.out.map(x => assetValue(x.id, x.isPick)));
    const inVal = sum(L.in.map(x => assetValue(x.id, x.isPick)));
    const hi = Math.max(outVal, inVal), lo = Math.min(outVal, inVal);
    return {
      rosterId: +rid, team: S.teamById[+rid], out: L.out, in: L.in, outVal, inVal,
      twoSided: L.out.length > 0 && L.in.length > 0,

function hypValidity() {

  const spots = S.cfg.activeSpots || 0;
  // Neither an IR nor a taxi player occupies an active spot.
  const size = T ? T.players.length - T.taxi.size - T.ir.size : 0;
  return {
    ledgers: L, oneSided, thirdParty: L.thirdParty,
    ok: oneSided.length === 0 && L.thirdParty.length === 0,
    size, spots, ir: T ? T.ir.size : 0, taxi: T ? T.taxi.size : 0,
    overLimit: spots > 0 && size > spots

}
/** Nearest-value asset from the side that owes something, to even a trade up. */
function hypBalanceSuggestion(led) {
  const me = hypTeamId();
  const needFrom = led.in.length && !led.out.length ? me : led.rosterId;
  const targetVal = needFrom === me ? led.inVal : led.outVal;
  const T = S.teamById[needFrom];
  if (!T) return null;
  const already = new Set(led.out.concat(led.in).map(x => x.id));
  // Only offer assets this side actually owns in the real league. Passing on a
  // player you just acquired elsewhere is a three-team deal, not a trade.
  const pool = assetsOf(T).filter(a => {
    const key = a.kind === 'pick' ? pickKeyOf(a) : a.id;
    if (already.has(key)) return false;
    const baseOwner = a.kind === 'pick' ? S.base.pickOwn[key] : S.base.own[key];
    return baseOwner === needFrom;
  });
  if (!pool.length) return null;
  pool.sort((x, y) => Math.abs(x.dv - targetVal) - Math.abs(y.dv - targetVal));
  return { asset: pool[0], from: needFrom, to: needFrom === me ? led.rosterId : me };
}

    },
      h('div.row', { style: { justifyContent: 'space-between', gap: '8px' } },
        h('div.row', { style: { gap: '7px' } },
          h('b.tiny', 'with ' + (led.team ? led.team.name : '?')),
          led.twoSided
            ? h('span.tag', { style: { borderColor: 'var(--good)', color: 'var(--good-text)' } }, 'balance ' + pct(led.fair, 0))
            : h('span.tag', { style: { borderColor: 'var(--critical)', color: 'var(--bad-text)' } }, led.in.length ? 'nothing sent back' : 'nothing coming back')),
        sug ? h('button.btn.sm', {
          onclick: () => {
            const a = sug.asset;
            if (a.kind === 'pick') hypMovePick(pickKeyOf(a), sug.to); else hypMove(a.id, sug.to);
            render();
          }
        }, 'Even it up with ' + sug.asset.name) : null),
      h('div.row', { style: { gap: '10px', alignItems: 'flex-start' } },
        h('div', { style: { flex: 1, minWidth: 0 } },
          h('div.tiny.muted', 'you send · ' + kfmt(Math.round(led.outVal))),
          h('div.row', { style: { gap: '4px' } }, led.out.length ? led.out.map(chip) : h('span.tiny.muted', '—'))),
        h('div.tiny.muted', '⇄'),
        h('div', { style: { flex: 1, minWidth: 0 } },
          h('div.tiny.muted', 'you get · ' + kfmt(Math.round(led.inVal))),
          h('div.row', { style: { gap: '4px' } }, led.in.length ? led.in.map(chip) : h('span.tiny.muted', '—')))));
  });
  const fa = V.ledgers.fa;
  if (fa.added.length || fa.dropped.length) {
    rows.push(h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', padding: '8px 10px', background: 'var(--surface-1)' } },
      h('div.row', { style: { gap: '7px' } }, h('b.tiny', 'free agency'),
        h('span.tiny.muted', 'no other roster is touched')),
      h('div.row', { style: { gap: '10px', marginTop: '4px' } },
        h('div', { style: { flex: 1 } }, h('div.tiny.muted', 'released'), h('div.row', { style: { gap: '4px' } }, fa.dropped.length ? fa.dropped.map(chip) : h('span.tiny.muted', '—'))),
        h('div', { style: { flex: 1 } }, h('div.tiny.muted', 'signed'), h('div.row', { style: { gap: '4px' } }, fa.added.length ? fa.added.map(chip) : h('span.tiny.muted', '—'))))));
  }
  if (V.thirdParty.length) {
    rows.push(h('div', { style: { border: '1px solid var(--critical)', borderRadius: 'var(--r-sm)', padding: '8px 10px', background: 'var(--surface-1)' } },
      h('b.tiny', V.thirdParty.length + ' move' + (V.thirdParty.length === 1 ? '' : 's') + ' between two other teams'),
      h('div.tiny.muted', 'These do not involve ' + (S.teamById[me] || {}).name + ', so they cannot be part of your trade.')));
  }
  return h('div', { style: { display: 'grid', gap: '7px' } }, rows);
}

function hypBlockedNotice(V) {
  const bits = [];
  V.oneSided.forEach(led => bits.push((led.team ? led.team.name : 'a team')
    + (led.in.length ? ' has not received anything back' : ' has not sent anything')));
  if (V.thirdParty.length) bits.push(V.thirdParty.length + ' move(s) involve two other teams');
  return h('div', {
    style: {
      border: '1px solid var(--critical)', borderRadius: 'var(--r-sm)', padding: '10px 12px',
      background: 'color-mix(in srgb, var(--critical) 7%, transparent)', display: 'grid', gap: '4px'
    }
  },
    h('div.row', { style: { gap: '7px' } },
      h('span', { style: { color: 'var(--critical)', fontWeight: 700 } }, '!'),
      h('b', 'Impact hidden — this is not a trade anyone could make')),
    h('div.tiny.sec', bits.join(' · ') + '.'),
    h('div.tiny.muted',
      'A one-sided move makes your team better and theirs worse in a way that could never happen, so the simulated odds either side of it would not be comparable. '
      + 'Send something back, or switch to Free edits if you only want to see what a roster looks like without the other team reacting.'));
}
/* ================= boot ================= */
async function boot(leagueId, onStep) {
  try {
    S.busy = true;
    await loadLeague(leagueId, onStep);
    const me = LS.get('me', null);
    if (me) { const t = S.teams.find(t => t.ownerId === me); if (t) S.myRosterId = t.rosterId; }
    if (!S.myRosterId) S.myRosterId = S.teams[0].rosterId;
    RosterUI.team = S.myRosterId; TradeUI.a = S.myRosterId; FinderUI.team = S.myRosterId;
    S.busy = false;
    S.sim = null;
    render();
  } catch (e) {
    S.busy = false; console.error(e);
    if (onStep) onStep('', 0);
    const app = $('#app');
    if (!S.league) {
      clear(app); app.appendChild(splash());
      const st = $('.splash .tiny.muted');
      const box = $('.splash .box .bd');
      box.appendChild(h('div', { style: { marginTop: '10px', padding: '9px 11px', border: '1px solid var(--critical)', borderRadius: 'var(--r-sm)', background: 'color-mix(in srgb, var(--critical) 8%, transparent)' } },
        h('b', { style: { color: 'var(--bad-text)' } }, 'Could not load'), h('div.tiny.sec', String(e.message || e)),
        h('div.tiny.muted', { style: { marginTop: '5px' } }, 'If this says “Failed to fetch”, the API is unreachable from this page — check your connection, or open this file directly in a browser rather than inside another app’s preview pane.')));
    }
  }
}
setTheme(currentTheme());
watchViewport();
const _last = LS.get('last', null);
render();
if (_last && /^\d{6,25}$/.test(String(_last))) {
  const st = $('.splash .tiny.muted');
  const bar = $('.splash .loadbar i');
  boot(_last, (m, p) => { if (st) st.textContent = m; if (bar) bar.style.width = (p * 100) + '%'; });
}


</script>
</body>
</html>

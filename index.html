<!doctype html>

<meta charset="utf-8">
<!-- Content Security Policy. GitHub Pages cannot send headers, so it rides in a meta tag (which must come first).
     Scripts: only this site and GoatCounter's counter, so injected markup cannot run inline code. Data: only the
     hosts the app reads (Sleeper, FantasyCalc, ESPN) and the counter. Images may come from anywhere, because a team's
     avatar is a URL its owner chose. Inline styles are allowed because the app sets them on elements. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.sleeper.app https://api.sleeper.com https://api.fantasycalc.com https://site.api.espn.com https://lm-api-reads.fantasy.espn.com https://fantasy.espn.com https://coreyjohnsen.goatcounter.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">

<!-- the two media-matched colours are the fallback; once the page runs it keeps one plain tag in step with the theme and accent -->
<meta name="theme-color" content="#f2f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0d17" media="(prefers-color-scheme: dark)">

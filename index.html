    { k: 'slot', h: 'Proj. slot', num: true, sort: r => r.s.draftSlot, f: r => h('b.mono', slotLabel(r.s.draftSlot)) },
    { k: 'name', h: 'Original owner', sort: r => r.t.name, f: r => teamCell(r.t) },
    {
      k: 'likely', prio: 2, h: 'Most likely', num: true, sortable: false,
      f: r => { const m = modal(r.s.draftDist); return h('span', h('b.mono', '1.' + String(m).padStart(2, '0')), h('span.tiny.muted', ' ' + pct(r.s.draftDist[m], 0))); }
    },
    { k: 'range', prio: 2, h: 'Middle 80%', sortable: false, f: r => { const b = band(r.s.draftDist); return h('span.tiny.mono.muted', b.lo === b.hi ? String(b.lo) : b.lo + '–' + b.hi); } },
    {
      k: 'first', h: isNarrow() ? '1.01' : 'The 1.01', num: true, sort: r => r.s.draftDist[1],
      f: r => h('div.meter', { style: { justifyContent: 'flex-end' } },
        isNarrow() ? null : h('div.bar-track', { style: { width: '44px' } }, h('div.bar-fill', { style: { width: (r.s.draftDist[1] * 100) + '%', background: 'var(--s4)' } })),
        h('span.mono', pct(r.s.draftDist[1], 0)))
    },
    {
      k: 'top3', prio: 2, h: 'Top 3', num: true,
      sort: r => r.s.draftDist[1] + r.s.draftDist[2] + r.s.draftDist[3],
      f: r => h('span.mono', pct(r.s.draftDist[1] + r.s.draftDist[2] + r.s.draftDist[3], 0))
    },
    { k: 'playoff', prio: 2, h: 'Playoffs', num: true, sort: r => r.s.playoff, f: r => h('span.mono.muted', pct(r.s.playoff, 0)) },
    isDynasty() ? { k: 'held', h: season !== null ? season + ' picks' : 'Picks', sortable: false, f: heldCell } : null
  ], rows, { sortKey: 'slot', sortDir: 1 });

  return card('Next year’s draft order' + (season !== null ? ' — ' + season : ''),
    'from the same ' + kfmt(res.n) + ' seasons: everyone who misses the playoffs picks first, fewest points first, then the playoff teams in the order they went out',
    h('div', { style: { display: 'grid', gap: '11px' } },
      tbl,
      h('div.tiny.muted',
        anyTraded
          ? h('span', h('b', 'Some of these picks have already moved.'), ' A tag like ', h('span.tag.traded', '1st → ABC'),
            ' means that team’s own first-rounder belongs to somebody else now — the slot on the left is where the pick lands, not who gets to use it.')
          : (isDynasty()
            ? 'Every team still holds its own picks in this draft, so the slot and the owner are the same thing.'
            : 'A redraft league does not carry picks between seasons, so this is the order the next draft would run in, not a set of assets anyone holds.')),
      h('div.tiny.muted',
        'Ties are broken on points, the way the standings break them. Leagues that use a lottery, or order the back half by regular-season finish rather than playoff exit, will differ — this is the common default, not a reading of your league’s bylaws.')));

/* ==================================================================
   Live week — actual points where the games are finished, projections

/* Sleeper publishes the NFL schedule with a status per game. Without it there is
   no honest way to tell "scored zero" from "has not kicked off yet". */
async function loadNflSchedule(season) {
  const key = 'nflsched:' + season;
  const rec = await idbGet(key);
  const FRESH = 8 * 60 * 1000;          // statuses move during a game day
  if (rec && Date.now() - rec.t < FRESH && rec.d) return rec.d;
  try {
    const j = await getJSON('https://api.sleeper.app/schedule/nfl/regular/' + season, 2);
    if (!Array.isArray(j) || !j.length) return (rec && rec.d) || null;
    const out = {};
    j.forEach(g => {
      const w = +g.week; if (!w) return;
      out[w] = out[w] || {};
      if (g.home) out[w][g.home] = { status: g.status, date: g.date, opp: g.away, home: true };
      if (g.away) out[w][g.away] = { status: g.status, date: g.date, opp: g.home, home: false };
    });
    await idbSet(key, { t: Date.now(), d: out });
    return out;
  } catch (e) { return (rec && rec.d) || null; }
}
/* The per-week scores feed carries what the season schedule does not: a real
   kickoff time and a live quarter. That is what makes slates and in-game
   proration possible. */
async function loadWeekScores(season, week) {
  const key = 'nflscores:' + season + ':' + week;
  const rec = await idbGet(key);
  const FRESH = 3 * 60 * 1000;
  if (rec && Date.now() - rec.t < FRESH && rec.d) return rec.d;
  try {
    const j = await getJSON(`https://api.sleeper.app/scores/nfl/regular/${season}/${week}`, 2);
    if (!Array.isArray(j) || !j.length) return (rec && rec.d) || null;
    const games = j.map(g => {
      const m = g.metadata || {};
      const q = m.quarter_num !== undefined && m.quarter_num !== null ? +m.quarter_num : null;
      return {
        id: g.game_id, start: g.start_time || (m.date_time ? Date.parse(m.date_time) : null),
        status: g.status, home: m.home_team, away: m.away_team,
        over: !!m.is_over || GAME_OVER[g.status] === 1,
        inProgress: !!m.is_in_progress, started: !!m.has_started,
        quarter: m.quarter || null, quarterNum: q
      };
    }).filter(g => g.home && g.away);
    const out = { games: games, byTeam: {} };
    games.forEach(g => { out.byTeam[g.home] = g; out.byTeam[g.away] = g; });
    await idbSet(key, { t: Date.now(), d: out });
    return out;
  } catch (e) { return (rec && rec.d) || null; }
}
/** Pull the scores feed for a week if it is not already in hand. */
async function ensureWeekScores(wk) {
  S.weekScores = S.weekScores || {};
  const got = await loadWeekScores(S.season, wk);
  if (got) { S.weekScores[wk] = got; S._live = null; }
  return got;
}
function weekScoreGame(team, wk) {
  const ws = S.weekScores && S.weekScores[wk];
  return (ws && team && ws.byTeam[team]) || null;
}
const GAME_OVER = { complete: 1, canceled: 1, postponed: 1 };
function nflGame(team, wk) {
  const s = S.nflSched && S.nflSched[wk];
  return (s && team && s[team]) || null;
}
/** Has any game in this NFL week finished or kicked off? */
function weekStarted(wk) {
  const s = S.nflSched && S.nflSched[wk];
  if (s) return Object.keys(s).some(t => s[t].status !== 'pre_game');
  return !!(S.matchups[wk] || []).some(m => (m.points || 0) > 0);
}
/** Are all of this NFL week's games done? */
function weekFinished(wk) {

  if (s) { const ks = Object.keys(s); return ks.length > 0 && ks.every(t => GAME_OVER[s[t].status]); }

/** done · live · upcoming · bye · unknown */
function livePlayerState(p, wk) {
  const sg = weekScoreGame(p && p.team, wk);
  if (sg) return sg.over ? 'done' : (sg.started || sg.inProgress) ? 'live' : 'upcoming';
  if (!S.nflSched) return wk <= S.lastWeek ? 'done' : 'upcoming';
  const g = nflGame(p && p.team, wk);

  if (GAME_OVER[g.status]) return 'done';

/** How much of a player's game is still to be played, 0 to 1. */
function liveRemaining(p, wk, state) {

  if (state !== 'live') return 1;
  const sg = weekScoreGame(p && p.team, wk);
  const q = sg && sg.quarterNum;
  // halfway through the quarter on average; overtime is the tail end of nothing
  if (!q || q < 1) return 1;
  if (q >= 5) return 0.04;
  return clamp((4 - q + 0.5) / 4, 0.04, 1);

/* What one player is worth to a live week: the points they have banked, plus the
   share of their projection still to come. A finished game is all points and no
   projection; a game that has not kicked off is all projection. */
function liveValue(p, wk) {
  const state = livePlayerState(p, wk);
  const m = (S.matchups[wk] || []).find(x => x.players_points && x.players_points[p.id] !== undefined);
  const actual = m ? m.players_points[p.id] : null;
  const proj = pw(p, wk);
  const rem = liveRemaining(p, wk, state);
  const banked = state === 'done' ? (actual || 0) : (state === 'live' ? (actual || 0) : 0);
  const open = state === 'bye' ? 0 : proj * rem;
  const sg = weekScoreGame(p && p.team, wk);

    state: state, actual: actual, proj: proj, remaining: rem,
    banked: banked, open: open, used: banked + open,
    settled: state === 'done' || state === 'bye',

/** The number to show for a player in a given week — live where the week is live. */
function pwShown(p, wk) { return wk === S.liveWeek ? liveValue(p, wk).used : pw(p, wk); }

/* Which starters a team fields in a given week. Sleeper reports the lineup the
   manager actually set for the current and past weeks; for weeks that have not
   arrived the stored lineup is stale, so the optimiser stands in. */
function startersFor(t, wk) {
  const m = (S.matchups[wk] || []).find(x => x.roster_id === t.rosterId);
  if (m && Array.isArray(m.starters) && wk <= Math.max(S.lastWeek, S.liveWeek || 0)) {
    const ids = m.starters.filter(id => id && id !== '0');
    if (ids.length) return ids.map(id => S.index[id] || ensurePlayer(id));
  }
  return optimalLineup(activePlayers(t), p => pw(p, wk)).map(s => s.player).filter(Boolean);
}

/* The heart of it: banked points for finished games, projections for everyone
   else. A player whose game is under way has not finished playing, so their
   projection still stands — mixing a half-played line into a final score would
   silently understate every team on a Sunday afternoon. */
function liveRoster(t, wk) {
  const key = t.rosterId + '|' + wk;
  S._live = S._live || {};
  if (S._live[key]) return S._live[key];
  const m = (S.matchups[wk] || []).find(x => x.roster_id === t.rosterId);
  const pts = (m && m.players_points) || {};
  const rows = startersFor(t, wk).map(p => {
    const v = liveValue(p, wk);
    // the roster's own matchup row is the authority on what this player scored
    if (typeof pts[p.id] === 'number') {
      v.actual = pts[p.id];
      v.banked = v.state === 'done' || v.state === 'live' ? pts[p.id] : 0;
      v.used = v.banked + v.open;
    } else if (v.state === 'done' || v.state === 'live') {

    liveN: rows.filter(r => r.state === 'live').length,
    leftN: rows.filter(r => r.state === 'upcoming').length,
    byeN: rows.filter(r => r.state === 'bye').length,
    open: openRows.map(r => ({ p: r.p, used: r.open })),

/** Pull the week's scores and game statuses again, without reloading the league. */
async function refreshLiveWeek() {
  const wk = S.liveWeek || clamp(S.lastWeek + 1, 1, S.regEnd);
  try {
    const [ms, sched] = await Promise.all([
      sl(`/league/${S.leagueId}/matchups/${wk}`).catch(() => null),
      (async () => { await idbSet('nflsched:' + S.season, null); return loadNflSchedule(S.season); })()
    ]);
    if (ms && ms.length) S.matchups[wk] = ms;
    if (sched) S.nflSched = sched;
  } catch (e) { }
  S._live = null; S._wpSnaps = null;
  // a week that has just finished stops being the live one
  if (S.liveWeek && weekFinished(S.liveWeek)) { S.lastWeek = S.liveWeek; S.liveWeek = null; S._sched = null; }
}

/** The lineup a manager actually has set, paired with the league's starting slots. */
function liveLineupSlots(t, wk) {
  const slots = (S.cfg.rosterPositions || []).filter(x => !['BN', 'IR', 'TAXI'].includes(x));
  const players = startersFor(t, wk);
  const fits = slots.every((sl, i) => !players[i] || (SLOT_ELIG[sl] || [sl]).indexOf(players[i].pos) >= 0);
  // Sleeper's starters array is positional, but if a league's data does not line
  // up, showing a kicker in the QB slot helps nobody — reseat them by eligibility
  if (fits) return slots.map((slot, i) => ({ slot: slot, player: players[i] || null }));
  return optimalLineup(players, p => pwShown(p, wk));

/** A short badge saying where a player's game is up to. */
function liveBadge(p, wk) {

  if (v.state === 'done') return h('span.tag', { style: { borderColor: 'var(--good)', color: 'var(--good-text)' } }, 'final');
  if (v.state === 'live') return h('span.tag', { title: 'game in progress — points so far are banked, the rest of the projection still counts', style: { borderColor: 'var(--s1)', color: 'var(--s1)' } }, v.quarter ? String(v.quarter) : 'playing');

}

/** Win probability with the banked points held fixed and only the open slots drawn. */
function liveWinProb(A, B, wk, n) {
  n = n || 4000;
  const la = liveRoster(A, wk), lb = liveRoster(B, wk);
  const mk = (l) => l.open.map(r => ({ m: r.used, sd: volFromMean(r.p.pos, r.used) }));
  const oa = mk(la), ob = mk(lb);
  const draw = (arr, base) => {
    let s = 0;
    for (let k = 0; k < arr.length; k++) { if (rnd() < BUST_RATE) continue; s += drawScore(arr[k].m, arr[k].sd); }
    return base + Math.max(0, s * Math.max(0.55, 1 + 0.05 * gauss()));
  };
  seedRng(hashStr(A.rosterId + '~' + B.rosterId + '~' + wk) >>> 0);
  let aw = 0, tie = 0;
  const margins = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const x = draw(oa, la.banked), y = draw(ob, lb.banked);
    margins[i] = x - y;
    if (x > y) aw++; else if (x === y) tie++;
  }
  const srt = Array.from(margins).sort((x, y) => x - y);
  const q = (p) => srt[clamp(Math.floor(p * (n - 1)), 0, n - 1)];
  return {
    pA: aw / n, pB: (n - aw - tie) / n, tie: tie / n,
    med: q(.5), lo: q(.1), hi: q(.9),
    a: la, b: lb,
    settled: !oa.length && !ob.length
  };
}

/** This week's matchups, both sides scored live. */
function liveMatchups(wk) {
  return (schedule()[wk - 1] || []).map(([a, b]) => {
    const A = S.teamById[a], B = S.teamById[b];
    if (!A || !B) return null;
    return Object.assign({ A: A, B: B }, liveWinProb(A, B, wk));
  }).filter(Boolean);
}

/* ---------- slates ----------

    by[k].n += 0.5; if (GAME_OVER[sc[t].status]) by[k].done += 0.5;
  });
  return Object.values(by).sort((a, b) => a.start - b.start);
}
/** How many of the week's games are finished. */
function weekGamesDone(wk) {
  const ws = S.weekScores && S.weekScores[wk];
  if (ws) return { done: ws.games.filter(g => g.over).length, total: ws.games.length };
  const sc = S.nflSched && S.nflSched[wk];
  if (!sc) return { done: 0, total: 0 };
  const ks = Object.keys(sc);
  return { done: ks.filter(t => GAME_OVER[sc[t].status]).length / 2, total: ks.length / 2 };
}

/* ---------- win-probability history ----------
   Nothing records an intra-week path for us, so the app keeps its own: one
   sample per visit, plus a synthetic point at the start of the week from the
   pure projection, so the chart says something on the very first load. */
function liveSnapKey(wk) { return 'wp:' + S.leagueId + ':' + wk; }
function recordLiveSnapshot(wk) {
  if (typeof HYP !== 'undefined' && HYP.on) return;      // never record a what-if
  if (!wk || !weekStarted(wk) || weekFinished(wk)) return;
  const key = liveSnapKey(wk);
  let snaps = LS.get(key, []);
  const now = Date.now();
  const gd = weekGamesDone(wk);
  const rec = { t: now, g: gd.done, gt: gd.total, p: {}, s: {} };
  liveMatchups(wk).forEach(g => {
    rec.p[g.A.rosterId] = Math.round(g.pA * 1000) / 1000;
    rec.p[g.B.rosterId] = Math.round(g.pB * 1000) / 1000;
    rec.s[g.A.rosterId] = Math.round(g.a.total * 10) / 10;
    rec.s[g.B.rosterId] = Math.round(g.b.total * 10) / 10;
  });
  if (!Object.keys(rec.p).length) return;
  // one sample every ten minutes is plenty; anything closer is noise
  const last = snaps[snaps.length - 1];
  if (last && Math.abs(now - last.t) < 10 * 60 * 1000) snaps[snaps.length - 1] = rec;
  else snaps.push(rec);
  snaps.sort((a, b) => a.t - b.t);
  if (snaps.length > 400) snaps = snaps.slice(-400);
  try { localStorage.setItem('dcc:' + key, JSON.stringify(snaps)); } catch (e) { }
  S._wpSnaps = S._wpSnaps || {}; S._wpSnaps[wk] = snaps;
}
function liveSeries(wk) {
  S._wpSnaps = S._wpSnaps || {};
  if (!S._wpSnaps[wk]) S._wpSnaps[wk] = LS.get(liveSnapKey(wk), []);
  return S._wpSnaps[wk];
}
/** The pre-week anchor: what the odds were before anybody had played. */
function preWeekOdds(wk) {
  const out = {};
  (schedule()[wk - 1] || []).forEach(([a, b]) => {
    const A = S.teamById[a], B = S.teamById[b];
    if (!A || !B) return;
    const r = h2hSim(A, B, wk, 1500);
    out[a] = r.pA; out[b] = r.pB;
  });
  return out;
}

function currentWeek() {

}

/** A franchise's name, shortened to its abbreviation when the card is too

function matchupName(T) {

/** Every starter on both sides of one matchup. */

/** ESPN-style win-probability trace for one matchup, cut into the week's slates. */
function matchupProbChart(wk, g) {
  // nothing has moved until somebody has played
  if (!weekStarted(wk)) return null;
  const CA = 'var(--s1)', CB = 'var(--s2)';
  const snaps = liveSeries(wk).filter(s => s.p[g.A.rosterId] !== undefined);
  const slates = weekSlates(wk);
  if (!slates.length) return null;

  /* Wall-clock time wastes most of its width on an empty Friday and crushes the
     three Sunday windows into a smudge. The axis is the week's slates instead:
     pregame, then one equal column per kickoff window, with readings placed
     proportionally inside the window they fall in. */
  const bounds = [slates[0].start - 3 * 3600 * 1000].concat(slates.map(sl => sl.start));
  bounds.push(slates[slates.length - 1].start + 4 * 3600 * 1000);
  const nWin = bounds.length - 1;
  const slateX = (t) => {
    if (t <= bounds[0]) return 0;
    for (let i = 0; i < nWin; i++) {
      if (t < bounds[i + 1]) return i + (t - bounds[i]) / Math.max(1, bounds[i + 1] - bounds[i]);
    }
    return nWin;
  };
  const labels = ['Pre'].concat(slates.map(sl => sl.label));
  const t0 = bounds[0];
  const pre = preWeekOdds(wk);

  const pts = [{ x: 0, y: (pre[g.A.rosterId] !== undefined ? pre[g.A.rosterId] : g.pA) * 100, label: 'Before kickoff' }];
  snaps.forEach(s => {
    if (s.t <= t0) return;
    pts.push({
      x: slateX(s.t), y: s.p[g.A.rosterId] * 100,
      label: new Date(s.t).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })
        + (s.s && s.s[g.A.rosterId] !== undefined ? ' · ' + fmt(s.s[g.A.rosterId], 1) + '–' + fmt(s.s[g.B.rosterId], 1) : '')
    });
  });
  const lastX = pts[pts.length - 1].x;
  const nowX = slateX(Date.now());
  // a week that is over ends where the readings ended; only a live week has a "now"
  if (!weekFinished(wk) && nowX > lastX + 0.02) {
    pts.push({ x: nowX, y: g.pA * 100, label: 'now · ' + fmt(g.a.total, 1) + '–' + fmt(g.b.total, 1) });
  }
  if (pts.length < 2) {
    // the week ran without the app being open for it; say so rather than
    // drawing a chart out of a single point
    return card('Win probability', null, h('div.empty',
      h('div', { style: { fontWeight: 600, color: 'var(--text-secondary)' } }, 'No readings from this week'),
      h('div.tiny', { style: { marginTop: '6px', maxWidth: '460px', margin: '6px auto 0' } },
        'The trace is built from readings taken while this page is open, so it only exists for weeks you watched. '
        + 'Open the app during a week and it fills in on its own.')));
  }
  pts.sort((a, b) => a.x - b.x);

  const xEnd = pts[pts.length - 1].x;
  const ticks = labels.map((lb, i) => ({ x: i, label: lb, rule: i > 0 })).filter(t => t.x <= xEnd + 0.01);
  const chart = lineChart([{ name: g.A.short, color: CA, width: 2.4, points: pts }], {
    h: 270, dots: false, y0: 0, y1: 100, yRule: 50, yTicks: 2, x0: 0, x1: Math.max(1, xEnd),
    yFmt: v => Math.abs(v - 50) < 1 ? '50' : String(Math.round(v > 50 ? v : 100 - v)),
    xTickValues: ticks,
    aria: 'win probability through the week'
  });
  const moved = Math.max.apply(null, pts.map(p => Math.abs(p.y - pts[0].y)));
  const swung = pts.some(p => (p.y - 50) * (pts[0].y - 50) < 0);
  return card('Win probability',
    `${g.A.name} above the line, ${g.B.name} below · ${snaps.length} reading${snaps.length === 1 ? '' : 's'} taken`
    + (moved > 1 ? ` · biggest move ${moved.toFixed(0)} points` : '')
    + (swung ? ' · the lead has changed hands' : ''),
    h('div',
      h('div.row', { style: { gap: '7px', marginBottom: '6px' } },
        h('span', { style: { width: '16px', height: '9px', borderRadius: '2px', background: CA, display: 'inline-block' } }),
        h('b.tiny', g.A.name)),
      chart,
      h('div.row', { style: { gap: '7px', marginTop: '6px' } },
        h('span', { style: { width: '16px', height: '9px', borderRadius: '2px', background: CB, display: 'inline-block' } }),
        h('b.tiny', g.B.name),
        h('span.tiny.muted', '— ahead whenever the line is below the middle')),
      h('div.tiny.muted', { style: { marginTop: '8px' } },
        'One column per kickoff window' + (slates.length ? ' (' + slates.map(sl => sl.label + ' ×' + Math.round(sl.n)).join(', ') + ')' : '')
        + '. The line is only as detailed as the times this page was open — it takes a reading on load, at most one every ten minutes.')));
}
/* ================= 14. HOME =================
   The landing page: which league you are looking at, where the season stands,
   and a way into every other page. It is the first thing a visit meets, so it
   answers "what is this and where do I go" before it answers anything else. */

/** One line each, so a tile says what the page is for rather than repeating its name. */
/** Two of these read differently once there is no next season to rank. */
function blurbFor(k) {
  if (!isDynasty()) {
    if (k === 'power') return 'The league ranked on this season, by projection and by results';
    if (k === 'scout') return 'Who needs what — every roster’s holes and surpluses right now';
    if (k === 'stock') return 'Redraft value over time, for a player or a whole franchise';
    if (k === 'trade') return 'Price a trade at redraft value and see what it does to the season';
  }
  return VIEW_BLURB[k] || '';
}
const VIEW_BLURB = {
  week: 'Live scores, win probability and the game that matters most',
  roster: 'Any roster in full — value, projections and the starting lineup',
  lineup: 'Who to start this week, with the calls actually worth thinking about',
  trade: 'Price a trade and see what it does to the season',
  finder: 'Trades that fit both rosters, scanned across the league',
  trades: 'Every completed trade, graded at today’s market',
  h2h: 'Two teams side by side, this week and as franchises',
  power: 'The league ranked, by projection and by what has happened',
  standings: 'Wins, losses and points actually scored',
  scout: 'Who needs what — every roster’s holes and surpluses',
  sim: 'Playoff odds, seeds, and the games with most riding on them',
  draft: 'The draft board, shaded by value against slot par',
  stock: 'Value over time, for a player or a whole franchise'
};
/* The tiles, in the order someone would actually want them. */
const HOME_TILES = ['week', 'lineup', 'roster', 'trade', 'finder', 'h2h', 'power', 'standings', 'sim', 'scout', 'trades', 'draft', 'stock'];

function goView(k) { S.view = k; render(); window.scrollTo(0, 0); }

function viewHome() {
  const wrap = h('div.grid', { style: { gap: '20px' } });
  const cfg = S.cfg;
  const me = S.teamById[S.myRosterId];
  const wk = S.liveWeek || clamp(S.lastWeek + 1, 1, S.regEnd);
  const fmtStr = `${cfg.superflex ? 'Superflex' : '1QB'} · ${cfg.actualTeams} teams · `
    + `${cfg.ppr === 1 ? 'PPR' : cfg.ppr === 0.5 ? 'Half-PPR' : 'Standard'} · ${isDynasty() ? 'dynasty' : 'redraft'}`;
  const state = S.liveWeek ? 'Week ' + S.liveWeek + ' in progress'
    : S.lastWeek >= S.regEnd ? 'Regular season complete'
      : S.lastWeek ? 'Through week ' + S.lastWeek : 'Preseason';

  /* ---- who and what ----
     The badges of the league's own teams run across the back of the banner,
     masked so they fade out before they reach the name. They are decoration, so
     they only appear in the Default view, and a badge that fails to load simply
     takes itself out — if none of them arrive the gradient is still there. */
  const band = !isSimple() ? null : (() => {
    const badges = S.teams.filter(t => t.avatar).slice(0, 9);
    if (!badges.length) return null;
    return h('div.heroband', { 'aria-hidden': 'true' }, badges.map(t =>
      h('img', { src: t.avatar, alt: '', loading: 'lazy', onerror: e => e.target.remove() })));
  })();
  wrap.appendChild(h('div.hero',
    band,
    S.league.avatar
      ? h('img.heroav', { src: 'https://sleepercdn.com/avatars/' + S.league.avatar, alt: '', loading: 'lazy', onerror: e => e.target.style.visibility = 'hidden' })
      : h('div.heroav'),
    h('div', { style: { minWidth: 0, flex: 1 } },
      h('h1', S.league.name),
      h('div.tiny.sec', { style: { marginTop: '3px' } }, fmtStr + ' · ' + S.season + ' season · ' + S.regEnd + '-week regular season'),
      h('div.row', { style: { gap: '7px', marginTop: '9px' } },
        h('span.tag', { style: S.liveWeek ? { borderColor: 'var(--s1)', color: 'var(--s1)' } : null }, (S.liveWeek ? '● ' : '') + state),
        me ? h('span.tag', 'You: ' + me.name) : null,
        S.league.status ? h('span.tag', String(S.league.status).replace(/_/g, ' ')) : null))));

  /* ---- where you stand ---- */
  if (me) {
    const rec = `${me.wins}-${me.losses}${me.ties ? '-' + me.ties : ''}`;
    const simBy = S.sim && S.sim.by ? S.sim.by[me.rosterId] : null;
    wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))' } },
      kpi('Your record', rec, S.gamesPlayed ? fmt(me.avgPts, 1) + ' per week' : 'no games yet'),
      kpi('Power rank', '#' + me.powerRank, 'of ' + S.teams.length),
      dynOnly(kpi('Future rank', '#' + me.futureRank, 'two to three years out')),
      kpi(capitalLabel(), kfmt(Math.round(me.totalValue)), ord(me.valueRank) + ' in the league'),
      simBy ? kpi('Playoff odds', pct(simBy.playoff, 0), pct(simBy.title, 1) + ' title')
        : kpi('Playoff odds', '—', 'run the simulator')));
  }

  /* ---- the week, if there is one being played ---- */
  if (S.liveWeek && me) {
    const g = liveMatchups(S.liveWeek).find(x => x.A.rosterId === me.rosterId || x.B.rosterId === me.rosterId);
    if (g) {
      const mine = g.A.rosterId === me.rosterId;
      const my = mine ? g.a : g.b, th = mine ? g.b : g.a;
      const them = mine ? g.B : g.A, p = mine ? g.pA : g.pB;
      // both badges either side of the score, so the card says who at a glance
      const face = (T, colour, total, right) => h('div.mvside' + (right ? '.r' : ''),
        T.avatar
          ? h('img.mvav', { src: T.avatar, alt: '', loading: 'lazy', onerror: e => e.target.style.visibility = 'hidden' })
          : h('div.mvav'),
        h('div', { style: { minWidth: 0 } },
          h('div.tiny.muted', { style: { lineHeight: '1.2' } }, T.rosterId === me.rosterId ? 'You' : T.name),
          h('b', { style: { fontSize: '26px', color: colour, lineHeight: '1.1', display: 'block' } }, fmt(total, 1))));
      wrap.appendChild(card('Your week ' + S.liveWeek, 'scored live — banked where the games are over, projected where they are not',

          h('div.row', { style: { gap: '16px', flexWrap: 'wrap' } },

            h('button.btn', { onclick: () => goView('lineup') }, 'Check my lineup')))));

  }

  const faces = myHeadliners(me);
  if (faces) wrap.appendChild(faces);

  /* ---- the top of the table ---- */
  const strip = leagueStrip();
  if (strip) wrap.appendChild(strip);

  /* ---- everywhere else ---- */
  wrap.appendChild(card('Everything else', 'thirteen pages, all reading the same league',
    h('div.tilegrid', HOME_TILES.map(k => {
      const v = VIEWS.find(x => x.k === k); if (!v) return null;

    }))));

  /* ---- where the numbers come from ---- */
  wrap.appendChild(card('Where this comes from', null,
    h('div.tiny.sec', { style: { lineHeight: '1.55' } },
      'Rosters, matchups, drafts and trades are read live from ', h('b', 'Sleeper'),
      '; weekly projections are Sleeper’s own lines re-scored through this league’s settings; ',
      isDynasty() ? 'player and pick values are ' : 'player values are ',
      h('b', 'FantasyCalc'), ' ', valueWord(), ' prices for a ', cfg.superflex ? 'superflex' : '1QB', ' ', String(cfg.numTeams),
      '-team ', cfg.ppr === 1 ? 'PPR' : cfg.ppr === 0.5 ? 'half-PPR' : 'standard', ' league.',
      isDynasty() ? null : h('span', ' Because this is a redraft league, nothing carries to next season: no long-range projections, no ageing curve, and next year’s draft is a fresh start rather than an asset to hold.'),
      ' Everything is computed in this browser — nothing is stored anywhere else.')));
  return wrap;
}


/** The last few results, oldest first. Read from the matchup feed rather than
 *  from the running record, so a bye or a missing week cannot slide the run out
 *  of alignment with the weeks it is meant to describe. */
function recentForm(t, n) {
  const out = [];
  for (let w = 1; w <= S.lastWeek; w++) {
    const ms = S.matchups[w]; if (!ms) continue;
    const mine = ms.find(m => m.roster_id === t.rosterId);
    if (!mine || !mine.matchup_id) continue;
    const opp = ms.find(m => m.matchup_id === mine.matchup_id && m.roster_id !== t.rosterId);
    if (!opp) continue;
    const a = mine.points || 0, b = opp.points || 0;
    out.push({ week: w, r: a > b ? 'W' : b > a ? 'L' : 'T', pf: a, pa: b, opp: S.teamById[opp.roster_id] });
  }
  return out.slice(-(n || 5));
}

/** The top of the table, on blocks. Ordered exactly the way Active Rankings
 *  orders it — wins, then points — because that is the table people argue about.
 *  Before a ball is kicked there is nothing to stand on, so it falls back to the
 *  projection and says so rather than inventing a leader. */
function leaguePodium(ranked, live) {
  const top = ranked.slice(0, 3);
  if (top.length < 3) return null;
  const hunt = ranked.slice(3, 5);
  const MEDALS = ['gold', 'silver', 'bronze'];
  // second, first, third — a podium reads from the middle outward
  const orderOnStage = [1, 0, 2];

  const formStrip = (r) => r.form.length
    ? h('div.form', r.form.map(f => bindTT(h('i.' + f.r), `<div class="k">Week ${f.week}</div>`
      + `${f.r === 'W' ? 'Beat' : f.r === 'L' ? 'Lost to' : 'Tied'} <b>${f.opp ? f.opp.short : '?'}</b><br>`
      + `${fmt(f.pf, 1)} – ${fmt(f.pa, 1)}`)))
    : null;

  const step = (idx) => {
    const r = top[idx], t = r.t;
    return h('div.pod.p' + (idx + 1) + (t.rosterId === S.myRosterId ? '.mine' : ''), {
      tabindex: 0, role: 'button', title: t.name + ' — ' + t.owner,
      onclick: () => { RosterUI.team = t.rosterId; goView('roster'); },
      onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); RosterUI.team = t.rosterId; goView('roster'); } }
    },
      h('div.podtop',
        t.avatar
          ? h('img.podav', { src: t.avatar, alt: '', loading: 'lazy', onerror: e => e.target.style.visibility = 'hidden' })
          : h('div.podav'),
        h('div.nm', t.name),
        h('div.tiny.muted', live ? `${t.wins}-${t.losses}${t.ties ? '-' + t.ties : ''} · ${fmt(t.fpts, 0)} PF` : fmt(t.power, 1) + ' rating'),
        formStrip(r),
        r.s ? h('div.pododds', h('b', pct(r.s.title, 1)), ' to win it') : null),
      h('div.block.' + MEDALS[idx], h('span.place', idx + 1)));
  };

  const huntRow = (r, i) => {
    const t = r.t, gap = top[2].t.wins - t.wins, pts = top[2].t.fpts - t.fpts;
    return h('div.huntrow', {
      tabindex: 0, role: 'button',
      onclick: () => { RosterUI.team = t.rosterId; goView('roster'); },
      onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); RosterUI.team = t.rosterId; goView('roster'); } }
    },
      h('div.rk', ranked.indexOf(r) + 1),
      t.avatar ? h('img.avatar', { src: t.avatar, alt: '', loading: 'lazy', onerror: e => e.target.style.visibility = 'hidden' }) : h('div.avatar'),
      h('div', { style: { minWidth: 0 } },
        h('div.nm', t.name),
        h('div.tiny.muted', live
          ? (gap > 0 ? gap + (gap === 1 ? ' win' : ' wins') + ' back'
            : pts > 0 ? fmt(pts, 0) + ' points back' : 'level on the cut')
          : fmt(top[2].t.power - t.power, 1) + ' rating back')),
      formStrip(r) || h('span'));
  };

  return h('div.podwrap',
    h('div.podium', orderOnStage.map(step)),
    hunt.length ? h('div.hunt',
      h('div.lbl', 'In the hunt'),
      hunt.map(huntRow)) : null);
}

/** Every team in the league in one ranked strip: badge, record, scoring, recent
 *  form and how the season is likely to end. */
function leagueStrip() {
  const sim = S.sim && S.sim.by ? S.sim : null;
  const live = S.gamesPlayed > 0;
  // the Active Rankings order: wins first, then points. Before week 1 there is
  // nothing to rank on results, so it falls back to the projection.
  const rows = S.teams.slice()
    .sort(live ? ((a, b) => (b.wins - a.wins) || (b.fpts - a.fpts)) : ((a, b) => a.powerRank - b.powerRank))
    .map(t => ({ t, s: sim ? sim.by[t.rosterId] : null, form: recentForm(t, 5) }));

  const podium = leaguePodium(rows, live);
  if (!podium) return null;
  return card('The league',
    (live ? 'the table as it stands — wins, then points' : 'nothing played yet, so this is the projection')
    + (sim ? ' · and what the simulator makes of it' : ''),
    podium,
    sim ? null : h('button.btn.sm', {
      onclick: () => { S.sim = simulate(S.simN); SimUI.res = S.sim; render(); }
    }, 'Run ' + kfmt(S.simN) + ' seasons'));
}


/** A team photo, essentially: the biggest names on your roster, lined up. It is
 *  decoration first — the numbers it shows are on four other pages — so it only
 *  appears in the Default view, and it says nothing a missing headshot would
 *  make a lie of. Every face is a way into that player's page. */
function myHeadliners(me) {
  if (!isSimple() || !me) return null;
  const pool = activePlayers(me).filter(p => p.pos !== 'PICK' && (p.dv || 0) > 0);
  if (pool.length < 3) return null;
  // six either way: on a phone that wraps to two rows of three, which reads as a
  // lineup card. Four would leave a stranded fourth on its own line.
  const best = pool.slice().sort((a, b) => (b.dv || 0) - (a.dv || 0)).slice(0, 6);
  const live = S.liveWeek;

  // "J. Allen" rather than a truncated "Josh Allen ..." — six portraits across
  // do not have room for a full name, and this is how a lineup card reads anyway
  const shortName = (p) => {
    if (p.pos === 'DEF') return p.name;
    const w = String(p.name || '').trim().split(/\s+/);
    return w.length > 1 ? w[0][0] + '. ' + w.slice(1).join(' ') : p.name;
  };

  const one = (p, i) => {
    const l = live ? liveValue(p, S.liveWeek) : null;
    return h('div.lup', {
      style: { '--i': String(i) },
      tabindex: 0, role: 'button', title: p.name + ' — ' + p.pos + (p.team ? ' · ' + p.team : ''),
      onclick: () => openPlayer(p.id, 'home'),
      onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayer(p.id, 'home'); } }
    },
      h('div.lupface', playerFace(p, { lg: true }), h('span.luppos.pos-' + p.pos, p.pos)),
      h('div.lupnm', shortName(p)),
      h('div.tiny.muted', { style: { lineHeight: '1.2' } },
        l && l.state === 'bye' ? 'on bye'
          : l ? h('span', h('b.sec', fmt(l.used, 1)), ' pts')
            : h('span', h('b.sec', fmt(p.ppg || 0, 1)), ' proj')));
  };

  return card('The headliners', me.name + '’s most valuable ' + best.length + ' — click any face for the full page',
    h('div.lineup', best.map(one)));
}
/* ================= hypothetical roster sandbox =================
   Release, sign and swap players and picks, then look at any page as if those
   moves had happened. Nothing here touches Sleeper — it is a local rebuild of
   the same model from the same baseline, so exiting always restores the truth. */
var HYP = {
  on: false,
  moves: {},          // playerId -> rosterId, or null to release to free agency
  picks: {},          // pickKey  -> rosterId, or null
  team: null,         // whose roster you are editing
  open: true,         // editor expanded
  q: '',              // player search
  seed: null,         // shared seed, so before/after odds are a paired comparison
  strict: true,       // every acquisition must be matched by something sent back
  base: null,         // metrics for the real league
  after: null,        // metrics for the current what-if
  sig: null
};
const HYP_SIMS = 1200;

function hypTeamId() {
  if (HYP.team && S.teamById[HYP.team]) return HYP.team;
  return S.myRosterId || (S.teams[0] && S.teams[0].rosterId);
}
function hypCount() { return Object.keys(HYP.moves).length + Object.keys(HYP.picks).length; }
function hypSig() {
  return JSON.stringify([HYP.moves, HYP.picks, hypTeamId()]);
}
/** Snapshot the metrics every view compares against. */
function hypMetrics(sim) {
  const out = {};
  S.teams.forEach(t => {
    const s = sim ? sim.by[t.rosterId] : null;
    out[t.rosterId] = {
      now: t.now, future: t.future, power: t.power, futurePower: t.futurePower, powerRank: t.powerRank,
      futureRank: t.futureRank, totalValue: t.totalValue, valueRank: t.valueRank,
      pickCapital: t.pickCapital, window: t.window, age: t.age,
      posNow: Object.assign({}, t.posNow),
      playoff: s ? s.playoff : null, title: s ? s.title : null, wins: s ? s.wins : null
    };
  });
  return out;
}
function hypEnter() {
  if (HYP.on) return;
  HYP.seed = (Math.random() * 4294967296) >>> 0;
  HYP.moves = {}; HYP.picks = {}; HYP.sig = null; HYP.after = null;
  HYP.team = hypTeamId();
  HYP.base = hypMetrics(simulate(HYP_SIMS, { seed: HYP.seed }));
  HYP.on = true;
  document.documentElement.setAttribute('data-hyp', '1');
}
function hypExit() {
  HYP.on = false; HYP.moves = {}; HYP.picks = {}; HYP.after = null; HYP.sig = null;
  document.documentElement.removeAttribute('data-hyp');
  applyOwnership({}, {});
}
function hypReset() {
  HYP.moves = {}; HYP.picks = {}; HYP.after = null; HYP.sig = null;
  applyOwnership({}, {});
}
/** Recompute the league under the current moves, and refresh the after-metrics. */
function hypSync() {
  if (!HYP.on) return;
  const sig = hypSig();
  if (sig === HYP.sig && HYP.after) return;
  applyOwnership(HYP.moves, HYP.picks);
  HYP.after = hypMetrics(simulate(HYP_SIMS, { seed: HYP.seed }));
  HYP.sig = sig;
}
function hypMove(playerId, toRosterId) {
  const baseOwner = S.base.own[playerId];
  if (toRosterId === baseOwner) delete HYP.moves[playerId];
  else HYP.moves[playerId] = toRosterId;
  HYP.after = null; hypSync();
}
function hypMovePick(key, toRosterId) {
  const baseOwner = S.base.pickOwn[key];
  if (toRosterId === baseOwner) delete HYP.picks[key];
  else HYP.picks[key] = toRosterId;
  HYP.after = null; hypSync();
}
/* which views actually change when a roster changes */
const HYP_VIEWS = { roster: 1, lineup: 1, power: 1, sim: 1, finder: 1, trade: 1, scout: 1, stock: 1, player: 1 };
const HYP_UNAFFECTED = {
  week: 'This Week is scored from games that are already happening. A hypothetical roster does not change points that have been banked, so the live totals and matchups here stay real.',
  standings: 'Active Rankings is pure results — wins, losses and points actually scored. A hypothetical roster cannot change games that have already been played.',
  draft: 'The draft board is a historical record of picks that were actually made, so a hypothetical roster does not change it.',
  trades: 'Trade History is a record of deals that actually happened, so a hypothetical roster does not change it. The grades already use live market values.'
};

/* ---------- trade bookkeeping ----------
   A player can only arrive from somewhere. In strict mode every partner you take
   from must also receive something, otherwise the "after" league is not one that
   could actually exist and the comparison is worthless. */
function assetLabel(id, isPick) {
  if (isPick) {
    const parts = id.split('|');
    return parts[0] + ' round ' + parts[1] + (S.teamById[+parts[2]] ? ' (' + S.teamById[+parts[2]].short + ')' : '');
  }
  const p = S.index[id] || ensurePlayer(id);
  return p.name;
}
function assetValue(id, isPick) {
  if (!isPick) { const p = S.index[id]; return p ? (p.dv || 0) : 0; }
  for (const t of S.teams) { const a = (t.pickAssets || []).find(x => pickKeyOf(x) === id); if (a) return a.dv || 0; }
  const parts = id.split('|');
  return pickValue(+parts[0], +parts[1], 'Mid');
}
function hypLedgers() {
  const me = hypTeamId();
  const partners = {}, fa = { added: [], dropped: [] }, thirdParty = [];
  const consider = (id, isPick, from, to) => {
    if (from === me && to !== me) {
      if (to === null || to === undefined) { fa.dropped.push({ id, isPick }); return; }
      (partners[to] = partners[to] || { out: [], in: [] }).out.push({ id, isPick });
    } else if (to === me && from !== me) {
      if (from === null || from === undefined) { fa.added.push({ id, isPick }); return; }
      (partners[from] = partners[from] || { out: [], in: [] }).in.push({ id, isPick });
    } else if (from !== me && to !== me) {
      thirdParty.push({ id, isPick, from, to });
    }
  };
  for (const id in HYP.moves) consider(id, false, S.base.own[id], HYP.moves[id]);
  for (const k in HYP.picks) consider(k, true, S.base.pickOwn[k], HYP.picks[k]);
  const list = Object.keys(partners).map(rid => {
    const L = partners[rid];
    const outVal = sum(L.out.map(x => assetValue(x.id, x.isPick)));
    const inVal = sum(L.in.map(x => assetValue(x.id, x.isPick)));
    const hi = Math.max(outVal, inVal), lo = Math.min(outVal, inVal);
    return {
      rosterId: +rid, team: S.teamById[+rid], out: L.out, in: L.in, outVal, inVal,
      twoSided: L.out.length > 0 && L.in.length > 0,
      fair: hi > 0 ? lo / hi : 1
    };
  });
  return { list, fa, thirdParty, me };
}
function hypValidity() {
  const L = hypLedgers();
  const oneSided = L.list.filter(x => !x.twoSided);
  const T = S.teamById[L.me];
  const spots = S.cfg.activeSpots || 0;
  // Neither an IR nor a taxi player occupies an active spot.
  const size = T ? T.players.length - T.taxi.size - T.ir.size : 0;
  return {
    ledgers: L, oneSided, thirdParty: L.thirdParty,
    ok: oneSided.length === 0 && L.thirdParty.length === 0,
    size, spots, ir: T ? T.ir.size : 0, taxi: T ? T.taxi.size : 0,
    overLimit: spots > 0 && size > spots
  };
}
/** Nearest-value asset from the side that owes something, to even a trade up. */
function hypBalanceSuggestion(led) {
  const me = hypTeamId();
  const needFrom = led.in.length && !led.out.length ? me : led.rosterId;
  const targetVal = needFrom === me ? led.inVal : led.outVal;
  const T = S.teamById[needFrom];
  if (!T) return null;
  const already = new Set(led.out.concat(led.in).map(x => x.id));
  // Only offer assets this side actually owns in the real league. Passing on a
  // player you just acquired elsewhere is a three-team deal, not a trade.
  const pool = assetsOf(T).filter(a => {
    const key = a.kind === 'pick' ? pickKeyOf(a) : a.id;
    if (already.has(key)) return false;
    // and not something already promised elsewhere in this sandbox: re-routing
    // a player who is part of another leg repairs this trade by breaking that one
    if (a.kind === 'pick' ? HYP.picks[key] !== undefined : HYP.moves[key] !== undefined) return false;
    const baseOwner = a.kind === 'pick' ? S.base.pickOwn[key] : S.base.own[key];
    return baseOwner === needFrom;
  });
  if (!pool.length) return null;
  pool.sort((x, y) => Math.abs(x.dv - targetVal) - Math.abs(y.dv - targetVal));
  return { asset: pool[0], from: needFrom, to: needFrom === me ? led.rosterId : me };
}

/* ---------- the bar that appears on every affected page ---------- */
function hypBar() {
  if (!HYP.on) return null;
  hypSync();
  const T = S.teamById[hypTeamId()];
  if (!T) return null;
  const b = HYP.base[T.rosterId], a = HYP.after[T.rosterId];
  const n = hypCount();

  const stat = (label, before, after, dec, isPct, invertRank) => {
    const d = after - before;
    const f = (v) => isPct ? pct(v, dec) : fmt(v, dec);
    return h('div', { style: { display: 'grid', gap: '1px', minWidth: 0 } },
      h('div.lbl', { style: { fontSize: '10px' } }, label),
      h('div.row', { style: { gap: '6px', alignItems: 'baseline' } },
        h('span.tiny.muted.mono', f(before)),
        h('span.tiny.muted', '→'),
        h('b.mono', { style: { fontSize: '15px' } }, f(after))),
      Math.abs(d) < (isPct ? 0.0005 : 0.05)
        ? h('span.tiny.flat', 'no change')
        : deltaTag(invertRank ? -d : d, dec, isPct ? 'pp' : ''));
  };
  const rankStat = (label, before, after) => h('div', { style: { display: 'grid', gap: '1px' } },
    h('div.lbl', { style: { fontSize: '10px' } }, label),
    h('div.row', { style: { gap: '6px', alignItems: 'baseline' } },
      h('span.tiny.muted.mono', '#' + before), h('span.tiny.muted', '→'),
      h('b.mono', { style: { fontSize: '15px' } }, '#' + after)),
    before === after ? h('span.tiny.flat', 'no change')
      : h('span', { class: after < before ? 'up' : 'down', style: { fontSize: '11.5px', fontWeight: 620 } },
        (after < before ? '▲ up ' : '▼ down ') + Math.abs(after - before)));

  const summary = h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(118px,1fr))', gap: '12px' } },
    stat('Lineup pts/wk', b.now, a.now, 1),
    rankStat('Power rank', b.powerRank, a.powerRank),
    dynOnly(rankStat('Future rank', b.futureRank, a.futureRank)),
    stat(capitalLabel(), b.totalValue, a.totalValue, 0),
    b.playoff !== null ? stat('Playoff odds', b.playoff, a.playoff, 0, true) : null,
    b.title !== null ? stat('Title odds', b.title, a.title, 1, true) : null
  );

  const V = hypValidity();
  const blocked = HYP.strict && !V.ok && n > 0;

  const head = h('div.row', { style: { justifyContent: 'space-between', gap: '10px' } },
    h('div.row', { style: { gap: '9px' } },
      h('span.hyp-badge', 'HYPOTHETICAL'),
      h('select', {
        style: { fontSize: '12.5px', padding: '4px 8px' },
        onchange: e => { HYP.team = +e.target.value; HYP.after = null; render(); }
      }, S.teams.map(t => h('option', { value: t.rosterId, selected: t.rosterId === T.rosterId }, t.name))),
      h('span.tiny.muted', n ? n + (n === 1 ? ' move' : ' moves') + ' applied' : 'no moves yet — the numbers below are the real league')),
    h('div.row', { style: { gap: '6px' } },
      segmented([{ k: true, label: 'Balanced trades' }, { k: false, label: 'Free edits' }], HYP.strict,
        v => { HYP.strict = v; render(); }),
      h('button.btn.sm', { onclick: () => { HYP.open = !HYP.open; render(); } }, HYP.open ? 'Hide editor' : 'Edit roster'),
      n ? h('button.btn.sm', { onclick: () => { hypReset(); render(); } }, 'Reset moves') : null,
      h('button.btn.sm', { onclick: () => { hypExit(); render(); } }, 'Exit')));

  return h('div.hypbar',
    h('div', { style: { display: 'grid', gap: '12px' } },
      head,
      n ? (V.ledgers.list.length || V.thirdParty.length ? hypLedgerView(V) : null) : null,
      V.overLimit ? h('div.tiny', { style: { color: 'var(--bad-text)', fontWeight: 560 } },
        `${T.name} would carry ${V.size} active players for ${V.spots} active spots`
        + (V.ir || V.taxi ? ` (${V.taxi} on taxi and ${V.ir} on IR do not count)` : '')
        + ` — you would need to release ${V.size - V.spots} more.`) : null,
      blocked ? hypBlockedNotice(V)
        : (n ? summary : h('div.tiny.muted', 'Release, sign or swap players below and every page will recompute as if it had happened. Nothing is sent to Sleeper.')),
      HYP.open ? hypEditor(T) : null,
      n ? hypMoveList() : null));
}

/* ---------- the editor: your roster on the left, everyone else on the right ---------- */
function hypEditor(T) {
  const others = S.teams.filter(t => t.rosterId !== T.rosterId);
  const dest = (cur) => [{ v: T.rosterId, l: 'Keep' }, { v: '', l: 'Release' }]
    .concat(others.map(o => ({ v: o.rosterId, l: '→ ' + o.name })));

  const mine = assetsOf(T).sort((x, y) => y.dv - x.dv);
  const rows = mine.map(a => {
    const isNew = a.kind === 'player'
      ? (S.base.own[a.id] !== T.rosterId)
      : (S.base.pickOwn[pickKeyOf(a)] !== T.rosterId);
    return h('div.asset', { style: { cursor: 'default' } },
      posPill(a.pos),
      a.kind === 'player' ? pname(a.ref, { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } })
        : h('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, a.name),
      isNew ? h('span.tag', { style: { borderColor: 'var(--good)', color: 'var(--good-text)', flex: 'none' } }, 'IN') : null,
      h('span.v', kfmt(Math.round(a.dv))),
      h('select', {
        style: { fontSize: '11px', padding: '2px 5px', flex: 'none', maxWidth: '112px' },
        onchange: e => {
          const v = e.target.value === '' ? null : +e.target.value;
          if (a.kind === 'player') hypMove(a.id, v); else hypMovePick(pickKeyOf(a), v);
          render();
        }
      }, dest().map(o => h('option', { value: o.v, selected: o.v === T.rosterId }, o.l))));
  });

  // everyone not on this roster, free agents included
  const pool = [];
  S.teams.forEach(t => { if (t.rosterId === T.rosterId) return; assetsOf(t).forEach(a => pool.push({ a, from: t })); });
  Object.values(S.index).forEach(p => {
    if (S.base.own[p.id] === undefined && HYP.moves[p.id] === undefined && (p.dv || 0) > 150 && !ownerOfPlayer(p.id))
      pool.push({ a: { id: p.id, name: p.name, pos: p.pos, dv: p.dv || 0, ref: p, kind: 'player' }, from: null });
  });
  pool.sort((x, y) => y.a.dv - x.a.dv);
  const q = HYP.q.trim().toLowerCase();
  const filtered = pool.filter(x => !q || x.a.name.toLowerCase().includes(q)).slice(0, 80);

  const addList = h('div.picker',
    filtered.length ? filtered.map(({ a, from }) => h('div.asset.pickable', {
      onclick: () => { if (a.kind === 'player') hypMove(a.id, T.rosterId); else hypMovePick(pickKeyOf(a), T.rosterId); render(); }
    },
      posPill(a.pos),
      h('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, a.name),
      h('span.tiny.muted', { style: { flex: 'none' } }, from ? from.short : 'FA'),
      h('span.v', kfmt(Math.round(a.dv)))))
      : h('div.tiny.muted', { style: { padding: '10px' } }, 'Nothing matches'));

  return h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(280px,1fr))', gap: '12px', borderTop: '1px solid var(--border)', paddingTop: '12px' } },
    h('div', { style: { minWidth: 0 } },
      h('div.row', { style: { justifyContent: 'space-between', marginBottom: '5px' } },
        h('label.fld', { style: { gap: 0 } }, T.name + ' — ' + mine.length + ' assets'),
        h('span.tiny.muted', 'send anywhere, or release')),
      h('div.picker', rows)),
    h('div', { style: { minWidth: 0 } },
      h('div.row', { style: { justifyContent: 'space-between', marginBottom: '5px' } },
        h('label.fld', { style: { gap: 0 } }, 'Acquire'),
        h('span.tiny.muted', 'other rosters and free agents')),
      h('input', {
        placeholder: 'Search anyone…', value: HYP.q, style: { width: '100%', marginBottom: '6px' },
        oninput: e => {
          HYP.q = e.target.value;
          const box = e.target.parentNode.querySelector('.picker');
          if (box) { const fresh = hypEditor(T); const nb = fresh.querySelectorAll('.picker')[1]; if (nb) box.replaceWith(nb); }
        }
      }),
      addList));
}
function pickKeyOf(a) {
  if (a.kind !== 'pick') return null;
  const r = a.ref;
  return r.season + '|' + r.round + '|' + r.origRosterId;
}

function hypMoveList() {
  const rows = [];
  const nameOfTeam = (rid) => rid === null || rid === undefined ? 'free agency' : (S.teamById[rid] || {}).name || '?';
  for (const id in HYP.moves) {
    const p = S.index[id] || ensurePlayer(id);
    rows.push({ label: p.name, pos: p.pos, from: nameOfTeam(S.base.own[id]), to: nameOfTeam(HYP.moves[id]), undo: () => { delete HYP.moves[id]; HYP.after = null; hypSync(); render(); } });
  }
  for (const k in HYP.picks) {
    const parts = k.split('|');
    rows.push({
      label: parts[0] + ' round ' + parts[1] + ' (' + ((S.teamById[+parts[2]] || {}).short || '?') + ')', pos: 'PICK',
      from: nameOfTeam(S.base.pickOwn[k]), to: nameOfTeam(HYP.picks[k]),
      undo: () => { delete HYP.picks[k]; HYP.after = null; hypSync(); render(); }
    });
  }
  return h('div', { style: { borderTop: '1px solid var(--border)', paddingTop: '10px', display: 'grid', gap: '4px' } },
    h('div.lbl', { style: { fontSize: '10px', marginBottom: '2px' } }, 'Moves applied'),
    rows.map(r => h('div.row', { style: { gap: '8px', fontSize: '12px' } },
      posPill(r.pos),
      h('b', r.label),
      h('span.tiny.muted', r.from + ' → ' + r.to),
      h('span', { style: { flex: 1 } }),
      h('button.btn.sm', { onclick: r.undo }, 'Undo'))));
}

/* ---------- the one-line note for pages a roster change cannot touch ---------- */
function hypNote(view) {
  if (!HYP.on || !HYP_UNAFFECTED[view]) return null;
  return h('div.hypbar.quiet',
    h('div.row', { style: { gap: '9px' } },
      h('span.hyp-badge', 'HYPOTHETICAL'),
      h('span.tiny.sec', HYP_UNAFFECTED[view])));
}

/* ---------- per-partner ledger, so a trade reads as a trade ---------- */
function hypLedgerView(V) {
  const me = hypTeamId();
  const chip = (x) => h('span.tag', { style: { fontWeight: 560 } }, assetLabel(x.id, x.isPick));
  const rows = V.ledgers.list.map(led => {
    const sug = led.twoSided ? null : hypBalanceSuggestion(led);
    return h('div', {
      style: {
        border: '1px solid ' + (led.twoSided ? 'var(--border)' : 'var(--critical)'),
        borderRadius: 'var(--r-sm)', padding: '8px 10px', background: 'var(--surface-1)', display: 'grid', gap: '6px'
      }
    },
      h('div.row', { style: { justifyContent: 'space-between', gap: '8px' } },
        h('div.row', { style: { gap: '7px' } },
          h('b.tiny', 'with ' + (led.team ? led.team.name : '?')),
          led.twoSided
            ? h('span.tag', { style: { borderColor: 'var(--good)', color: 'var(--good-text)' } }, 'balance ' + pct(led.fair, 0))
            : h('span.tag', { style: { borderColor: 'var(--critical)', color: 'var(--bad-text)' } }, led.in.length ? 'nothing sent back' : 'nothing coming back')),
        sug ? h('button.btn.sm', {
          onclick: () => {
            const a = sug.asset;
            if (a.kind === 'pick') hypMovePick(pickKeyOf(a), sug.to); else hypMove(a.id, sug.to);
            render();
          }
        }, 'Even it up with ' + sug.asset.name) : null),
      h('div.row', { style: { gap: '10px', alignItems: 'flex-start' } },
        h('div', { style: { flex: 1, minWidth: 0 } },
          h('div.tiny.muted', 'you send · ' + kfmt(Math.round(led.outVal))),
          h('div.row', { style: { gap: '4px' } }, led.out.length ? led.out.map(chip) : h('span.tiny.muted', '—'))),
        h('div.tiny.muted', '⇄'),
        h('div', { style: { flex: 1, minWidth: 0 } },
          h('div.tiny.muted', 'you get · ' + kfmt(Math.round(led.inVal))),
          h('div.row', { style: { gap: '4px' } }, led.in.length ? led.in.map(chip) : h('span.tiny.muted', '—')))));
  });
  const fa = V.ledgers.fa;
  if (fa.added.length || fa.dropped.length) {
    rows.push(h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', padding: '8px 10px', background: 'var(--surface-1)' } },
      h('div.row', { style: { gap: '7px' } }, h('b.tiny', 'free agency'),
        h('span.tiny.muted', 'no other roster is touched')),
      h('div.row', { style: { gap: '10px', marginTop: '4px' } },
        h('div', { style: { flex: 1 } }, h('div.tiny.muted', 'released'), h('div.row', { style: { gap: '4px' } }, fa.dropped.length ? fa.dropped.map(chip) : h('span.tiny.muted', '—'))),
        h('div', { style: { flex: 1 } }, h('div.tiny.muted', 'signed'), h('div.row', { style: { gap: '4px' } }, fa.added.length ? fa.added.map(chip) : h('span.tiny.muted', '—'))))));
  }
  if (V.thirdParty.length) {
    rows.push(h('div', { style: { border: '1px solid var(--critical)', borderRadius: 'var(--r-sm)', padding: '8px 10px', background: 'var(--surface-1)' } },
      h('b.tiny', V.thirdParty.length + ' move' + (V.thirdParty.length === 1 ? '' : 's') + ' between two other teams'),
      h('div.tiny.muted', 'These do not involve ' + (S.teamById[me] || {}).name + ', so they cannot be part of your trade.')));
  }
  return h('div', { style: { display: 'grid', gap: '7px' } }, rows);
}

function hypBlockedNotice(V) {
  const bits = [];
  V.oneSided.forEach(led => bits.push((led.team ? led.team.name : 'a team')
    + (led.in.length ? ' has not received anything back' : ' has not sent anything')));
  if (V.thirdParty.length) bits.push(V.thirdParty.length + ' move(s) involve two other teams');
  return h('div', {
    style: {
      border: '1px solid var(--critical)', borderRadius: 'var(--r-sm)', padding: '10px 12px',
      background: 'color-mix(in srgb, var(--critical) 7%, transparent)', display: 'grid', gap: '4px'
    }
  },
    h('div.row', { style: { gap: '7px' } },
      h('span', { style: { color: 'var(--critical)', fontWeight: 700 } }, '!'),
      h('b', 'Impact hidden — this is not a trade anyone could make')),
    h('div.tiny.sec', bits.join(' · ') + '.'),
    h('div.tiny.muted',
      'A one-sided move makes your team better and theirs worse in a way that could never happen, so the simulated odds either side of it would not be comparable. '
      + 'Send something back, or switch to Free edits if you only want to see what a roster looks like without the other team reacting.'));
}
/* ================= boot ================= */
async function boot(leagueId, onStep) {
  try {
    S.busy = true;
    await loadLeague(leagueId, onStep);
    const me = LS.get('me', null);
    if (me) { const t = S.teams.find(t => t.ownerId === me); if (t) S.myRosterId = t.rosterId; }
    if (!S.myRosterId) S.myRosterId = S.teams[0].rosterId;
    RosterUI.team = S.myRosterId; TradeUI.a = S.myRosterId; FinderUI.team = S.myRosterId;
    // a league that has just loaded lands on the front page; the live week is one
    // click from there, and is called out at the top of it when there is one
    if (S.view === 'roster') S.view = 'home';
    S.busy = false;
    S.sim = null;
    render();
  } catch (e) {
    S.busy = false; console.error(e);
    if (onStep) onStep('', 0);
    const app = $('#app');
    if (!S.league) {
      clear(app); app.appendChild(splash());
      const st = $('.splash .tiny.muted');
      const box = $('.splash .box .bd');
      box.appendChild(h('div', { style: { marginTop: '10px', padding: '9px 11px', border: '1px solid var(--critical)', borderRadius: 'var(--r-sm)', background: 'color-mix(in srgb, var(--critical) 8%, transparent)' } },
        h('b', { style: { color: 'var(--bad-text)' } }, 'Could not load'), h('div.tiny.sec', String(e.message || e)),
        h('div.tiny.muted', { style: { marginTop: '5px' } }, 'If this says “Failed to fetch”, the API is unreachable from this page — check your connection, or open this file directly in a browser rather than inside another app’s preview pane.')));
    }
  }
}
setTheme(currentTheme());
setUiMode(LS.get('ui', 'simple'));   // a first visit should meet the calmer view
setNameMode(LS.get('names', 'user')); // people know each other by handle, not by team name
watchViewport();
const _last = LS.get('last', null);
render();
if (_last && /^\d{6,25}$/.test(String(_last))) {
  const st = $('.splash .tiny.muted');
  const bar = $('.splash .loadbar i');
  boot(_last, (m, p) => { if (st) st.textContent = m; if (bar) bar.style.width = (p * 100) + '%'; });
}


</script>

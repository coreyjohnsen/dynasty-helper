<style>
/* ============ tokens ============ */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --surface-2:#f9f9f7; --surface-3:#f2f2ee; --plane:#f4f4f1;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10); --border-strong:rgba(11,11,11,0.18);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --seq-100:#cde2fb; --seq-150:#b7d3f6; --seq-200:#9ec5f4; --seq-250:#86b6ef; --seq-300:#6da7ec;
  --seq-350:#5598e7; --seq-400:#3987e5; --seq-450:#2a78d6; --seq-500:#256abf; --seq-550:#1c5cab;
  --seq-600:#184f95; --seq-650:#104281; --seq-700:#0d366b;
  --div-neutral:#f0efec;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300; --bad-text:#a92f2f;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
  --r:10px; --r-sm:7px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1a1a19; --surface-2:#141413; --surface-3:#232322; --plane:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --div-neutral:#383835;
    --good-text:#0ca30c; --bad-text:#e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --surface-2:#141413; --surface-3:#232322; --plane:#0d0d0d;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --div-neutral:#383835;
  --good-text:#0ca30c; --bad-text:#e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--text-primary);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:620;letter-spacing:-.011em}
a{color:var(--s1)}
button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--axis);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--surface-2);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--s1),var(--s7));flex:none}
.brand b{font-size:13.5px;letter-spacing:-.015em;line-height:1.15}
.brand small{display:block;color:var(--text-muted);font-size:10.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--text-secondary);cursor:pointer;text-align:left;width:100%;font-size:13px;font-weight:500;transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface-3);color:var(--text-primary)}
.navbtn.on{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:var(--shadow)}
.navbtn .ic{width:16px;text-align:center;font-size:13px;opacity:.9;flex:none}
.navbtn.on .ic{color:var(--s1)}
.side .spacer{flex:1}
.side .foot{padding:8px;border-top:1px solid var(--border);margin-top:8px;font-size:11px;color:var(--text-muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface-1);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .lg{font-weight:640;letter-spacing:-.012em}
.topbar .sub{color:var(--text-muted);font-size:12px}
.topbar .grow{flex:1}
/* The content column takes whatever width the window gives it. Nothing here is
   a wall of prose, and every grid is auto-fit, so a wide monitor buys more
   cards per row rather than longer lines. The cap is past any ordinary display
   — it only stops a table spreading itself across an ultrawide. */
.content{padding:20px 22px;width:100%;max-width:2400px}
@media (min-width:1700px){ .content{padding:22px 30px} }

/* ============ atoms ============ */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card .hd{padding:13px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .hd h3{font-size:14px}
.card .hd .note{color:var(--text-muted);font-size:11.5px}
.card .bd{padding:14px 16px 16px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.grid.split{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.grid.split2{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:center}
@media (max-width:860px){ .grid.split{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){ .grid.split2{grid-template-columns:minmax(0,1fr);gap:6px} }
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row>*{min-width:0}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:11.5px}
.big{font-size:26px;font-weight:660;letter-spacing:-.02em}
.hero{font-size:34px;font-weight:660;letter-spacing:-.025em;line-height:1.1}

.btn{padding:6px 11px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-1);cursor:pointer;font-size:12.5px;font-weight:520;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:11.5px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:2px;gap:2px;border:1px solid var(--border)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:520;color:var(--text-secondary)}
.seg button.on{background:var(--surface-1);color:var(--text-primary);font-weight:620;box-shadow:0 1px 2px rgba(0,0,0,.08)}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary)}
input:focus,select:focus{outline:2px solid var(--s1);outline-offset:-1px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text-muted);font-weight:560}

.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:620;border:1px solid var(--border)}
.pos-QB{background:#e34948;color:#fff;border-color:transparent}
.pos-RB{background:#1baf7a;color:#fff;border-color:transparent}
.pos-WR{background:#2a78d6;color:#fff;border-color:transparent}
.pos-TE{background:#eb6834;color:#fff;border-color:transparent}
.pos-K{background:#8a8880;color:#fff;border-color:transparent}
.pos-DEF{background:#4a3aa7;color:#fff;border-color:transparent}
.pos-PICK{background:#eda100;color:#231a00;border-color:transparent}
.pos-FLEX,.pos-NA{background:var(--surface-3);color:var(--text-secondary)}
.hypbar{border:1px dashed var(--s7);border-radius:var(--r);background:color-mix(in srgb, var(--s7) 6%, var(--surface-1));padding:13px 15px;margin-bottom:14px;min-width:0}
.hypbar.quiet{padding:9px 13px}
.hyp-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;background:#4a3aa7;color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;flex:none;white-space:nowrap}
:root[data-hyp] .topbar{box-shadow:inset 0 -2px 0 var(--s7)}
.btn.hypon{background:var(--s7);border-color:var(--s7);color:#fff}
.btn.hypon:hover{filter:brightness(1.08)}
tr.hyp-out td{opacity:.42}
.plink{cursor:pointer;border-bottom:1px solid color-mix(in srgb, var(--s1) 45%, transparent);transition:color .12s,border-color .12s}
.plink:hover{color:var(--s1);border-bottom-color:var(--s1)}
.plink:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-1);cursor:pointer;font-size:12px;font-weight:560;user-select:none;transition:background .12s,border-color .12s,color .12s}
.chip:hover{background:var(--surface-3)}
.chip.on{background:var(--s1);border-color:var(--s1);color:#fff}
.chip.on .dot{background:#fff}
.chipwrap{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--surface-3);border:1px solid var(--border);font-size:10.5px;font-weight:600;color:var(--text-secondary)}
.up{color:var(--good-text);font-weight:620}
.down{color:var(--bad-text);font-weight:620}
.flat{color:var(--text-muted)}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-weight:600;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--grid);position:sticky;top:0;background:var(--surface-1);z-index:2;white-space:nowrap}
table.tbl th.num,table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--surface-3)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--text-primary)}
.scroll-x{overflow-x:auto;max-width:100%}
/* A table wider than its card scrolls sideways. Without a cue that reads as a
   column someone simply cut off, so the fade is driven by measurement: it is
   there only while there is genuinely more to the right, and it fades out as
   you reach the end. */
.sx{position:relative;min-width:0}
.sx::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:38px;pointer-events:none;
  opacity:0;transition:opacity .16s;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:linear-gradient(to left, var(--surface-1) 18%, color-mix(in srgb, var(--surface-1) 55%, transparent) 62%, transparent);
}
.sx.more::after{opacity:1}
.sx .sx-hint{
  position:absolute;right:6px;bottom:1px;pointer-events:none;opacity:0;transition:opacity .16s;
  background:var(--surface-3);border:1px solid var(--border);border-radius:99px;
  padding:1px 8px;font-size:10.5px;font-weight:620;color:var(--text-secondary);white-space:nowrap;
}
/* The worded hint is for touch, where there is no scrollbar to see and no
   wheel to try; on a desktop the fade plus a scrollbar already says it, so the
   chip and the strip it needs stay off there and the layout is untouched. */
@media (max-width: 900px){
  .sx.more.hintable .sx-hint{opacity:.94}
  /* its own strip under the rows, so it never sits on top of a number. The class
     is set from a measurement and does not toggle with scroll position, so
     nothing reflows as you swipe. */
  .sx.canscroll.hintable>.scroll-x{padding-bottom:19px}
}

.bar-track{background:var(--surface-3);border-radius:4px;height:8px;overflow:hidden;min-width:40px}
.bar-fill{height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.meter{display:flex;align-items:center;gap:8px}

.tt{position:fixed;z-index:200;pointer-events:none;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--r-sm);box-shadow:0 4px 20px rgba(0,0,0,.18);padding:8px 10px;font-size:12px;max-width:280px;opacity:0;transition:opacity .09s}
.tt.on{opacity:1}
.tt .k{color:var(--text-muted);font-size:11px}
.tt b{font-weight:640}

.avatar{width:22px;height:22px;border-radius:6px;background:var(--surface-3);flex:none;object-fit:cover}
.tm{display:flex;align-items:center;gap:7px;min-width:0}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}

.empty{padding:40px 20px;text-align:center;color:var(--text-muted)}
.kpi{display:flex;flex-direction:column;gap:1px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-1)}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:620}
.kpi .val{font-size:21px;font-weight:650;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--text-secondary)}

.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font)}
.ax{font-size:10.5px;fill:var(--text-muted);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.axline{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);align-items:center}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

.splash{min-height:100vh;display:grid;place-items:center;padding:26px;background:var(--plane)}
.splash .box{width:100%;max-width:520px}
.loadbar{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.loadbar i{display:block;height:100%;background:var(--s1);width:0;transition:width .3s}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--s1);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.stale{opacity:.45;transition:opacity .2s}

.tradebox{border:1px dashed var(--border-strong);border-radius:var(--r);min-height:78px;padding:8px;display:flex;flex-direction:column;gap:5px;background:var(--surface-2)}
.asset{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:6px;background:var(--surface-1);border:1px solid var(--border);font-size:12px;cursor:pointer;min-width:0}
.asset>*{min-width:0}
.asset>span:not(.pill):not(.v):not(.x){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset .v,.asset .pill{flex:none}
.asset:hover{border-color:var(--s1)}
.asset .x{margin-left:auto;color:var(--text-muted);font-weight:700;padding:0 3px}
.asset .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:11.5px}
.asset.pickable:hover{background:var(--surface-3)}
.picker{max-height:330px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);padding:5px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2)}

.board{display:grid;gap:3px;min-width:760px}
.cell{border-radius:6px;padding:5px 6px;font-size:11px;border:1px solid var(--border);background:var(--surface-1);min-height:46px;overflow:hidden}
.cell .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
:root[data-ui="simple"] .cell{min-height:54px;padding:6px 7px}
:root[data-ui="simple"] .board{min-width:1040px}
.cell .mt{color:var(--text-muted);font-size:10px;display:flex;gap:4px;align-items:center}

/* ============ simple mode ============
   A calmer skin for the same data: more air, larger type, rounder edges, and
   the secondary columns and deep-dive cards left out. Everything here hangs off
   one attribute on the root, so the dense view is completely untouched. */
:root[data-ui="simple"]{
  --r:14px; --r-sm:10px;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 6px 20px rgba(11,11,11,.05);
}
:root[data-ui="simple"] body{font-size:15px}
:root[data-ui="simple"] .content{padding:26px}
:root[data-ui="simple"] .grid{gap:18px}
:root[data-ui="simple"] .card .hd{padding:17px 20px 0;gap:12px}
:root[data-ui="simple"] .card .hd h3{font-size:16.5px;letter-spacing:-.015em}
:root[data-ui="simple"] .card .hd .note{font-size:12.5px}
:root[data-ui="simple"] .card .bd{padding:16px 20px 20px}
:root[data-ui="simple"] .kpi{padding:15px 17px;gap:3px}
:root[data-ui="simple"] .kpi .val{font-size:26px}
:root[data-ui="simple"] .kpi .lbl{font-size:11px;letter-spacing:.06em}
:root[data-ui="simple"] .kpi .sub{font-size:12.5px}
:root[data-ui="simple"] table.tbl{font-size:13.5px}
:root[data-ui="simple"] table.tbl th{font-size:11.5px;padding:9px 10px}
:root[data-ui="simple"] table.tbl td{padding:11px 10px}
:root[data-ui="simple"] .tiny{font-size:12.5px}
:root[data-ui="simple"] .navbtn{padding:9px 11px;font-size:13.5px}
:root[data-ui="simple"] .btn{padding:8px 14px;font-size:13.5px}
:root[data-ui="simple"] .seg button{padding:7px 14px;font-size:13.5px}
:root[data-ui="simple"] .side{width:auto}
/* ---- settings menu ---- */
.menuwrap{position:relative}
.menupanel{position:absolute;top:calc(100% + 8px);right:0;z-index:60;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--r);box-shadow:0 10px 34px rgba(11,11,11,.16),0 2px 8px rgba(11,11,11,.08);padding:14px;width:288px;display:grid;gap:15px}
.menupanel .mlbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.menupanel .mnote{font-size:11.5px;color:var(--text-muted);margin-top:5px;line-height:1.35}
.menupanel .seg{width:100%}
.menupanel .seg button{flex:1;text-align:center}
.menupanel hr{border:0;border-top:1px solid var(--border);margin:0}
.menupanel .btn{width:100%;justify-content:center}
@media (max-width:560px){ .menupanel{width:min(300px,calc(100vw - 28px))} }

/* imagery — only ever used in simple mode */
.face{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex:none}
.face.lg{width:44px;height:44px;border-radius:12px}
.face.sm{width:22px;height:22px;border-radius:50%}
.face.xs{width:18px;height:18px;border-radius:50%}
.pnrow{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:nowrap}
/* a name with its headshot, wherever a name appears on its own */
.pnf{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%}
.pnf.mir{flex-direction:row-reverse}
/* ---- head-to-head slot ladder: a mirror down the middle ---- */
.ladderrow{display:grid;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--grid)}
.ladderrow:last-child{border-bottom:0}
.ladderrow.ladderhd{padding-bottom:6px;border-bottom:1px solid var(--border)}
.ladderrow .pl{display:flex;align-items:center;gap:7px;min-width:0}
.ladderrow .pl.l{justify-content:flex-end;text-align:right;flex-direction:row}
.ladderrow .pl .plink{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- home ---- */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:20px 22px;
  border:1px solid var(--border);border-radius:var(--r);
  background:linear-gradient(115deg, color-mix(in srgb, var(--s1) 11%, var(--surface-1)) 0%, var(--surface-1) 58%)}
.hero > *{position:relative;z-index:1}
.hero h1{font-size:28px;letter-spacing:-.025em;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.heroav{width:60px;height:60px;border-radius:16px;object-fit:cover;flex:none;background:linear-gradient(140deg,var(--s1),var(--s7))}
/* the league's own badges, running off the right edge and fading out before
   they reach the name; decoration only, so it never carries a number */
.heroband{position:absolute;z-index:0;top:0;right:0;bottom:0;width:min(62%,560px);
  display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-right:20px;pointer-events:none;
  opacity:.42;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 62%,#000 100%);
  mask-image:linear-gradient(to right,transparent 0%,#000 62%,#000 100%)}
.heroband img{width:52px;height:52px;border-radius:15px;object-fit:cover;flex:none;filter:saturate(.8)}
:root[data-theme="dark"] .heroband{opacity:.3}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .heroband{opacity:.3} }
@media (max-width:820px){ .heroband{display:none} }

/* ---- the headliners: your best players, lined up ----
   Decoration, so it is Default-mode only. The faces lift on hover one at a
   time, which is the whole trick: a row of portraits that reacts. */
.lineup{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:4px 0 2px}
.lup{display:grid;gap:6px;justify-items:center;width:104px;cursor:pointer;padding:6px 4px;border-radius:var(--r-sm);
  border:1px solid transparent;transition:transform .16s ease,background .16s,border-color .16s}
.lup:hover{transform:translateY(-4px);background:var(--surface-2);border-color:var(--border)}
.lup:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.lupface{position:relative;line-height:0}
.lupface .face.lg{width:66px;height:66px;border-radius:50%;border:3px solid var(--surface-1);
  box-shadow:0 2px 12px rgba(11,11,11,.16);background:linear-gradient(160deg,var(--surface-3),var(--surface-2))}
.lup:hover .lupface .face.lg{border-color:var(--s1)}
.luppos{position:absolute;right:-2px;bottom:0;padding:1px 6px;border-radius:99px;font-size:9.5px;font-weight:700;
  letter-spacing:.02em;border:2px solid var(--surface-1);line-height:1.35}
.lupnm{font-weight:620;font-size:11.5px;line-height:1.2;text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){
  .lineup{gap:8px}
  .lup{width:78px}
  .lupface .face.lg{width:54px;height:54px}
  .lupnm{font-size:11px}
}

/* ---- your matchup, badge either side of the score ---- */
.mvside{display:flex;align-items:center;gap:10px;min-width:0}
.mvside.r{flex-direction:row-reverse;text-align:right}
.mvav{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--surface-3);flex:none}

/* ---- the podium: the top of the table, on blocks ---- */
.podwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(190px,1fr);gap:18px;align-items:end}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{display:grid;gap:8px;justify-items:center;cursor:pointer;border-radius:var(--r-sm);padding:6px 4px 0;
  border:1px solid transparent;transition:background .12s,border-color .12s,transform .12s}
.pod:hover{background:var(--surface-2);border-color:var(--border);transform:translateY(-2px)}
.pod:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.pod .podtop{display:grid;gap:5px;justify-items:center;text-align:center;min-width:0;width:100%}
.pod .podav{width:46px;height:46px;border-radius:13px;object-fit:cover;background:var(--surface-3);
  box-shadow:0 2px 10px rgba(11,11,11,.14)}
.pod.p1 .podav{width:58px;height:58px;border-radius:16px}
.pod .nm{font-weight:660;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .pododds{font-size:11.5px;color:var(--text-secondary)}
.pod .pododds b{color:var(--s1)}
.pod.mine .podtop .nm{color:var(--s1)}
.pod .form{justify-content:center}
.pod.p1 .nm{font-size:14.5px}
.pod .block{width:100%;border-radius:8px 8px 0 0;display:grid;place-items:end center;padding-bottom:7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.pod.p1 .block{height:74px}
.pod.p2 .block{height:54px}
.pod.p3 .block{height:40px}
.pod .place{font-size:20px;font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.28);line-height:1}
.pod.p2 .place,.pod.p3 .place{font-size:17px}
.block.gold{background:linear-gradient(180deg,#e8c35a,#c99a1e)}
.block.silver{background:linear-gradient(180deg,#d3d9e0,#a4adb8)}
.block.bronze{background:linear-gradient(180deg,#d8a273,#b0743f)}
:root[data-theme="dark"] .block.silver{background:linear-gradient(180deg,#aab2bd,#79818c)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .block.silver{background:linear-gradient(180deg,#aab2bd,#79818c)} }
.hunt{display:grid;gap:5px;align-content:end;padding-bottom:4px}
.hunt .lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.huntrow{display:grid;grid-template-columns:20px 26px minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer;
  padding:6px 7px;border-radius:var(--r-sm);border:1px dashed var(--border)}
.huntrow:hover{background:var(--surface-2);border-style:solid}
.huntrow:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.huntrow .rk{font-size:11.5px;font-weight:700;color:var(--text-muted);text-align:center;font-variant-numeric:tabular-nums}
.huntrow .avatar{width:26px;height:26px;border-radius:8px}
.huntrow .nm{font-weight:600;font-size:12.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:780px){
  .podwrap{grid-template-columns:minmax(0,1fr);gap:14px}
  .hunt{align-content:start}
}
@media (max-width:420px){
  .pod .podav{width:38px;height:38px;border-radius:11px}
  .pod.p1 .podav{width:46px;height:46px}
  .pod .nm{font-size:11.5px}
  .pod.p1 .nm{font-size:12.5px}
}

/* ---- the league, one row per team ---- */
/* capped so the columns stay together: a name column free to take a whole wide
   card leaves a lake of white between the team and its record */
.lgstrip{display:grid;max-width:880px}
.lgrow.lghd{cursor:default;padding:0 8px 6px;border-bottom:1px solid var(--border);border-radius:0}
.lgrow.lghd:hover{background:none;border-color:transparent;border-bottom-color:var(--border)}
.lgrow.lghd .who{padding-left:44px}
.lgrow{display:grid;grid-template-columns:30px minmax(0,1fr) 58px 58px 78px 58px;gap:14px;align-items:center;
  padding:9px 8px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent}
.lgrow:hover{background:var(--surface-2);border-color:var(--border)}
.lgrow:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.lgrow.mine{background:color-mix(in srgb, var(--s1) 7%, transparent)}
.lgrow.mine:hover{background:color-mix(in srgb, var(--s1) 12%, transparent)}
.lgrow .rk{font-size:13px;font-weight:700;color:var(--text-muted);text-align:center;font-variant-numeric:tabular-nums}
.lgrow .who{display:flex;align-items:center;gap:10px;min-width:0}
.lgrow .who .avatar{width:34px;height:34px;border-radius:10px}
.lgrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.lgrow .num{text-align:right;font-size:12.5px;color:var(--text-secondary)}
.lgrow .odds{text-align:right;font-size:13px;color:var(--text-secondary)}
.lgrow .odds.up{color:var(--good-text)}
.lgrow .odds.down{color:var(--text-muted)}
/* a pick that has changed hands */
.tag.traded{border-color:var(--s4);color:var(--s4);font-weight:660}
/* the last five results, oldest first — a league table's form guide */
.form{display:flex;gap:3px;align-items:center}
.form i{width:12px;height:12px;border-radius:3px;display:block;cursor:default;background:var(--surface-3)}
.form i.W{background:var(--good)}
.form i.L{background:var(--s8)}
.form i.T{background:var(--text-muted);opacity:.6}
.huntrow .form i{width:9px;height:9px;border-radius:2px}
@media (max-width:700px){
  .lgrow{grid-template-columns:24px minmax(0,1fr) 52px;gap:9px;padding:8px 4px}
  .lgrow .form{display:none}
  .lgrow .who .avatar{width:30px;height:30px;border-radius:9px}
}
.tilegrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.tile{display:flex;align-items:flex-start;gap:11px;text-align:left;padding:13px 14px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-1);cursor:pointer;min-width:0;transition:border-color .12s,background .12s,transform .12s}
.tile:hover{border-color:var(--s1);background:var(--surface-2);transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.tile .ic{font-size:15px;color:var(--s1);flex:none;line-height:1.45}
.tile b{font-size:13.5px;font-weight:640;display:block}
@media (max-width:560px){
  .hero{gap:13px;padding:15px 16px}
  .hero h1{font-size:21px}
  .heroav{width:46px;height:46px;border-radius:13px}
  .tilegrid{grid-template-columns:minmax(0,1fr)}
}
td .pnf,.asset .pnf{vertical-align:middle}
.tlogo{width:18px;height:18px;object-fit:contain;flex:none;vertical-align:-4px}
:root[data-ui="simple"] .avatar{width:30px;height:30px;border-radius:9px}
:root[data-ui="simple"] .tm{gap:10px}
:root[data-ui="simple"] .tm .nm{font-weight:600}
.pcard{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-1);min-width:0}
.pcard .meta{min-width:0;flex:1}
.pcard .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sub{font-size:11.5px;color:var(--text-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcard .val{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rankrow{display:grid;grid-template-columns:34px 1fr minmax(120px,1.1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--grid)}
.rankrow:last-child{border-bottom:0}
/* ---- this-week matchup card: team, odds, team ---- */
.mvs{display:grid;grid-template-columns:minmax(0,1fr) minmax(86px,1.05fr) minmax(0,1fr);gap:10px;align-items:start}
.mvs .tmside{display:grid;gap:5px;min-width:0;justify-items:center;text-align:center}
.mvs .tmside .nm{font-weight:640;font-size:13.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mvs .tmside .sc{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em}
.mvs .tmside .dt{font-size:11px;color:var(--text-muted);line-height:1.3}
.mvs .tmside .dt.cnt{font-size:10px;white-space:nowrap;letter-spacing:-.01em}
.mvs .mid{display:grid;gap:5px;align-content:start;padding-top:46px;max-width:380px;width:100%;margin-inline:auto}
.mvs .mid .bar{position:relative;height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.mvs .mid .bar>i{position:absolute;inset:0 auto 0 0;border-radius:5px 0 0 5px;display:block}
.mvs .mid .pcts{display:flex;justify-content:space-between;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.mvs .mid .cap{text-align:center;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}
.mvs .mlogo{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--surface-3)}
@media (max-width:420px){
  .mvs{grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:7px}
  .mvs .tmside .sc{font-size:21px}
}
.rankrow .pos{font-size:19px;font-weight:700;color:var(--text-muted);text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:620px){
  .rankrow{grid-template-columns:28px 1fr auto;gap:10px}
  .rankrow .hidenarrow{display:none}
}

/* ============ narrow screens ============
   Everything below is scoped to a width or pointer query, so the desktop
   layout above is untouched. */
@media (max-width: 900px){
  /* auto rows in a min-height grid stretch to fill it, which turned the nav
     strip into a tall empty band on any page shorter than the screen */
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  /* the sidebar becomes one sticky, horizontally scrolling tab strip: five
     wrapped rows of nav pushed every page a third of a screen down, and the
     nav went out of reach the moment you scrolled */
  .side{
    position:sticky;top:0;z-index:40;height:auto;max-width:100%;min-width:0;
    flex-direction:row;flex-wrap:nowrap;gap:4px;padding:6px 8px;
    border-right:0;border-bottom:1px solid var(--border);
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;scrollbar-width:none;
  }
  .side::-webkit-scrollbar{display:none}
  .brand,.side .spacer,.side .foot{display:none}
  .navbtn{width:auto;white-space:nowrap;flex:0 0 auto;scroll-snap-align:center;padding:8px 11px}
  /* the top bar stops competing with the nav for the sticky slot */
  .topbar{position:static;padding:10px 14px;gap:8px}
  .topbar .lg{font-size:15px}
  .topbar>div:first-child{flex:1 1 100%}
  .topbar .grow{display:none}
  .content{padding:12px;max-width:100%}
  .card .hd{padding:12px 13px 0}
  .card .bd{padding:12px 13px 14px}
  /* a five-option segmented control is wider than a phone; let it wrap rather
     than push the page sideways */
  .seg{flex-wrap:wrap;max-width:100%}
  .kpi{padding:10px 12px}
  .kpi .val{font-size:19px}
  .hero{font-size:27px}
  .big{font-size:22px}
  .hypbar{padding:11px 12px}
  .picker{max-height:46vh}
  .tt{max-width:min(280px, calc(100vw - 24px))}
  .board{min-width:660px}
  .scroll-x{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
}
@media (max-width: 560px){
  .content{padding:10px}
  .card .hd{padding:11px 11px 0}
  .card .bd{padding:11px 11px 13px}
  table.tbl{font-size:12px}
  /* a long franchise name should not push every number off the screen */
  table.tbl .tm{max-width:112px}
  /* inside a table cell a wrapping row puts the position pill on its own line
     and doubles the row height; the name should ellipsise instead */
  /* a two-line header is worth far more than a column pushed off the screen */
  table.tbl th{white-space:normal;line-height:1.2}
  table.tbl .row{flex-wrap:nowrap}
  table.tbl .pill,table.tbl .tag{flex:none}
  table.tbl .plink{min-width:0;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.tbl th,table.tbl td{padding:7px 5px}
  table.tbl th:first-child,table.tbl td:first-child{padding-left:2px}
  table.tbl th:last-child,table.tbl td:last-child{padding-right:2px}
  .grid{gap:11px}
  .topbar{padding:9px 11px}
}
/* Touch devices and phone widths: fingers are not cursors. A desktop window is
   never below 560px in practice, so nothing here reaches a machine with a mouse. */
@media (pointer: coarse), (max-width: 560px){
  .btn{min-height:38px;padding:8px 13px}
  .btn.sm{min-height:32px;padding:6px 11px;font-size:12px}
  .chip{min-height:34px;padding:6px 12px}
  .seg button{min-height:34px;padding:7px 13px}
  .navbtn{min-height:38px}
  .asset{padding:7px 8px}
  .asset .x{padding:0 8px;font-size:15px}
  /* iOS zooms the whole page when a focused field is under 16px */
  input,select,textarea{font-size:16px;min-height:40px}
  table.tbl tbody tr:hover{background:transparent}
  .plink{padding:2px 0}
}
@supports (height: 100dvh){
  /* a mobile browser's 100vh includes the toolbar that is actually covering it */
  .shell{min-height:100dvh}
  .splash{min-height:100dvh}
}
@media print{ .side,.topbar{display:none} }
</style>

<body>
<div id="app"></div>
<div class="tt" id="tt"></div>
<script>
"use strict";
/* ==================================================================
   Dynasty Command Center — core
   Live data: Sleeper API (league/rosters/matchups/drafts/players)
              FantasyCalc API (dynasty + redraft trade values, picks)
   ================================================================== */

/* ---------- tiny dom ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function h(tag, props, ...kids) {
  const parts = tag.split(/([.#])/); let name = parts[0] || 'div';
  const e = document.createElement(name);
  for (let i = 1; i < parts.length; i += 2) {
    if (parts[i] === '.') e.classList.add(parts[i + 1]); else e.id = parts[i + 1];
  }
  // only a plain object is a props bag; numbers, strings, arrays and nodes are children
  if (props !== null && props !== undefined &&
      (typeof props !== 'object' || props.nodeType || Array.isArray(props))) { kids.unshift(props); props = null; }
  if (props) for (const k in props) {
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className += (e.className ? ' ' : '') + v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'data') for (const d in v) e.dataset[d] = v[d];
    else e.setAttribute(k, v === true ? '' : v);
  }
  const add = (c) => {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) return c.forEach(add);
    e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return e;
}
/* ---------- viewport ----------
   Charts are drawn into a fixed viewBox and stretched to fit their container.
   On a phone that means a 760-wide drawing squeezed into ~380 CSS pixels, which
   halves the width of every axis label and tick. Drawing narrow in the first
   place keeps the type honest. */
const NARROW_AT = 760;
/* Simple mode: the same data with the secondary half left out. It rides the same
   `prio` marks the phone layout uses, so nothing needed a parallel set of views. */
function isSimple() { return S.ui === 'simple'; }
function setUiMode(m) {
  S.ui = m === 'simple' ? 'simple' : 'full';
  if (S.ui === 'simple') document.documentElement.setAttribute('data-ui', 'simple');
  else document.documentElement.removeAttribute('data-ui');
  LS.set('ui', S.ui);
}
/** Cards that only earn their space in the dense view. */
function proOnly(node) { return isSimple() ? null : node; }

/* ---- dynasty or redraft ----
   A dynasty or keeper league carries value into next year, so half of what this
   app measures — the ageing curve, the two-to-three-year projection, draft-pick
   capital, contend-versus-rebuild — is about that carry. A redraft league has no
   carry: every roster is dissolved in the spring. Rather than show those numbers
   with a shrug, a redraft league switches them off and prices everything at the
   market's redraft value instead. */
function isDynasty() { return S.dynasty !== false; }
/** Cards, columns and tips that only mean something when next year exists. */
function dynOnly(node) { return isDynasty() ? node : null; }
function valueWord() { return isDynasty() ? 'dynasty' : 'redraft'; }
function capitalLabel() { return isDynasty() ? 'Dynasty capital' : 'Roster value'; }
/** Sleeper's own answer: 0 redraft, 1 keeper, 2 dynasty. Keepers carry enough
 *  value into next year to be read as dynasty; the setting can say otherwise. */
function detectLeagueType(league) {
  const t = league && league.settings ? league.settings.type : undefined;
  return t === 0 ? 'redraft' : 'dynasty';

    if (!all.length) continue;

    // projection has to follow the real weekly lines rather than the value curve

  // so strength has to be settled before picks can be priced.
  const dyn = isDynasty();
  teams.forEach(t => {
    t.now = lineupPoints(activePlayers(t), 'ppg');
    // with no next season there is no separate future to project: the two
    // timelines are the same one, so every "future" metric collapses onto now

    const ages = t.players.filter(p => POS4.includes(p.pos) && p.age && (p.dv || 0) > 300);
    t.age = ages.length ? sum(ages.map(p => p.age * p.dv)) / sum(ages.map(p => p.dv)) : null;
    t.posValue = {};

    t.posNow = {};

      t.posNow[pos] = sum(st.map(s => s.player.ppg));

  const price = dyn ? pickPricer(null) : null;

    t.pickAssets = !dyn ? [] : t.picks.map(pk => {
      const q = price(pk);

      return Object.assign({}, pk, {

        slotLabel: pk.round + '.' + String(q.slot).padStart(2, '0'),
        id: 'PK|' + pk.season + '|' + pk.round + '|' + pk.origRosterId,
        pos: 'PICK', name: label, dv: q.value, rv: 0

    teams.forEach(t => { const m = byRoster[t.rosterId]; t.weekly.push(m ? (m.points || 0) : null); });

/* ================= schedule ================= */
function schedule() {
  if (S._sched) return S._sched;
  const out = [];
  for (let w = 1; w <= S.regEnd; w++) {
    const ms = S.matchups[w];
    const games = [];
    if (ms) {
      const g = {};
      ms.forEach(m => { if (m.matchup_id !== null && m.matchup_id !== undefined) (g[m.matchup_id] = g[m.matchup_id] || []).push(m.roster_id); });
      for (const k in g) if (g[k].length === 2) games.push(g[k]);
    }
    out.push(games);
  }
  // synthetic round-robin fallback for any week Sleeper gave us nothing for
  const ids = S.teams.map(t => t.rosterId);
  if (ids.length % 2 === 0) {
    for (let w = 0; w < out.length; w++) {
      if (out[w].length) continue;
      const rot = ids.slice(1); const k = w % rot.length;
      const arr = [ids[0]].concat(rot.slice(k), rot.slice(0, k));
      const g = [];
      for (let i = 0; i < arr.length / 2; i++) g.push([arr[i], arr[arr.length - 1 - i]]);
      out[w] = g;

         have finished are facts, not draws. Only the open slots get sampled, and
         what is banked rides along as a fixed offset. */
      /* A week under way is treated as locked: the lineups are what the managers
         already set, and the finished games are facts. That holds whoever is
         asking — a hypothetical trade cannot un-play Sunday — which also keeps
         every paired before/after comparison honest. */

          banked: lr.banked,

        };

        banked: 0,

          .map(s => {

            const pos = s.player ? s.player.pos : (SLOT_ELIG[s.slot] || [s.slot])[0];

function recordSnapshot() {
  if (typeof HYP !== 'undefined' && HYP.on) return;   // never record a what-if as history

  // series would draw a cliff on the day someone flipped the setting
  const key = 'snap:' + S.leagueId + (isDynasty() ? '' : ':rd');
  let snaps = LS.get(key, []);
  const today = new Date().toISOString().slice(0, 10);
  const rec = { d: today, t: Date.now(), p: {}, tm: {} };
  for (const id in S.index) { const p = S.index[id]; if (p.dv > 250) rec.p[id] = p.dv; }
  S.teams.forEach(t => rec.tm[t.rosterId] = Math.round(t.totalValue));
  snaps = snaps.filter(s => s.d !== today);
  snaps.push(rec);
  snaps.sort((a, b) => a.d < b.d ? -1 : 1);
  if (snaps.length > 120) snaps = snaps.slice(-120);

  for (let attempt = 0; attempt < 4; attempt++) {
    try { localStorage.setItem('dcc:' + key, JSON.stringify(snaps)); break; }

}

  const out = [];

      const open = lr.open.map(r => ({ id: r.p.id, name: r.p.name, pos: r.p.pos, m: r.used, sd: volFromMean(r.p.pos, r.used) }));

/* sortable table */

  const st = { key: opts.sortKey || null, dir: opts.sortDir || -1 };
  if (st.key && !cols.some(c => c.k === st.key)) {
    const kept = cols.find(c => c.num) || cols[cols.length - 1];
    if (kept) st.key = kept.k;
  }
  const wrap = h('div.scroll-x');
  const render = () => {
    clear(wrap);
    let data = rows.slice();
    if (st.key) {
      const c = cols.find(c => c.k === st.key);
      data.sort((a, b) => {
        const va = c.sort ? c.sort(a) : a[st.key], vb = c.sort ? c.sort(b) : b[st.key];
        if (va === null || va === undefined) return 1; if (vb === null || vb === undefined) return -1;
        return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * st.dir;

      h('thead', h('tr', cols.map(c => h('th', {
        class: (c.num ? 'num ' : '') + (c.sortable === false ? '' : 'sortable'),
        title: c.tip || '',

      }, c.h, st.key === c.k ? (st.dir < 0 ? ' ↓' : ' ↑') : '')))),

    const room = wrap.scrollWidth - wrap.clientWidth;

/* line chart with crosshair — series: [{name,color,points:[{x,y,label}]}] */
function lineChart(series, opts) {
  opts = opts || {};
  const narrow = isNarrow();
  const W = opts.w || chartW(760, 400), H = opts.h || 230;
  const m = Object.assign(narrow ? { t: 10, r: 9, b: 24, l: 36 } : { t: 12, r: 14, b: 26, l: 46 }, opts.margin || {});
  const iw = W - m.l - m.r, ih = H - m.t - m.b;

  // is nonsense for a quantity that cannot go below zero
  if (opts.floorAtZero && y0 < 0 && Math.min(...ys) >= 0) y0 = 0;
  const x0 = opts.x0 !== undefined ? opts.x0 : Math.min(...xs);
  const x1 = opts.x1 !== undefined ? opts.x1 : Math.max(...xs);
  const X = v => m.l + (x1 === x0 ? iw / 2 : (v - x0) / (x1 - x0) * iw);
  const Y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
  const g = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img', 'aria-label': opts.aria || 'line chart' });
  g.style.height = H + 'px';
  const ticks = opts.yTicks || (narrow ? 3 : 4);
  for (let i = 0; i <= ticks; i++) {
    const v = y0 + (y1 - y0) * i / ticks, y = Y(v);
    g.appendChild(svg('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    const tx = svg('text', { class: 'ax', x: m.l - 7, y: y + 3.5, 'text-anchor': 'end' });
    tx.textContent = opts.yFmt ? opts.yFmt(v) : fmt(v, 0); g.appendChild(tx);
  }
  g.appendChild(svg('line', { class: 'axline', x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
  // a reference line at a meaningful y — the coin-flip mark on a win-probability chart
  if (opts.yRule !== undefined && opts.yRule >= y0 && opts.yRule <= y1) {
    g.appendChild(svg('line', { class: 'axline', x1: m.l, x2: W - m.r, y1: Y(opts.yRule), y2: Y(opts.yRule), opacity: .75 }));
  }
  if (opts.xTickValues && opts.xTickValues.length) {

    opts.xTickValues.forEach((t, i) => {
      if (t.x < x0 - 1e-9 || t.x > x1 + 1e-9) return;
      const px = X(t.x);
      // two labels on top of each other are worse than one label
      if (px - lastPx < (narrow ? 52 : 46)) return;
      lastPx = px;
      if (t.rule !== false) g.appendChild(svg('line', { class: 'gl', x1: px, x2: px, y1: m.t, y2: m.t + ih, 'stroke-dasharray': '2 4' }));
      const tx = svg('text', {
        class: 'ax', x: px, y: H - 8,
        'text-anchor': i === 0 ? 'start' : (i === opts.xTickValues.length - 1 && px > W - m.r - 30) ? 'end' : 'middle'
      });
      tx.textContent = t.label; g.appendChild(tx);
    });
  } else {
    const xt = opts.xTicks || (narrow ? 3 : 6);
    for (let i = 0; i <= xt; i++) {
      const v = x0 + (x1 - x0) * i / xt;
      const tx = svg('text', { class: 'ax', x: X(v), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === xt ? 'end' : 'middle' });
      tx.textContent = opts.xFmt ? opts.xFmt(v) : fmt(v, 0); g.appendChild(tx);
    }
  }

    const pts = s.points.slice().sort((a, b) => a.x - b.x);
    if (s.area) {
      const d = 'M' + X(pts[0].x) + ',' + (m.t + ih) + pts.map(p => 'L' + X(p.x) + ',' + Y(p.y)).join('') + 'L' + X(pts[pts.length - 1].x) + ',' + (m.t + ih) + 'Z';
      g.appendChild(svg('path', { d, fill: s.color, opacity: .10, stroke: 'none' }));
    }
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x) + ',' + Y(p.y)).join('');
    g.appendChild(svg('path', {
      d, fill: 'none', stroke: s.color, 'stroke-width': s.width || 2,
      opacity: s.opacity === undefined ? 1 : s.opacity,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke'
    }));
    if (opts.dots !== false && pts.length <= 30) pts.forEach(p => g.appendChild(svg('circle', { cx: X(p.x), cy: Y(p.y), r: 3.2, fill: s.color, stroke: 'var(--surface-1)', 'stroke-width': 2 })));
    if (s.endLabel === true && pts.length) {
      const last = pts[pts.length - 1];
      const t = svg('text', { class: 'ax', x: X(last.x) + 6, y: Y(last.y) + 3.5, fill: 'var(--text-secondary)', 'font-weight': 600 });
      t.textContent = s.name; if (opts.endLabels) g.appendChild(t);
    }

  g.appendChild(cross);

  g.appendChild(hit);

    const bb = g.getBoundingClientRect();
    const px = (clientX - bb.left) / bb.width * W;
    const xv = x0 + (px - m.l) / iw * (x1 - x0);

    series.forEach(s => s.points.forEach(p => { if (!near || Math.abs(p.x - xv) < Math.abs(near.x - xv)) near = p; }));
    if (!near) return;
    cross.setAttribute('x1', X(near.x)); cross.setAttribute('x2', X(near.x)); cross.setAttribute('opacity', .55);
    const cap = opts.maxTip || 12;
    const hits = series.map(s => ({ s, p: s.points.find(p => p.x === near.x) })).filter(x => x.p);
    hits.sort((a, b) => b.p.y - a.p.y);
    const rows = hits.slice(0, cap).map(({ s, p }) =>
      `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${s.name}: <b>${opts.yFmt ? opts.yFmt(p.y) : fmt(p.y, 1)}</b></div>`
    ).join('') + (hits.length > cap ? `<div class="k">+${hits.length - cap} more</div>` : '');

  };

  hit.addEventListener('touchstart', touch, { passive: true });
  hit.addEventListener('touchmove', touch, { passive: true });
  const endTouch = () => { cross.setAttribute('opacity', 0); ttHide(); };
  hit.addEventListener('touchend', endTouch);
  hit.addEventListener('touchcancel', endTouch);
  return g;
}

/* vertical histogram */
function histogram(bins, opts) {
  opts = opts || {};
  const W = opts.w || chartW(400, 340), H = opts.h || 150, m = { t: 8, r: 8, b: 24, l: 8 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(...bins.map(b => b.v), 0.0001);
  const bw = iw / bins.length;
  const g = svg('svg', Object.assign({ class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.aria || 'distribution' },
    opts.stretch ? { preserveAspectRatio: 'none' } : {}));
  g.style.height = H + 'px';
  // `stretch` lets the bars fill a narrower container, which is what it is for.
  // Letting them fill a *wider* one pulls the axis labels and the bar corners
  // out of shape, so the drawing stops at the width it was designed at.
  if (opts.stretch) {
    g.style.maxWidth = (opts.maxW || W) + 'px';
    g.style.display = 'block';
    g.style.marginInline = 'auto';
  }
  // a vertical rule at a meaningful x — zero on a margin chart, say
  if (opts.rule !== undefined) {
    const ri = bins.findIndex(b => b.x >= opts.rule);
    if (ri >= 0) {
      const rx = m.l + ri * bw;
      g.appendChild(svg('line', { class: 'axline', x1: rx, x2: rx, y1: m.t, y2: m.t + ih, 'stroke-dasharray': '3 3', 'vector-effect': 'non-scaling-stroke' }));
    }
  }
  bins.forEach((b, i) => {
    const hgt = b.v / max * ih;
    const x = m.l + i * bw, y = m.t + ih - hgt;
    const r = svg('rect', { x: x + 1, y, width: Math.max(1, bw - 2), height: Math.max(0, hgt), rx: Math.min(4, bw / 2 - 1), fill: b.color || 'var(--s1)' });
    r.style.cursor = 'default';
    const rr = svg('rect', { x, y: m.t, width: bw, height: ih, fill: 'transparent' });
    rr.addEventListener('mousemove', e => ttShow(e, `<div class="k">${b.label}</div><b>${pct(b.v, 1)}</b>`));
    rr.addEventListener('mouseleave', ttHide);
    g.appendChild(r); g.appendChild(rr);
    if (bins.length <= 30 && (i % Math.ceil(bins.length / 9) === 0 || bins.length <= 12)) {
      const t = svg('text', { class: 'ax', x: x + bw / 2, y: H - 8, 'text-anchor': 'middle' }); t.textContent = b.x; g.appendChild(t);
    }
  });
  g.appendChild(svg('line', { class: 'axline', x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
  return g;
}

/* sequential heatmap, teams × positions */
const SEQ = ['#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95'];

function heat(rows, cols, get, opts) {

  grid.appendChild(h('div'));
  cols.forEach(c => grid.appendChild(h('div.tiny.muted', { style: { textAlign: 'center', fontWeight: '660', paddingBottom: '2px' } }, c)));
  rows.forEach(r => {
    grid.appendChild(h('div.tiny', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', alignSelf: 'center', fontWeight: '540' } }, opts.rowLabel(r)));
    cols.forEach(c => {
      const v = get(r, c), t = nrm(v);
      const cell = h('div.mono', {
        style: {
          background: seqColor(t), color: t > 0.55 ? '#fff' : '#0b0b0b', textAlign: 'center',
          padding: '7px 4px', borderRadius: '5px', fontSize: '11.5px', fontWeight: '600', cursor: 'default'
        }, tabindex: 0

      bindTT(cell, () => opts.tip ? opts.tip(r, c, v) : `<div class="k">${opts.rowLabel(r)} · ${c}</div><b>${fmt(v, 1)}</b>`);
      grid.appendChild(cell);

function sparkline(pts, opts) {

  const W = opts.w || 90, H = opts.h || 24;
  if (pts.length < 2) return h('span.muted.tiny', '—');
  const ys = pts.map(p => p.v), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = i => i / (pts.length - 1) * (W - 2) + 1;
  const Y = v => H - 2 - (y1 === y0 ? .5 : (v - y0) / (y1 - y0)) * (H - 4);
  const up = ys[ys.length - 1] >= ys[0];
  const g = svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, style: 'display:block' });
  g.appendChild(svg('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(p.v)).join(''), fill: 'none', stroke: up ? 'var(--good)' : 'var(--critical)', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }));
  g.appendChild(svg('circle', { cx: X(pts.length - 1), cy: Y(ys[ys.length - 1]), r: 2.2, fill: up ? 'var(--good)' : 'var(--critical)' }));
  return g;
}

/* ================= week-by-week bars (actual vs projected) ================= */
function weeklyBars(items, opts) {
  opts = opts || {};
  const W = opts.w || chartW(720, 400), H = opts.h || 190,
    m = isNarrow() ? { t: 10, r: 8, b: 24, l: 28 } : { t: 10, r: 10, b: 26, l: 36 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = items.filter(i => i.v !== null && i.v !== undefined).map(i => i.v);
  const max = Math.max(...vals, 1) * 1.08;
  const bw = iw / Math.max(1, items.length);
  const g = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.aria || 'weekly points' });
  g.style.height = H + 'px';
  for (let i = 0; i <= 3; i++) {
    const v = max * i / 3, y = m.t + ih - (v / max) * ih;
    g.appendChild(svg('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    const t = svg('text', { class: 'ax', x: m.l - 6, y: y + 3.5, 'text-anchor': 'end' }); t.textContent = fmt(v, 0); g.appendChild(t);
  }
  items.forEach((it, i) => {
    const x = m.l + i * bw;
    if (it.v === null || it.v === undefined) {
      const t = svg('text', { class: 'ax', x: x + bw / 2, y: m.t + ih - 4, 'text-anchor': 'middle', opacity: .5 });
      t.textContent = it.bye ? 'BYE' : '–';
      if (it.bye) t.setAttribute('font-size', '8');
      g.appendChild(t);
    } else {
      const hgt = Math.max(1.5, (it.v / max) * ih);
      g.appendChild(svg('rect', {
        x: x + 2, y: m.t + ih - hgt, width: Math.max(1, bw - 4), height: hgt, rx: Math.min(4, (bw - 4) / 2),
        fill: it.kind === 'proj' ? 'var(--seq-200)' : 'var(--s1)'
      }));
    }
    const hit = svg('rect', { x, y: m.t, width: bw, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', e => ttShow(e, `<div class="k">Week ${it.x}${it.kind === 'proj' ? ' · projected' : ''}</div>` +
      (it.v === null || it.v === undefined
        ? '<b>' + (it.note || 'Did not play') + '</b>'
        : `<b>${fmt(it.v, 1)}</b> pts` + (it.note ? '<br>' + it.note : ''))));
    hit.addEventListener('mouseleave', ttHide);
    g.appendChild(hit);
    if (items.length <= 20 || i % 2 === 0) {
      const t = svg('text', { class: 'ax', x: x + bw / 2, y: H - 8, 'text-anchor': 'middle' }); t.textContent = it.x; g.appendChild(t);
    }
  });
  g.appendChild(svg('line', { class: 'axline', x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
  return g;
}

  const keep = t.players.filter(p => !rm.has(p.id));
  return keep.concat(incoming.filter(a => a.kind === 'player').map(a => a.ref));

      posValue[pos] = sum(players.filter(p => p.pos === pos).map(p => p.dv || 0));

      now: sum(starters.map(s => s.player ? s.player.ppg : 0)),
      futureRoster: isDynasty() ? lineupPoints(players, 'fppg') : lineupPoints(act, 'ppg'),
      age: ages.length ? sum(ages.map(p => p.age * p.dv)) / sum(ages.map(p => p.dv)) : null

    const pairSeed = (Math.random() * 4294967296) >>> 0;

  wrap.appendChild(card('Score distribution — week ' + res.onlyWeek, 'what this team could plausibly put up',
    h('div', histogram(bins, { h: 175, w: chartW(900, 360), stretch: true, aria: 'score distribution' }),
      h('div.tiny.muted', { style: { marginTop: '8px' } }, `Median ${fmt(scores[Math.floor(scores.length / 2)], 1)} · 10th–90th percentile ${fmt(scores[Math.floor(scores.length * .1)], 1)}–${fmt(scores[Math.floor(scores.length * .9)], 1)} · top-scorer odds ${pct(r.weekTop, 1)}`)),
    h('select', { onchange: e => { SimUI.team = +e.target.value; render(); } }, teams.map(t => h('option', { value: t.rosterId, selected: t.rosterId === SimUI.team }, t.name)))));

  const rank = simWeekRankCard(res);
  if (rank) wrap.appendChild(rank);

  wrap.appendChild(card('Every team this week', null, table([
    { k: 'name', h: 'Team', sort: r2 => r2.T.name, f: r2 => teamCell(r2.T) },
    { k: 'pts', h: 'Proj pts', num: true, sort: r2 => r2.r.weekPts, f: r2 => h('b.mono', fmt(r2.r.weekPts, 1)) },
    { k: 'win', h: 'Win prob', num: true, sort: r2 => r2.r.weekWin, f: r2 => pct(r2.r.weekWin, 0) },
    { k: 'top', prio: 2, h: 'Top scorer', num: true, sort: r2 => r2.r.weekTop, f: r2 => pct(r2.r.weekTop, 1) },
    { k: 'act', h: res.onlyWeek === S.liveWeek ? 'Live total' : 'Actual', num: true, sort: r2 => r2.act, f: r2 => r2.act ? fmt(r2.act, 1) : '—' }
  ], S.teams.map(t => ({
    T: t, r: res.by[t.rosterId],
    act: res.onlyWeek === S.liveWeek ? liveRoster(t, res.onlyWeek).total
      : played ? ((S.matchups[res.onlyWeek] || []).find(m => m.roster_id === t.rosterId) || {}).points : null
  })), { sortKey: 'pts', sortDir: -1 })));
  return wrap;
}
function simSeasonView(res) {
  const wrap = h('div.grid');
  const rows = S.teams.map(t => ({ t, s: res.by[t.rosterId] })).sort((a, b) => b.s.title - a.s.title);
  const champ = rows[0];
  const lucky = rows.filter(r => r.s.luck !== null).slice().sort((a, b) => b.s.luck - a.s.luck)[0];
  const biggest = (res.leverage || [])[0];
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))' } },
    kpi('Most likely champion', champ.t.name, pct(champ.s.title, 1) + ' of simulations'),
    kpi('Weeks simulated', `${Math.min(S.lastWeek + 1, S.regEnd)}–${S.regEnd}`, S.lastWeek ? `weeks 1–${S.lastWeek} are actual results` : 'full season'),
    kpi('Playoff field', String(res.playoffTeams), 'teams make the bracket'),
    kpi('Tightest race', rows.slice().sort((a, b) => Math.abs(a.s.playoff - .5) - Math.abs(b.s.playoff - .5))[0].t.name, 'closest to a coin flip'),
    biggest ? kpi('Biggest game left', biggest.a.team.short + ' v ' + biggest.b.team.short,
      pct(biggest.swing, 0) + ' playoff swing · week ' + biggest.week) : null,

      : kpi('Runs', kfmt(res.n), res.ms + ' ms')
  ));

  // the table is what the run was for, so it comes first — the leverage card and
  // everything under it are reading from the same numbers
  wrap.appendChild(card('Simulated season outcomes', 'each row is ' + kfmt(res.n) + ' full seasons', table([
    { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) },
    { k: 'rec', h: 'Now', sort: r => r.t.wins, f: r => `${r.t.wins}-${r.t.losses}` },
    { k: 'wins', h: 'Proj W', num: true, sort: r => r.s.wins, f: r => h('b.mono', fmt(r.s.wins, 1)) },
    { k: 'pts', prio: 2, h: 'Proj PF', num: true, sort: r => r.s.pts, f: r => fmt(r.s.pts, 0) },
    { k: 'seed', prio: 2, h: 'Avg seed', num: true, sort: r => r.s.seed, f: r => fmt(r.s.seed, 1) },
    { k: 'range', prio: 2, h: 'Seed range', num: true, sortable: false, f: r => h('span.tiny.mono.muted', `${r.s.best}–${r.s.worst}`) },
    { k: 'playoff', h: 'Playoffs', num: true, sort: r => r.s.playoff, f: r => h('div.meter', { style: { justifyContent: 'flex-end' } }, isNarrow() ? null : h('div.bar-track', { style: { width: '50px' } }, h('div.bar-fill', { style: { width: (r.s.playoff * 100) + '%', background: r.s.playoff > .6 ? 'var(--good)' : r.s.playoff > .25 ? 'var(--s4)' : 'var(--s8)' } })), h('span.mono', pct(r.s.playoff, 0))) },
    { k: 'bye', prio: 2, h: 'Bye', num: true, sort: r => r.s.bye, f: r => pct(r.s.bye, 0) },
    { k: 'final', prio: 2, h: 'Final', num: true, sort: r => r.s.final, f: r => pct(r.s.final, 0) },
    { k: 'title', h: 'Title', num: true, sort: r => r.s.title, f: r => h('b.mono', pct(r.s.title, 1)) }
  ], rows, { sortKey: 'title', sortDir: -1 })));

  const lever = simLeverageCard(res);
  if (lever) wrap.appendChild(lever);

  const teams = S.teams.slice().sort((a, b) => a.powerRank - b.powerRank);
  if (SimUI.team === null) SimUI.team = teams[0].rosterId;
  const sel = res.by[SimUI.team];
  const bins = sel.winDist.map((v, i) => ({ x: i, v, label: i + ' win' + (i === 1 ? '' : 's') })).filter((b, i) => i <= S.regEnd);
  wrap.appendChild(card('Final win total', S.teamById[SimUI.team].name,
    h('div', histogram(bins, { h: 175, w: chartW(900, 360), stretch: true, aria: 'win distribution' }),
      h('div.tiny.muted', { style: { marginTop: '8px' } },
        `Most likely: ${bins.reduce((a, b) => b.v > a.v ? b : a).x} wins · average ${fmt(sel.wins, 1)} · playoffs ${pct(sel.playoff, 0)} · title ${pct(sel.title, 1)}`)),
    h('select', { onchange: e => { SimUI.team = +e.target.value; render(); } }, teams.map(t => h('option', { value: t.rosterId, selected: t.rosterId === SimUI.team }, t.name)))));

  const draft = simDraftCard(res);
  if (draft) wrap.appendChild(draft);

  // the deep-dive half of the simulator; simple mode stops after the outcomes
  const traj = proOnly(simTrajectoryCard(res));
  if (traj) wrap.appendChild(traj);
  const seed = proOnly(simSeedCard(res));
  if (seed) wrap.appendChild(seed);
  const luck = proOnly(simLuckCard(res));
  if (luck) wrap.appendChild(luck);
  const alive = proOnly(simAliveCard(res));
  if (alive) wrap.appendChild(alive);
  return wrap;
}

/* ================= 7. DRAFT VIEW ================= */
const DraftUI = { id: null };
function viewDraft() {
  const wrap = h('div.grid');
  const drafts = S.drafts.slice().sort((a, b) => (b.season - a.season) || (b.start_time || 0) - (a.start_time || 0));
  if (!drafts.length) return wrap.appendChild(card('Drafts', null, h('div.empty', 'Sleeper reports no drafts for this league.'))), wrap;
  if (DraftUI.id === null || !drafts.find(d => d.draft_id === DraftUI.id)) DraftUI.id = drafts[0].draft_id;
  const d = S.draftMeta[DraftUI.id] || drafts.find(x => x.draft_id === DraftUI.id);
  const picks = (S.draftPicks[DraftUI.id] || []).slice().sort((a, b) => a.pick_no - b.pick_no);
  const isStartup = (d.settings && d.settings.rounds > 8) || d.type === 'snake_startup' || picks.length > S.teams.length * 8;
  const label = (x) => `${x.season} ${((x.settings && x.settings.rounds > 8) || x.type === 'snake_startup' || (S.draftPicks[x.draft_id] || []).length > S.teams.length * 8) ? 'Startup' : 'Rookie'} draft · ${x.status}`;

  wrap.appendChild(h('div.row', { style: { justifyContent: 'space-between' } },
    h('label.fld', { style: { minWidth: '280px' } }, 'Draft',
      h('select', { onchange: e => { DraftUI.id = e.target.value; render(); } }, drafts.map(x => h('option', { value: x.draft_id, selected: x.draft_id === DraftUI.id }, label(x))))),
    h('span.tiny.muted', picks.length + ' picks · ' + ((d.settings && d.settings.rounds) || '?') + ' rounds · ' + (d.type || 'snake'))));

  if (!picks.length) return wrap.appendChild(card('Draft board', null, h('div.empty', 'This draft has not started — no picks to show yet.'))), wrap;

  // surplus: player value vs. expected value at that pick slot
  const vals = picks.map(p => { const pl = S.index[String(p.player_id)]; return pl ? (pl.dv || 0) : 0; });
  const sorted = vals.slice().sort((a, b) => b - a);
  const enriched = picks.map((p, i) => {
    const pl = S.index[String(p.player_id)] || ensurePlayer(String(p.player_id));
    const expected = sorted[Math.min(i, sorted.length - 1)] || 0;
    const t = S.teams.find(x => x.rosterId === +p.roster_id) || S.teams.find(x => x.ownerId === p.picked_by);
    return { p, pl, expected, surplus: (pl.dv || 0) - expected, team: t, meta: p.metadata || {} };
  });
  const maxAbs = Math.max(...enriched.map(e => Math.abs(e.surplus)), 1);
  const surColor = (s) => {
    const t = clamp(Math.abs(s) / maxAbs, 0, 1);
    const a = 0.10 + t * 0.55;
    return s >= 0 ? `color-mix(in srgb, var(--s1) ${Math.round(a * 100)}%, var(--surface-1))` : `color-mix(in srgb, var(--s8) ${Math.round(a * 100)}%, var(--surface-1))`;
  };
  const rounds = Math.max(...picks.map(p => p.round));
  const perRound = Math.max(...picks.map(p => p.draft_slot || 1), S.teams.length);
  const board = h('div.board', { style: { gridTemplateColumns: `36px repeat(${perRound}, minmax(${isSimple() ? 132 : 96}px,1fr))` } });
  board.appendChild(h('div'));
  for (let s = 1; s <= perRound; s++) {
    const rid = d.slot_to_roster_id ? d.slot_to_roster_id[s] : null;
    const t = rid ? S.teamById[rid] : null;
    board.appendChild(h('div.tiny.muted', { style: { textAlign: 'center', fontWeight: 660, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, title: t ? t.name : '' }, t ? t.short : s));
  }
  for (let r = 1; r <= rounds; r++) {
    board.appendChild(h('div.tiny.muted', { style: { alignSelf: 'center', textAlign: 'center', fontWeight: 660 } }, r));
    for (let s = 1; s <= perRound; s++) {
      const e = enriched.find(x => x.p.round === r && x.p.draft_slot === s);
      if (!e) { board.appendChild(h('div.cell', { style: { opacity: .3 } })); continue; }
      const cell = h('div.cell', {
        style: { background: surColor(e.surplus), cursor: /^\d+$/.test(e.pl.id) ? 'pointer' : 'default' }, tabindex: 0,
        onclick: () => { if (/^\d+$/.test(e.pl.id)) openPlayer(e.pl.id); },
        onkeydown: (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && /^\d+$/.test(e.pl.id)) { ev.preventDefault(); openPlayer(e.pl.id); } }
      },
        isSimple()
          ? h('div.pnrow', playerFace(e.pl, { xs: true }), h('div.pn', e.pl.name))
          : h('div.pn', e.pl.name),
        h('div.mt', h('span', { style: { fontWeight: 700 } }, e.pl.pos || '—'),
          h('span', e.pl.team || ''), h('span', { style: { marginLeft: 'auto', opacity: .8 } }, r + '.' + String(s).padStart(2, '0'))));
      bindTT(cell, `<div class="k">Pick ${e.p.pick_no} (${r}.${String(s).padStart(2, '0')}) — ${e.team ? e.team.name : '?'}</div>` +
        `<b>${e.pl.name}</b> ${e.pl.pos || ''} ${e.pl.team || ''}<br>` +
        `Value today <b>${kfmt(Math.round(e.pl.dv || 0))}</b><br>Par for this slot <b>${kfmt(Math.round(e.expected))}</b><br>` +
        `<span style="color:${e.surplus >= 0 ? 'var(--good-text)' : 'var(--bad-text)'};font-weight:640">${sgn(Math.round(e.surplus), 0)} surplus</span>`);
      board.appendChild(cell);
    }
  }
  wrap.appendChild(card((isStartup ? 'Startup' : 'Rookie') + ' draft board — ' + d.season,
    'shaded by value today against what that slot normally returns',
    h('div', scrollBox(board),
      h('div.legend', { style: { marginTop: '11px' } },
        h('span', h('i', { style: { background: 'var(--s8)' } }), 'Below par for the slot'),
        h('span', h('i', { style: { background: 'var(--div-neutral)' } }), 'Par'),
        h('span', h('i', { style: { background: 'var(--s1)' } }), 'Above par'),
        h('span.tiny.muted', 'Hover any pick for the numbers.')))));

  const best = enriched.slice().sort((a, b) => b.surplus - a.surplus);
  const cols = [
    { k: 'pick', h: 'Pick', num: true, sort: r => r.p.pick_no, f: r => h('span.mono', r.p.round + '.' + String(r.p.draft_slot).padStart(2, '0')) },
    { k: 'player', h: 'Player', sort: r => r.pl.name, f: r => h('div.row', { style: { gap: '6px' } }, posPill(r.pl.pos), pname(r.pl)) },
    { k: 'team', prio: 2, h: 'Drafted by', sort: r => r.team ? r.team.name : '', f: r => r.team ? r.team.name : '—' },
    { k: 'dv', h: 'Value now', num: true, sort: r => r.pl.dv || 0, f: r => kfmt(Math.round(r.pl.dv || 0)) },
    { k: 'exp', prio: 2, h: 'Par', num: true, sort: r => r.expected, f: r => kfmt(Math.round(r.expected)) },
    { k: 'surplus', h: 'Surplus', num: true, sort: r => r.surplus, f: r => deltaTag(r.surplus, 0) }
  ];
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(340px,1fr))' } },
    card('Best value picks', 'biggest gain over slot par', table(cols, best.slice(0, 12), { sortKey: 'surplus', sortDir: -1 })),
    card('Picks that did not work out', 'biggest shortfall', table(cols, best.slice(-12).reverse(), { sortKey: 'surplus', sortDir: 1 }))));

  const byTeam = {};
  enriched.forEach(e => { if (!e.team) return; (byTeam[e.team.rosterId] = byTeam[e.team.rosterId] || []).push(e); });
  wrap.appendChild(card('Draft haul by team', 'total value of everything each team took in this draft, still on any roster or not',
    barList(Object.keys(byTeam).map(k => {
      const list = byTeam[k], t = S.teamById[k];
      return {
        label: t.name, v: sum(list.map(e => e.pl.dv || 0)), vl: kfmt(Math.round(sum(list.map(e => e.pl.dv || 0)))),
        tip: `<div class="k">${t.name} — ${list.length} picks</div>` + list.slice(0, 10).map(e => `${e.p.round}.${String(e.p.draft_slot).padStart(2, '0')} ${e.pl.name} — <b>${kfmt(Math.round(e.pl.dv || 0))}</b>`).join('<br>')
      };
    }).sort((a, b) => b.v - a.v), { labelW: '160px', dec: 0 })));
  return wrap;
}


/** Every player on a franchise as its own line, on the same dates as the
 *  franchise chart. The biggest movers get a colour and an end label; the rest
 *  stay thin and grey so the shape of the roster is still readable. */
const STOCK_LINE_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s7)'];
function stockTeamLines(t, teamSer) {
  const rows = t.players.map(p => {
    // a player the market does not price (most kickers and defences) has a flat
    // line at nothing, which only distorts the axis
    if (!((p.dv || 0) > 0)) return null;
    const ser = playerSeries(p.id, StockUI.range);
    if (!ser.length) return null;
    const f = ser[0].v, l = ser[ser.length - 1].v;
    return { p: p, ser: ser, first: f, last: l, chg: l - f, pctc: f ? (l - f) / f : 0 };
  }).filter(Boolean);
  if (!rows.length) return card('Players behind the ticker', null, h('div.empty', 'No player history for this roster.'));

  const dates = teamSer.map(s => s.d);
  const byMove = rows.slice().sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg));
  const featured = byMove.slice(0, 5);
  const colorOf = {};
  featured.forEach((r, i) => colorOf[r.p.id] = STOCK_LINE_COLORS[i % STOCK_LINE_COLORS.length]);

  // absolute value puts a 12k stud and a 200-point stash on one axis, which is
  // honest but unreadable; indexing every line to 100 at the start of the window
  // is what actually answers "whose stock moved"
  const indexed = StockUI.lines === 'index';
  const toPoints = (r) => r.ser.map((s, i) => ({
    x: i, y: indexed ? (r.first ? s.v / r.first * 100 : 100) : s.v,
    label: new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
  }));
  // background lines first so the featured five draw on top of them
  const bg = rows.filter(r => !colorOf[r.p.id]).map(r => ({
    name: r.p.name, color: 'var(--text-muted)', width: 1, opacity: .3, points: toPoints(r)
  }));
  const fg = featured.map(r => ({
    name: r.p.name, color: colorOf[r.p.id], width: 2, points: toPoints(r)
  }));
  const chart = lineChart(bg.concat(fg), {
    h: 300, dots: false, maxTip: 10, floorAtZero: true,
    yFmt: v => indexed ? fmt(v, 0) : kfmt(Math.round(v)),
    xFmt: i => dates[clamp(Math.round(i), 0, dates.length - 1)]
      ? new Date(dates[clamp(Math.round(i), 0, dates.length - 1)]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
      : '',
    aria: 'every player on this roster, value over time'
  });
  const modeRow = h('div.row', { style: { justifyContent: 'flex-end', marginBottom: '6px' } },
    segmented([{ k: 'index', label: 'Indexed to 100' }, { k: 'value', label: 'Absolute value' }], StockUI.lines,
      k => { StockUI.lines = k; render(); }));
  const legend = h('div.legend', { style: { marginTop: '8px' } }, featured.map(r =>
    h('span', h('i', { style: { background: colorOf[r.p.id] } }), r.p.name))
    .concat(bg.length ? [h('span', h('i', { style: { background: 'var(--text-muted)', opacity: .3 } }), bg.length + ' more')] : []));

  const tbl = table([
    { k: 'name', h: 'Player', sort: r => r.p.name, f: r => h('div.row', { style: { gap: '6px' } }, posPill(r.p.pos), pname(r.p, { style: { fontWeight: 540 } })) },
    { k: 'first', prio: 2, h: 'Start', num: true, f: r => kfmt(r.first) },
    { k: 'last', h: 'Now', num: true, f: r => h('b.mono', kfmt(r.last)) },
    { k: 'chg', h: 'Change', num: true, f: r => deltaTag(r.chg, 0) },
    { k: 'pctc', h: '%', num: true, f: r => h('span', { class: r.pctc > 0 ? 'up mono' : r.pctc < 0 ? 'down mono' : 'mono' }, sgn(r.pctc * 100, 1) + '%') },
    { k: 'share', prio: 2, h: 'Share', num: true, sort: r => r.last, f: r => pct(r.last / Math.max(1, sum(rows.map(x => x.last))), 1) }
  ], rows, { sortKey: 'chg', sortDir: -1 });
  const wt = withTable(h('div', modeRow, chart, legend), tbl);
  const up = rows.filter(r => r.chg > 0).length;
  return card('Players behind the ticker',
    `${rows.length} priced players over the same ${StockUI.range} days · ${up} up, ${rows.length - up} down · `
    + (indexed ? 'every line starts at 100, so the shape is the percentage move' : 'absolute trade value') + ' · picks are not shown here',
    wt.body, wt.btn);
}

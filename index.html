<style>
/* ============ tokens ============
   One scale of cool neutrals, one brand (indigo into violet) and the data
   palette (--s1…--s8, --seq-*) that every chart reads from. The brand is chrome
   only — navigation, primary actions, focus — so it never competes with the
   colours that carry meaning in a chart or a position pill. */
:root{
  color-scheme: light;
  --surface-1:#ffffff; --surface-2:#f8f9fc; --surface-3:#eef0f6; --plane:#f2f3f8;
  --text-primary:#0d1020; --text-secondary:#454b63; --text-muted:#6a7089;
  --grid:#e8eaf2; --axis:#c8ccdb; --border:rgba(18,22,48,0.085); --border-strong:rgba(18,22,48,0.16);
  --s1:#2f6df0; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6a4fd8; --s8:#e34948;
  --seq-100:#d3e3fc; --seq-150:#bdd5f8; --seq-200:#a3c6f5; --seq-250:#89b7f1; --seq-300:#6fa7ee;
  --seq-350:#5798ea; --seq-400:#3f89e6; --seq-450:#2f6df0; --seq-500:#2960d6; --seq-550:#2252b8;
  --seq-600:#1c4499; --seq-650:#15367d; --seq-700:#0f2961;
  --div-neutral:#eff0f5;
  --good:#12a150; --warning:#fab219; --serious:#ec835a; --critical:#d93b45;
  --good-text:#0a7a3b; --bad-text:#c0303a;
  --brand:#4f5bf0; --brand-2:#8a5cf6; --brand-soft:color-mix(in srgb, var(--brand) 9%, transparent);
  --brand-grad:linear-gradient(135deg,#4468f5 0%,#6a55f2 55%,#8a5cf6 100%);
  --ring:0 0 0 3px color-mix(in srgb, var(--brand) 28%, transparent);
  --ink:#0e1226; --ink-2:#161b36; --ink-text:#aab0cc; --ink-text-hi:#ffffff;
  --hero-a:#10143a; --hero-b:#1c2160; --hero-c:#2d2078;
  --glow-a:rgba(168,108,255,.5); --glow-b:rgba(70,118,255,.42);
  --title-a:#9fb0ff; --title-b:#d2a6ff; --nav-on:#b9c2ff;
  --shadow-xs: 0 1px 2px rgba(18,22,48,.06);
  --shadow: 0 1px 2px rgba(18,22,48,.04), 0 10px 28px -12px rgba(18,22,48,.12);
  --shadow-lg: 0 2px 4px rgba(18,22,48,.05), 0 24px 56px -16px rgba(18,22,48,.22);
  --r:16px; --r-sm:10px;
  --font: "Inter var","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#141826; --surface-2:#0f1320; --surface-3:#1c2132; --plane:#0a0d17;
    --text-primary:#f3f5fb; --text-secondary:#b9bfd3; --text-muted:#8b92ab;
    --grid:#232940; --axis:#343b57; --border:rgba(255,255,255,0.075); --border-strong:rgba(255,255,255,0.15);
    --s1:#4b8cf2; --s2:#e0652f; --s3:#22b585; --s4:#d9981a; --s5:#df5f8e; --s6:#1a9a1a; --s7:#9b8cf0; --s8:#ee6b6b;
    --div-neutral:#343b57;
    --good:#22b15f; --good-text:#3fcf80; --bad-text:#f27a7a;
    --brand:#7480ff; --brand-2:#a37bff;
    --brand-grad:linear-gradient(135deg,#5b78ff 0%,#7a62f7 55%,#9a68fb 100%);
    --ink:#070912; --ink-2:#0d1020;
    --shadow-xs: 0 1px 2px rgba(0,0,0,.4);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px -12px rgba(0,0,0,.6);
    --shadow-lg: 0 2px 4px rgba(0,0,0,.4), 0 28px 60px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#141826; --surface-2:#0f1320; --surface-3:#1c2132; --plane:#0a0d17;
  --text-primary:#f3f5fb; --text-secondary:#b9bfd3; --text-muted:#8b92ab;
  --grid:#232940; --axis:#343b57; --border:rgba(255,255,255,0.075); --border-strong:rgba(255,255,255,0.15);
  --s1:#4b8cf2; --s2:#e0652f; --s3:#22b585; --s4:#d9981a; --s5:#df5f8e; --s6:#1a9a1a; --s7:#9b8cf0; --s8:#ee6b6b;
  --div-neutral:#343b57;
  --good:#22b15f; --good-text:#3fcf80; --bad-text:#f27a7a;
  --brand:#7480ff; --brand-2:#a37bff;
  --brand-grad:linear-gradient(135deg,#5b78ff 0%,#7a62f7 55%,#9a68fb 100%);
  --ink:#070912; --ink-2:#0d1020;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.4);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 2px 4px rgba(0,0,0,.4), 0 28px 60px -16px rgba(0,0,0,.75);
}

/* ---- accent themes ----
   The brand is one hue. Everything that is "brand" — buttons, links, focus, the
   sidebar's tint, the home banner, the landing page — is derived from --hue, so a
   theme is a single number (plus --cs, how saturated: 0 is graphite). The hex
   values above are what a browser without oklch() keeps: the original indigo. */
:root{--hue:278;--cs:1}
:root[data-accent="blue"]{--hue:252}
:root[data-accent="teal"]{--hue:200}
:root[data-accent="green"]{--hue:157}
:root[data-accent="orange"]{--hue:48}
:root[data-accent="rose"]{--hue:8}
:root[data-accent="graphite"]{--hue:265;--cs:.12}
@supports (color: oklch(50% .1 200)){
  :root{
    --brand:oklch(53% calc(.21*var(--cs)) var(--hue));
    --brand-2:oklch(57% calc(.2*var(--cs)) calc(var(--hue) + 32));
    --brand-grad:linear-gradient(135deg,oklch(58% calc(.2*var(--cs)) calc(var(--hue) - 14)) 0%,var(--brand) 55%,var(--brand-2) 100%);
    --ink:oklch(15.5% calc(.04*var(--cs)) var(--hue)); --ink-2:oklch(20.5% calc(.052*var(--cs)) var(--hue));
    --hero-a:oklch(19% calc(.075*var(--cs)) var(--hue)); --hero-b:oklch(27% calc(.125*var(--cs)) var(--hue)); --hero-c:oklch(31% calc(.14*var(--cs)) calc(var(--hue) + 24));
    --glow-a:oklch(62% calc(.2*var(--cs)) calc(var(--hue) + 36) / .5); --glow-b:oklch(60% calc(.2*var(--cs)) calc(var(--hue) - 6) / .42);
    --title-a:oklch(82% calc(.11*var(--cs)) var(--hue)); --title-b:oklch(84% calc(.12*var(--cs)) calc(var(--hue) + 40));
    --nav-on:oklch(84% calc(.09*var(--cs)) var(--hue));
  }
}
@supports (color: oklch(50% .1 200)){
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:oklch(71% calc(.17*var(--cs)) var(--hue));
      --brand-2:oklch(73% calc(.17*var(--cs)) calc(var(--hue) + 32));
      --brand-grad:linear-gradient(135deg,oklch(66% calc(.19*var(--cs)) calc(var(--hue) - 14)) 0%,oklch(62% calc(.2*var(--cs)) var(--hue)) 55%,oklch(64% calc(.2*var(--cs)) calc(var(--hue) + 32)) 100%);
      --ink:oklch(11.5% calc(.03*var(--cs)) var(--hue)); --ink-2:oklch(16% calc(.04*var(--cs)) var(--hue));
    }
  }
  :root[data-theme="dark"]{
    --brand:oklch(71% calc(.17*var(--cs)) var(--hue));
    --brand-2:oklch(73% calc(.17*var(--cs)) calc(var(--hue) + 32));
    --brand-grad:linear-gradient(135deg,oklch(66% calc(.19*var(--cs)) calc(var(--hue) - 14)) 0%,oklch(62% calc(.2*var(--cs)) var(--hue)) 55%,oklch(64% calc(.2*var(--cs)) calc(var(--hue) + 32)) 100%);
    --ink:oklch(11.5% calc(.03*var(--cs)) var(--hue)); --ink-2:oklch(16% calc(.04*var(--cs)) var(--hue));
  }
}

*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plane);color:var(--text-primary);font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  font-feature-settings:"cv11","ss03","tnum" 0}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.018em}
a{color:var(--brand)}
button{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:color-mix(in srgb, var(--brand) 30%, transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--axis);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ============ shell ============ */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.shell>*{min-width:0}
/* the sidebar is always ink, in either theme: it is the one fixed landmark, and
   a dark rail makes the working surface beside it read as lighter and calmer */
.side{
  background:
    radial-gradient(320px 220px at 0% 0%, color-mix(in srgb, var(--brand) 26%, transparent), transparent 70%),
    linear-gradient(180deg,var(--ink-2),var(--ink));
  color:var(--ink-text);padding:16px 12px 14px;display:flex;flex-direction:column;gap:1px;
  position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent;
}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);background-clip:content-box}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.brand .mark{width:34px;height:34px;border-radius:11px;background:var(--brand-grad);flex:none;display:grid;place-items:center;
  box-shadow:0 6px 18px -4px color-mix(in srgb, var(--brand) 70%, transparent), inset 0 1px 0 rgba(255,255,255,.35)}
.brand .mark svg{width:19px;height:19px;color:#fff}
.brand b{font-size:15px;letter-spacing:-.02em;line-height:1.1;color:var(--ink-text-hi);display:block}
.brand small{display:block;color:var(--ink-text);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;opacity:.8}
.navgroup{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(170,176,204,.5);padding:14px 11px 5px}
.navbtn{position:relative;display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:10px;border:0;background:transparent;
  color:var(--ink-text);cursor:pointer;text-align:left;width:100%;font-size:13.5px;font-weight:540;
  transition:background .15s,color .15s}
.navbtn:hover{background:rgba(255,255,255,.07);color:var(--ink-text-hi)}
.navbtn:focus-visible{outline-color:#fff;outline-offset:-2px}
.navbtn.on{background:rgba(255,255,255,.1);color:var(--ink-text-hi);font-weight:640;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.navbtn.on::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-grad)}
.navbtn .ic{width:18px;height:18px;flex:none;display:grid;place-items:center;opacity:.8}
.navbtn .ic svg{width:18px;height:18px}
.navbtn.on .ic{opacity:1;color:var(--nav-on)}
.side .spacer{flex:1;min-height:12px}
.side .foot{padding:12px 11px 2px;border-top:1px solid rgba(255,255,255,.08);margin-top:10px;font-size:11px;color:rgba(170,176,204,.7);line-height:1.6}

.main{min-width:0;display:flex;flex-direction:column;
  background:radial-gradient(900px 380px at 78% -60px, color-mix(in srgb, var(--brand) 9%, transparent), transparent 70%)}
.topbar{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--plane) 82%, transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);
  border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .lg{font-weight:700;font-size:17px;letter-spacing:-.02em;line-height:1.2}
.topbar .sub{color:var(--text-muted);font-size:12.5px}
.topbar .grow{flex:1}
.topbar .btn .bl{display:inline}
.live{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.01em;
  color:var(--brand);background:color-mix(in srgb, var(--brand) 11%, var(--surface-1));border:1px solid color-mix(in srgb, var(--brand) 32%, transparent)}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.8s ease-out infinite}
.live.idle{color:var(--text-secondary);background:var(--surface-1);border-color:var(--border-strong)}
.live.idle i{animation:none;opacity:.55}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, currentColor 55%, transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* The content column takes whatever width the window gives it. Nothing here is
   a wall of prose, and every grid is auto-fit, so a wide monitor buys more
   cards per row rather than longer lines. The cap is past any ordinary display
   — it only stops a table spreading itself across an ultrawide. */
.content{padding:24px 28px 56px;width:100%;max-width:1760px;margin-inline:auto}
@media (min-width:1700px){ .content{padding:28px 36px 64px} }
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* only on a change of page — a re-render from a click inside one must not replay it */
.content.enter>*{animation:rise .42s var(--ease) both}
.content.enter>*:nth-child(2){animation-delay:.04s}
.content.enter>*:nth-child(3){animation-delay:.08s}
.content.enter>*:nth-child(4){animation-delay:.12s}
.content.enter>*:nth-child(n+5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){ .content.enter>*{animation:none} .live i{animation:none} *{transition-duration:.01ms!important} }

/* ============ player tiers ============ */
:root{
  --m-diamond-a:#3fd9ff; --m-diamond-b:#8b6bff; --m-diamond-c:#ff62c8;
  --m-gold-a:#ffd84a; --m-gold-b:#e08a00; --m-gold-c:#fff2b0;
  --m-silver-a:#f6f8fc; --m-silver-b:#6f7e9c; --m-silver-c:#ffffff;
  --m-bronze-a:#eaa062; --m-bronze-b:#9c4f17; --m-bronze-c:#f7c999;
}
.medal.diamond{--m-grad:linear-gradient(115deg,var(--m-diamond-a),var(--m-diamond-b),var(--m-diamond-c),var(--m-diamond-a));--m-tint:rgba(110,160,255,.14);--m-edge:#7f9bff;--m-bar:linear-gradient(180deg,#3fd9ff,#8b6bff 55%,#ff62c8)}
.medal.gold{--m-grad:linear-gradient(115deg,var(--m-gold-b),var(--m-gold-a),var(--m-gold-c),var(--m-gold-b));--m-tint:rgba(242,169,0,.15);--m-edge:#e8a000;--m-bar:linear-gradient(180deg,#ffd84a,#e08a00)}
.medal.silver{--m-grad:linear-gradient(115deg,var(--m-silver-b),var(--m-silver-a),var(--m-silver-c),var(--m-silver-b));--m-tint:rgba(120,135,165,.14);--m-edge:#8493b0;--m-bar:linear-gradient(180deg,#f6f8fc,#6f7e9c 60%,#c9d2e3)}
.medal.bronze{--m-grad:linear-gradient(115deg,var(--m-bronze-b),var(--m-bronze-a),var(--m-bronze-c),var(--m-bronze-b));--m-tint:rgba(168,90,30,.14);--m-edge:#b8662a;--m-bar:linear-gradient(180deg,#eaa062,#9c4f17)}
.mring{display:inline-flex;flex:none;padding:3.5px;border-radius:50%;background:var(--m-grad);background-size:300% 100%;line-height:0;vertical-align:middle}
.mring.lg{padding:4px;border-radius:17px}
.mring.mhero{padding:5px;border-radius:17px}
.mring.mhero>*{border-radius:13px!important;display:block}
.mring.sm{padding:3px}
.mring.xs{padding:2.5px}
.lupface .mring.lg{border-radius:50%;padding:4px}
.lupface .mring>.face.lg{border-width:0}
.mring>.face{box-shadow:0 0 0 1px var(--surface-1)}
.mring:not(.anim){background-size:100% 100%}
.mring{box-shadow:0 0 0 1px rgba(20,30,60,.22)}
.mring.diamond{box-shadow:0 0 0 1px rgba(90,110,255,.45),0 0 12px 0 rgba(90,170,255,.6)}
.mring.gold{box-shadow:0 0 0 1px rgba(170,100,0,.45),0 0 11px -1px rgba(242,169,0,.65)}
.mring.silver{box-shadow:0 0 0 1px rgba(60,75,110,.42),0 0 6px -1px rgba(130,150,190,.55)}
.mring.bronze{box-shadow:0 0 0 1px rgba(110,50,10,.45),0 0 6px -2px rgba(184,102,42,.5)}
.pcard.medal,.card.medal.mhero{position:relative;overflow:hidden;border-color:var(--m-edge);
  background:linear-gradient(100deg,var(--m-tint),transparent 62%),var(--surface-1)}
.pcard.medal::after,.card.medal.mhero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:250% 100%;background-position:150% 0}
.pcard.medal.diamond::after,.pcard.medal.gold::after,.card.medal.mhero.diamond::after,.card.medal.mhero.gold::after{opacity:.5}
.card.medal.mhero{box-shadow:var(--shadow),0 0 0 1px var(--m-edge) inset}
  color:#1a1405;background:var(--m-grad);background-size:300% 100%;vertical-align:middle}
@keyframes medal-flow{to{background-position:-300% 0}}
@keyframes medal-sweep{0%,55%{background-position:150% 0}100%{background-position:-50% 0}}
.mring.anim.diamond{animation:medal-flow 5s linear infinite}
.mring.anim.gold{animation:medal-flow 8s linear infinite}
.mring.anim.silver{animation:medal-flow 14s linear infinite}
.pcard.medal.anim.diamond::after,.card.medal.mhero.anim.diamond::after{animation:medal-sweep 4.5s ease-in-out infinite}
.pcard.medal.anim.gold::after,.card.medal.mhero.anim.gold::after{animation:medal-sweep 7s ease-in-out infinite}
.pcard.medal.anim.gold::after,.card.medal.mhero.anim.gold::after{animation:medal-sweep 7s ease-in-out infinite}
@media (max-width:760px){ .mring.anim.silver,.pcard.medal.anim.gold::after{animation:none} }
@media (prefers-reduced-motion:reduce){ .mring,.pcard.medal::after,.card.medal.mhero::after{animation:none!important} }
:root[data-theme="dark"] .medal{--m-tint:rgba(255,255,255,.05)}
:root[data-theme="dark"] .medal.diamond{--m-tint:rgba(125,232,255,.1)}
:root[data-theme="dark"] .medal.gold{--m-tint:rgba(242,169,0,.14)}
:root[data-theme="dark"] .medal.silver{--m-tint:rgba(170,185,215,.1)}
:root[data-theme="dark"] .medal.bronze{--m-tint:rgba(210,120,50,.14)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .medal{--m-tint:rgba(255,255,255,.05)}
  :root:not([data-theme="light"]) .medal.diamond{--m-tint:rgba(125,232,255,.1)}
  :root:not([data-theme="light"]) .medal.gold{--m-tint:rgba(242,169,0,.14)}
  :root:not([data-theme="light"]) .medal.silver{--m-tint:rgba(170,185,215,.1)}
  :root:not([data-theme="light"]) .medal.bronze{--m-tint:rgba(210,120,50,.14)}
}
:root[data-theme="dark"] .pcard.medal::after{background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);background-size:250% 100%}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pcard.medal::after{background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);background-size:250% 100%} }

/* ---- trading card ---- */
.pcxstage{display:grid;justify-items:center;gap:12px;padding:10px 0 4px}
.pcxcard{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--hx:0%;--hy:0%;position:relative;width:min(300px,86vw);aspect-ratio:5/7;border-radius:20px;padding:6px;
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s var(--ease),box-shadow .3s;touch-action:pan-y;
  background:var(--pcx-frame);box-shadow:0 18px 40px -14px rgba(18,22,48,.5),0 2px 6px rgba(18,22,48,.2);background-size:260% 260%;background-position:calc(50% + var(--hx)*.85) calc(50% + var(--hy)*.85)}
.pcxcard.pcxon{transition:transform .08s linear,box-shadow .3s;box-shadow:0 30px 50px -16px rgba(18,22,48,.55),0 2px 6px rgba(18,22,48,.2)}
.pcxcard.none,.pxm.none{--pcx-frame:#a9b0c4;--pcx-bg:#eff1f7;--pcx-art:#dde1ec}
.pcxcard.bronze,.pxm.bronze{--pcx-frame:linear-gradient(140deg,#e0a070,#a8622f 50%,#e8b186);--pcx-bg:linear-gradient(170deg,#fff4ea,#f0d3b8);--pcx-art:linear-gradient(160deg,#e9c3a0,#f8e4d1)}
.pcxcard.silver,.pxm.silver{--pcx-frame:linear-gradient(135deg,#d5dcec 0%,#5d6c8c 14%,#ffffff 28%,#8696b8 44%,#f4f7ff 58%,#4f5f82 76%,#c4cee4 90%,#ffffff 100%);--pcx-bg:repeating-linear-gradient(118deg,rgba(255,255,255,.75) 0 1.5px,rgba(120,138,178,.14) 1.5px 4px),linear-gradient(170deg,#fcfdff,#c9d2e6);--pcx-art:linear-gradient(135deg,#b3c0dc,#f6f8fd 45%,#a2b0d0)}
.pcxcard.silver{box-shadow:0 18px 40px -12px rgba(110,130,185,.6),0 2px 6px rgba(18,22,48,.2)}
.pcxcard.gold,.pxm.gold{--pcx-frame:linear-gradient(140deg,#fff0b0,#f2a900 40%,#ffe27a 65%,#d99200);--pcx-bg:linear-gradient(170deg,#fffaf0,#fbe9bd);--pcx-art:linear-gradient(160deg,#ffe9a8,#fff6dc)}
.pcxcard.diamond,.pxm.diamond{--pcx-frame:linear-gradient(140deg,#7de8ff,#a98bff 40%,#ff9ad5 65%,#7de8ff);--pcx-bg:linear-gradient(170deg,#f6fcff,#e4e2ff);--pcx-art:linear-gradient(160deg,#c4efff,#e2d6ff 55%,#ffd9ee)}
.pcxcard.diamond{box-shadow:0 18px 44px -12px rgba(125,150,255,.55),0 2px 6px rgba(18,22,48,.2)}
.pcxcard.gold{box-shadow:0 18px 44px -12px rgba(242,169,0,.5),0 2px 6px rgba(18,22,48,.2)}
.pcxface{position:relative;height:100%;border-radius:15px;overflow:hidden;background:var(--pcx-bg);color:#14182c;display:flex;flex-direction:column;padding:11px 11px 10px;gap:8px}
.pcxtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcxname{font-weight:780;font-size:19px;letter-spacing:-.02em;line-height:1.1;min-width:0}
.pcxrank{font-size:11px;font-weight:700;color:#5a6180;white-space:nowrap}
.pcxart{position:relative;flex:1;min-height:0;border-radius:11px;overflow:hidden;background:var(--pcx-art);box-shadow:inset 0 0 0 1px rgba(18,22,48,.14)}
.pcxart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pcxpos{position:absolute;left:-4px;bottom:-14px;font-size:92px;font-weight:900;letter-spacing:-.05em;color:rgba(18,22,48,.1);line-height:1;pointer-events:none}
.pcxteam{position:absolute;right:6px;bottom:6px;width:36px;height:36px;display:grid;place-items:center}
.pcxteam .tlogo{width:34px;height:34px;margin:0;display:block;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(18,22,48,.45))}
.pcxdef .pcxdeflogo{position:absolute;left:50%;top:50%;width:68%;height:68%;transform:translate(-50%,-50%);object-fit:contain;filter:drop-shadow(0 6px 10px rgba(18,22,48,.28))}
.pxmdef{position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);object-fit:contain;filter:drop-shadow(0 2px 3px rgba(18,22,48,.3))}
.pcxmeta{font-size:11px;font-weight:650;color:#4a5170;letter-spacing:.02em;text-align:center}
.pcxstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pcxs{background:rgba(255,255,255,.7);border:1px solid rgba(18,22,48,.12);border-radius:9px;padding:5px 4px 4px;text-align:center;min-width:0}
.pcxk{font-size:9px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#5a6180}
.pcxv{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.pcxsub{font-size:9.5px;color:#6a7089;line-height:1.1;min-height:10px}
/* the shine: a glare that follows the pointer, and a foil that slides under it */
.pcxglare,.pcxholo{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.pcxglare{background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 48%);opacity:0;transition:opacity .3s;mix-blend-mode:soft-light}
.pcxcard.pcxon .pcxglare{opacity:1}
.pcxholo{opacity:0;transition:opacity .3s;mix-blend-mode:color-dodge;border-radius:inherit;background-size:220% 220%;background-position:calc(50% + var(--hx)) calc(50% + var(--hy))}
.pcxcard.diamond .pcxholo{background-image:repeating-linear-gradient(115deg,#ff7ad9 0%,#ffd86b 12%,#7dffa8 24%,#6bd6ff 36%,#a98bff 48%,#ff7ad9 60%);opacity:.38}
.pcxcard.diamond.pcxon .pcxholo{opacity:.62}
.pcxcard.gold .pcxholo{background-image:linear-gradient(115deg,transparent 20%,rgba(255,236,150,.95) 40%,rgba(255,255,255,.9) 50%,rgba(255,200,60,.9) 60%,transparent 80%);opacity:.2}
.pcxcard.gold.pcxon .pcxholo{opacity:.5}
.pcxcard.silver .pcxholo{background-image:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.95) 38%,rgba(190,205,240,.9) 50%,rgba(255,255,255,.95) 62%,transparent 82%);opacity:.32}
.pcxcard.silver.pcxon .pcxholo{opacity:.7}
.pcxcard.anim.silver .pcxholo{animation:pcx-drift 7s ease-in-out infinite alternate}
.pcxcard.anim.silver:not(.pcxon){animation:pcx-frame 8s ease-in-out infinite alternate}
.pcxcard.anim.diamond:not(.pcxon){animation:pcx-frame 7s ease-in-out infinite alternate}
.pcxcard.anim.gold:not(.pcxon){animation:pcx-frame 9s ease-in-out infinite alternate}
@keyframes pcx-frame{from{background-position:30% 30%}to{background-position:70% 70%}}
.pcxcard.anim.diamond .pcxholo{animation:pcx-drift 6s ease-in-out infinite alternate}
.pcxcard.anim.gold .pcxholo{animation:pcx-drift 8s ease-in-out infinite alternate}
.pcxcard.pcxon .pcxholo{animation:none}
@keyframes pcx-drift{from{background-position:20% 20%}to{background-position:80% 80%}}
.pcxcap{text-align:center}
@media (prefers-reduced-motion:reduce){ .pcxcard{transform:none!important;transition:none} .pcxholo{animation:none!important} }

/* ---- small cards: the home line-up and the roster deck ---- */
.pcxfit{position:relative;flex:none}
.pcxscale{position:absolute;left:0;top:0;width:300px;height:420px;transform:scale(var(--k,1));transform-origin:0 0}
.pcxscale .pcxcard{width:300px}
.pcxlink{cursor:pointer;border-radius:20px}
.pcxlink:focus-visible{outline:2px solid var(--s1);outline-offset:4px}
.pcxhand{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 8px}
.pcxhandi{display:grid;justify-items:center;gap:6px}
.pcxdeck{display:flex;align-items:flex-end;padding:44px 26px 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;min-height:0}
.pcxdeck .pcxfit{margin-left:-82px;transition:transform .38s var(--ease),margin .38s var(--ease),filter .3s}
.pcxdeck .pcxfit:first-child{margin-left:0}
.pcxdeck .pcxfit:hover,.pcxdeck .pcxfit:focus-visible{transform:translateY(-34px) scale(1.07);z-index:5}
.pcxdeck:hover .pcxfit:not(:hover){filter:brightness(.97)}
.pcxdeck .pcxfit:hover~.pcxfit{transform:translateX(46px)}
.pcxdeck .pcxfit:nth-child(n){z-index:auto}
@media (prefers-reduced-motion:reduce){ .pcxdeck .pcxfit{transition:none} }
@media (hover:none){ .pcxdeck .pcxfit{margin-left:-60px} }

/* ---- hover preview + deal cards ---- */
.pcxpop{position:fixed;z-index:1200;pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .18s var(--ease),transform .22s var(--ease);filter:drop-shadow(0 18px 28px rgba(18,22,48,.35))}
.pcxpop.in{opacity:1;transform:none}
.pcxpop .pcxcard{transform:none!important}
.tray-items.cards,.tmini-items.cards{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tray-items.cards .tray-foot{flex-basis:100%}
.pxmwrap{display:grid;gap:5px;justify-items:center;align-content:start}
.pxm{position:relative;width:96px;height:134px;padding:3px;border-radius:12px;background:var(--pcx-frame);background-size:260% 260%;box-shadow:0 6px 14px -8px rgba(18,22,48,.5),0 1px 2px rgba(18,22,48,.2);transition:transform .22s var(--ease),box-shadow .22s;flex:none}
.pxm:hover{transform:translateY(-4px);box-shadow:0 14px 22px -10px rgba(18,22,48,.5),0 1px 2px rgba(18,22,48,.2)}
.pxm.pcxlink:focus-visible{outline:2px solid var(--s1);outline-offset:3px}
.pxmface{height:100%;border-radius:9px;overflow:hidden;background:var(--pcx-bg);color:#14182c;display:flex;flex-direction:column;padding:4px 4px 5px;gap:3px;min-width:0}
.pxmart{position:relative;flex:1;min-height:0;border-radius:6px;overflow:hidden;background:var(--pcx-art);box-shadow:inset 0 0 0 1px rgba(18,22,48,.14)}
.pxmart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pxmpick{position:absolute;inset:0;display:grid;place-items:center;color:rgba(18,22,48,.4)}
.pxmpick svg{width:30px;height:30px}
.pxmpos{position:absolute;left:3px;top:3px;font-size:8.5px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:99px;background:rgba(20,24,44,.82);color:#fff}
.pxmval{position:absolute;right:3px;bottom:3px;font-size:10px;font-weight:800;padding:0 5px;border-radius:99px;background:rgba(255,255,255,.92);font-variant-numeric:tabular-nums}
.pxmname{font-size:10.5px;font-weight:760;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pxmsub{font-size:8.5px;color:#5a6180;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pxmx{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);display:grid;place-items:center;cursor:pointer;padding:0;opacity:0;transition:opacity .15s;z-index:2}
.pxm:hover .pxmx,.pxmx:focus-visible{opacity:1}
.pxmx svg{width:11px;height:11px}
@media (hover:none){ .pxmx{opacity:1} }
.pxm.anim.diamond:not(:hover){animation:pcx-frame 7s ease-in-out infinite alternate}
.pxm.anim.gold:not(:hover){animation:pcx-frame 9s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){ .pxm{animation:none!important;transition:none} .pcxpop{transition:none} }

/* ---- phones: the deck is a swipeable strip ---- */
.pcxfit .pcxcard{touch-action:manipulation}
.pcxdeck{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pcxhint{display:none;text-align:center;margin-top:-6px}
@media (hover:none){
  .pcxdeck{padding-top:18px;padding-right:40px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
  .pcxdeck .pcxfit:hover,.pcxdeck .pcxfit:hover~.pcxfit{transform:none}
  .pcxdeck .pcxfit:active{transform:translateY(-10px);transition-duration:.12s}
  .pcxhint{display:block}
}

/* ---- row accent: a tier bar down the left edge and a faint wash across the row ---- */
.trm{--m-wash:color-mix(in srgb,var(--m-tint) 50%,transparent)}
.lnrow{display:grid;grid-template-columns:46px 1fr auto;gap:9px;align-items:center;padding:3px 0;border-bottom:1px solid var(--grid)}
.lnrow.trm{padding-left:10px;border-radius:6px 0 0 6px}
table.tbl tbody tr.trm td{background-image:linear-gradient(var(--m-wash),var(--m-wash))}
table.tbl tbody tr.trm td:first-child{background-image:var(--m-bar),linear-gradient(var(--m-wash),var(--m-wash));background-size:4px 100%,auto;background-repeat:no-repeat,repeat;background-position:left top,0 0}
.bitem.trm,.sigrow.trm,.dealitem.trm,.lnrow.trm,.pcard.trm:not(.hypin){background-image:var(--m-bar),linear-gradient(90deg,var(--m-tint),transparent 80%);background-size:4px 100%,auto;background-repeat:no-repeat;background-position:left top,0 0}

/* ---- player page: card beside the headline numbers ---- */
.pcxhero{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:8px 30px;align-items:center}
.pcxhero>.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
@media (max-width:1180px){ .pcxhero>.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important} }
@media (max-width:900px){ .pcxhero{grid-template-columns:minmax(0,1fr)} .pcxhero>.grid{grid-template-columns:repeat(auto-fit,minmax(min(146px,100%),1fr))!important} }

/* ============ atoms ============ */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card .hd{padding:17px 20px 0;display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.card .hd h3{font-size:15.5px;font-weight:680}
.card .hd .note{color:var(--text-muted);font-size:12.5px}
.card .bd{padding:15px 20px 20px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.grid.split{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.grid.split2{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:center}
@media (max-width:860px){ .grid.split{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){ .grid.split2{grid-template-columns:minmax(0,1fr);gap:6px} }
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row>*{min-width:0}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:12px}
.big{font-size:28px;font-weight:700;letter-spacing:-.025em}
.hero{font-size:36px;font-weight:720;letter-spacing:-.03em;line-height:1.1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;min-height:34px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--surface-1);cursor:pointer;font-size:13px;font-weight:580;
  box-shadow:var(--shadow-xs);transition:background .15s,border-color .15s,box-shadow .15s,transform .1s,filter .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn .ic{display:inline-flex}
.btn svg{width:16px;height:16px;flex:none}
.btn.lgpick{width:100%;justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 13px}
.btn.lgpick div:first-child{font-weight:650}
.btn.pri{background:var(--brand-grad);border-color:transparent;color:#fff;
  box-shadow:0 1px 2px rgba(10,12,40,.25), 0 8px 18px -8px color-mix(in srgb, var(--brand) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.22)}
.btn.pri:hover{filter:brightness(1.07);background:var(--brand-grad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:4px 10px;min-height:28px;font-size:12px;border-radius:8px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:calc(var(--r-sm) + 2px);padding:3px;gap:2px;border:1px solid var(--border)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;font-weight:560;color:var(--text-secondary);transition:background .15s,color .15s}
.seg button:hover{color:var(--text-primary)}
.seg button.on{background:var(--surface-1);color:var(--text-primary);font-weight:680;box-shadow:var(--shadow-xs), 0 0 0 1px var(--border)}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--text-muted)}
input:hover,select:hover{border-color:color-mix(in srgb, var(--text-muted) 55%, transparent)}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
select{cursor:pointer}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--text-muted);font-weight:620;letter-spacing:.01em}

/* a position pill is the one place the app uses colour as a label, so it is
   saturated and the same shape everywhere */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:30px;padding:1px 7px;border-radius:7px;font-size:10.5px;font-weight:720;letter-spacing:.03em;border:1px solid var(--border)}
.pos-QB{background:#e34948;color:#fff;border-color:transparent}
.pos-RB{background:#16a56f;color:#fff;border-color:transparent}
.pos-WR{background:#2f6df0;color:#fff;border-color:transparent}
.pos-TE{background:#eb6834;color:#fff;border-color:transparent}
.pos-K{background:#7d8099;color:#fff;border-color:transparent}
.pos-DEF{background:#5b46c8;color:#fff;border-color:transparent}
.pos-PICK{background:#f0b020;color:#2a1d00;border-color:transparent}
.pos-FLEX,.pos-NA{background:var(--surface-3);color:var(--text-secondary)}
.hypbar{border:1px dashed color-mix(in srgb, var(--s7) 70%, transparent);border-radius:var(--r);background:color-mix(in srgb, var(--s7) 7%, var(--surface-1));padding:14px 16px;margin-bottom:16px;min-width:0}
.hypbar.quiet{padding:10px 14px}
.hyp-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;background:var(--s7);color:#fff;font-size:10px;font-weight:750;letter-spacing:.08em;flex:none;white-space:nowrap}
:root[data-hyp] .topbar{box-shadow:inset 0 -2px 0 var(--s7)}
.btn.hypon{background:var(--s7);border-color:var(--s7);color:#fff}
.btn.hypon:hover{filter:brightness(1.08);background:var(--s7)}
tr.hyp-out td{opacity:.42}
.plink{cursor:pointer;border-bottom:1px solid color-mix(in srgb, var(--brand) 35%, transparent);transition:color .12s,border-color .12s}
.plink:hover{color:var(--brand);border-bottom-color:var(--brand)}
.plink:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-1);cursor:pointer;font-size:12.5px;font-weight:580;user-select:none;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.chip:hover{background:var(--surface-3)}
.chip.on{background:var(--ink-2);border-color:var(--ink-2);color:#fff;box-shadow:var(--shadow-xs)}
:root[data-theme="dark"] .chip.on{background:var(--brand);border-color:var(--brand)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.on{background:var(--brand);border-color:var(--brand)} }
.chip.on .dot{background:#fff}
.chipwrap{display:flex;gap:7px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--surface-3);border:1px solid var(--border);font-size:10.5px;font-weight:650;color:var(--text-secondary);letter-spacing:.01em;white-space:nowrap}
.up{color:var(--good-text);font-weight:650}
.down{color:var(--bad-text);font-weight:650}
.flat{color:var(--text-muted)}

table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.tbl th{text-align:left;font-weight:650;color:var(--text-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:9px 12px;border-bottom:1px solid var(--grid);position:sticky;top:0;background:var(--surface-1);z-index:2;white-space:nowrap}
table.tbl th.num,table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--grid);vertical-align:middle;transition:background .12s}
table.tbl tbody tr:hover td{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl th.sortable{cursor:pointer;user-select:none;transition:color .12s}
table.tbl th.sortable:hover{color:var(--text-primary)}
/* Minimal is the dense view: same table, a third less air */
:root:not([data-ui="simple"]) table.tbl td{padding:7px 10px}
:root:not([data-ui="simple"]) table.tbl th{padding:7px 10px}
.scroll-x{overflow-x:auto;max-width:100%}
/* A table wider than its card scrolls sideways. Without a cue that reads as a
   column someone simply cut off, so the fade is driven by measurement: it is
   there only while there is genuinely more to the right, and it fades out as
   you reach the end. */
.sx{position:relative;min-width:0}
.sx::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:44px;pointer-events:none;
  opacity:0;transition:opacity .16s;border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:linear-gradient(to left, var(--surface-1) 18%, color-mix(in srgb, var(--surface-1) 55%, transparent) 62%, transparent);
}
.sx.more::after{opacity:1}
.sx .sx-hint{
  position:absolute;right:6px;bottom:1px;pointer-events:none;opacity:0;transition:opacity .16s;
  background:var(--surface-3);border:1px solid var(--border);border-radius:99px;
  padding:1px 8px;font-size:10.5px;font-weight:650;color:var(--text-secondary);white-space:nowrap;
}
/* The worded hint is for touch, where there is no scrollbar to see and no
   wheel to try; on a desktop the fade plus a scrollbar already says it, so the
   chip and the strip it needs stay off there and the layout is untouched. */
@media (max-width: 900px){
  .sx.more.hintable .sx-hint{opacity:.94}
  /* its own strip under the rows, so it never sits on top of a number. The class
     is set from a measurement and does not toggle with scroll position, so
     nothing reflows as you swipe. */
  .sx.canscroll.hintable>.scroll-x{padding-bottom:19px}
}

.tt{position:fixed;z-index:200;pointer-events:none;background:var(--ink-2);color:#eef0fa;border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:var(--shadow-lg);padding:9px 12px;font-size:12px;line-height:1.45;max-width:290px;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s}

.empty{padding:44px 20px;text-align:center;color:var(--text-muted)}
.kpi{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-1);box-shadow:var(--shadow);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.kpi[tabindex]:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:680}
.kpi .val{font-size:25px;font-weight:720;letter-spacing:-.028em;line-height:1.2;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kpi .sub{font-size:12px;color:var(--text-secondary)}

.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font)}
.ax{font-size:10.5px;fill:var(--text-muted);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.axline{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);align-items:center}

.splash{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--plane)}
.sp-art{position:relative;overflow:hidden;color:#fff;padding:56px clamp(32px,5vw,84px);display:flex;flex-direction:column;justify-content:center;gap:28px;
  background:
    radial-gradient(620px 420px at 12% 8%, var(--glow-b), transparent 70%),
    radial-gradient(560px 460px at 92% 96%, var(--glow-a), transparent 70%),
    linear-gradient(150deg,var(--hero-a) 0%,var(--hero-b) 52%,var(--hero-c) 100%)}
.sp-art::before{content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 0%,transparent 72%);mask-image:radial-gradient(ellipse at 30% 40%,#000 0%,transparent 72%)}
.sp-art>*{position:relative}
.sp-logo{display:flex;align-items:center;gap:12px}
.sp-logo .mark{width:42px;height:42px;border-radius:13px;background:var(--brand-grad);display:grid;place-items:center;box-shadow:0 10px 28px -6px rgba(110,100,255,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.sp-logo .mark svg{width:23px;height:23px;color:#fff}

.sp-art h1{font-size:clamp(30px,3.6vw,50px);line-height:1.04;letter-spacing:-.035em;font-weight:750;max-width:15em;margin:0}
.sp-art h1 span{background:linear-gradient(90deg,var(--title-a),var(--title-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-art p{margin:0;color:rgba(226,230,255,.78);font-size:15.5px;line-height:1.6;max-width:34em}
.sp-feats{display:flex;flex-wrap:wrap;gap:8px;max-width:38em}
.sp-feats span{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:580;color:#e7eaff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sp-feats svg{width:14px;height:14px;opacity:.85}
.sp-form{display:grid;place-items:center;padding:32px}
.splash .box{width:100%;max-width:460px}
.splash .box .card{box-shadow:var(--shadow-lg);border-radius:20px}
.splash .box .bd{padding:28px}
.sp-title{font-size:22px;font-weight:720;letter-spacing:-.03em;margin:0 0 3px}
.loadbar{height:4px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.loadbar i{display:block;height:100%;background:var(--brand-grad);width:0;transition:width .3s;border-radius:99px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.stale{opacity:.45;transition:opacity .2s}
@media (max-width:900px){
  .splash{grid-template-columns:1fr}
  .sp-art{padding:30px 22px 34px;gap:18px}
  .sp-art h1{font-size:30px}
  .sp-art p{font-size:14px}
  .sp-feats{display:none}
  .sp-form{padding:18px 14px 30px;margin-top:-22px;position:relative}
}

.tradebox{border:1.5px dashed var(--border-strong);border-radius:var(--r);min-height:84px;padding:9px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.asset{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9px;background:var(--surface-1);border:1px solid var(--border);font-size:12.5px;cursor:pointer;min-width:0;transition:border-color .12s,background .12s,box-shadow .12s}
.asset>*{min-width:0}

.asset .v,.asset .pill{flex:none}
.asset:hover{border-color:var(--brand);box-shadow:var(--shadow-xs)}
.asset .x{margin-left:auto;color:var(--text-muted);font-weight:700;padding:0 3px}
.asset .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:12px;font-weight:600}

.asset.pickable:hover{background:var(--surface-3)}
.picker{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-sm);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}

.board{display:grid;gap:4px;min-width:760px}
.cell{border-radius:8px;padding:6px 7px;font-size:11px;border:1px solid var(--border);background:var(--surface-1);min-height:48px;overflow:hidden}

:root[data-ui="simple"] .board{min-width:1040px}
.cell .mt{color:var(--text-muted);font-size:10px;display:flex;gap:4px;align-items:center}

/* the page title: where you are, in words, on every page but the two that carry their own */

.pagehead .pic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;background:var(--brand-grad);
  box-shadow:0 10px 22px -10px color-mix(in srgb, var(--brand) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.28)}
.pagehead .pic svg{width:22px;height:22px}
.pagehead h2{font-size:24px;font-weight:740;letter-spacing:-.03em;line-height:1.15}

.content>.pagehead{margin-bottom:18px}
@media (max-width:900px){ .pagehead{gap:11px} .pagehead .pic{width:38px;height:38px;border-radius:12px} .pagehead .pic svg{width:20px;height:20px} .pagehead h2{font-size:20px} .pagehead p{font-size:12.5px} .content>.pagehead{margin-bottom:14px} }

/* ---- trade finder: reasons and market angle ---- */
.sigtag{flex:none;padding:0 6px;border-radius:5px;font-size:10px;font-weight:720;letter-spacing:.02em;line-height:1.6;white-space:nowrap;border:1px solid transparent}
.sigtag.good{background:color-mix(in srgb, var(--good) 14%, transparent);color:var(--good-text);border-color:color-mix(in srgb, var(--good) 35%, transparent)}
.sigtag.warn{background:color-mix(in srgb, var(--warning) 20%, transparent);color:var(--warn-text,#8a5a00);border-color:color-mix(in srgb, var(--warning) 50%, transparent)}
:root[data-theme="dark"] .sigtag.warn{color:#f3c36b}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sigtag.warn{color:#f3c36b} }
.why{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb, var(--brand) 5%, var(--surface-1));border:1px solid color-mix(in srgb, var(--brand) 14%, var(--border))}

.why li{position:relative;padding-left:15px;font-size:12.5px;line-height:1.45;color:var(--text-secondary)}
.why li::before{content:'';position:absolute;left:1px;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.why li.w-buy::before,.why li.w-sell::before{background:var(--good)}
.why li.w-cost::before{background:var(--warning)}
.why li.w-age::before{background:var(--s4)}
.why li.w-them::before{background:var(--s3)}
.sigcols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.sigh{display:grid;gap:1px;margin-bottom:8px}
.sigrows{display:grid;gap:8px}
.sigrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);min-width:0}
.sigrow .btn{flex:none;margin-left:auto}
.sigmain{min-width:0;flex:1}
.sigwhy{margin-top:2px;line-height:1.35}
.pips{display:inline-flex;gap:3px;flex:none}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--axis)}

.tcols{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:10px;align-items:center}

@media (max-width:620px){
  .tcols{grid-template-columns:minmax(0,1fr);gap:8px}
  .tcols .swap{transform:rotate(90deg);justify-self:center;line-height:1}
  .why li{font-size:13px}
}

.ptags{display:inline-flex;gap:4px;flex:none}
.sigtag.buy{background:color-mix(in srgb, var(--good) 14%, transparent);color:var(--good-text);border-color:color-mix(in srgb, var(--good) 35%, transparent)}
.sigtag.sell{background:color-mix(in srgb, var(--s7) 13%, transparent);color:var(--s7);border-color:color-mix(in srgb, var(--s7) 35%, transparent)}

.tllater{color:var(--s1);font-weight:650}

/* a card whose body folds away: one slim bar when closed */
.card.collapsible .chd{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;border:0;background:none;text-align:left;cursor:pointer;border-radius:var(--r);color:inherit;transition:background .15s}

@media (max-width:560px){ .card.collapsible .chd{padding:13px 14px} .chd-hint{display:none} }

/* ---- trade calculator ---- */
.tdesk{display:grid;gap:18px}
.tdesk>*{min-width:0}
.tdesk-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.tpick,.tray,.tbrowse.ta,.tbrowse.tb{--c:var(--s1)}

.tpick{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--surface-1);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:var(--r);box-shadow:var(--shadow)}
.tav{width:48px;height:48px;border-radius:14px;object-fit:cover;background:var(--surface-3);flex:none}
.tpick-main{min-width:0;flex:1;display:grid;gap:2px}
.tpick-name{font-size:17px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tpick-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-muted)}

.deal{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,260px) minmax(0,1fr);gap:16px;align-items:stretch}
.tray{display:flex;flex-direction:column;min-height:270px;background:var(--surface-1);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:var(--r);box-shadow:var(--shadow)}
.tray-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px 9px}
.tray-t{display:flex;align-items:center;gap:9px;font-size:15px;min-width:0}
.tray-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.tray-sum{font-size:24px;font-weight:730;letter-spacing:-.03em;color:var(--c)}
.tray-items{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;padding:4px 14px 14px;flex:1}
.dealitem{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);animation:rise .28s var(--ease) both}
.dealmain{min-width:0;flex:1}
.dealnm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dealmeta{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dealval{font-weight:700;font-size:15px;flex:none}
.dealx{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--text-muted);cursor:pointer;display:grid;place-items:center;flex:none;transition:background .15s,color .15s}
.dealx:hover{background:color-mix(in srgb,var(--critical) 13%,transparent);color:var(--critical)}
.dealx svg{width:16px;height:16px}
.pickface{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,#f0b020 22%,var(--surface-3));color:#a66a00}
:root[data-theme="dark"] .pickface{color:#f3c36b}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pickface{color:#f3c36b} }
.pickface svg{width:22px;height:22px}
.tray-foot{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0}
.tray-empty{flex:1;margin:4px 14px 14px;padding:26px 18px;border:1.5px dashed var(--border-strong);border-radius:var(--r);background:transparent;cursor:pointer;display:grid;place-content:center;justify-items:center;gap:7px;text-align:center;color:inherit;transition:border-color .15s,background .15s}

.tray-empty:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tray-plus{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tray-plus svg{width:21px;height:21px}

.dealmid{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:20px 18px;text-align:center;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}

.bal-empty{display:grid;gap:10px;justify-items:center;color:var(--text-secondary);padding:6px 0}

.btab-dot{width:10px;height:10px;border-radius:50%;flex:none}
.btab.a .btab-dot{background:var(--s1)}
.btab.b .btab-dot{background:var(--s2)}

/* ============ simple mode ============
   The Default view: the same data with more air, larger type, rounder edges,
   and the secondary columns and deep-dive cards left out. Everything here hangs
   off one attribute on the root, so the dense Minimal view is untouched. */
:root[data-ui="simple"]{
  --r:18px; --r-sm:12px;
}
:root[data-ui="simple"] body{font-size:15px}
:root[data-ui="simple"] .grid{gap:20px}
:root[data-ui="simple"] .card .hd{padding:20px 24px 0;gap:6px 12px}
:root[data-ui="simple"] .card .hd h3{font-size:17px;letter-spacing:-.02em}
:root[data-ui="simple"] .card .hd .note{font-size:13px}
:root[data-ui="simple"] .card .bd{padding:18px 24px 24px}
:root[data-ui="simple"] .kpi{padding:18px 20px;gap:3px}
:root[data-ui="simple"] .kpi .val{font-size:30px}
:root[data-ui="simple"] .kpi .lbl{font-size:11px}
:root[data-ui="simple"] .kpi .sub{font-size:13px}
:root[data-ui="simple"] table.tbl{font-size:14px}
:root[data-ui="simple"] table.tbl th{font-size:11px;padding:11px 12px}
:root[data-ui="simple"] table.tbl td{padding:12px}
:root[data-ui="simple"] .tiny{font-size:12.5px}
:root[data-ui="simple"] .navbtn{padding:9px 12px;font-size:14px}
:root[data-ui="simple"] .btn{padding:8px 15px;min-height:38px;font-size:13.5px}
:root[data-ui="simple"] .btn.sm{min-height:30px;padding:5px 11px;font-size:12.5px}
:root[data-ui="simple"] .seg button{padding:7px 15px;font-size:13.5px}
:root[data-ui="simple"] .avatar{width:32px;height:32px;border-radius:10px}
/* ---- settings menu ---- */
.menuwrap{position:relative}
.menupanel{position:absolute;top:calc(100% + 10px);right:0;z-index:60;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:18px;width:312px;display:grid;gap:16px;max-height:calc(100vh - 96px);overflow-y:auto;animation:rise .22s var(--ease) both}
.menupanel .mlbl{font-size:10.5px;font-weight:720;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px}
.menupanel .mnote{font-size:12px;color:var(--text-muted);margin-top:7px;line-height:1.45}
.menupanel .seg{width:100%}
.menupanel .seg button{flex:1;text-align:center}
.menupanel hr{border:0;border-top:1px solid var(--border);margin:0}
.menupanel .btn{width:100%;justify-content:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap;padding:4px 3px}
.swatch{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;flex:none;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28),var(--shadow-xs);transition:transform .15s var(--ease),box-shadow .15s}
.swatch:hover{transform:scale(1.1)}
.swatch.on{box-shadow:0 0 0 2.5px var(--surface-1),0 0 0 4.5px var(--text-primary)}
.swatch.on::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:11px;margin:-6.5px 0 0 -3px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px);filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
@media (max-width:560px){ .menupanel{width:min(320px,calc(100vw - 28px))} }

/* imagery — only ever used in simple mode */
.face{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex:none}
.face.lg{width:46px;height:46px;border-radius:13px}
.face.sm{width:24px;height:24px;border-radius:50%}
.face.xs{width:18px;height:18px;border-radius:50%}
.pnrow{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:nowrap}
/* a name with its headshot, wherever a name appears on its own */
.pnf{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.pnf.mir{flex-direction:row-reverse}
/* ---- head-to-head slot ladder: a mirror down the middle ---- */
.ladderrow{display:grid;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--grid)}
.ladderrow:last-child{border-bottom:0}
.ladderrow.ladderhd{padding-bottom:7px;border-bottom:1px solid var(--border)}
.ladderrow .pl{display:flex;align-items:center;gap:7px;min-width:0}
.ladderrow .pl.l{justify-content:flex-end;text-align:right;flex-direction:row}
.ladderrow .pl .plink{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ladderstack{border-bottom:1px solid var(--grid);padding:8px 0}
/* a counted score with where the game is underneath it */
.lcell{display:inline-grid;gap:1px;line-height:1.15}
.lstat{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--text-muted);font-weight:600}
.lstat .up{color:var(--good-text)}
.lstat .down{color:var(--bad-text)}

/* ---- home ---- */
.banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;padding:28px 30px;color:#fff;
  border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow-lg);
  background:
    radial-gradient(520px 280px at 100% 0%, var(--glow-a), transparent 70%),
    radial-gradient(460px 280px at 0% 110%, var(--glow-b), transparent 70%),
    linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%)}
.banner::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:40px 40px;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 100%);mask-image:linear-gradient(100deg,transparent 30%,#000 100%)}
.banner > *{position:relative;z-index:1}
.banner h1{font-size:32px;font-weight:750;letter-spacing:-.035em;line-height:1.08;overflow:hidden;text-overflow:ellipsis;color:#fff}
.banner .sec{color:rgba(224,228,255,.78)}
.banner .tag{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#eef0ff}
.banner .live{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26);color:#fff}
.heroav{width:68px;height:68px;border-radius:20px;object-fit:cover;flex:none;background:var(--brand-grad);
  box-shadow:0 0 0 3px rgba(255,255,255,.18),0 12px 28px -8px rgba(0,0,0,.5)}
/* the league's own badges, running off the right edge and fading out before
   they reach the name; decoration only, so it never carries a number */
.heroband{position:absolute;z-index:0;top:0;right:0;bottom:0;width:min(62%,560px);
  display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-right:24px;pointer-events:none;
  opacity:.5;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 62%,#000 100%);
  mask-image:linear-gradient(to right,transparent 0%,#000 62%,#000 100%)}
.heroband img{width:54px;height:54px;border-radius:16px;object-fit:cover;flex:none;box-shadow:0 8px 18px -6px rgba(0,0,0,.5)}
@media (max-width:820px){ .heroband{display:none} }

/* ---- the headliners: your best players, lined up ----
   Decoration, so it is Default-mode only. The faces lift on hover one at a
   time, which is the whole trick: a row of portraits that reacts. */
.lineup{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:4px 0 2px}
.lup{display:grid;gap:6px;justify-items:center;width:104px;cursor:pointer;padding:6px 4px;border-radius:var(--r-sm);
  border:1px solid transparent;transition:transform .16s ease,background .16s,border-color .16s}
.lup:hover{transform:translateY(-4px);background:var(--surface-2);border-color:var(--border)}
.lup:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.lupface{position:relative;line-height:0}
.lupface .face.lg{width:66px;height:66px;border-radius:50%;border:3px solid var(--surface-1);
  box-shadow:0 2px 12px rgba(11,11,11,.16);background:linear-gradient(160deg,var(--surface-3),var(--surface-2))}
.lup:hover .lupface .face.lg{border-color:var(--s1)}
.luppos{position:absolute;right:-2px;bottom:0;padding:1px 6px;border-radius:99px;font-size:9.5px;font-weight:700;
  letter-spacing:.02em;border:2px solid var(--surface-1);line-height:1.35}
.lupnm{font-weight:620;font-size:11.5px;line-height:1.2;text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){
  .lineup{gap:8px}
  .lup{width:78px}
  .lupface .face.lg{width:54px;height:54px}
  .lupnm{font-size:11px}
}

/* ---- start/sit comparison cards ---- */
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(248px,100%),1fr))}
.ccard{position:relative;border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;background:var(--surface-1);
  display:grid;gap:10px;min-width:0;align-content:start}
.ccard.lead{border-color:var(--s1);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--s1) 35%, transparent)}
.ccard .cx{position:absolute;top:8px;right:8px;padding:2px 8px;line-height:1.3;opacity:.55}
.ccard .cx:hover{opacity:1}
.chead{display:flex;align-items:center;gap:11px;min-width:0;padding-right:26px}
.chead .face.lg{width:52px;height:52px;border-radius:50%;background:var(--surface-3)}
.cnm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.leadtag{border-color:var(--s1);color:var(--s1);font-weight:660}
/* floor → ceiling, every card on one scale */
.crange{position:relative;height:10px;background:var(--surface-3);border-radius:5px}
.crange i{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--seq-200)}
.crange u{position:absolute;top:-3px;bottom:-3px;width:2.5px;border-radius:2px;background:var(--s1);text-decoration:none}
.cstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--grid);padding-top:9px}
.cstat{text-align:center;min-width:0;cursor:default}
.cstat b{display:block;font-size:13.5px;font-variant-numeric:tabular-nums;line-height:1.2}
.cstat span{display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* one bar per pairing */
.cpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,1.5fr) minmax(0,1fr);gap:10px;align-items:center}
.cpn{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cbar{position:relative;height:18px;border-radius:5px;background:var(--seq-150);overflow:hidden}
.cbar i{position:absolute;inset:0 auto 0 0;background:var(--s1);display:block}
.cpct{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:10.5px;font-weight:700;
  font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cpct.l{left:7px}
.cpct.r{right:7px;color:var(--text-secondary);text-shadow:none}
@media (max-width:620px){
  .cstats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:9px}
  .cpair{grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);gap:7px}
  .cpn{font-size:11.5px}
}

/* ---- players page ---- */
tr.pickline td{background:color-mix(in srgb, #eda100 7%, transparent)}
tr.pickline td:first-child{box-shadow:inset 3px 0 0 #eda100}
tr.mineline td{background:color-mix(in srgb, var(--brand) 7%, transparent)}
.mine-own{color:var(--brand);font-weight:700}
.tag.fa{border-color:var(--good);color:var(--good-text);font-weight:660}
.wirebest{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid color-mix(in srgb, var(--good) 40%, var(--border));background:color-mix(in srgb, var(--good) 6%, transparent)}

/* ---- a real score against its projection ---- */
.score.up{color:var(--good-text)}
.score.down{color:var(--bad-text)}

/* ---- what the sandbox changed on a roster ---- */
.hypline{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--border);min-width:0}
.hypline.in{background:color-mix(in srgb, var(--good) 7%, transparent);border-color:color-mix(in srgb, var(--good) 35%, var(--border))}
.hypline.out{background:color-mix(in srgb, var(--critical) 6%, transparent);border-color:color-mix(in srgb, var(--critical) 30%, var(--border))}
.hypline.out .hypnm{text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--critical) 60%, transparent);opacity:.8}
.hypdir{font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:5px;flex:none}
.hypline.in .hypdir{background:var(--good);color:#fff}
.hypline.out .hypdir{background:var(--critical);color:#fff}
.hypnm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard.hypin{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}

/* ---- your matchup, badge either side of the score ---- */
.mvside{display:flex;align-items:center;gap:10px;min-width:0}
.mvside.r{flex-direction:row-reverse;text-align:right}
.mvav{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--surface-3);flex:none}

/* ---- the podium: the top of the table, on blocks ---- */
.podwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(190px,1fr);gap:18px;align-items:end}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{display:grid;gap:8px;justify-items:center;cursor:pointer;border-radius:var(--r-sm);padding:6px 4px 0;
  border:1px solid transparent;transition:background .12s,border-color .12s,transform .12s}
.pod:hover{background:var(--surface-2);border-color:var(--border);transform:translateY(-2px)}
.pod:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.pod .podtop{display:grid;gap:5px;justify-items:center;text-align:center;min-width:0;width:100%}
.pod .podav{width:46px;height:46px;border-radius:13px;object-fit:cover;background:var(--surface-3);
  box-shadow:0 2px 10px rgba(11,11,11,.14)}
.pod.p1 .podav{width:58px;height:58px;border-radius:16px}
.pod .nm{font-weight:660;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .pododds{font-size:11.5px;color:var(--text-secondary)}
.pod .pododds b{color:var(--s1)}
.pod.mine .podtop .nm{color:var(--brand)}
.pod .form{justify-content:center}
.pod.p1 .nm{font-size:14.5px}
.pod .block{width:100%;border-radius:8px 8px 0 0;display:grid;place-items:end center;padding-bottom:7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.pod.p1 .block{height:74px}
.pod.p2 .block{height:54px}
.pod.p3 .block{height:40px}
.pod .place{font-size:20px;font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.28);line-height:1}
.pod.p2 .place,.pod.p3 .place{font-size:17px}
.block.gold{background:linear-gradient(180deg,#e8c35a,#c99a1e)}
.block.silver{background:linear-gradient(180deg,#d3d9e0,#a4adb8)}
.block.bronze{background:linear-gradient(180deg,#d8a273,#b0743f)}
:root[data-theme="dark"] .block.silver{background:linear-gradient(180deg,#aab2bd,#79818c)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .block.silver{background:linear-gradient(180deg,#aab2bd,#79818c)} }
.hunt{display:grid;gap:5px;align-content:end;padding-bottom:4px}
.hunt .lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.huntrow{display:grid;grid-template-columns:20px 26px minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer;
  padding:6px 7px;border-radius:var(--r-sm);border:1px dashed var(--border)}
.huntrow:hover{background:var(--surface-2);border-style:solid}
.huntrow:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.huntrow .rk{font-size:11.5px;font-weight:700;color:var(--text-muted);text-align:center;font-variant-numeric:tabular-nums}
.huntrow .avatar{width:26px;height:26px;border-radius:8px}
.huntrow .nm{font-weight:600;font-size:12.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:780px){
  .podwrap{grid-template-columns:minmax(0,1fr);gap:14px}
  .hunt{align-content:start}
}
@media (max-width:420px){
  .pod .podav{width:38px;height:38px;border-radius:11px}
  .pod.p1 .podav{width:46px;height:46px}
  .pod .nm{font-size:11.5px}
  .pod.p1 .nm{font-size:12.5px}
}

/* ---- the league, one row per team ---- */
/* capped so the columns stay together: a name column free to take a whole wide
   card leaves a lake of white between the team and its record */
.lgstrip{display:grid;max-width:880px}
.lgrow.lghd{cursor:default;padding:0 8px 6px;border-bottom:1px solid var(--border);border-radius:0}
.lgrow.lghd:hover{background:none;border-color:transparent;border-bottom-color:var(--border)}
.lgrow.lghd .who{padding-left:44px}
.lgrow{display:grid;grid-template-columns:30px minmax(0,1fr) 58px 58px 78px 58px;gap:14px;align-items:center;
  padding:9px 8px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent}
.lgrow:hover{background:var(--surface-2);border-color:var(--border)}
.lgrow:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.lgrow.mine{background:color-mix(in srgb, var(--brand) 8%, transparent)}
.lgrow.mine:hover{background:color-mix(in srgb, var(--brand) 13%, transparent)}
.lgrow .rk{font-size:13px;font-weight:700;color:var(--text-muted);text-align:center;font-variant-numeric:tabular-nums}
.lgrow .who{display:flex;align-items:center;gap:10px;min-width:0}
.lgrow .who .avatar{width:34px;height:34px;border-radius:10px}
.lgrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.lgrow .num{text-align:right;font-size:12.5px;color:var(--text-secondary)}
.lgrow .odds{text-align:right;font-size:13px;color:var(--text-secondary)}
.lgrow .odds.up{color:var(--good-text)}
.lgrow .odds.down{color:var(--text-muted)}
/* a pick that has changed hands */
.tag.traded{border-color:var(--s4);color:var(--s4);font-weight:660}
/* the last five results, oldest first — a league table's form guide */
.form{display:flex;gap:3px;align-items:center}
.form i{width:12px;height:12px;border-radius:3px;display:block;cursor:default;background:var(--surface-3)}
.form i.W{background:var(--good)}
.form i.L{background:var(--s8)}
.form i.T{background:var(--text-muted);opacity:.6}
.huntrow .form i{width:9px;height:9px;border-radius:2px}
@media (max-width:700px){
  .lgrow{grid-template-columns:24px minmax(0,1fr) 52px;gap:9px;padding:8px 4px}
  .lgrow .form{display:none}
  .lgrow .who .avatar{width:30px;height:30px;border-radius:9px}
}
.tilegrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(262px,100%),1fr))}
.tile{display:flex;align-items:flex-start;gap:13px;text-align:left;padding:15px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-1);cursor:pointer;min-width:0;
  box-shadow:var(--shadow-xs);transition:border-color .15s,background .15s,transform .18s var(--ease),box-shadow .18s}
.tile:hover{border-color:color-mix(in srgb, var(--brand) 45%, var(--border));transform:translateY(-2px);box-shadow:var(--shadow)}
.tile:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tile .ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--brand);
  background:var(--brand-soft);transition:background .15s,color .15s}
.tile .ic svg{width:19px;height:19px}
.tile:hover .ic{background:var(--brand-grad);color:#fff}
.tile b{font-size:14px;font-weight:660;display:block;margin-bottom:1px}
@media (max-width:560px){
  .banner{gap:14px;padding:20px 18px}
  .banner h1{font-size:23px}
  .heroav{width:52px;height:52px;border-radius:15px}
  .tilegrid{grid-template-columns:minmax(0,1fr)}
}
td .pnf,.asset .pnf{vertical-align:middle}
.tlogo{width:18px;height:18px;object-fit:contain;flex:none;vertical-align:-4px}
:root[data-ui="simple"] .avatar{width:30px;height:30px;border-radius:9px}
:root[data-ui="simple"] .tm{gap:10px}
:root[data-ui="simple"] .tm .nm{font-weight:600}
.pcard{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-1);min-width:0}
.pcard .meta{min-width:0;flex:1}
.pcard .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sub{font-size:11.5px;color:var(--text-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcard .val{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rankrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(110px,.9fr) auto auto;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--grid)}
.rankstats{display:flex;gap:18px;text-align:right}
.rankstats b{font-size:14px;display:block;line-height:1.15}
.rankrow:last-child{border-bottom:0}
/* ---- this-week matchup card: team, odds, team ---- */
.mvs{display:grid;grid-template-columns:minmax(0,1fr) minmax(86px,1.05fr) minmax(0,1fr);gap:10px;align-items:start}
.mvs .tmside{display:grid;gap:5px;min-width:0;justify-items:center;text-align:center}
.mvs .tmside .nm{font-weight:640;font-size:13.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mvs .tmside .sc{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em}
.mvs .tmside .dt{font-size:11px;color:var(--text-muted);line-height:1.3}
.mvs .tmside .dt.cnt{font-size:10px;white-space:nowrap;letter-spacing:-.01em}

  if (rec && Date.now() - rec.t < FRESH && rec.d && rec.d.n) return { d: rec.d, at: rec.t, state: 'ok' };
  try {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctl && ctl.abort(), 8000);
    let j;
    try {
      const r = await fetch(ESPN_INJ, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      j = await r.json();
    } finally { clearTimeout(timer); }
    const d = parseEspnInjuries(j);
    if (!d.n) throw new Error('empty feed');
    try { await idbSet(key, { t: Date.now(), d }); } catch (e) { }
    return { d, at: Date.now(), state: 'ok' };
  } catch (e) {
    if (rec && rec.d) return { d: rec.d, at: rec.t, state: 'stale', error: String(e.message || e) };
    return { d: null, at: null, state: 'down', error: String(e.message || e) };
  }
}

/** Typical games missed for a body part and designation, plus whether it ends the season. */
function modelWeeks(tag, body, note) {
  const b = String(body || '').toLowerCase().trim();
  let w = BODY_WEEKS[b];
  if (w === undefined) { const k = Object.keys(BODY_WEEKS).find(k => b.includes(k)); w = k ? BODY_WEEKS[k] : 3; }
  const n = String(note || '');
  if (/fracture|broken|surgery|operation|torn|rupture/i.test(n) && w < 6) w = Math.max(w, 6);
  if (tag === 'IR') w = Math.max(w, 4);          // the league minimum for an IR stay
  if (tag === 'PUP') w = Math.max(w, 5);
  return w;
}

/** Build one player's injury profile, or null when there is nothing to estimate. */
function injuryProfile(p, espn) {
  const tag = p.injury;
  if (!tag || tag === 'NA') return null;
  const m = S.players[p.id] || {};
  const cw = injCurrentWeek();
  const body = (m.ib || (espn && espn.body) || '') || null;
  const note = [m.in, espn && espn.long, espn && espn.short].filter(Boolean).join(' ');
  const base = { tag, body, note: m.in || (espn && (espn.short || espn.long)) || null, cw };
  if (tag === 'Questionable') return Object.assign(base, { kind: 'day', pNow: 0.85, pNext: 1, src: 'tag', label: null, text: 'Questionable — listed week to week' });
  if (tag === 'Doubtful') return Object.assign(base, { kind: 'day', pNow: 0.2, pNext: 0.85, src: 'tag', label: null, text: 'Doubtful — unlikely to play this week' });
  if (tag === 'COV') return Object.assign(base, { kind: 'long', R: cw + 1, s: 0.7, src: 'model', text: 'Health and safety protocols — typically a week' });

  const startMs = m.is ? Date.parse(m.is + 'T12:00:00') : (espn && espn.date ? Date.parse(espn.date) : NaN);
  const elapsedWk = isFinite(startMs) ? Math.max(0, (Date.now() - startMs) / WEEK_MS) : null;
  let R = null, s = 1.3, src = 'model', retDate = null, season = false, why = '';

  // 1. ESPN's own return date
  if (espn && espn.ret) {
    const w = weekOfDate(espn.ret);
    if (w !== null) {
      retDate = String(espn.ret).slice(0, 10);
      R = w; s = 0.8; src = 'espn';
      if (R <= cw) { R = cw + 1; s = 1.3; why = 'ESPN’s return date has already passed'; }
    }
  }
  // 2. the wording of the notes
  if (R === null) {
    // words from ESPN count from the day ESPN wrote them; Sleeper's from the day he was hurt
    const eh = espn && injuryHints([espn.long, espn.short].filter(Boolean).join(' '));
    const hint = eh || injuryHints(m.in);
    const hintElapsed = eh && espn.date && isFinite(Date.parse(espn.date)) ? Math.max(0, (Date.now() - Date.parse(espn.date)) / WEEK_MS) : elapsedWk;
    if (hint) {
      if (hint.season) { R = 99; season = true; src = 'note'; s = 0.5; }
      else if (hint.week) { R = Math.max(hint.week, cw + 1); s = 0.9; src = 'note'; }
      else if (hint.weeks) {
        const left = Math.max(1, hint.weeks - (hintElapsed || 0));
        R = cw + Math.max(1, Math.round(left)); s = 1 + Math.min(1, left * 0.1); src = 'note';
      }
    }
  }
  // 3. typical recovery for what hurt
  if (R === null) {
    if (tag === 'Sus') {
      const g = /(\d+)[- ]game/i.exec(note);
      R = cw + (g ? +g[1] : 2); s = g ? 0.6 : 1.5; src = g ? 'note' : 'model';
    } else if (tag === 'DNR') { R = cw + 1; s = 1; }
    else {
      const total = modelWeeks(tag, body, note);
      if (total >= 30) { R = 99; season = true; s = 0.5; }
      else {
        let left = total - (elapsedWk !== null ? elapsedWk : (tag === 'IR' || tag === 'PUP' ? 1 : 0.5));
        let spread = 1.1 + Math.min(1.4, 0.18 * Math.max(0, left));
        if (left < 1) { left = 1; spread = 1.5; why = 'past the usual recovery time'; }
        R = cw + Math.max(1, Math.round(left)); s = spread;
      }
    }
  }
  if (!season && R > 40) { season = true; }
  const seasonEnd = season || R > S.regEnd + 4;
  const wkLabel = seasonEnd ? 'Season' : 'Wk ' + R;
  const srcText = src === 'espn' ? 'ESPN’s estimated return' : src === 'note' ? 'From the injury report wording' : 'Typical for ' + (body ? 'a ' + String(body).toLowerCase() + ' injury' : 'this designation');
  return Object.assign(base, {
    kind: 'long', R: seasonEnd ? 99 : R, s, src, season: seasonEnd, retDate, label: wkLabel,
    short: seasonEnd ? 'S' : String(R), text: srcText + (why ? ' (' + why + ')' : '')
  });
}

/** Chance he plays in week `wk`, given what we know. 1 for a healthy player. */
function availability(p, wk) {
  const j = p && p.inj;
  if (!j || !INJ.enabled()) return 1;
  const cw = j.cw;
  if (wk < cw) return 1;
  if (j.kind === 'day') return wk === cw ? j.pNow : wk === cw + 1 ? j.pNext : 1;
  if (j.season) return 0;
  let a = phi((wk - j.R + 0.5) / j.s);

}

}
/** Expected games he misses between now and the end of the regular season. */

/** Fold one player's injury profile into his projection. `ctx` carries the feed, the

function availOne(p, ctx) {
  ctx = ctx || availCtx();

  if (!ctx.on || !p.inj || ctx.cw > S.regEnd + 4) { p.ppg = p.ppgLegacy; p.flat = undefined; p.injFactor = 1; return e; }

    if (lines.length) p.ppg = mean(lines);
    else { const all = []; for (let k = 1; k <= 18; k++) if (p.wk[k]) all.push(p.wk[k].p); p.ppg = mean(all) * availRest(p); }

    p.ppg = p.flat * availRest(p);

/** Run every flagged player through availOne. Safe to repeat: baselines are stored. */

    const p = S.index[id];
    if (!p || p.pos === 'PICK') continue;
    if (p.injury && p.injury !== 'NA') flagged++;
    const e = availOne(p, ctx);

    listed: ctx.feed ? ctx.feed.n : 0, flagged, matched

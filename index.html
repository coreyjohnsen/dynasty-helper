/* ================= draft pick pricing =================
   A pick's worth is set by where it lands, and where it lands is set by how the
   team that owns the slot finishes. FantasyCalc publishes Early/Mid/Late only for
   the next rookie draft and a single blended value for the years after it, so the
   tier *shape* is lifted from the year that has it and damped for later years,
   where nobody can really call the order. */
function buildPickCurves() {
  const V = S.pickVals || {};
  const seasons = new Set(), rounds = new Set();
  Object.keys(V).forEach(k => {
    const p = k.split('|');
    if (/^slot/.test(p[2])) return;
    seasons.add(+p[0]); rounds.add(+p[1]);
  });
  // per round, the nearest season that publishes a full Early/Mid/Late set
  const ref = {};
  const seasonList = Array.from(seasons).sort((a, b) => a - b);
  Array.from(rounds).forEach(r => {
    const y = seasonList.find(y => V[`${y}|${r}|Early`] !== undefined && V[`${y}|${r}|Mid`] !== undefined && V[`${y}|${r}|Late`] !== undefined);
    if (y === undefined) return;
    const M = V[`${y}|${r}|Mid`], P = V[`${y}|${r}|Any`];
    ref[r] = { season: y, rE: V[`${y}|${r}|Early`] / M, rL: V[`${y}|${r}|Late`] / M, mOverPlain: P ? M / P : 1 };
  });
  const curves = {};
  seasonList.forEach(y => rounds.forEach(r => {
    const key = y + '|' + r;
    const E = V[`${y}|${r}|Early`], M = V[`${y}|${r}|Mid`], L = V[`${y}|${r}|Late`];
    if (E !== undefined && M !== undefined && L !== undefined) { curves[key] = { E, M, L, published: true }; return; }
    const P = V[`${y}|${r}|Any`], R = ref[r];
    if (P === undefined) return;
    if (!R) { curves[key] = { E: P, M: P, L: P, published: false, flat: true }; return; }
    const gap = Math.max(0, y - R.season);
    const shrink = clamp(1 - 0.3 * gap, 0.35, 1);
    const Mest = P * R.mOverPlain;
    curves[key] = {
      E: Mest * (1 + (R.rE - 1) * shrink),
      M: Mest,
      L: Mest * (1 - (1 - R.rL) * shrink),
      published: false
    };
  }));
  S.pickCurves = curves;
  return curves;
}
/** Draft slot a team picks at, given its projected finish (1 = best record).
 *  Accepts a fractional rank, since expected finish is continuous. */
function slotForRank(projRank, nTeams) {
  const N = Math.max(2, nTeams || S.cfg.actualTeams || 12);
  return clamp(N - projRank + 1, 1, N);
}
function normCdf(x) {
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989422804014327 * Math.exp(-x * x / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return x >= 0 ? 1 - p : p;
}
/* How strongly roster strength predicts final standing. Nowhere near 1: fantasy
   seasons are noisy, and they get noisier the further out you look. Keeping this
   below 1 is what stops one signing from swinging a pick from 1.09 to 1.02. */
function finishRho(yearsOut) { return clamp(0.62 - 0.13 * Math.max(0, yearsOut - 1), 0.28, 0.62); }
/** Expected finishing position (1 = best) for a team at strength z-score `z`. */
function expectedFinish(z, nTeams, rho) {
  return 1 + normCdf(-rho * z) * (Math.max(2, nTeams) - 1);
}
function tierWordForSlot(slot, nTeams) {
  const N = Math.max(2, nTeams || S.cfg.actualTeams || 12);
  const q = (slot - 0.5) / N;
  return q <= 1 / 3 ? 'Early' : q <= 2 / 3 ? 'Mid' : 'Late';
}
/** Continuous value for a pick landing at `slot` of `nTeams`. */
function pickValueAtSlot(season, round, slot, nTeams) {
  const c = (S.pickCurves || {})[season + '|' + round];
  if (!c) return pickValue(season, round, tierWordForSlot(slot, nTeams));
  const N = Math.max(2, nTeams || S.cfg.actualTeams || 12);
  const q = clamp((slot - 0.5) / N, 0, 1);
  const qE = 1 / 6, qM = 0.5, qL = 5 / 6;
  let v;
  if (q <= qE) {
    // the very top of a draft is worth more than the Early average; bounded so it cannot run away
    const t = (qE - q) / qE;
    v = Math.min(c.E + (c.E - c.M) * t * 0.9, c.E * 1.35);
  } else if (q <= qM) {
    v = c.E + (c.M - c.E) * (q - qE) / (qM - qE);
  } else if (q <= qL) {
    v = c.M + (c.L - c.M) * (q - qM) / (qL - qM);
  } else {
    const t = (q - qL) / (1 - qL);
    v = Math.max(c.L + (c.L - c.M) * t * 0.9, c.L * 0.72);
  }

function futureWeightFor(season) {

}

 *  shrunk toward mid-table because strength only partly predicts where you land. */
function finishRanksFor(season, nowArr, futArr) {
  const w = futureWeightFor(season);
  const yearsOut = Math.max(0, (season || 0) - (S.season || new Date().getFullYear()));
  const rho = finishRho(yearsOut);

function pickPricer(overrides) {
  const teams = S.teams;
  const idx = {}; teams.forEach((t, i) => idx[t.rosterId] = i);
  const nowArr = teams.map(t => (overrides && overrides[t.rosterId]) ? overrides[t.rosterId].now : t.now);
  const futArr = teams.map(t => (overrides && overrides[t.rosterId]) ? overrides[t.rosterId].futureRoster : t.futureRoster);

  const N = S.cfg.actualTeams || teams.length;

    const y = pk.season;
    if (!cache[y]) cache[y] = finishRanksFor(y, nowArr, futArr);
    const i = idx[pk.origRosterId];
    const rank = i === undefined ? (teams.length + 1) / 2 : cache[y][i];
    const slot = slotForRank(rank, N);
    return {
      value: pickValueAtSlot(y, pk.round, slot, N),
      slot: Math.round(slot), slotExact: slot, rank: rank,
      tier: tierWordForSlot(slot, N)

async function loadLeague(leagueId, onStep) {
  const step = onStep || (() => { });

  const league = await sl('/league/' + leagueId);

  S.league = league; S.leagueId = leagueId;

  step('Loading NFL week…', 0.1);
  S.state = await sl('/state/nfl');
  const season = +(league.season || S.state.season);
  S.season = season;
  const isCurrent = String(season) === String(S.state.season);
  S.week = isCurrent ? (S.state.week || 1) : 18;

  const espnLoad = loadEspnInjuries().catch(e => ({ d: null, at: null, state: 'down', error: String(e && e.message || e) }));

  step('Loading ' + valueWord() + ' trade values…', 0.52);
  S.values = await loadValues(S.cfg);
  S.index = buildIndex(); S._sig = null; S._tl = null;
  if (isDynasty()) buildPickCurves();

  step('Loading weekly matchups…', 0.66);
  const weeks = [];
  for (let w = 1; w <= S.regEnd + 4; w++) weeks.push(w);

  for (let w = 1; w <= S.regEnd; w++) {

  }

    break;

  step('Loading drafts…', 0.82);

/* line chart with crosshair — series: [{name,color,points:[{x,y,label}]}] */

  const m = Object.assign(narrow ? { t: 10, r: 9, b: 24, l: 36 } : { t: 12, r: 14, b: 26, l: 46 }, opts.margin || {});

      const px = X(t.x);
      // two labels on top of each other are worse than one label

      lastPx = px;
      if (t.rule !== false) g.appendChild(svg('line', { class: 'gl', x1: px, x2: px, y1: m.t, y2: m.t + ih, 'stroke-dasharray': '2 4' }));

        class: 'ax', x: px, y: H - 8,
        'text-anchor': i === 0 ? 'start' : (i === opts.xTickValues.length - 1 && px > W - m.r - 30) ? 'end' : 'middle'

}

/* vertical histogram */
function histogram(bins, opts) {
  opts = opts || {};
  const W = opts.w || chartW(400, 340), H = opts.h || 150, m = { t: 8, r: 8, b: 24, l: 8 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;

  const bw = iw / bins.length;
  const g = svg('svg', Object.assign({ class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.aria || 'distribution' },
    opts.stretch ? { preserveAspectRatio: 'none' } : {}));
  g.style.height = H + 'px';
  // `stretch` lets the bars fill a narrower container, which is what it is for.
  // Letting them fill a *wider* one pulls the axis labels and the bar corners
  // out of shape, so the drawing stops at the width it was designed at.
  if (opts.stretch) {
    g.style.maxWidth = (opts.maxW || W) + 'px';
    g.style.display = 'block';
    g.style.marginInline = 'auto';
  }

    const ri = bins.findIndex(b => b.x >= opts.rule);
    if (ri >= 0) {
      const rx = m.l + ri * bw;
      g.appendChild(svg('line', { class: 'axline', x1: rx, x2: rx, y1: m.t, y2: m.t + ih, 'stroke-dasharray': '3 3', 'vector-effect': 'non-scaling-stroke' }));
    }

    const hgt = b.v / max * ih;
    const x = m.l + i * bw, y = m.t + ih - hgt;
    const r = svg('rect', { x: x + 1, y, width: Math.max(1, bw - 2), height: Math.max(0, hgt), rx: Math.min(4, bw / 2 - 1), fill: b.color || 'var(--s1)' });
    r.style.cursor = 'default';
    const rr = svg('rect', { x, y: m.t, width: bw, height: ih, fill: 'transparent' });
    rr.addEventListener('mousemove', e => ttShow(e, `<div class="k">${b.label}</div><b>${pct(b.v, 1)}</b>`));
    rr.addEventListener('mouseleave', ttHide);

    }

  g.appendChild(svg('line', { class: 'axline', x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));

function sparkline(pts, opts) {
  opts = opts || {};
  const W = opts.w || 90, H = opts.h || 24;
  if (pts.length < 2) return h('span.muted.tiny', '—');
  const ys = pts.map(p => p.v), y0 = Math.min(...ys), y1 = Math.max(...ys);

/* ================= week-by-week bars (actual vs projected) ================= */
function weeklyBars(items, opts) {

  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = items.filter(i => i.v !== null && i.v !== undefined).map(i => i.v);
  const max = Math.max(...vals, 1) * 1.08;

  g.style.height = H + 'px';

/* ---------- a position group, drawn as its shape ----------
   One bar per player in the group, tallest first, with the starters filled and
   the bench hollow and a cut between them. Two rules run across it: what the

   one glance that says whether a group is two stars and a cliff, four of the

  const iw = W - m.l - m.r, ih = H - m.t - m.b;

  const bw = iw / show;

  g.style.height = H + 'px'; g.style.maxWidth = W + 'px'; g.style.display = 'block';
  const Y = v => m.t + ih - clamp(v / max, 0, 1) * ih;
  const rule = (v, cls, dash, op) => g.appendChild(svg('line', { class: cls, x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), 'stroke-dasharray': dash, opacity: op }));
  rule(e.base, 'gl', '2 3', .9);                 // the wire
  rule(e.lgStart, 'axline', '4 3', .85);         // the league's starters here

      fill: starter ? (opts.colour || 'var(--s1)') : 'var(--surface-3)',
      stroke: starter ? 'none' : 'var(--border)', 'shape-rendering': 'crispEdges'
    }));
    const lb = svg('text', { class: 'ax', x: x + bw / 2, y: H - 4, 'text-anchor': 'middle', 'font-size': '8.5' });
    lb.textContent = p ? fmt(v, 1) : '—';
    g.appendChild(lb);
    const hit = svg('rect', { x: x, y: m.t, width: bw, height: ih, fill: 'transparent' });
    bindTT(hit, p
      ? `<div class="k">${starter ? 'Starter' : 'Bench'} ${i + 1}</div><b>${p.name}</b><br>${fmt(v, 1)} pts/wk`
      : `<div class="k">Slot ${i + 1}</div>Nobody — the wire is worth ${fmt(e.base, 1)}`);

    points: t.weekly.map((v, w) => v === null || v <= 0 ? null : ({ x: w + 1, y: v, label: 'Week ' + (w + 1) })).filter(Boolean)
  })).filter(s => s.points.length);
  const rows = teams.map(t => ({ t, ...t }));
  const tbl = table([
    { k: 'name', h: 'Team', sort: r => r.t.name, f: r => r.t.name },

  ], rows, { sortKey: 'avg', sortDir: -1 });
  const wt = withTable(h('div', lineChart(series, { h: 240, yFmt: v => fmt(v, 0), xFmt: v => 'Wk ' + fmt(v, 0), xTicks: Math.min(S.lastWeek - 1, 8), aria: 'weekly scores' }),
    h('div.legend', { style: { marginTop: '8px' } }, shown.map((t, i) => h('span', h('i', { style: { background: colors[i] } }), t.name)))), tbl);

}
function contendMatrix() {
  const teams = S.teams;
  const W = 560, H = 330, m = { t: 14, r: 16, b: 34, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = teams.map(t => t.powerZ), ys = teams.map(t => t.futureZ);
  const xr = Math.max(1.6, Math.max(...xs.map(Math.abs)) * 1.15), yr = Math.max(1.6, Math.max(...ys.map(Math.abs)) * 1.15);
  const X = v => m.l + (v + xr) / (2 * xr) * iw, Y = v => m.t + ih - (v + yr) / (2 * yr) * ih;
  const g = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'contend versus build scatter' });
  g.style.height = H + 'px';
  g.appendChild(svg('rect', { x: X(0), y: m.t, width: iw / 2, height: ih / 2, fill: 'var(--s1)', opacity: .05 }));
  g.appendChild(svg('line', { class: 'gl', x1: X(0), x2: X(0), y1: m.t, y2: m.t + ih }));
  g.appendChild(svg('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0) }));
  [['Contend now', X(0) + 8, m.t + 14, 'start'], ['Rebuild', m.l + 8, m.t + ih - 8, 'start'], ['Win-now, thin future', X(0) + 8, m.t + ih - 8, 'start'], ['Young, not ready', m.l + 8, m.t + 14, 'start']]
    .forEach(([tx, x, y, a]) => { const t = svg('text', { class: 'ax', x, y, 'text-anchor': a, opacity: .8 }); t.textContent = tx; g.appendChild(t); });
  teams.forEach(t => {
    const c = svg('circle', { cx: X(t.powerZ), cy: Y(t.futureZ), r: 6.5, fill: 'var(--s1)', stroke: 'var(--surface-1)', 'stroke-width': 2 });
    const hit = svg('circle', { cx: X(t.powerZ), cy: Y(t.futureZ), r: 14, fill: 'transparent' });
    hit.addEventListener('mousemove', e => ttShow(e, `<div class="k">${t.name}</div>Now <b>${fmt(t.power, 1)}</b> (#${t.powerRank})<br>Future <b>${fmt(t.futurePower, 1)}</b> (#${t.futureRank})<br>Window <b>${t.window}</b>`));
    hit.addEventListener('mouseleave', ttHide);
    const lb = svg('text', { class: 'ax', x: X(t.powerZ), y: Y(t.futureZ) - 10, 'text-anchor': 'middle', fill: 'var(--text-secondary)', 'font-weight': 600 });
    lb.textContent = t.short;
    g.appendChild(c); g.appendChild(lb); g.appendChild(hit);
  });
  const xl = svg('text', { class: 'ax', x: m.l + iw / 2, y: H - 8, 'text-anchor': 'middle' }); xl.textContent = 'Win now  →';
  const yl = svg('text', { class: 'ax', x: 12, y: m.t + ih / 2, 'text-anchor': 'middle', transform: `rotate(-90 12 ${m.t + ih / 2})` }); yl.textContent = 'Future  →';
  g.appendChild(xl); g.appendChild(yl);
  return g;
}

/** In the what-if, the roster page shows the roster as it would be — and this

function hypRosterChanges(t) {
  if (!HYP.on || !S.base) return null;

  // undo, whether or not the editor is open — repeating them underneath adds
  // nothing. Where this earns its place is on the OTHER side of a deal: open

      h('span.hypnm', p ? pname(p, { face: false }) : label(x)),

      p ? h('span.mono.tiny', { style: { marginLeft: 'auto' } }, kfmt(Math.round(p.dv || 0))) : h('span', { style: { marginLeft: 'auto' } }),
      undo(x));

    h('div', { style: { display: 'grid', gap: '6px' } },

/* ================= trade evaluation engine ================= */
function assetsOf(t) {
  return t.players.map(p => ({ id: p.id, name: p.name, pos: p.pos, dv: p.dv || 0, ref: p, kind: 'player' }))
    .concat(t.pickAssets.map(p => ({ id: p.id, name: p.label, pos: 'PICK', dv: p.value, ref: p, kind: 'pick' })));
}
function afterRoster(t, out, incoming) {
  const rm = new Set(out.filter(a => a.kind === 'player').map(a => a.id));
  const keep = t.players.filter(p => !rm.has(p.id));
  return keep.concat(incoming.filter(a => a.kind === 'player').map(a => a.ref));
}
function afterPicks(t, out, incoming) {
  const rm = new Set(out.filter(a => a.kind === 'pick').map(a => a.id));
  return t.pickAssets.filter(p => !rm.has(p.id)).concat(incoming.filter(a => a.kind === 'pick').map(a => a.ref));
}
/** Full before/after picture for a two-team trade.
 *  Picks are priced twice: once on today's standings, and once on the standings
 *  the trade itself produces. Landing a starter pushes you up the table, which
 *  pushes the pick you sent down the draft order — so the deal is often better
 *  for the seller than the sticker price suggests, and worse for the buyer. */
function tradeEval(A, B, aOut, bOut, simN) {
  // phase 1: rosters and strength, with pick capital deliberately excluded
  const shell = (t, out, inc) => {
    const players = afterRoster(t, out, inc);
    const picks = afterPicks(t, out, inc);
    const act = players.filter(p => !t.taxi.has(p.id) && !t.ir.has(p.id));
    const starters = optimalLineup(act, 'ppg');
    const posNow = {}, posValue = {};
    POS4.forEach(pos => {
      posNow[pos] = sum(starters.filter(s => s.player && s.player.pos === pos).map(s => s.player.ppg));
      posValue[pos] = sum(players.filter(p => p.pos === pos).map(p => p.dv || 0));
    });
    const ages = players.filter(p => POS4.includes(p.pos) && p.age && (p.dv || 0) > 300);
    return {
      team: t, players, picks, act, starters, posNow, posValue,
      now: sum(starters.map(s => s.player ? s.player.ppg : 0)),
      futureRoster: isDynasty() ? lineupPoints(players, 'fppg') : lineupPoints(act, 'ppg'),
      age: ages.length ? sum(ages.map(p => p.age * p.dv)) / sum(ages.map(p => p.dv)) : null
    };
  };
  // phase 2: price the picks against a given league state, then fold them in
  const finish = (sh, price) => {
    const priced = sh.picks.map(pk => {
      const q = price(pk);
      return Object.assign({}, pk, {
        value: q.value, dv: q.value, slot: q.slot, tier: q.tier, ownerRank: q.rank,
        slotLabel: pk.round + '.' + String(q.slot).padStart(2, '0')
      });
    });
    const pickCapital = sum(priced.map(p => p.value));
    return Object.assign({}, sh, {
      picks: priced, pickCapital,
      future: sh.futureRoster + pickCapital / 620,
      value: sum(sh.players.map(p => p.dv || 0)) + pickCapital
    });
  };

  const dyn = isDynasty();
  const aSh = shell(A, aOut, bOut), bSh = shell(B, bOut, aOut);
  const aShB = shell(A, [], []), bShB = shell(B, [], []);
  const ov = {};
  ov[A.rosterId] = { now: aSh.now, futureRoster: aSh.futureRoster };
  ov[B.rosterId] = { now: bSh.now, futureRoster: bSh.futureRoster };
  const zero = () => ({ value: 0, slot: 0, tier: '', rank: 0 });
  const priceBefore = dyn ? pickPricer(null) : zero, priceAfter = dyn ? pickPricer(ov) : zero;
  const aAfter = finish(aSh, priceAfter), bAfter = finish(bSh, priceAfter);
  const aBefore = finish(aShB, priceBefore), bBefore = finish(bShB, priceBefore);

  // every pick either side touches, priced both ways
  const shifts = [];
  const seen = new Set();
  [[aBefore, A], [bBefore, B]].forEach(([sh, t]) => sh.picks.forEach(pk => {
    if (seen.has(pk.id)) return; seen.add(pk.id);
    const bq = priceBefore(pk), aq = priceAfter(pk);
    const heldAfter = aAfter.picks.some(x => x.id === pk.id) ? A
      : bAfter.picks.some(x => x.id === pk.id) ? B : null;
    shifts.push({
      pk, label: pk.label, season: pk.season, round: pk.round,
      origTeam: S.teamById[pk.origRosterId], heldBefore: t, heldAfter,
      before: bq, after: aq, delta: aq.value - bq.value, moved: aq.slot !== bq.slot
    });
  }));
  [[aAfter, A], [bAfter, B]].forEach(([sh, t]) => sh.picks.forEach(pk => {
    if (seen.has(pk.id)) return; seen.add(pk.id);
    const bq = priceBefore(pk), aq = priceAfter(pk);
    shifts.push({
      pk, label: pk.label, season: pk.season, round: pk.round,
      origTeam: S.teamById[pk.origRosterId], heldBefore: null, heldAfter: t,
      before: bq, after: aq, delta: aq.value - bq.value, moved: aq.slot !== bq.slot
    });
  }));
  shifts.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));

  // league-wide ranks after the trade (only two teams move)
  const rankAfter = (metric, getAfter) => {
    const vals = S.teams.map(t => t.rosterId === A.rosterId ? getAfter(aAfter) : t.rosterId === B.rosterId ? getAfter(bAfter) : metric(t));
    const r = rankOf(vals);
    const idx = {}; S.teams.forEach((t, i) => idx[t.rosterId] = r[i]);
    return idx;
  };
  const nowRankAfter = rankAfter(t => t.now, x => x.now);
  const futRankAfter = rankAfter(t => t.future, x => x.future);
  const valRankAfter = rankAfter(t => t.totalValue, x => x.value);
  const posRankAfter = {};
  POS4.forEach(pos => { posRankAfter[pos] = rankAfter(t => t.posNow[pos], x => x.posNow[pos]); });

  let simBefore = null, simAfter = null;
  if (simN) {
    // Common random numbers: identical seed on both runs, so the difference
    // reflects the trade rather than simulation noise.
    const so = {}; so[A.rosterId] = aAfter.act; so[B.rosterId] = bAfter.act;
    const pairSeed = (Math.random() * 4294967296) >>> 0;
    simBefore = simulate(simN, { seed: pairSeed });
    simAfter = simulate(simN, { overrides: so, seed: pairSeed });
  }
  // headline balance stays at today's market prices — that is what you negotiate at
  const aVal = sum(aOut.map(a => a.dv)), bVal = sum(bOut.map(a => a.dv));
  return {
    A, B, aOut, bOut, aAfter, bAfter, aBefore, bBefore, shifts,
    aGives: aVal, bGives: bVal, delta: bVal - aVal,
    nowRankAfter, futRankAfter, valRankAfter, posRankAfter, simBefore, simAfter
  };
}
function fairness(aVal, bVal) {
  const hi = Math.max(aVal, bVal), lo = Math.min(aVal, bVal);
  if (hi <= 0) return 1;
  return lo / hi;
}

/* ================= 2. TRADE CALCULATOR ================= */
/* Five thousand seasons is enough that a one-point swing in title odds is real
   rather than noise, and it runs in about a second — so there is nothing left
   for the user to choose, only a button to press. */
const TRADE_SIMS = 5000;

    // roster crunch: two bodies out, one body in — picks don't occupy a roster spot,
    // so a package with a pick in it wouldn't actually free anything
    if (shape === 'roster') return give.length === 2 && get.length === 1 &&
      give.every(a => a.kind === 'player') && get[0].kind === 'player' &&
      get[0].dv > Math.max(give[0].dv, give[1].dv);
    if (shape === 'consolidate') return give.length >= 2 && get.length === 1 &&
      Math.max.apply(null, get.map(a => a.dv)) > Math.max.apply(null, give.map(a => a.dv));
    if (shape === 'spread') return give.length === 1 && get.length >= 2 &&
      Math.max.apply(null, give.map(a => a.dv)) > Math.max.apply(null, get.map(a => a.dv));
    return true;
  };
  // when the user has named the player they want, they have already said which
  // position they are shopping for
  const posOk = (get) => !wantPos.length || (focus && focus.side === 'get') || get.some(a => wantPos.includes(a.pos));

  const myBase = quick(T, [], []);
  const scT = scoutTeam(T);
  let mine = assetsOf(T).filter(a => a.dv > 180).sort((a, b) => b.dv - a.dv).slice(0, 20);
  // a focus player has to be in the pool even if the value cut would have dropped them
  let focusAsset = null;
  if (focus && focus.side === 'give') {
    focusAsset = assetsOf(T).find(a => a.id === focus.id) || null;
    if (focusAsset && !mine.some(a => a.id === focusAsset.id)) mine = mine.concat([focusAsset]);
  }
  const out = []; let scanned = 0, filtered = 0;
  const pool = S.teams.filter(P => P.rosterId !== T.rosterId && (!partners.length || partners.includes(P.rosterId)));

  pool.forEach(P => {
    const pMode = windowToMode(P.window);
    const pObj = objectiveFor(pMode);
    const pBase = quick(P, [], []);
    let theirs = assetsOf(P).filter(a => a.dv > 180).sort((a, b) => b.dv - a.dv).slice(0, 22);
    // when the user is hunting a position, make sure enough of it survives the top-N cut
    if (wantPos.length) {
      const wanted = assetsOf(P).filter(a => a.dv > 120 && wantPos.includes(a.pos)).sort((a, b) => b.dv - a.dv).slice(0, 14);
      const seen = new Set(theirs.map(a => a.id));
      theirs = theirs.concat(wanted.filter(a => !seen.has(a.id)));
    }
    if (focus && focus.side === 'get' && P.rosterId === focus.owner.rosterId) {
      const fa = assetsOf(P).find(a => a.id === focus.id);
      if (fa && !theirs.some(a => a.id === fa.id)) theirs = theirs.concat([fa]);
    }
    const combos = [];
    const M = Math.min(mine.length, 14), N = Math.min(theirs.length, 16);

    /* ---- built around one named player ---- */
    if (focus) {
      const F = focus.side === 'give' ? focusAsset : (assetsOf(P).find(a => a.id === focus.id) || null);
      if (!F) return;
      const pair = (giveArr, getArr) => combos.push([giveArr, getArr]);
      if (focus.side === 'give') {
        const mp = mine.filter(a => a.id !== F.id).slice(0, 12);
        const tp = theirs.slice(0, 16), tpS = theirs.slice(0, 10);
        tp.forEach(t2 => pair([F], [t2]));
        for (let i = 0; i < tp.length; i++) for (let j = i + 1; j < tp.length; j++) pair([F], [tp[i], tp[j]]);
        for (let i = 0; i < tpS.length; i++) for (let j = i + 1; j < tpS.length; j++) for (let k = j + 1; k < tpS.length; k++) pair([F], [tpS[i], tpS[j], tpS[k]]);
        mp.forEach(m => {
          tp.forEach(t2 => pair([F, m], [t2]));
          for (let i = 0; i < tpS.length; i++) for (let j = i + 1; j < tpS.length; j++) pair([F, m], [tpS[i], tpS[j]]);
        });
      } else {
        // only one partner to search, so it can afford to be thorough
        const tp = theirs.filter(a => a.id !== F.id).slice(0, 12);
        const mp = mine.slice(0, 18), mpS = mine.slice(0, 12);
        mp.forEach(m => pair([m], [F]));
        for (let i = 0; i < mpS.length; i++) for (let j = i + 1; j < mpS.length; j++) pair([mpS[i], mpS[j]], [F]);
        for (let i = 0; i < Math.min(mpS.length, 10); i++) for (let j = i + 1; j < Math.min(mpS.length, 10); j++) for (let k = j + 1; k < Math.min(mpS.length, 10); k++) pair([mpS[i], mpS[j], mpS[k]], [F]);
        // they may want to send a second piece back to balance a big overpay
        tp.forEach(t2 => {
          mp.forEach(m => pair([m], [F, t2]));
          for (let i = 0; i < Math.min(mpS.length, 10); i++) for (let j = i + 1; j < Math.min(mpS.length, 10); j++) pair([mpS[i], mpS[j]], [F, t2]);
        });
      }
    }

    if (!focus && (shape === 'any' || shape === 'even')) mine.forEach(m => theirs.forEach(t2 => combos.push([[m], [t2]])));
    if (!focus && shape === 'roster') {
      const mp = mine.filter(a => a.kind === 'player').slice(0, 14);
      const tp = theirs.filter(a => a.kind === 'player').slice(0, 16);
      for (let i = 0; i < mp.length; i++) for (let j = i + 1; j < mp.length; j++)
        tp.forEach(t2 => combos.push([[mp[i], mp[j]], [t2]]));
    }
    if (!focus && (shape === 'any' || shape === 'consolidate')) {
      for (let i = 0; i < M; i++) for (let j = i + 1; j < M; j++)
        theirs.slice(0, N).forEach(t2 => combos.push([[mine[i], mine[j]], [t2]]));
      if (shape === 'consolidate') {
        for (let i = 0; i < Math.min(M, 9); i++) for (let j = i + 1; j < Math.min(M, 9); j++) for (let k = j + 1; k < Math.min(M, 9); k++)
          theirs.slice(0, 10).forEach(t2 => combos.push([[mine[i], mine[j], mine[k]], [t2]]));
      }
    }
    if (!focus && (shape === 'any' || shape === 'spread')) {
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++)
        mine.slice(0, M).forEach(m => combos.push([[m], [theirs[i], theirs[j]]]));
      if (shape === 'spread') {
        for (let i = 0; i < Math.min(N, 10); i++) for (let j = i + 1; j < Math.min(N, 10); j++) for (let k = j + 1; k < Math.min(N, 10); k++)
          mine.slice(0, 9).forEach(m => combos.push([[m], [theirs[i], theirs[j], theirs[k]]]));
      }
    }

    /* ---- built from need: what each side is actually missing ----
       The enumeration above only ever produces 1-for-1, 2-for-1 and 1-for-2. Real
       deals are often 2-for-2 or 3-for-2, because two rosters rarely line up
       one piece against one. So start from the hole instead: pick the players
       on their roster that fill yours, then assemble packages from the things I
       can spare (a surplus position, a position they are short at, picks) whose
       worth lands on theirs, and let the value check and both lineups decide. */
    if (!focus) {
      const scP = scoutTeam(P);
      const wanted = wantPos.length ? wantPos.filter(x => POS4.includes(x)) : (scT.holes.length ? scT.holes.map(x => x.pos) : scP.surplus.map(x => x.pos));
      const tgt = assetsOf(P).filter(a => a.kind === 'player' && wanted.includes(a.pos) && a.dv > 400).sort((a, b) => b.dv - a.dv).slice(0, 5);
      const theirHoles = scP.holes.map(x => x.pos), mySurplus = scT.surplus.map(x => x.pos);
      let cur = mine.filter(a => a.kind === 'pick' || mySurplus.includes(a.pos) || theirHoles.includes(a.pos)).slice(0, 12);
      if (cur.length < 8) cur = cur.concat(mine.filter(a => !cur.includes(a)).slice(0, 8 - cur.length));
      const sets = tgt.map(a => [a]);
      for (let i = 0; i < Math.min(tgt.length, 4); i++) for (let j = i + 1; j < Math.min(tgt.length, 4); j++) sets.push([tgt[i], tgt[j]]);
      const loB = 1 - tol - 0.03, hiB = 1 / loB;
      sets.forEach(gs => {
        const target = packageValue(gs);
        const fits = (g) => { const v = packageValue(g); return v >= target * loB && v <= target * hiB; };
        for (let i = 0; i < cur.length; i++) {
          if (fits([cur[i]])) combos.push([[cur[i]], gs]);
          for (let j = i + 1; j < cur.length; j++) {
            if (fits([cur[i], cur[j]])) combos.push([[cur[i], cur[j]], gs]);
            for (let k = j + 1; k < cur.length; k++) if (fits([cur[i], cur[j], cur[k]])) combos.push([[cur[i], cur[j], cur[k]], gs]);
          }
        }
      });
    }

    const seenCombo = new Set();
    combos.forEach(([give, get]) => {
      const ck = give.map(a => a.id).sort().join('+') + '>' + get.map(a => a.id).sort().join('+');
      if (seenCombo.has(ck)) return;
      seenCombo.add(ck);
      scanned++;
      if (!posOk(get) || !shapeOk(give, get)) { filtered++; return; }
      const gv = packageValue(give), gt = packageValue(get);
      if (gv <= 0 || gt <= 0) return;
      const hi = Math.max(gv, gt), lo = Math.min(gv, gt);
      if (lo / hi < 1 - tol) return;
      const pair = evalPair(T, P, give, get);
      const myAfter = pair[0], pAfter = pair[1];
      if (myAfter.infeasible || pAfter.infeasible) return;
      const myGain = myObj(myBase, myAfter);
      if (myGain <= 0.12) return;
      const pGain = pObj(pBase, pAfter);
      if (pGain <= 0.08) return;
      // the market angle: selling what the market overpays for, buying what it underprices
      const signal = sum(give.map(a => sigMap[a.id] && sigMap[a.id].kind === 'sell' ? sigMap[a.id].strength : 0))
        + sum(get.map(a => sigMap[a.id] && sigMap[a.id].kind === 'buy' ? sigMap[a.id].strength : 0));
      if (filters.signal === 'only' && signal < 0.35) return;
      out.push({ partner: P, give, get, myGain, pGain, gv, gt, myAfter, myBase, signal, myDrops: myAfter.drops, theirDrops: pAfter.drops,
        score: myGain + pGain * 0.55 + (filters.signal === 'off' ? 0 : 0.35 * signal)
          - 0.12 * pAfter.drops.length - 0.04 * myAfter.drops.length, fair: lo / hi });
    });
  });
  out.sort((a, b) => b.score - a.score);
  // keep the list varied — unless the user narrowed to a few partners, in which case show them more
  const perPartner = partners.length ? Math.max(4, Math.ceil(20 / partners.length)) : (focus ? 4 : 3);
  // with one player in the frame the user wants several ways to move them, not
  // one idea per partner
  const perPackage = focus ? 4 : 2;
  const seenP = {}, seenA = {}, seenG = {}, list = [];
  for (const r of out) {
    const kp = r.partner.rosterId;
    const ka = r.give.map(a => a.id).sort().join('+');
    const kg = kp + '|' + r.get.map(a => a.id).sort().join('+');
    if ((seenP[kp] || 0) >= perPartner) continue;
    if ((seenA[ka] || 0) >= perPackage) continue;
    // don't show the same target package from the same partner more than once —
    // three ways to buy the same player reads as noise, not as three ideas
    if (seenG[kg]) continue;
    seenP[kp] = (seenP[kp] || 0) + 1; seenA[ka] = (seenA[ka] || 0) + 1; seenG[kg] = 1;
    list.push(r); if (list.length >= 20) break;
  }
  // only the shortlist gets a free-agent backfill — running it inside the scan
  // would cost a lineup solve per combination for no benefit
  list.forEach(r => {
    const freed = r.give.filter(a => a.kind === 'player').length - r.get.filter(a => a.kind === 'player').length;
    if (freed < 1) return;
    r.freed = freed;
    r.fa = bestFreeAgentFor(afterRoster(T, r.give, r.get), T.taxi, T.ir, 2);
  });
  // the shortlist is small, so this is where the reasons get worked out
  list.forEach(r => {
    r.signals = [];
    r.give.forEach(a => { const s = a.kind === 'player' && sigMap[a.id]; if (s && s.kind === 'sell') r.signals.push(Object.assign({ asset: a, side: 'give' }, s)); });
    r.get.forEach(a => { const s = a.kind === 'player' && sigMap[a.id]; if (s && s.kind === 'buy') r.signals.push(Object.assign({ asset: a, side: 'get' }, s)); });
    r.why = explainTrade(r, T, scT, scoutTeam(r.partner));
  });
  return { list, scanned, filtered, focus };
}

        h('span', h('i', { style: { background: 'var(--div-neutral)' } }), 'Par'),
        h('span', h('i', { style: { background: 'var(--s1)' } }), 'Above par'),
        h('span.tiny.muted', 'Hover any pick for the numbers.')))));

  const best = enriched.slice().sort((a, b) => b.surplus - a.surplus);
  const cols = [
    { k: 'pick', h: 'Pick', num: true, sort: r => r.p.pick_no, f: r => h('span.mono', r.p.round + '.' + String(r.p.draft_slot).padStart(2, '0')) },
    { k: 'player', h: 'Player', sort: r => r.pl.name, f: r => h('div.row', { style: { gap: '6px' } }, posPill(r.pl.pos), pname(r.pl)) },
    { k: 'team', prio: 2, h: 'Drafted by', sort: r => r.team ? r.team.name : '', f: r => r.team ? r.team.name : '—' },
    { k: 'dv', h: 'Value now', num: true, sort: r => r.pl.dv || 0, f: r => kfmt(Math.round(r.pl.dv || 0)) },
    { k: 'exp', prio: 2, h: 'Par', num: true, sort: r => r.expected, f: r => kfmt(Math.round(r.expected)) },
    { k: 'surplus', h: 'Surplus', num: true, sort: r => r.surplus, f: r => deltaTag(r.surplus, 0) }
  ];
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(min(340px,100%),1fr))' } },
    card('Best value picks', 'biggest gain over slot par', table(cols, best.slice(0, 12), { sortKey: 'surplus', sortDir: -1 })),
    card('Picks that did not work out', 'biggest shortfall', table(cols, best.slice(-12).reverse(), { sortKey: 'surplus', sortDir: 1 }))));

  const byTeam = {};
  enriched.forEach(e => { if (!e.team) return; (byTeam[e.team.rosterId] = byTeam[e.team.rosterId] || []).push(e); });
  wrap.appendChild(card('Draft haul by team', 'total value of everything each team took in this draft, still on any roster or not',
    barList(Object.keys(byTeam).map(k => {
      const list = byTeam[k], t = S.teamById[k];
      return {
        label: t.name, v: sum(list.map(e => e.pl.dv || 0)), vl: kfmt(Math.round(sum(list.map(e => e.pl.dv || 0)))),
        tip: `<div class="k">${t.name} — ${list.length} picks</div>` + list.slice(0, 10).map(e => `${e.p.round}.${String(e.p.draft_slot).padStart(2, '0')} ${e.pl.name} — <b>${kfmt(Math.round(e.pl.dv || 0))}</b>`).join('<br>')
      };
    }).sort((a, b) => b.v - a.v), { labelW: '160px', dec: 0 })));
  return wrap;
}


/** Every player on a franchise as its own line, on the same dates as the
 *  franchise chart. The biggest movers get a colour and an end label; the rest
 *  stay thin and grey so the shape of the roster is still readable. */
const STOCK_LINE_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s7)'];
function stockTeamLines(t, teamSer) {
  const rows = t.players.map(p => {
    // a player the market does not price (most kickers and defences) has a flat
    // line at nothing, which only distorts the axis
    if (!((p.dv || 0) > 0)) return null;
    const ser = playerSeries(p.id, StockUI.range);
    if (!ser.length) return null;
    const f = ser[0].v, l = ser[ser.length - 1].v;
    return { p: p, ser: ser, first: f, last: l, chg: l - f, pctc: f ? (l - f) / f : 0 };
  }).filter(Boolean);
  if (!rows.length) return card('Players behind the ticker', null, h('div.empty', 'No player history for this roster.'));

  const dates = teamSer.map(s => s.d);
  const byMove = rows.slice().sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg));
  const featured = byMove.slice(0, 5);
  const colorOf = {};
  featured.forEach((r, i) => colorOf[r.p.id] = STOCK_LINE_COLORS[i % STOCK_LINE_COLORS.length]);

  // absolute value puts a 12k stud and a 200-point stash on one axis, which is
  // honest but unreadable; indexing every line to 100 at the start of the window
  // is what actually answers "whose stock moved"
  const indexed = StockUI.lines === 'index';
  const toPoints = (r) => r.ser.map((s, i) => ({
    x: i, y: indexed ? (r.first ? s.v / r.first * 100 : 100) : s.v,
    label: new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
  }));
  // background lines first so the featured five draw on top of them
  const bg = rows.filter(r => !colorOf[r.p.id]).map(r => ({
    name: r.p.name, color: 'var(--text-muted)', width: 1, opacity: .3, points: toPoints(r)
  }));
  const fg = featured.map(r => ({
    name: r.p.name, color: colorOf[r.p.id], width: 2, points: toPoints(r)
  }));
  const chart = lineChart(bg.concat(fg), {
    h: 300, dots: false, maxTip: 10, floorAtZero: true,
    yFmt: v => indexed ? fmt(v, 0) : kfmt(Math.round(v)),
    xFmt: i => dates[clamp(Math.round(i), 0, dates.length - 1)]
      ? new Date(dates[clamp(Math.round(i), 0, dates.length - 1)]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
      : '',
    aria: 'every player on this roster, value over time'
  });
  const modeRow = h('div.row', { style: { justifyContent: 'flex-end', marginBottom: '6px' } },
    segmented([{ k: 'index', label: 'Indexed to 100' }, { k: 'value', label: 'Absolute value' }], StockUI.lines,
      k => { StockUI.lines = k; render(); }));
  const legend = h('div.legend', { style: { marginTop: '8px' } }, featured.map(r =>
    h('span', h('i', { style: { background: colorOf[r.p.id] } }), r.p.name))
    .concat(bg.length ? [h('span', h('i', { style: { background: 'var(--text-muted)', opacity: .3 } }), bg.length + ' more')] : []));

  const tbl = table([
    { k: 'name', h: 'Player', sort: r => r.p.name, f: r => h('div.row', { style: { gap: '6px' } }, posPill(r.p.pos), pname(r.p, { style: { fontWeight: 540 } })) },
    { k: 'first', prio: 2, h: 'Start', num: true, f: r => kfmt(r.first) },
    { k: 'last', h: 'Now', num: true, f: r => h('b.mono', kfmt(r.last)) },
    { k: 'chg', h: 'Change', num: true, f: r => deltaTag(r.chg, 0) },
    { k: 'pctc', h: '%', num: true, f: r => h('span', { class: r.pctc > 0 ? 'up mono' : r.pctc < 0 ? 'down mono' : 'mono' }, sgn(r.pctc * 100, 1) + '%') },
    { k: 'share', prio: 2, h: 'Share', num: true, sort: r => r.last, f: r => pct(r.last / Math.max(1, sum(rows.map(x => x.last))), 1) }
  ], rows, { sortKey: 'chg', sortDir: -1 });
  const wt = withTable(h('div', modeRow, chart, legend), tbl);
  const up = rows.filter(r => r.chg > 0).length;
  return card('Players behind the ticker',
    `${rows.length} priced players over the same ${StockUI.range} days · ${up} up, ${rows.length - up} down · `
    + (indexed ? 'every line starts at 100, so the shape is the percentage move' : 'absolute trade value') + ' · picks are not shown here',
    wt.body, wt.btn);
}

/** A player's name, rendered as a link into the player page. In the default

  }, p.name);

  if (!isSimple() || opts.face === false) return opts.mirror ? h('span.pnf.mir', el) : el;
  // mirrored puts the headshot on the outside, so two of these facing each other

/* ================= 9. PLAYER PAGE ================= */
const PlayerUI = { id: null, back: 'roster', range: 90 };
/* ================= trading card (player page, Default view) ================= */
/** NFL draft line for the card: "2023 · Rd 1 · #5", a rookie with no record yet, or undrafted. */
function draftLine(p) {
  if (p.draft && p.draft.round) return { top: 'Rd ' + p.draft.round + ' · #' + p.draft.pick, sub: String(p.draft.year || '') };
  return { top: p.exp === 0 ? 'Rookie' : 'Undrafted', sub: p.exp === 0 ? 'class of ' + (S.season || '') : '' };
}
function tradingCard(p, opts) {
  opts = opts || {};
  const tier = medalOf(p) || 'none';
  const dl = draftLine(p);
  const cell = (k, v, sub) => h('div.pcxs', h('div.pcxk', k), h('div.pcxv', v), sub ? h('div.pcxsub', sub) : null);
  const isDef = p.pos === 'DEF';
  const full = !isDef && /^\d+$/.test(String(p.id)) ? 'https://sleepercdn.com/content/nfl/players/' + p.id + '.jpg' : null;
  const defTeam = String(p.team || p.id || '').toLowerCase();
  const art = h('div.pcxart' + (isDef ? '.pcxdef' : ''),
    h('div.pcxpos', p.pos),
    isDef && defTeam ? h('img.pcxdeflogo', {
      src: 'https://sleepercdn.com/images/team_logos/nfl/' + defTeam + '.png', alt: '',
      onerror: e => { e.target.style.visibility = 'hidden'; }
    }) : null,
    full ? h('img', {
      src: full, alt: '',
      onerror: e => {
        const im = e.target;
        if (!im.dataset.fb) { im.dataset.fb = '1'; im.src = 'https://sleepercdn.com/content/nfl/players/thumb/' + p.id + '.jpg'; }
        else im.style.visibility = 'hidden';
      }
    }) : null,
    h('div.pcxholo'),
    !isDef && p.team ? h('div.pcxteam', teamLogo(p.team)) : null);
  const face = h('div.pcxface',
    h('div.pcxtop', h('div.pcxname', p.name),
      p.rank ? h('div.pcxrank', '#' + p.rank) : null),
    art,
    h('div.pcxmeta', p.pos + (p.posRank ? p.posRank : '') + ' · ' + (p.team || 'Free agent') + (p.age ? ' · ' + fmt(p.age, 0) + ' yrs' : '')),
    h('div.pcxstats',
      cell('Value', kfmt(Math.round(p.dv || 0)), isDynasty() ? 'dynasty' : 'redraft'),
      cell('Pts / wk', fmt(p.ppg || 0, 1), 'projected'),
      cell('Draft', dl.top, dl.sub)),
    h('div.pcxglare'));
  const card = h('div.pcxcard.' + tier + (medalMode() === 'animated' ? '.anim' : ''), { title: p.medal ? medalTitle(p) : null }, face);
  // the card leans toward the pointer; the glare and foil follow the same point
  const still = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = !!opts.w;   // small cards live in scrolling rows, where a finger means scroll, not tilt
  if (!still) {
    const move = e => {
      if (small && e.pointerType === 'touch') return;
      const r = card.getBoundingClientRect();
      const x = clamp((e.clientX - r.left) / r.width, 0, 1), y = clamp((e.clientY - r.top) / r.height, 0, 1);
      card.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); card.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      card.style.setProperty('--rx', ((0.5 - y) * 18).toFixed(2) + 'deg'); card.style.setProperty('--ry', ((x - 0.5) * 18).toFixed(2) + 'deg');
      card.style.setProperty('--hx', ((x - 0.5) * 100).toFixed(1) + '%'); card.style.setProperty('--hy', ((y - 0.5) * 100).toFixed(1) + '%');
    };
    card.addEventListener('pointerenter', e => { if (small && e.pointerType === 'touch') return; card.classList.add('pcxon'); });
    card.addEventListener('pointermove', move);
    card.addEventListener('pointerleave', () => {
      card.classList.remove('pcxon');
      ['--mx', '--my', '--rx', '--ry', '--hx', '--hy'].forEach(k => card.style.removeProperty(k));
    });
  }
  if (!opts.w) return card;
  // a smaller card is the full card scaled down, so its layout never has to be redesigned
  const k = opts.w / 300;
  const fit = h('div.pcxfit' + (opts.back ? '.pcxlink' : ''), { style: { width: opts.w + 'px', height: Math.round(420 * k) + 'px' } }, h('div.pcxscale', card));
  fit.style.setProperty('--k', k.toFixed(4));
  if (opts.back) {
    fit.tabIndex = 0; fit.setAttribute('role', 'button'); fit.setAttribute('aria-label', p.name);
    fit.addEventListener('click', () => openPlayer(p.id, opts.back));
    fit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayer(p.id, opts.back); } });
  }
  return fit;
}

function attachCardPop(el, p) {

      { k: 'pa', prio: 2, h: 'PA', num: true, f: r => fmt(r.pa, 1) },
      { k: 'diff', prio: 2, h: 'Diff', num: true, sort: r => r.pf - r.pa, f: r => h('span', { class: r.pf - r.pa >= 0 ? 'up mono' : 'down mono' }, sgn(r.pf - r.pa, 1)) },
      { k: 'best', prio: 2, h: 'Best week', num: true, f: r => r.best ? h('span', fmt(r.best, 1), h('span.tiny.muted', ' wk' + r.bestWeek)) : '—' },
      { k: 'form', prio: 2, h: 'Form', sortable: false, f: r => h('span', { style: { display: 'flex', gap: '2px' } }, r.form.slice(-8).map(f => h('span', { style: { width: '13px', height: '13px', borderRadius: '3px', fontSize: '9px', fontWeight: 700, display: 'grid', placeItems: 'center', color: '#fff', background: f === 'W' ? 'var(--good)' : f === 'T' ? 'var(--axis)' : 'var(--critical)' } }, f))) }
    ], sim.standings, { sortKey: 'seed', sortDir: 1 })));

  // ---- week by week ----
  const weekBtns = h('div.wkstrip', sim.weeks.map(w =>
    h('button.btn.sm', {
      class: SimUI.openWeek === w.week ? 'pri' : '',
      onclick: () => { SimUI.openWeek = SimUI.openWeek === w.week ? null : w.week; render(); }
    }, (w.actual ? '✓' : '') + w.week)));
  const shown = SimUI.openWeek ? sim.weeks.filter(w => w.week === SimUI.openWeek) : sim.weeks;
  const weekBlocks = shown.map(w => h('div', { style: { marginBottom: '14px' } },
    h('div.row', { style: { marginBottom: '5px', gap: '8px' } },
      h('b', 'Week ' + w.week),
      w.actual ? h('span.tag', { style: { borderColor: 'var(--s1)', color: 'var(--s1)' } }, 'actual result') : h('span.tag', 'simulated'),
      h('span.tiny.muted', w.games.length + ' games')),
    h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(min(268px,100%),1fr))', gap: '7px' } },
      w.games.map(g => {
        const rowFor = (rid, pts, top, won) => h('div.row', { style: { justifyContent: 'space-between', gap: '8px', opacity: won ? 1 : .6 } },
          h('div.row', { style: { gap: '7px', minWidth: 0, flexWrap: 'nowrap' } },
            S.teamById[rid] ? teamFace(S.teamById[rid], 22) : null,
            h('span', { style: { fontWeight: won ? 660 : 500, fontSize: '12.5px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, nameOf(rid))),
          h('b.mono', { style: { fontSize: '12.5px' } }, fmt(pts, 1)));
        const el = h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', padding: '7px 9px', background: 'var(--surface-1)' }, tabindex: 0 },

        bindTT(el, `<div class="k">Week ${w.week}${w.actual ? ' · actual' : ''}</div>` +
          (g.win ? `<b>${nameOf(g.win)}</b> by ${fmt(g.margin, 1)}` : '<b>Tie</b>') +
          (g.aTop ? `<br>${shortOf(g.a)} best: ${g.aTop.name} ${fmt(g.aTop.pts, 1)}` : '') +

      }))));
  wrap.appendChild(card('Week by week', SimUI.openWeek ? 'showing week ' + SimUI.openWeek + ' — click it again for the full season' : 'every matchup; ✓ marks weeks that actually happened',

}
/* ==================================================================
   Analysis layer — free agents, roster scouting, trade history
   ================================================================== */

/* ---------- free agents ---------- */
/** Everyone with a projection who is not on a roster in this league. */
function freeAgents() {
  if (S._fa) return S._fa;
  const owned = new Set();
  S.teams.forEach(t => t.players.forEach(p => owned.add(p.id)));
  S._fa = Object.values(S.index)
    .filter(p => !owned.has(p.id) && POS_ALL.indexOf(p.pos) >= 0)
    .sort((a, b) => (b.ppg || 0) - (a.ppg || 0));
  return S._fa;
}
const POS_ALL = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
/** What adding this player would add to a team's optimal lineup. */
function marginalAdd(players, taxi, ir, player, key) {
  const act = players.filter(p => !taxi.has(p.id) && !ir.has(p.id));
  return lineupPoints(act.concat([player]), key) - lineupPoints(act, key);
}

/* ---------- roster scouting ---------- */
/** How many lineup slots a position can occupy: dedicated slots plus a share of
 *  every flex that accepts it. */
function slotDemand() {
  if (S._slotDemand) return S._slotDemand;
  const rp = (S.cfg.rosterPositions || []).filter(p => !['BN', 'IR', 'TAXI'].includes(p));
  const d = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DEF: 0 };
  rp.forEach(slot => {
    const elig = SLOT_ELIG[slot] || [slot];
    if (elig.length === 1) { if (d[elig[0]] !== undefined) d[elig[0]] += 1; return; }
    elig.forEach(pos => { if (d[pos] !== undefined) d[pos] += 1 / elig.length; });
  });
  S._slotDemand = d;
  return d;
}
/** A player good enough to be worth starting over a waiver-wire replacement. */
function startable(p) { return (p.ppg || 0) > (STREAM[p.pos] !== undefined ? STREAM[p.pos] : 5) * 1.05; }

function scoutTeam(t) {
  const demand = slotDemand();
  const act = activePlayers(t);
  const zNow = {}, zVal = {};
  POS4.forEach(pos => {
    const arr = S.teams.map(x => x.posNow[pos]);
    const m = mean(arr), sd = sd_(arr) || 1;
    zNow[pos] = (t.posNow[pos] - m) / sd;
    const av = S.teams.map(x => x.posValue[pos]);
    const mv = mean(av), sv = sd_(av) || 1;
    zVal[pos] = (t.posValue[pos] - mv) / sv;
  });
  // kickers and defences are streamed, not built — nobody scouts a roster for
  // them and nobody trades for them, so they are left out of the scouting view
  const pos = POS4.filter(p => (demand[p] || 0) > 0).map(p => {
    const group = act.filter(x => x.pos === p).sort((a, b) => (b.ppg || 0) - (a.ppg || 0));
    const good = group.filter(startable);
    const need = demand[p] || 0;
    const depth = good.length - need;              // spare startable bodies
    return {
      pos: p, need: Math.round(need * 10) / 10, count: group.length, startable: good.length, depth,
      output: t.posNow[p] || 0, rank: (t.posNow[p + 'Rank'] || null),
      valueRank: (t.posValue[p + 'Rank'] || null),
      z: zNow[p] !== undefined ? zNow[p] : 0,
      best: group[0] || null,
      // a hole is thin bodies OR clearly below the league at that spot
      hole: depth < 0 || (zNow[p] !== undefined && zNow[p] < -0.85),
      surplus: depth >= 1 && (zNow[p] === undefined || zNow[p] > 0.25)
    };
  });
  const holes = pos.filter(p => p.hole).sort((a, b) => a.z - b.z);
  const surplus = pos.filter(p => p.surplus).sort((a, b) => b.z - a.z);
  const strengths = pos.slice().sort((a, b) => b.z - a.z).filter(p => p.z > 0.6).slice(0, 3);
  const weaknesses = pos.slice().sort((a, b) => a.z - b.z).filter(p => p.z < -0.6).slice(0, 3);
  const young = act.filter(p => p.age && p.age <= 25 && (p.dv || 0) > 1500).length;
  const old = act.filter(p => p.age && p.age >= 29 && (p.dv || 0) > 1500).length;
  return { team: t, pos, holes, surplus, strengths, weaknesses, young, old, demand };
}

/* ---------- starters and depth ----------
   A position is not one number. Two teams can produce the same points from
   their receivers and want opposite trades. One has two stars and nothing
   behind them: an injury or a bye turns a strength into a hole, so depth is
   cheap for them to buy and worth more than it looks. The other has four of the
   same receiver and nobody to build a week around: they have bodies to spare
   and would happily send two for one better one. On output alone both read as
   "covered", which is exactly the read that loses you the trade.

   What separates them is the shape of the group: how much of it is in the
   starters, what stands behind them, and whether anyone is a difference-maker.
   All three come out of the same numbers the rest of the app already has. */
const DEPTH_SHAPES = {
  thin: { tag: 'THIN', label: 'Thin', want: 'a starter', colour: 'var(--s8)' },
  topHeavy: { tag: 'TOP', label: 'Top-heavy', want: 'depth', colour: 'var(--s4)' },
  committee: { tag: 'FLAT', label: 'Committee', want: 'a difference-maker', colour: 'var(--s7)' },
  deep: { tag: 'DEEP', label: 'Strong and deep', want: null, colour: 'var(--s1)' },
  covered: { tag: 'OK', label: 'Covered', want: null, colour: 'var(--text-muted)' }
};

/** One team's group at one position, as a shape rather than a total. */
function posShape(t, pos, need) {
  const base = STREAM[pos] !== undefined ? STREAM[pos] : 5;
  const group = activePlayers(t).filter(x => x.pos === pos).sort((a, b) => (b.ppg || 0) - (a.ppg || 0));
  /* What a slot is worth, not what the player in it projects. An empty slot is
     not zero points — it is whatever the wire gives you — and neither is a slot
     held by somebody projecting nothing, because nobody starts him either. This
     is the same assumption the lineup solver already makes, and without it a
     roster with a zero on it reads as worse than a roster with a gap. */
  const at = i => Math.max(group[i] ? (group[i].ppg || 0) : 0, base);
  const n = Math.max(1, Math.round(need || 1));
  let sum = 0; for (let i = 0; i < n; i++) sum += at(i);
  const bodies = group.filter(startable).length;
  return {
    pos: pos, need: need || 0, n: n, group: group, team: t,
    top: at(0), last: at(n - 1), startAvg: sum / n,
    nextUp: at(n), next2: at(n + 1), depthAvg: (at(n) + at(n + 1)) / 2,
    cliff: at(n - 1) - at(n), spread: at(0) - at(n - 1),
    bodies: bodies, spare: bodies - Math.ceil(need || 1),
    spareBest: group[n] || null, best: group[0] || null, base: base
  };
}

/** The whole league's shapes, with the baselines each is judged against. */
function depthLeague() {
  if (S._depth) return S._depth;
  const demand = slotDemand();
  const positions = POS4.filter(p => (demand[p] || 0) > 0);
  const byTeam = {};
  S.teams.forEach(t => {
    byTeam[t.rosterId] = {};
    positions.forEach(p => { byTeam[t.rosterId][p] = posShape(t, p, demand[p]); });
  });
  const base = {};
  positions.forEach(p => {
    const st = S.teams.map(t => byTeam[t.rosterId][p].startAvg);
    const dp = S.teams.map(t => byTeam[t.rosterId][p].nextUp);
    /* A difference-maker is not "good", it is scarce. Judging him against the
       league's *best players* at that position rather than against its starters
       is what keeps the bar in the right place whatever the position's shape: a
       superflex QB1 and a WR1 are both roughly a top-quarter best player. */
    const tops = S.teams.map(t => byTeam[t.rosterId][p].top);
    base[p] = {
      start: mean(st), startSd: sd_(st) || 1, depth: mean(dp), depthSd: sd_(dp) || 1,
      elite: mean(tops) + 0.85 * (sd_(tops) || 0), need: demand[p] || 0
    };
  });
  S.teams.forEach(t => positions.forEach(p => shapeVerdict(byTeam[t.rosterId][p], base[p])));
  S._depth = { positions: positions, base: base, byTeam: byTeam };
  return S._depth;
}
/** Which of the five shapes a group is, and what that means for a trade. */
function shapeVerdict(e, b) {
  e.lgStart = b.start; e.lgDepth = b.depth; e.elite = b.elite;
  e.zStart = (e.startAvg - b.start) / b.startSd;
  e.zDepth = (e.nextUp - b.depth) / b.depthSd;
  e.hasStar = e.top >= b.elite && b.elite > 0;
  const nm = (p) => p ? p.name : 'nobody';
  if (e.bodies < Math.ceil(e.need) - 0.001 || e.zStart <= -0.85) {
    e.shape = 'thin';
    // not enough bodies and enough bodies who are not good enough are both thin,
    // and a manager hears them as different problems
    e.note = e.bodies < Math.ceil(e.need) - 0.001
      ? `${e.bodies} startable for ${fmt(e.need, 1)} slot${e.need === 1 ? '' : 's'} — they have to buy one.`
      : `${e.bodies} bodies but only ${fmt(e.startAvg, 1)} a slot against a league ${fmt(b.start, 1)} — the quantity is there, the quality is not.`;
  } else if (e.zStart >= 0.2 && (e.zDepth <= -0.45 || e.cliff >= Math.max(3, 0.45 * e.last))) {
    e.shape = 'topHeavy';
    e.note = `${nm(e.best)} carries it and the next man up is ${fmt(e.nextUp, 1)} a week — a bye or a knock costs them ${fmt(Math.max(0, e.cliff), 1)}.`;
  } else if (!e.hasStar && e.bodies >= e.n + 1 && e.spread <= 0.22 * e.startAvg) {
    e.shape = 'committee';
    e.note = `${e.bodies} of much the same player and nobody above ${fmt(e.elite, 1)} — they would send two for one better one.`;
  } else if (e.zStart >= 0.4 && e.zDepth >= 0.35) {
    e.shape = 'deep';
    e.note = `${fmt(e.startAvg, 1)} from the starters and ${fmt(e.nextUp, 1)} still on the bench — they can sell from it.`;
  } else {
    e.shape = 'covered';
    e.note = `${fmt(e.startAvg, 1)} a week from the starters against a league ${fmt(e.lgStart, 1)}, with ${fmt(e.nextUp, 1)} behind them.`;
  }
  e.verdict = DEPTH_SHAPES[e.shape];
  return e;
}
/** One team's shapes, in league order. */
function depthProfile(t) {
  const L = depthLeague();
  return L.positions.map(p => L.byTeam[t.rosterId][p]);
}

/* Where one roster's shape fits another's. A group that wants depth and a group
   with a spare startable body are a trade; so are a committee and somebody
   else's second star. This is the half of scouting the value-based finder
   cannot see, because both sides of these deals look even on price. */
function depthOpenings(me) {
  const L = depthLeague();
  const mine = L.byTeam[me.rosterId];
  if (!mine) return [];
  const out = [];
  S.teams.forEach(t => {
    if (t.rosterId === me.rosterId) return;
    L.positions.forEach(p => {
      const th = L.byTeam[t.rosterId][p], my = mine[p];
      if (!th || !my) return;
      if ((th.shape === 'topHeavy' || th.shape === 'thin') && my.spare >= 1 && my.spareBest) {
        out.push({
          team: t, pos: p, kind: th.shape === 'thin' ? 'starter' : 'depth', them: th, me: my,
          offer: my.spareBest, ask: th.shape === 'thin' ? 'a real price' : 'a modest price',
          why: th.shape === 'thin'
            ? `They are ${th.bodies} startable for ${fmt(th.need, 1)} slots. You can spare ${my.spareBest.name}.`
            : `${th.best ? th.best.name : 'Their starter'} is carrying it with ${fmt(th.nextUp, 1)} behind him. ${my.spareBest.name} is your ${ord(my.n + 1)} ${p} and would start for them in a pinch.`,
          score: (th.shape === 'thin' ? 0.2 : 1.0) + Math.max(0, -th.zDepth) * 0.6 + Math.max(0, my.spare) * 0.3
        });
      } else if (th.shape === 'committee' && my.hasStar && my.bodies >= my.n + 1 && my.best) {
        out.push({
          team: t, pos: p, kind: 'consolidate', them: th, me: my,
          offer: my.best, ask: 'two of theirs',
          why: `They have ${th.bodies} similar ${p}s and nobody above ${fmt(th.elite, 1)}. ${my.best.name} is the player that breaks the tie, and you have ${my.bodies} bodies to fall back on.`,
          score: 1.2 + (my.bodies - my.n) * 0.25 + Math.max(0, my.zStart) * 0.3
        });
      }
    });
  });
  /* One player can only be sent once and one manager will not take four calls
     about four positions, so the list is the best idea per piece and per team
     rather than every pairing the numbers allow. */
  const usedPlayer = {}, perTeam = {};
  return out.sort((a, b) => b.score - a.score).filter(o => {
    const id = o.offer.id, tid = o.team.rosterId;
    if (usedPlayer[id]) return false;
    if ((perTeam[tid] || 0) >= 2) return false;
    usedPlayer[id] = 1; perTeam[tid] = (perTeam[tid] || 0) + 1;
    return true;
  });
}

/* ---------- trade history ---------- */
/** Turn Sleeper's transaction feed into two-sided trades with assets per team. */
function parseTrades() {
  if (S._trades) return S._trades;
  const out = [];
  (S.transactions || []).forEach(tx => {
    if (tx.type !== 'trade' || tx.status !== 'complete') return;
    const rosters = (tx.roster_ids || []).slice();
    if (rosters.length < 2) return;
    const sides = {};
    rosters.forEach(r => sides[r] = { rosterId: r, team: S.teamById[r] || null, got: [], sent: [] });
    for (const pid in (tx.adds || {})) {
      const to = tx.adds[pid];
      const p = S.index[pid] || ensurePlayer(pid);
      if (sides[to]) sides[to].got.push({ kind: 'player', id: pid, name: p.name, pos: p.pos, ref: p, value: p.dv || 0 });
    }
    for (const pid in (tx.drops || {})) {
      const from = tx.drops[pid];
      const p = S.index[pid] || ensurePlayer(pid);
      if (sides[from]) sides[from].sent.push({ kind: 'player', id: pid, name: p.name, pos: p.pos, ref: p, value: p.dv || 0 });
    }
    (tx.draft_picks || []).forEach(dp => {
      const season = +dp.season, round = +dp.round;
      const key = season + '|' + round + '|' + dp.roster_id;
      // price it the way the app prices any pick: off the original owner's outlook
      // a redraft league's picks buy nothing that carries, so they are recorded
      // as part of the trade but priced at nothing rather than at a rookie-pick rate
      let value = 0, slotLabel = null;
      if (isDynasty()) {
        try {
          const q = pickPricer(null)({ season, round, origRosterId: +dp.roster_id });
          value = q.value; slotLabel = round + '.' + String(q.slot).padStart(2, '0');
        } catch (e) { value = pickValue(season, round, 'Mid'); }
      }
      const orig = S.teamById[+dp.roster_id];
      const label = season + ' ' + (ROUND_WORD[round] || round + 'th') + (orig ? ' (' + orig.short + ')' : '');
      const asset = { kind: 'pick', id: 'PK|' + key, name: label, pos: 'PICK', value, slotLabel, season, round };
      if (sides[dp.owner_id]) sides[dp.owner_id].got.push(asset);
      if (sides[dp.previous_owner_id]) sides[dp.previous_owner_id].sent.push(asset);
    });
    (tx.waiver_budget || []).forEach(wb => {
      const a = { kind: 'faab', id: 'FAAB' + wb.amount + '-' + wb.sender + '-' + wb.receiver, name: '$' + wb.amount + ' FAAB', pos: 'NA', value: 0 };
      if (sides[wb.receiver]) sides[wb.receiver].got.push(a);
      if (sides[wb.sender]) sides[wb.sender].sent.push(a);
    });
    const list = Object.values(sides);
    if (!list.some(s => s.got.length || s.sent.length)) return;
    out.push({
      id: tx.transaction_id, when: tx.created ? new Date(tx.created) : null,
      week: tx._week || tx.leg || null, creator: tx.creator, sides: list
    });
  });
  out.sort((a, b) => (b.when ? b.when.getTime() : 0) - (a.when ? a.when.getTime() : 0));
  out.forEach(tr => gradeTrade(tr));
  S._trades = out;
  return out;
}

const GRADES = [
  [0.55, 'A+'], [0.38, 'A'], [0.24, 'A−'], [0.14, 'B+'], [0.05, 'B'], [-0.05, 'B−'],
  [-0.14, 'C+'], [-0.24, 'C'], [-0.38, 'C−'], [-0.55, 'D'], [-Infinity, 'F']
];
function gradeLetter(score) {
  for (const [thr, g] of GRADES) if (score >= thr) return g;
  return 'F';
}
/** Score each side on value swing and on how well the pieces fit the roster.
 *  Values are today's market, so this reads a trade with hindsight — it is not a
 *  verdict on the decision at the time it was made. */
function gradeTrade(tr) {
  const demand = slotDemand();
  tr.sides.forEach(s => {
    s.gotValue = sum(s.got.map(a => a.value));
    s.sentValue = sum(s.sent.map(a => a.value));
    s.net = s.gotValue - s.sentValue;
    const base = Math.max(400, (s.gotValue + s.sentValue) / 2);
    s.valueEdge = clamp(s.net / base, -1.6, 1.6);
    // need fit: did the incoming pieces land where this roster is thin, and did
    // the outgoing pieces come from a spot it could afford to sell from?
    let fit = 0, n = 0;
    if (s.team) {
      const sc = scoutTeam(s.team);
      const zOf = (p) => { const e = sc.pos.find(x => x.pos === p); return e ? e.z : 0; };
      s.got.filter(a => a.kind === 'player').forEach(a => { fit += clamp(-zOf(a.pos), -1, 1); n++; });
      s.sent.filter(a => a.kind === 'player').forEach(a => { fit += clamp(zOf(a.pos), -1, 1) * 0.6; n++; });
    }
    s.needFit = n ? fit / n : 0;
    s.score = s.valueEdge + 0.3 * s.needFit;
    s.grade = gradeLetter(s.score);
  });
  const best = tr.sides.slice().sort((a, b) => b.score - a.score);
  tr.winner = best.length > 1 && Math.abs(best[0].score - best[1].score) > 0.08 ? best[0] : null;
  tr.margin = best.length > 1 ? best[0].score - best[1].score : 0;
  tr.totalValue = sum(tr.sides.map(s => s.gotValue));
  return tr;
}
/** Per-manager trading record. */
function traderStats() {
  const trades = parseTrades();
  const by = {};
  S.teams.forEach(t => by[t.rosterId] = {
    team: t, n: 0, net: 0, scores: [], wins: 0, losses: 0, partners: {},
    playersIn: 0, playersOut: 0, picksIn: 0, picksOut: 0, ageIn: [], ageOut: [], valueIn: 0, valueOut: 0
  });
  trades.forEach(tr => tr.sides.forEach(s => {
    const b = by[s.rosterId]; if (!b) return;
    b.n++; b.net += s.net; b.scores.push(s.score);
    if (tr.winner === s) b.wins++; else if (tr.winner) b.losses++;
    tr.sides.forEach(o => { if (o !== s) b.partners[o.rosterId] = (b.partners[o.rosterId] || 0) + 1; });
    s.got.forEach(a => {
      if (a.kind === 'player') { b.playersIn++; b.valueIn += a.value; if (a.ref && a.ref.age) b.ageIn.push(a.ref.age); }
      if (a.kind === 'pick') { b.picksIn++; b.valueIn += a.value; }
    });
    s.sent.forEach(a => {
      if (a.kind === 'player') { b.playersOut++; b.valueOut += a.value; if (a.ref && a.ref.age) b.ageOut.push(a.ref.age); }
      if (a.kind === 'pick') { b.picksOut++; b.valueOut += a.value; }
    });

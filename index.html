            // the live badge already says BYE, so the meta line does not repeat it
            h('span.tiny.muted', o.bye ? (isLive ? '' : 'on bye this week')
              : o.zero ? 'not expected to play'
                : o.opp ? (isLive ? '' : 'vs ') + o.opp : 'no opponent listed'),
            injuryTag(p.injury, p), isLive ? liveBadge(p, wk) : null))),
      // the headline number: what he actually scored once he has played, else the projection
      h('div.row', { style: { alignItems: 'baseline', gap: '8px' } },
        ps && ps.final
          ? h('b.score.' + (ps.actual >= ps.proj ? 'up' : 'down'), { style: { fontSize: '27px' } }, fmt(ps.actual, 1))
          : h('b', { style: { fontSize: '27px' } }, fmt(o.mean, 1)),
        h('span.tiny.muted', ps && ps.final ? 'scored · ' + fmt(ps.proj, 1) + ' projected'
          : ps ? 'so far · ' + fmt(ps.proj, 1) + ' projected'
            : o.bye ? 'on bye' : o.zero ? 'projected nothing' : 'projected'),
        lead ? h('span.tag.leadtag', { style: { marginLeft: 'auto' } }, 'highest') : null),
      // floor → ceiling on a scale shared by every card, so they compare by eye
      o.bye || o.zero ? null : h('div',
        h('div.crange',
          h('i', { style: { left: pctOf(o.floor) + '%', width: Math.max(2, pctOf(o.ceil) - pctOf(o.floor)) + '%' } }),
          h('u', { style: { left: pctOf(o.mean) + '%' } })),
        h('div.row', { style: { justifyContent: 'space-between', marginTop: '3px' } },
          h('span.tiny.muted.mono', fmt(o.floor, 0)),
          h('span.tiny.muted', 'floor → ceiling'),
          h('span.tiny.muted.mono', fmt(o.ceil, 0)))),
      o.bye || o.zero ? null : h('div.cstats',
        stat('big week', pct(o.boom, 0), '<div class="k">Chance of a big week</div>Half again his projection or better, from the same distribution the simulator draws from.'),
        stat('dud', pct(o.bust, 0), '<div class="k">Chance of a dud</div>Half his projection or less.'),
        stat('avg so far', avg === null ? '—' : fmt(avg, 1), '<div class="k">This season</div>' + (log.length ? `Average of his <b>${log.length}</b> finished games.` : 'No finished games yet.')),
        stat('best', top === null ? '—' : fmt(top, 1), '<div class="k">Best week</div>His highest finished score this season.')));
  };

  // every pairing, as a single bar each: who wins the week between these two
  const pairs = [];
  for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
    const a = players[i], b = players[j];
    const pr = pBeats(a, b, wk);
    pairs.push(h('div.cpair',
      h('span.cpn', { style: { textAlign: 'right', fontWeight: pr >= 0.5 ? 660 : 500 } }, a.name),
      h('div.cbar',
        h('i', { style: { width: (pr * 100) + '%' } }),
        h('span.cpct.l', pct(pr, 0)), h('span.cpct.r', pct(1 - pr, 0))),
      h('span.cpn', { style: { fontWeight: pr < 0.5 ? 660 : 500 } }, b.name)));
  }

  return h('div', { style: { display: 'grid', gap: '14px' } },
    h('div.cgrid', outs.map(card1)),
    pairs.length ? h('div',
      h('div.lbl', { style: { fontSize: '10px', marginBottom: '6px' } }, 'Who outscores whom'),
      h('div', { style: { display: 'grid', gap: '5px' } }, pairs),
      h('div.tiny.muted', { style: { marginTop: '7px' } },
        'From 12,000 paired draws of the same week. A tie counts as half to each side.')) : null);
}

/* ================= 11. GM SCOUT ================= */
const ScoutUI = { team: null, mode: 'starters' };
function viewScout() {
  const wrap = h('div.grid');
  const stats = traderStats();
  const statBy = {}; stats.list.forEach(s => statBy[s.team.rosterId] = s);
  const scouts = S.teams.map(t => {
    const sc = scoutTeam(t);
    sc.stat = statBy[t.rosterId];
    sc.strategy = projectedStrategy(t, sc.stat);
    return sc;
  });
  if (ScoutUI.team === null || !S.teamById[ScoutUI.team]) ScoutUI.team = S.myRosterId || S.teams[0].rosterId;

  // ---- league-wide needs matrix ----
  // kickers and defences are out of the scouting view entirely — they are
  // streamed week to week, so "who needs a kicker" is not a question anyone
  // trades on. A position with no projected output anywhere is a dead column
  // of zeroes too, so leave that out rather than implying every team is equal.
  const posList = POS4.filter(p => (slotDemand()[p] || 0) > 0)
    .filter(p => scouts.some(sc => { const e = sc.pos.find(x => x.pos === p); return e && e.output > 0.05; }));
  const ordered = scouts.slice().sort((a, b) => a.team.powerRank - b.team.powerRank);
  /* The same grid answers three different questions, and only the first of them
     used to be on the page. Output says who is strong; depth says who is one
     knock away from a hole; shape says which trade they would actually take. */
  const DEPTH = depthLeague();
  const MODES = [
    { k: 'starters', label: 'Starters', blurb: 'what each position produces now — red is a hole worth exploiting, blue is a surplus they can sell from' },
    { k: 'depth', label: 'Depth', blurb: 'what the first man off the bench is worth — red means a bye or a knock turns that position into a hole' },
    { k: 'shape', label: 'Shape', blurb: 'what the group looks like, and so what they would trade for: THIN needs a starter, TOP wants depth, FLAT wants a difference-maker, DEEP can sell' }
  ];
  if (!MODES.some(m => m.k === ScoutUI.mode)) ScoutUI.mode = 'starters';
  const mode = ScoutUI.mode;
  const grid = h('div', { style: { display: 'grid', gridTemplateColumns: `minmax(130px,1.5fr) repeat(${posList.length}, minmax(56px,1fr))`, gap: '2px', minWidth: (150 + posList.length * 62) + 'px' } });
  grid.appendChild(h('div'));
  posList.forEach(p => grid.appendChild(h('div.tiny.muted', { style: { textAlign: 'center', fontWeight: 660, paddingBottom: '2px' } }, p)));
  ordered.forEach(sc => {
    grid.appendChild(h('div.tiny', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', alignSelf: 'center', fontWeight: 540, cursor: 'pointer' }, onclick: () => { ScoutUI.team = sc.team.rosterId; render(); } }, sc.team.name));
    posList.forEach(p => {
      const e = sc.pos.find(x => x.pos === p) || { z: 0, startable: 0, need: 0, output: 0 };
      const d = DEPTH.byTeam[sc.team.rosterId] ? DEPTH.byTeam[sc.team.rosterId][p] : null;
      const z = mode === 'depth' && d ? d.zDepth : e.z;
      const shade = (zz, on) => zz >= 0
        ? `color-mix(in srgb, var(--s1) ${Math.round(clamp(zz / 2, 0, 1) * 62)}%, var(--surface-1))`
        : `color-mix(in srgb, var(--s8) ${Math.round(clamp(-zz / 2, 0, 1) * 62)}%, var(--surface-1))`;
      const bg = mode === 'shape' && d
        ? (d.shape === 'covered' ? 'var(--surface-1)' : `color-mix(in srgb, ${d.verdict.colour} 34%, var(--surface-1))`)
        : shade(z);
      const text = mode === 'shape' ? (d ? d.verdict.tag : '—')
        : mode === 'depth' ? (d ? fmt(d.nextUp, 1) : '—')
          : fmt(e.output, 1);
      const cell = h('div.mono', {
        tabindex: 0,
        style: {
          background: bg, textAlign: 'center', padding: '7px 4px', borderRadius: '5px', fontSize: '11.5px', fontWeight: 600, cursor: 'pointer',
          color: mode !== 'shape' && Math.abs(z) > 1.4 ? '#fff' : 'var(--text-primary)',
          border: mode === 'shape' && d && d.shape !== 'covered' ? '1px solid ' + d.verdict.colour : '1px solid transparent'
        },
        onclick: () => { ScoutUI.team = sc.team.rosterId; render(); }
      }, text);
      bindTT(cell, `<div class="k">${sc.team.name} · ${p}</div>` +
        `Starters produce <b>${fmt(e.output, 1)}</b> pts/wk (${e.rank ? ord(e.rank) : '—'} of ${S.teams.length})<br>` +
        (d ? `Next man up <b>${fmt(d.nextUp, 1)}</b> against a league ${fmt(d.lgDepth, 1)}<br>` : '') +
        `${e.startable} startable for ${e.need} slot${e.need === 1 ? '' : 's'}<br>` +
        (d ? `<b style="color:${d.verdict.colour}">${d.verdict.label}</b>${d.verdict.want ? ' — they want ' + d.verdict.want : ''}<br>${d.note}`
          : (e.hole ? '<b style="color:var(--bad-text)">A hole they should be shopping for</b>' : e.surplus ? '<b style="color:var(--good-text)">Surplus they can afford to sell from</b>' : 'Adequately covered')));
      grid.appendChild(cell);
    });
  });
  const modeRow = h('div.row', { style: { gap: '6px', marginBottom: '10px', flexWrap: 'wrap' } },
    MODES.map(m => h('button.chip' + (m.k === mode ? '.on' : ''), { onclick: () => { ScoutUI.mode = m.k; render(); } }, m.label)));
  wrap.appendChild(card('Who needs what',
    (MODES.find(m => m.k === mode) || MODES[0]).blurb + '. Click a team for the full report.',
    h('div', modeRow, scrollBox(grid),
      h('div.legend', { style: { marginTop: '11px' } },
        mode === 'shape'
          ? Object.keys(DEPTH_SHAPES).filter(k => k !== 'covered').map(k => h('span',
            h('i', { style: { background: DEPTH_SHAPES[k].colour } }),
            DEPTH_SHAPES[k].tag + ' ' + DEPTH_SHAPES[k].label.toLowerCase() + (DEPTH_SHAPES[k].want ? ' — wants ' + DEPTH_SHAPES[k].want : '')))
          : [h('span', h('i', { style: { background: 'var(--s8)' } }), mode === 'depth' ? 'Nothing behind the starters' : 'Weak — they need help here'),
          h('span', h('i', { style: { background: 'var(--surface-3)' } }), 'Covered'),
          h('span', h('i', { style: { background: 'var(--s1)' } }), mode === 'depth' ? 'Real players on the bench' : 'Strong — they can trade from it')]))));

  // ---- summary table ----
  wrap.appendChild(card('Every team at a glance', 'strategy is inferred from the roster and from the trades they have actually made',
    table([
      { k: 'name', h: 'Team', sort: r => r.team.name, f: r => teamCell(r.team) },
      { k: 'power', prio: 2, h: 'Power', num: true, sort: r => r.team.powerRank, f: r => '#' + r.team.powerRank },
      isDynasty() ? { k: 'window', prio: 2, h: 'Window', sort: r => r.team.window, f: r => h('span.tag', r.team.window) } : null,
      { k: 'strategy', h: 'Projected strategy', sort: r => r.strategy.headline, f: r => h('b.tiny', r.strategy.headline) },
      { k: 'dir', prio: 2, h: 'Trading', sort: r => r.strategy.direction.label, f: r => h('span.tiny', r.strategy.direction.label + (r.stat && r.stat.n ? ' (' + r.stat.n + ')' : '')) },
      // three pills per cell is 110px twice over on a phone; the top two carry it
      // on a phone the hole is the actionable half — it is what you can go and buy
      { k: 'strong', prio: 2, h: 'Strength', sortable: false, f: r => r.strengths.length ? h('div.row', { style: { gap: '3px' } }, r.strengths.slice(0, isNarrow() ? 2 : 3).map(x => posPill(x.pos))) : h('span.muted.tiny', '—') },
      { k: 'weak', h: 'Hole', sortable: false, f: r => r.holes.length ? h('div.row', { style: { gap: '3px' } }, r.holes.slice(0, isNarrow() ? 2 : 3).map(x => posPill(x.pos))) : h('span.muted.tiny', 'none') },
      isDynasty() ? { k: 'age', prio: 2, h: 'Age', num: true, sort: r => r.team.age || 0, f: r => r.team.age ? fmt(r.team.age, 1) : '—' } : null,
      isDynasty()
        ? { k: 'picks', prio: 2, h: 'Pick capital', num: true, sort: r => r.team.pickCapital, f: r => kfmt(Math.round(r.team.pickCapital)) }
        : { k: 'value', prio: 2, h: 'Roster value', num: true, sort: r => r.team.totalValue, f: r => kfmt(Math.round(r.team.totalValue)) }
    ], scouts, { sortKey: 'power', sortDir: 1, onRow: r => { ScoutUI.team = r.team.rosterId; render(); } })));

  // ---- selected team dossier ----
  const sc = scouts.find(x => x.team.rosterId === ScoutUI.team) || scouts[0];
  const t = sc.team;
  const dpOf = (pos) => (DEPTH.byTeam[t.rosterId] || {})[pos] || null;
  wrap.appendChild(card('Scouting report — ' + t.name, t.owner,
    h('div', { style: { display: 'grid', gap: '14px' } },
      h('div.row', { style: { gap: '9px' } },
        h('span.tag', { style: { borderColor: 'var(--s1)', color: 'var(--s1)' } }, sc.strategy.headline),
        t.window ? h('span.tag', t.window) : null,
        h('span.tag', sc.strategy.direction.label),
        h('span.tiny.muted', sc.strategy.detail)),
      h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(min(150px,100%),1fr))' } },
        kpi('Power', '#' + t.powerRank, fmt(t.power, 1) + ' rating'),
        dynOnly(kpi('Future', '#' + t.futureRank, fmt(t.futurePower, 1) + ' rating')),
        kpi(capitalLabel(), kfmt(Math.round(t.totalValue)), ord(t.valueRank) + ' of ' + S.teams.length),
        dynOnly(kpi('Pick capital', kfmt(Math.round(t.pickCapital)), (t.pickAssets || []).length + ' picks')),
        dynOnly(kpi('Core age', t.age ? fmt(t.age, 1) : '—', sc.young + ' young / ' + sc.old + ' older starters')),
        isDynasty() ? null : kpi('Starting lineup', fmt(t.now, 1), 'projected pts/week'),
        kpi('Trades made', sc.stat ? String(sc.stat.n) : '0', sc.stat && sc.stat.grade ? 'avg grade ' + sc.stat.grade : 'no trades yet')),
      table([
        { k: 'pos', h: 'Pos', f: r => posPill(r.pos), sort: r => r.pos },
        { k: 'output', h: 'Starters produce', num: true, f: r => h('b.mono', fmt(r.output, 1)) },
        { k: 'rank', prio: 2, h: 'Rank', num: true, f: r => r.rank ? ord(r.rank) : '—' },
        { k: 'depth', h: 'Startable / slots', sortable: false, f: r => h('span.mono', r.startable + ' / ' + r.need) },
        {
          k: 'next', h: 'Next man up', num: true, prio: 2,
          sort: r => (dpOf(r.pos) || {}).nextUp || 0,
          f: r => { const d = dpOf(r.pos); return d ? h('span', h('span.mono', fmt(d.nextUp, 1)), h('span.muted.tiny', ' vs ' + fmt(d.lgDepth, 1))) : h('span.muted.tiny', '—'); }
        },
        { k: 'best', prio: 2, h: 'Best', sortable: false, f: r => r.best ? pname(r.best) : h('span.muted.tiny', 'nobody') },
        {
          k: 'shape', h: 'Shape', keepSimple: true, sort: r => (dpOf(r.pos) || {}).shape || '',
          f: r => { const d = dpOf(r.pos); return d ? h('span.tag', { style: { borderColor: d.verdict.colour, color: d.verdict.colour }, title: d.note }, d.verdict.label) : h('span.muted.tiny', '—'); }
        },
        /* The old hole/surplus verdict used to sit here. Shape says everything it
           said and more, and two columns grading the same group on two slightly
           different thresholds only ever disagree in public. */
      ], sc.pos, { sortKey: 'shape', sortDir: 1 }),
      h('div.tiny.muted',
        sc.holes.length
          ? 'Approach: offer them ' + sc.holes.map(x => x.pos).join(' or ') + ' help, and ask for ' + (sc.surplus.length ? sc.surplus.map(x => x.pos).join(' or ') : 'picks') + ' back.'
          : 'No obvious hole to exploit — they are covered everywhere that matters.'))));

  /* ---- the same roster as shapes rather than totals ---- */
  const prof = depthProfile(t);
  const depthCard = proOnly(card('Starters and depth — ' + t.name,
    'each group tallest first: filled bars start, hollow bars wait. The dashed rule is what the league gets from its starters at that position, the dotted one is what the wire is worth',
    h('div',
      h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(min(236px,100%),1fr))', gap: '12px' } },
        prof.map(e => h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', padding: '10px 11px', background: 'var(--surface-1)', minWidth: 0 } },
          h('div.row', { style: { gap: '7px', marginBottom: '7px' } },
            posPill(e.pos),
            h('span.tag', { style: { borderColor: e.verdict.colour, color: e.verdict.colour } }, e.verdict.label),
            h('span', { style: { flex: 1 } }),
            e.verdict.want ? h('span.tiny.muted', 'wants ' + e.verdict.want) : null),
          depthBars(e, { colour: e.verdict.colour === 'var(--text-muted)' ? 'var(--s1)' : e.verdict.colour }),
          h('div.tiny', { style: { marginTop: '7px' } },
            h('b.mono', fmt(e.startAvg, 1)), h('span.muted', ' a slot from ' + e.n + ' starter' + (e.n === 1 ? '' : 's') + ' (lg ' + fmt(e.lgStart, 1) + ') · '),
            h('b.mono', fmt(e.nextUp, 1)), h('span.muted', ' next up (lg ' + fmt(e.lgDepth, 1) + ')')),
          h('div.tiny.muted', { style: { marginTop: '4px' } }, e.note)))),
      h('div.tiny.muted', { style: { marginTop: '10px' } },
        'A group is judged on three things rather than its total: what the starters produce against the rest of the league, '
        + 'what stands behind them, and whether anyone in it is a difference-maker — a best player a clear step above the best the rest of the league has, '
        + fmt((depthLeague().base[prof[0] ? prof[0].pos : 'QB'] || {}).elite || 0, 1) + ' a week at ' + (prof[0] ? prof[0].pos : '') + '. '
        + 'Two stars and a cliff and four of the same player both read as "covered" on output alone, and they want opposite trades. '
        + 'A slot is never counted below the dotted line, because nobody starts a player projecting nothing when the wire is there — '
        + 'so a bar under that line is a body, not a starter.'))));
  if (depthCard) wrap.appendChild(depthCard);

  /* ---- what that shape is worth at the table ---- */
  const meTeam = S.teamById[S.myRosterId] || S.teams[0];
  const mine = sc.team.rosterId === meTeam.rosterId;
  const openings = depthOpenings(meTeam);
  const rel = (mine ? openings : openings.filter(o => o.team.rosterId === sc.team.rosterId)).slice(0, mine ? 8 : 6);
  const kindTag = { depth: 'wants depth', starter: 'needs a starter', consolidate: 'wants a difference-maker' };
  wrap.appendChild(card(mine ? 'Where your shape fits the league' : 'How to trade with ' + t.name,
    mine ? 'positions where somebody else\'s shape and yours point at the same deal — priced evenly, these are the trades both sides want'
      : 'read off their shape against your roster, not off the price of the pieces',
    rel.length
      ? h('div', { style: { display: 'grid', gap: '9px' } },
        rel.map(o => h('div', {
          style: {
            display: 'grid', gridTemplateColumns: isNarrow() ? '1fr' : 'minmax(0,1fr) auto', gap: '9px', alignItems: 'center',
            border: '1px solid var(--border)', borderLeft: '3px solid ' + o.them.verdict.colour,
            borderRadius: 'var(--r-sm)', padding: '9px 11px', background: 'var(--surface-1)'
          }
        },
          h('div', { style: { minWidth: 0 } },
            h('div.row', { style: { gap: '7px', flexWrap: 'wrap' } },
              posPill(o.pos),
              mine ? h('b.tiny', o.team.name) : null,
              h('span.tag', { style: { borderColor: o.them.verdict.colour, color: o.them.verdict.colour } }, kindTag[o.kind]),
              h('span.tiny.muted', 'you send'), pname(o.offer)),
            h('div.tiny.muted', { style: { marginTop: '5px' } }, o.why)),
          h('button.btn.sm', {
            onclick: () => {
              FinderUI.team = meTeam.rosterId; FinderUI.partners = [o.team.rosterId];
              FinderUI.focus = o.offer.id; FinderUI.positions = [];
              FinderUI.shape = o.kind === 'consolidate' ? 'consolidate' : 'any';
              FinderUI.results = null; S.view = 'finder'; render(); window.scrollTo(0, 0);
            }
          }, 'Build it'))))
      : h('div.empty', mine
        ? 'Nobody in the league is shaped the opposite way to you right now — no position where their gap is your spare.'
        : 'Their groups are the same shape as yours, so there is no depth-for-star deal here. The value finder is the way in.')));
  return wrap;
}

/* ================= 12. TRADE HISTORY ================= */
const TradesUI = { team: null };
function viewTrades() {
  const wrap = h('div.grid');
  const { list, trades } = traderStats();
  if (!trades.length) {
    wrap.appendChild(card('Trade history', null, h('div.empty',
      h('div', { style: { fontWeight: 600, color: 'var(--text-secondary)' } }, 'No completed trades yet'),
      h('div.tiny', { style: { marginTop: '6px', maxWidth: '520px', margin: '6px auto 0' } },
        'Sleeper reports no completed trades in this league’s current season. If the league has run before, earlier trades live under the previous season’s league and are not loaded here.'))));
    return wrap;
  }
  const graded = list.filter(x => x.n > 0);
  const best = graded.slice().sort((a, b) => b.avgScore - a.avgScore)[0];
  const busiest = graded.slice().sort((a, b) => b.n - a.n)[0];
  const richest = graded.slice().sort((a, b) => b.net - a.net)[0];

  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(min(160px,100%),1fr))' } },
    kpi('Completed trades', String(trades.length), graded.length + ' of ' + S.teams.length + ' managers involved'),
    kpi('Most active', busiest ? busiest.team.name : '—', busiest ? busiest.n + ' trade' + (busiest.n === 1 ? '' : 's') : ''),
    kpi('Best trader', best ? best.team.name : '—', best ? 'average grade ' + best.grade : '',
      '<div class="k">How this is scored</div>Average of their per-trade grades, which combine the value swing at today’s prices with how well the pieces fit the roster.'),
    kpi('Biggest value gain', richest ? richest.team.name : '—', richest ? sgn(Math.round(richest.net), 0) + ' at today’s prices' : ''),
    kpi('Assets moved', String(sum(trades.map(t => sum(t.sides.map(s => s.got.length))))), 'players, picks and FAAB')
  ));

  wrap.appendChild(card('A note on grades', null, h('div.tiny.sec',
    'Every asset is priced at ', h('b', 'today’s'), ' market, so these grades are hindsight — they say how a trade looks now, not whether it was a good decision when it was made. '
    + 'A manager who sold a player before he got hurt will grade badly here and was still right. Need fit is judged against each roster as it stands now, for the same reason.')));

  // ---- every trade ----
  const assetChip = (a, dim) => h('div.asset', { style: { cursor: 'default', opacity: dim ? .75 : 1 } },
    a.kind === 'faab' ? h('span.pill.pos-NA', 'FAAB') : posPill(a.pos),
    a.kind === 'player' && a.ref ? pname(a.ref, { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } })
      : h('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, a.name),
    a.kind === 'pick' && a.slotLabel ? h('span.tiny.muted', { style: { flex: 'none' } }, 'proj ' + a.slotLabel) : null,
    a.value ? h('span.v', kfmt(Math.round(a.value))) : null);

  const gradeChip = (g) => {
    const good = /^A/.test(g), bad = /^[DF]/.test(g);
    return h('span.tag', {
      style: {
        fontWeight: 700, fontSize: '12px', padding: '2px 8px',

    { k: 'ageIn', prio: 2, h: 'Age acquired', num: true, sort: r => r.ageFlow || 0, f: r => r.ageFlow ? fmt(r.ageFlow, 1) : '—' },
    { k: 'ageOut', prio: 2, h: 'Age sent', num: true, sort: r => r.ageSent || 0, f: r => r.ageSent ? fmt(r.ageSent, 1) : '—' },
    { k: 'partner', prio: 2, h: 'Trades most with', sortable: false, f: r => r.topPartner && r.topPartner.team ? h('span.tiny', r.topPartner.team.name + ' (' + r.topPartner.n + ')') : h('span.muted.tiny', '—') }
  ], list, { sortKey: 'n', sortDir: -1 })));

/* ---------- leverage: which games actually decide the season ---------- */
const LevUI = { week: 'all', n: 6 };
/** One game that moves the season: who plays, and where both teams stand in each of the two worlds it leaves behind. */
function levGameCard(g, i, res) {
  const A = g.a.team, B = g.b.team;
  const total = (g.nA || 0) + (g.nB || 0);
  const ok = v => v !== null && v !== undefined;
  const tag = g.thin ? ['too lopsided to weigh', 'var(--text-muted)']
    : g.swing > 0.22 ? ['season-defining', 'var(--critical)'] : g.swing > 0.12 ? ['big one', 'var(--s4)'] : g.swing < 0.04 ? ['low stakes', 'var(--text-muted)'] : null;
  const lead = Math.abs(g.a.swing) >= Math.abs(g.b.swing) ? g.a : g.b;
  const heavy = (g.nA || 0) >= (g.nB || 0) ? A : B;
  const sentence = g.thin
    ? `${heavy.name} win this in ${pct(Math.max(g.nA || 0, g.nB || 0) / Math.max(1, total), 0)} of simulated seasons, so there is no second world to compare the first one against.`
    : `${lead.team.name} ${lead.swing >= 0.005 ? 'go from ' + pct(lead.poLose, 0) + ' to ' + pct(lead.poWin, 0) + ' to make the playoffs' : 'barely move either way'}`
    + (Math.abs(lead.titleSwing) > 0.004 ? `, and from ${pct(lead.tiLose, 1)} to ${pct(lead.tiWin, 1)} to win it` : '')
    + '.';
  const cell = (po, ti, win) => !ok(po) ? h('div.lev-c.na', '—')
    : h('div.lev-c' + (win ? '.win' : ''),
      h('div.lev-top', h('b.mono', pct(po, 0)), h('span.tiny.muted', ' playoffs')),
      h('div.bar-track', h('div.bar-fill', { style: { width: (clamp(po, 0, 1) * 100) + '%', background: win ? 'var(--s1)' : 'var(--text-muted)' } })),
      h('div.tiny.muted', pct(ti, 1) + ' title'));
  const head = (T) => h('div.lev-h', h('span.tiny.muted', 'If'), teamFace(T, 20), h('b.tiny', T.short), h('span.tiny.muted', 'wins'));
  const row = (T, w0, w1) => [h('div.lev-t', teamFace(T, 30), h('b.tiny', T.short)), w0, w1];
  const gridEl = h('div.levgrid', h('span'), head(A), head(B),
    row(A, cell(g.a.poWin, g.a.tiWin, true), cell(g.a.poLose, g.a.tiLose, false)),
    row(B, cell(g.b.poLose, g.b.tiLose, false), cell(g.b.poWin, g.b.tiWin, true)));
  const miss0 = !ok(g.a.poWin) || !ok(g.b.poLose), miss1 = !ok(g.a.poLose) || !ok(g.b.poWin);
  const next = g.week === res.fromWeek;
  return h('div.levcard',
    h('div.row', { style: { gap: '7px', flexWrap: 'wrap' } },
      h('b.mono.tiny', '#' + (i + 1)),
      h('span.tag', { style: { borderColor: next ? 'var(--s1)' : null, color: next ? 'var(--s1)' : null } }, 'Week ' + g.week + (next ? ' · next up' : '')),
      tag ? h('span.tag', { style: { borderColor: tag[1], color: tag[1] } }, tag[0]) : null,
      h('span', { style: { flex: 1 } }),
      h('span.tiny.muted', 'up to ' + pct(g.swing, 0) + ' of playoff odds on the line')),
    h('div.levvs', teamFace(A, 34), h('b.levnm', A.name), h('span.tiny.muted', 'v'), h('b.levnm', B.name), teamFace(B, 34)),
    gridEl,
    miss0 ? levUnmeasured(A.name, g.nA || 0, total) : null,
    miss1 ? levUnmeasured(B.name, g.nB || 0, total) : null,
    h('div.tiny.sec', { style: { borderTop: '1px solid var(--border)', paddingTop: '8px' } }, sentence));
}
function simLeverageCard(res) {
  if (!res.leverage || !res.leverage.length) return null;
  const weeks = []; for (let w = res.fromWeek; w <= S.regEnd; w++) if (res.leverage.some(g => g.week === w)) weeks.push(w);
  if (LevUI.week !== 'all' && !weeks.includes(LevUI.week)) LevUI.week = 'all';
  const picked = LevUI.week === 'all' ? res.leverage : res.leverage.filter(g => g.week === LevUI.week);
  const shown = picked.slice(0, LevUI.n);

  const opts = [{ k: 'all', label: 'Rest of season' }].concat(weeks.map(w => ({ k: w, label: 'Wk ' + w })));
  const controls = h('div.row', { style: { gap: '12px', marginBottom: '12px' } },
    h('div.segscroll', segmented(opts, LevUI.week, k => { LevUI.week = k; LevUI.n = 6; render(); })),
    h('span', { style: { flex: 1 } }),
    h('span.tiny.muted', picked.length + ' game' + (picked.length === 1 ? '' : 's') + ' weighed'));

  const body = h('div', { style: { display: 'grid', gap: '12px' } }, shown.map((g, i) => levGameCard(g, i, res)));

  const more = picked.length > shown.length
    ? h('div.row', { style: { marginTop: '11px', justifyContent: 'center' } },
      h('button.btn.sm', { onclick: () => { LevUI.n += 6; render(); } }, 'Show ' + Math.min(6, picked.length - shown.length) + ' more'))
    : null;

  // the whole remaining season at a glance, so nothing is hidden behind the top six
  const allTbl = table([
    { k: 'week', h: 'Week', num: true, sort: g => g.week, f: g => h('b.mono', g.week) },
    { k: 'game', h: 'Matchup', sortable: false, f: g => h('div.row', { style: { gap: '5px', minWidth: 0 } }, h('span.tiny', g.a.team.short), h('span.tiny.muted', 'v'), h('span.tiny', g.b.team.short)) },
    { k: 'swing', h: 'Playoff swing', num: true, sort: g => g.swing, f: g => g.thin
      ? h('span.muted.tiny', { title: 'one outcome barely happens in the simulation, so the two cannot be compared' }, 'not weighable')
      : h('div.meter', { style: { justifyContent: 'flex-end' } },
        isNarrow() ? null : h('div.bar-track', { style: { width: '64px' } }, h('div.bar-fill', { style: { width: (clamp(g.swing / 0.35, 0, 1) * 100) + '%', background: g.swing > 0.22 ? 'var(--critical)' : g.swing > 0.12 ? 'var(--s4)' : 'var(--seq-300)' } })),
        h('b.mono', pct(g.swing, 0))) },
    { k: 'title', prio: 2, h: 'Title swing', num: true, sort: g => Math.max(Math.abs(g.a.titleSwing), Math.abs(g.b.titleSwing)), f: g => g.thin ? h('span.muted', '—') : pct(Math.max(Math.abs(g.a.titleSwing), Math.abs(g.b.titleSwing)), 1) },
    { k: 'fav', prio: 2, h: 'Most at stake', sortable: false, f: g => h('span.tiny', (Math.abs(g.a.swing) >= Math.abs(g.b.swing) ? g.a : g.b).team.name) }
  ], picked, { sortKey: 'swing', sortDir: -1 });
  const wt = withTable(h('div', controls, body, more), allTbl);

  return card(LevUI.week === 'all' ? 'Games that matter most — rest of season' : 'Games that matter most — week ' + LevUI.week,
    'every simulated season is split by who won each game, then read back. Each box is one of the two worlds the game leaves behind: where both teams stand if it goes that way.',
    wt.body, wt.btn);
}

/* ---------- playoff odds through the season ---------- */
function simTrajectoryCard(res) {
  const start = res.fromWeek, end = S.regEnd;
  if (end - start < 1) return null;
  const teams = S.teams.slice().sort((a, b) => res.by[b.rosterId].playoff - res.by[a.rosterId].playoff);
  const colors = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s7)'];
  const featured = teams.slice(0, 5).concat(teams.slice(-1));
  const colorOf = {}; featured.forEach((t, i) => colorOf[t.rosterId] = colors[i % colors.length]);
  // anchor the line on where the table actually stands right now, so the chart
  // reads as a race in progress rather than starting from nowhere
  const nowField = new Set(S.teams.slice()
    .sort((a, b) => (b.wins + 0.5 * b.ties) - (a.wins + 0.5 * a.ties) || b.fpts - a.fpts)
    .slice(0, res.playoffTeams).map(t => t.rosterId));
  const anchor = S.lastWeek >= 1 ? S.lastWeek : null;
  const pts = (t) => {
    const a = [];
    if (anchor) a.push({ x: anchor, y: nowField.has(t.rosterId) ? 100 : 0, label: 'Week ' + anchor + ' (actual)' });
    for (let w = start; w <= end; w++) a.push({ x: w, y: res.by[t.rosterId].fieldAt[w] * 100, label: 'Week ' + w });
    return a;
  };
  const bg = teams.filter(t => !colorOf[t.rosterId]).map(t => ({ name: t.name, color: 'var(--text-muted)', width: 1, opacity: .28, points: pts(t) }));
  const fg = featured.map(t => ({ name: t.name, color: colorOf[t.rosterId], width: 2, points: pts(t) }));
  const chart = lineChart(bg.concat(fg), {
    h: 250, dots: false, maxTip: 12, y0: 0, y1: 100, floorAtZero: true,
    yFmt: v => Math.round(v) + '%', xFmt: v => 'Wk ' + Math.round(v), xTicks: Math.min(6, end - start + (anchor ? 1 : 0)),
    aria: 'odds of sitting in the playoff field after each week'
  });
  const legend = h('div.legend', { style: { marginTop: '8px' } },
    featured.map(t => h('span', h('i', { style: { background: colorOf[t.rosterId] } }), t.name))
      .concat(bg.length ? [h('span', h('i', { style: { background: 'var(--text-muted)', opacity: .3 } }), bg.length + ' more')] : []));
  const tbl = table([
    { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) }
  ].concat(Array.from({ length: end - start + 1 }, (_, i) => ({
    k: 'w' + (start + i), h: 'W' + (start + i), num: true,
    sort: r => res.by[r.t.rosterId].fieldAt[start + i],
    f: r => pct(res.by[r.t.rosterId].fieldAt[start + i], 0)
  }))), teams.map(t => ({ t })), {});
  const wt = withTable(h('div', chart, legend), tbl);
  return card('Playoff position, week by week',
    'the share of simulated seasons in which each team is inside the cut with the season paused at that week'
    + (anchor ? ' — week ' + anchor + ' is where the real table stands today' : ''),
    wt.body, wt.btn);
}

/* ---------- seed distribution ---------- */
function simSeedCard(res) {
  const n = S.teams.length;
  const teams = S.teams.slice().sort((a, b) => res.by[a.rosterId].seed - res.by[b.rosterId].seed);
  const cols = Array.from({ length: n }, (_, i) => String(i + 1));
  const grid = heat(teams, cols, (t, c) => res.by[t.rosterId].seedDist[+c] * 100, {
    rowLabel: t => t.name,
    fmt: v => v < 0.5 ? '·' : Math.round(v) + '',
    tip: (t, c, v) => `<div class="k">${t.name} · ${ord(+c)} seed</div><b>${fmt(v, 1)}%</b> of simulated seasons`
      + (+c <= res.playoffTeams ? '<br>inside the playoff cut' : '<br>missed the playoffs')
  });
  return card('Where everyone finishes', 'percentage of simulated seasons ending at each seed — ' + res.playoffTeams + ' make the bracket',
    h('div', grid, h('div', { style: { marginTop: '10px' } }, seqLegend('never', 'often', 'Share of seasons'))));
}

/* ---------- schedule luck and strength ---------- */
function simLuckCard(res) {
  if (!res.simWeeks) return null;
  const rows = S.teams.map(t => ({ t, s: res.by[t.rosterId] })).filter(r => r.s.allPlayPct !== null);
  if (!rows.length) return null;
  const sos = rows.map(r => r.s.sos).filter(v => v !== null);

  const bars = rows.slice().sort((a, b) => b.s.luck - a.s.luck).map(r => ({

      h('div.tiny.muted', { style: { marginTop: '10px' } },

      table([
        { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) },
        { k: 'allplay', h: 'Beats', num: true, tip: 'Share of the league this team outscores in a typical remaining week', sort: r => r.s.allPlayPct, f: r => pct(r.s.allPlayPct, 0) },
        { k: 'w', h: 'Proj W', num: true, sort: r => r.s.simWins, f: r => h('b.mono', fmt(r.s.simWins, 1)) },
        { k: 'luck', h: 'Schedule', num: true, sort: r => r.s.luck, f: r => deltaTag(r.s.luck, 2, ' W') },

        { k: 'pf', prio: 2, h: 'Season PF range', num: true, sortable: false, f: r => h('span.tiny.mono.muted', fmt(r.s.ptsP10, 0) + '–' + fmt(r.s.ptsP90, 0)) }
      ], rows, { sortKey: 'luck', sortDir: -1 })));
}

/* ---------- still alive ---------- */
function simAliveCard(res) {
  const start = res.fromWeek, end = S.regEnd;
  if (end - start < 2) return null;
  const rows = S.teams.map(t => {
    const s = res.by[t.rosterId];
    let outWeek = null;
    for (let w = start; w <= end; w++) if (s.aliveAt[w] < 0.5) { outWeek = w; break; }
    return { t, s, outWeek };
  }).sort((a, b) => (b.outWeek === null ? 99 : b.outWeek) - (a.outWeek === null ? 99 : a.outWeek) || b.s.playoff - a.s.playoff);
  const anyOut = rows.some(r => r.outWeek !== null);
  if (!anyOut) return null;
  return card('When the maths runs out',
    'the first week by which more than half the simulations have a team unable to reach the cut line on wins alone',
    table([
      { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) },
      { k: 'out', h: 'Out of it by', sort: r => r.outWeek === null ? 99 : r.outWeek, f: r => r.outWeek === null ? h('span.tag', { style: { borderColor: 'var(--good)', color: 'var(--good-text)' } }, 'alive all season') : h('b', 'week ' + r.outWeek) },
      { k: 'playoff', h: 'Playoffs', num: true, sort: r => r.s.playoff, f: r => pct(r.s.playoff, 0) },
      { k: 'alive', prio: 2, h: 'Alive at the end', num: true, sort: r => r.s.aliveAt[S.regEnd], f: r => pct(r.s.aliveAt[S.regEnd], 0) }
    ], rows, { sortKey: 'out', sortDir: -1 }));
}

/* ---------- the week ranked: close games, mismatches, upsets ---------- */
function simWeekRankCard(res) {
  const games = (schedule()[res.onlyWeek - 1] || []);
  if (games.length < 2) return null;
  const rows = games.map(([a, b]) => {
    const A = S.teamById[a], B = S.teamById[b], ra = res.by[a], rb = res.by[b];
    if (!A || !B || !ra || !rb) return null;
    // the two score arrays are run-for-run aligned, so the margin needs no extra simulation
    const n = Math.min(ra.weekScores.length, rb.weekScores.length);
    const m = new Array(n);
    for (let i = 0; i < n; i++) m[i] = ra.weekScores[i] - rb.weekScores[i];
    m.sort((x, y) => x - y);
    const q = (p) => m[clamp(Math.floor(p * (n - 1)), 0, n - 1)];
    const favA = ra.weekWin >= rb.weekWin;
    return {
      A, B, ra, rb, favA,
      fav: favA ? A : B, dog: favA ? B : A,
      favP: Math.max(ra.weekWin, rb.weekWin),
      margin: Math.abs(q(0.5)),
      close: m.filter(x => Math.abs(x) <= 10).length / n,
      swing: Math.abs(ra.weekWin - rb.weekWin)
    };
  }).filter(Boolean);
  if (!rows.length) return null;
  const tightest = rows.slice().sort((x, y) => x.swing - y.swing)[0];
  const widest = rows.slice().sort((x, y) => y.swing - x.swing)[0];
  return card('The week at a glance',
    `closest game: ${tightest.A.short} v ${tightest.B.short} · biggest mismatch: ${widest.fav.short} over ${widest.dog.short}`,
    table([
      { k: 'game', h: 'Matchup', sortable: false, f: r => h('div.row', { style: { gap: '5px', minWidth: 0 } },
        h('b.tiny', r.fav.short), h('span.tiny.muted', 'v'), h('span.tiny', r.dog.short)) },
      { k: 'fav', h: 'Favourite', sortable: false, prio: 2, f: r => teamCell(r.fav, { sub: false }) },
      { k: 'p', h: 'Win prob', num: true, sort: r => r.favP, f: r => h('b.mono', pct(r.favP, 0)) },
      { k: 'margin', h: 'Median margin', num: true, sort: r => r.margin, f: r => h('span.mono', fmt(r.margin, 1)) },
      { k: 'close', h: 'One-score', num: true, tip: 'Chance the game finishes within ten points', sort: r => r.close, f: r => pct(r.close, 0) },
      { k: 'upset', h: 'Upset', num: true, sort: r => 1 - r.favP, f: r => {
        const u = 1 - r.favP;
        return h('span', { class: u > 0.4 ? 'up mono' : 'mono muted' }, pct(u, 0));
      } }
    ], rows, { sortKey: 'p', sortDir: 1 }));
}

/* ================= 12. HEAD TO HEAD ================= */
const H2HUI = { a: null, b: null, week: null, sims: 4000, res: null };

/** One week, both teams, many times: the distribution of the margin between them. */
function h2hSim(A, B, wk, n) {
  /* A week already under way is part settled: the finished games are banked and
     only the open slots are drawn, which is what makes the odds move as Sunday runs. */
  const live = wk === S.liveWeek;
  const lineup = (T) => {
    if (live) {
      const lr = liveRoster(T, wk);
      return { banked: lr.banked, arr: lr.open.map(r => ({ m: r.used, sd: volFromMean(r.p.pos, r.used) })) };
    }
    return {
      banked: 0,
      arr: optimalLineup(withReturners(activePlayers(T), T, wk), p => pw(p, wk))
        .map(s => {
          const pos = s.player ? s.player.pos : (SLOT_ELIG[s.slot] || [s.slot])[0];
          let m = s.player ? pw(s.player, wk) : 0;
          if (m <= 0.05) m = STREAM[pos] !== undefined ? STREAM[pos] : 0;
          return { m, sd: volFromMean(pos, m) };
        }).filter(x => x.m > 0.05)
    };
  };
  const la = lineup(A), lb = lineup(B);
  const draw = (l) => {
    let s = 0;
    for (let k = 0; k < l.arr.length; k++) { if (rnd() < BUST_RATE) continue; s += drawScore(l.arr[k].m, l.arr[k].sd); }
    return l.banked + Math.max(0, s * Math.max(0.55, 1 + 0.05 * gauss()));
  };
  seedRng(hashStr(A.rosterId + '|' + B.rosterId + '|' + wk) >>> 0);
  const margins = new Float64Array(n), sa = new Float64Array(n), sb = new Float64Array(n);
  let wins = 0, ties = 0;
  for (let i = 0; i < n; i++) {
    const x = draw(la), y = draw(lb);
    sa[i] = x; sb[i] = y; margins[i] = x - y;
    if (x > y) wins++; else if (x === y) ties++;
  }
  const q = (arr, p) => { const a = Array.from(arr).sort((x, y) => x - y); return a[clamp(Math.floor(p * (a.length - 1)), 0, a.length - 1)]; };
  const marr = Array.from(margins);
  return {
    n, pA: wins / n, pB: (n - wins - ties) / n, tie: ties / n,
    meanA: mean(Array.from(sa)), meanB: mean(Array.from(sb)),
    medMargin: q(margins, .5), loMargin: q(margins, .1), hiMargin: q(margins, .9),
    blowoutA: marr.filter(m => m > 30).length / n, blowoutB: marr.filter(m => m < -30).length / n,
    closeGame: marr.filter(m => Math.abs(m) <= 10).length / n,
    margins: marr, aScores: Array.from(sa), bScores: Array.from(sb)
  };
}

/** The weeks these two are scheduled against each other. */
function weeksBetween(A, B) {
  const sched = schedule(), out = [];
  for (let w = 1; w <= S.regEnd; w++) {
    const games = sched[w - 1] || [];
    if (games.some(g => (g[0] === A.rosterId && g[1] === B.rosterId) || (g[1] === A.rosterId && g[0] === B.rosterId))) out.push(w);
  }
  return out;
}

/** Every time these two have actually played. */
function h2hHistory(A, B) {
  const out = [];
  for (let w = 1; w <= S.lastWeek; w++) {
    const ms = S.matchups[w] || [];
    const ma = ms.find(m => m.roster_id === A.rosterId), mb = ms.find(m => m.roster_id === B.rosterId);
    if (!ma || !mb) continue;
    if (ma.matchup_id === null || ma.matchup_id === undefined || ma.matchup_id !== mb.matchup_id) continue;
    out.push({ week: w, a: ma.points || 0, b: mb.points || 0 });
  }
  return out;
}

        { k: 'd', h: 'Margin', num: true, sort: g => g.a - g.b, f: g => deltaTag(g.a - g.b, 1) }
      ], hist, { sortKey: 'week', sortDir: 1 })));
  }

  /* ---- do they match up as trade partners? ---- */
  const scA = scoutTeam(A), scB = scoutTeam(B);
  const fits = [];
  scA.holes.forEach(hA => { const sB = scB.surplus.find(x => x.pos === hA.pos); if (sB) fits.push({ from: B, to: A, pos: hA.pos, z: sB.z - hA.z }); });
  scB.holes.forEach(hB => { const sA = scA.surplus.find(x => x.pos === hB.pos); if (sA) fits.push({ from: A, to: B, pos: hB.pos, z: sA.z - hB.z }); });
  wrap.appendChild(card('Do they fit as trade partners?',
    fits.length ? 'each of these is a position one of them is deep at and the other is thin at' : null,
    fits.length
      ? h('div', { style: { display: 'grid', gap: '7px' } }, fits.sort((x, y) => y.z - x.z).map(f =>
        h('div.row', { style: { gap: '8px', border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', padding: '8px 10px', background: 'var(--surface-2)' } },
          posPill(f.pos), h('b.tiny', f.from.name), h('span.tiny.muted', '→'), h('b.tiny', f.to.name),
          h('span', { style: { flex: 1 } }),
          h('span.tiny.muted', 'gap ' + fmt(f.z, 1) + ' SD'),
          h('button.btn.sm', {

              S.view = 'finder'; render(); window.scrollTo(0, 0);

      : h('div.empty', 'Neither team is deep where the other is thin — a trade here would have to be about value, not need.')));
  return wrap;

/* ================= next year's draft order ================= */
/** The soonest draft any roster still holds a pick in. */
function nextDraftSeason() {
  let best = null;
  S.teams.forEach(t => (t.pickAssets || []).forEach(pk => { if (best === null || pk.season < best) best = pk.season; }));
  return best;
}
/** Who actually holds the pick a given team originally owned. */
function pickHolder(origRosterId, season, round) {
  for (const t of S.teams) {
    const hit = (t.pickAssets || []).find(pk => pk.origRosterId === origRosterId && pk.season === season && pk.round === round);
    if (hit) return t;
  }
  return null;   // not held by anyone in this league — already used, or outside the window
}

/** Where each team is heading in the next draft, and who will actually be making
 *  the pick. The order comes out of the same simulation as everything else. */
function simDraftCard(res) {
  const rows = S.teams.map(t => ({ t, s: res.by[t.rosterId] }))
    .filter(r => r.s && r.s.draftSlot > 0);
  if (!rows.length) return null;
  rows.sort((a, b) => a.s.draftSlot - b.s.draftSlot);
  const season = nextDraftSeason();
  // the rounds this league actually drafts, as far as anyone still holds picks
  const rounds = [];
  if (season !== null) {
    S.teams.forEach(t => (t.pickAssets || []).forEach(pk => {
      if (pk.season === season && !rounds.includes(pk.round)) rounds.push(pk.round);
    }));
    rounds.sort((a, b) => a - b);
  }
  const slotLabel = (v) => Math.round(v * 10) / 10;
  const modal = (d) => { let b = 1; for (let i = 1; i < d.length; i++) if (d[i] > d[b]) b = i; return b; };
  // the slots holding the middle 80% of the outcomes
  const band = (d) => {
    const cum = []; let run = 0;
    for (let i = 1; i < d.length; i++) { run += d[i]; cum[i] = run; }
    let lo = 1, hi = d.length - 1;
    for (let i = 1; i < d.length; i++) if (cum[i] >= 0.1) { lo = i; break; }
    for (let i = 1; i < d.length; i++) if (cum[i] >= 0.9) { hi = i; break; }
    return { lo, hi };
  };

  const heldCell = (r) => {
    if (!isDynasty() || season === null) return h('span.muted.tiny', '—');
    const away = [];
    rounds.forEach(rd => {
      const holder = pickHolder(r.t.rosterId, season, rd);
      if (holder && holder.rosterId !== r.t.rosterId) away.push({ rd, holder });
    });
    if (!away.length) return h('span.tiny.muted', 'all their own');

/* ==================================================================
   Live week — actual points where the games are finished, projections
   where they are not.
   ================================================================== */

/* Sleeper publishes the NFL schedule with a status per game. Without it there is
   no honest way to tell "scored zero" from "has not kicked off yet". */
async function loadNflSchedule(season) {
  const key = 'nflsched:' + season;
  const rec = await idbGet(key);
  const FRESH = 8 * 60 * 1000;          // statuses move during a game day
  if (rec && Date.now() - rec.t < FRESH && rec.d) return rec.d;
  try {
    const j = await getJSON('https://api.sleeper.app/schedule/nfl/regular/' + season, 2);
    if (!Array.isArray(j) || !j.length) return (rec && rec.d) || null;
    const out = {};
    j.forEach(g => {
      const w = +g.week; if (!w) return;
      out[w] = out[w] || {};
      if (g.home) out[w][g.home] = { status: g.status, date: g.date, opp: g.away, home: true };
      if (g.away) out[w][g.away] = { status: g.status, date: g.date, opp: g.home, home: false };
    });
    await idbSet(key, { t: Date.now(), d: out });
    return out;
  } catch (e) { return (rec && rec.d) || null; }
}
/* The per-week scores feed carries what the season schedule does not: a real
   kickoff time and a live quarter. That is what makes slates and in-game
   proration possible. */
async function loadWeekScores(season, week) {
  const key = 'nflscores:' + season + ':' + week;
  const rec = await idbGet(key);
  const FRESH = 3 * 60 * 1000;
  if (rec && Date.now() - rec.t < FRESH && rec.d) return rec.d;
  try {
    const j = await getJSON(`https://api.sleeper.app/scores/nfl/regular/${season}/${week}`, 2);
    if (!Array.isArray(j) || !j.length) return (rec && rec.d) || null;
    const games = j.map(g => {
      const m = g.metadata || {};
      const q = m.quarter_num !== undefined && m.quarter_num !== null ? +m.quarter_num : null;
      return {
        id: g.game_id, start: g.start_time || (m.date_time ? Date.parse(m.date_time) : null),
        status: g.status, home: m.home_team, away: m.away_team,
        over: !!m.is_over || GAME_OVER[g.status] === 1,
        inProgress: !!m.is_in_progress, started: !!m.has_started,
        quarter: m.quarter || null, quarterNum: q
      };
    }).filter(g => g.home && g.away);
    const out = { games: games, byTeam: {} };
    games.forEach(g => { out.byTeam[g.home] = g; out.byTeam[g.away] = g; });
    await idbSet(key, { t: Date.now(), d: out });
    return out;
  } catch (e) { return (rec && rec.d) || null; }
}
/** Pull the scores feed for a week if it is not already in hand. */
async function ensureWeekScores(wk) {

  // kickoff times are what the trace is cut on, so a path built before the feed
  // arrived is built from the wrong clock — throw it away with the rest
  if (got) { S.weekScores[wk] = got; S._live = null; S._wpPath = null; }

}
function weekScoreGame(team, wk) {

}
const GAME_OVER = { complete: 1, canceled: 1, postponed: 1 };
function nflGame(team, wk) {

}
/** Has any game in this NFL week finished or kicked off? */
function weekStarted(wk) {

  if (s) return Object.keys(s).some(t => s[t].status !== 'pre_game');
  return !!(S.matchups[wk] || []).some(m => (m.points || 0) > 0);
}
/** Are all of this NFL week's games done? */
function weekFinished(wk) {

  if (s) { const ks = Object.keys(s); return ks.length > 0 && ks.every(t => GAME_OVER[s[t].status]); }

/* Which starters a team fields in a given week. Sleeper reports the lineup the

   arrived the stored lineup is stale, so the optimiser stands in. */
function startersFor(t, wk) {

  if (m && Array.isArray(m.starters) && wk <= Math.max(S.lastWeek, S.liveWeek || 0)) {
    const ids = m.starters.filter(id => id && id !== '0');
    if (ids.length) return ids.map(id => S.index[id] || ensurePlayer(id));

   projection still stands — mixing a half-played line into a final score would

  const key = t.rosterId + '|' + wk;

  if (S._live[key]) return S._live[key];
  const m = (S.matchups[wk] || []).find(x => x.roster_id === t.rosterId);
  const pts = (m && m.players_points) || {};

  try {

      sl(`/league/${S.leagueId}/matchups/${wk}`).catch(() => null),
      (async () => { await idbSet('nflsched:' + S.season, null); return loadNflSchedule(S.season); })()

/** The lineup a manager actually has set, paired with the league's starting slots. */

/* Both sides of a matchup already split into points that are banked and slots

  if (day === 'Sat') return 'Sat';
  if (day === 'Mon') return 'MNF';
  if (day === 'Tue' || day === 'Wed') return day;
  if (hour < 12) return 'Sun AM';
  if (hour < 15) return 'Sun early';
  if (hour < 19) return 'Sun late';
  return 'SNF';
}
/** The week's kickoff windows, in order, with how many games each carries. */
function weekSlates(wk) {
  const ws = S.weekScores && S.weekScores[wk];
  if (ws && ws.games.length && ws.games.every(g => g.start)) {
    const by = {};
    ws.games.forEach(g => {
      const k = slateLabel(g.start);
      by[k] = by[k] || { label: k, start: g.start, n: 0, done: 0 };
      by[k].start = Math.min(by[k].start, g.start);
      by[k].n++; if (g.over) by[k].done++;
    });
    return Object.values(by).sort((a, b) => a.start - b.start);
  }
  // no kickoff times: fall back to one window per distinct game date
  const sc = S.nflSched && S.nflSched[wk];
  if (!sc) return [];
  const by = {};
  Object.keys(sc).forEach(t => {
    const d = sc[t].date; if (!d) return;
    const ms = Date.parse(d + 'T17:00:00Z');
    const k = slateLabel(ms);
    by[k] = by[k] || { label: k, start: ms, n: 0, done: 0 };
    by[k].n += 0.5; if (GAME_OVER[sc[t].status]) by[k].done += 0.5;
  });
  return Object.values(by).sort((a, b) => a.start - b.start);
}
/** How many of the week's games are finished. */
function weekGamesDone(wk) {
  const ws = S.weekScores && S.weekScores[wk];
  if (ws) return { done: ws.games.filter(g => g.over).length, total: ws.games.length };
  const sc = S.nflSched && S.nflSched[wk];
  if (!sc) return { done: 0, total: 0 };
  const ks = Object.keys(sc);
  return { done: ks.filter(t => GAME_OVER[sc[t].status]).length / 2, total: ks.length / 2 };
}

/* ---------- the week's own probability path ----------
   Nothing upstream keeps an intra-week win-probability trace, so this used to be
   recorded: one reading per visit, kept in this browser. That made the chart a
   record of when somebody was watching rather than of what happened — a week
   nobody had open had no chart at all, the same week looked different on a
   phone and a laptop, and every past week was blank forever.

   None of that is necessary, because the week itself remembers enough. We know
   when every game kicked off, what each player actually scored, and what he was
   projected for before he played. Wind the clock back to any moment and the sum
   is the one the live view already computes: everyone whose game had finished
   counts at his real score, everyone else counts at his projection. So the
   trace is derived rather than recorded — the same on every device, and there
   for every week whether or not anyone watched it.

   What it cannot rebuild is the inside of a game. Nothing upstream keeps a
   history of who had how many points at half time, so between one whistle and
   the next the line is flat by construction, and the path is cut at the moments
   the picture actually changed: the end of each kickoff window. */

const GAME_LEN = 3 * 3600 * 1000 + 15 * 60 * 1000;   // kickoff to final whistle

/** When one player's game is reckoned to have ended, or null if unknown. */
function gameEnd(p, wk) {
  const sg = weekScoreGame(p && p.team, wk);
  if (sg && sg.start) return sg.start + GAME_LEN;
  const g = nflGame(p && p.team, wk);
  if (g && g.date) return Date.parse(g.date + 'T17:00:00Z') + GAME_LEN;
  return null;
}
/** Is his game over in fact — not at some earlier moment, but now? */
function gameOver(p, wk) {
  const sg = weekScoreGame(p && p.team, wk);
  if (sg) return !!sg.over;
  const g = nflGame(p && p.team, wk);
  return !!(g && GAME_OVER[g.status]);
}

/** The moments in the week worth plotting: one per kickoff window, at the last
 *  whistle in it, with whether every game in that window has actually ended. */
function weekCuts(wk) {
  const by = {};
  const add = (start, over) => {
    if (!start) return;
    const k = slateLabel(start);
    by[k] = by[k] || { label: k, start: start, t: 0, n: 0, over: 0 };
    by[k].start = Math.min(by[k].start, start);
    by[k].t = Math.max(by[k].t, start + GAME_LEN);
    by[k].n++; if (over) by[k].over++;
  };
  const ws = S.weekScores && S.weekScores[wk];
  if (ws && ws.games.length && ws.games.every(g => g.start)) {
    ws.games.forEach(g => add(g.start, g.over));
  } else {
    const sc = S.nflSched && S.nflSched[wk];
    if (!sc) return [];
    const seen = {};
    Object.keys(sc).forEach(t => {
      const g = sc[t]; if (!g.date) return;
      const id = [t, g.opp].sort().join('~'); if (seen[id]) return; seen[id] = 1;
      add(Date.parse(g.date + 'T17:00:00Z'), !!GAME_OVER[g.status]);
    });
  }
  const cuts = Object.keys(by).map(k => by[k]).sort((a, b) => a.t - b.t);
  cuts.forEach(c => { c.done = c.n > 0 && c.over === c.n; });
  return cuts;
}

/** A team's week with the clock wound back to `T`: the real scores of everyone
 *  whose game had ended by then, and the projection for everyone who had not
 *  played yet. A player on bye is neither — he is simply not in the sum. */
function rosterAt(t, wk, T) {
  const m = (S.matchups[wk] || []).find(x => x.roster_id === t.rosterId);
  const pts = (m && m.players_points) || {};
  let banked = 0; const open = [];
  startersFor(t, wk).forEach(p => {
    if (!p || onBye(p, wk)) return;
    const end = gameEnd(p, wk);
    if (gameOver(p, wk) && end !== null && end <= T) banked += (typeof pts[p.id] === 'number' ? pts[p.id] : 0);
    else open.push({ p: p, used: pw(p, wk) });
  });
  return { banked: banked, open: open, total: banked + sum(open.map(o => o.used)) };
}

/** The win-probability path across one matchup's week. One point before
 *  kickoff, then one at the end of every window whose games have all finished.
 *  Every point is drawn from the same seed, so the wobble of the sampler is
 *  common to all of them and a move in the line is a move in the week. */
function probPath(A, B, wk) {
  S._wpPath = S._wpPath || {};
  const key = A.rosterId + '|' + B.rosterId + '|' + wk + (typeof HYP !== 'undefined' && HYP.on ? '|h' : '');
  if (S._wpPath[key]) return S._wpPath[key];
  const cuts = weekCuts(wk);
  if (!cuts.length) return null;
  const seed = hashStr(A.rosterId + '~' + B.rosterId + '~' + wk + '~path') >>> 0;
  const out = [];
  const at = (T, label, extra) => {
    const la = rosterAt(A, wk, T), lb = rosterAt(B, wk, T);
    const r = probFromSides(la, lb, seed, 2500);
    out.push(Object.assign({
      t: T, p: r.pA, label: label,
      a: la.banked, b: lb.banked, ta: la.total, tb: lb.total,
      left: la.open.length + lb.open.length
    }, extra || {}));
  };
  at(cuts[0].start - 1000, 'Before kickoff', { pre: true });
  cuts.forEach(c => { if (c.done) at(c.t, 'After ' + c.label, { games: c.n }); });
  S._wpPath[key] = out;
  return out;
}

/* ---------- a real score, against the projection ----------
   Once a player has actually played, the number worth showing is what he scored,
   and the thing worth knowing about it is whether it beat what he was expected
   to do. This is the one place that decides both, so Start/Sit, the matchup page
   and anything else that shows a score agree on it. */
/** What `p` actually scored in week `wk`, if he has played, and his projection.
 *  null when there is nothing real yet — he has not kicked off, or is on bye.
 *  `final` is false for a game still in progress: a real number, not a result. */
function playedScore(p, wk) {
  if (!p) return null;
  if (wk === S.liveWeek) {
    const lv = liveValue(p, wk);
    if (lv.actual === null || lv.actual === undefined) return null;
    if (lv.state === 'done') return { final: true, actual: lv.actual, proj: lv.proj };
    if (lv.state === 'live') return { final: false, actual: lv.actual, proj: lv.proj, quarter: lv.quarter };
    return null;
  }
  if (wk <= S.lastWeek) {
    const m = (S.matchups[wk] || []).find(x => x.players_points && x.players_points[p.id] !== undefined);
    if (!m) return null;
    return { final: true, actual: m.players_points[p.id], proj: pw(p, wk) };
  }
  return null;
}
/** The score as a number, green above projection and red below — but only once
 *  the game is over. Half a game against a whole-game projection would read as
 *  a miss every time, so a game in progress stays neutral. */
function scoreVsProj(ps, opts) {
  opts = opts || {};
  const beat = ps.actual >= ps.proj;
  const cls = !ps.final ? '' : beat ? 'up' : 'down';
  const tip = ps.final
    ? `<div class="k">${beat ? 'Beat' : 'Missed'} his projection</div>Scored <b>${fmt(ps.actual, 1)}</b> against <b>${fmt(ps.proj, 1)}</b> projected — ${beat ? '+' : '−'}${fmt(Math.abs(ps.actual - ps.proj), 1)}`
    : `<div class="k">Still playing${ps.quarter ? ' — ' + ps.quarter : ''}</div><b>${fmt(ps.actual, 1)}</b> so far, projected <b>${fmt(ps.proj, 1)}</b> for the game`;
  return bindTT(h('div', { tabindex: 0 },
    h('b.mono.score' + (cls ? '.' + cls : ''), fmt(ps.actual, 1)),
    opts.sub === false ? null : h('div.tiny.mono.muted', { style: { lineHeight: '1.15' } },
      (ps.final ? 'proj ' : 'so far · proj ') + fmt(ps.proj, 1))), tip);
}
/* ================= 13. THIS WEEK ================= */
const WeekUI = { week: null, open: null, prob: null };

function currentWeek() {
  if (S.liveWeek) return S.liveWeek;
  return clamp(S.lastWeek + 1, 1, S.regEnd);
}

/** A franchise's name, shortened to its abbreviation when the card is too
 *  narrow to carry the whole thing without cutting it in half anyway. */
function matchupName(T) {
  const n = T.name || '';
  const wide = !isNarrow();
  return (n.length <= (wide ? 16 : 11)) ? n : T.short;
}
/** One half of a matchup card: badge, name, live total, and what is behind it. */
function matchupSide(l, T, colour) {

}

function viewWeek() {
  const wrap = h('div.grid');

  // week the user actually looks at, then redraw

    S._wsAsked[wk] = true;

  }

  const openGame = games.find(g => g.A.rosterId === WeekUI.open);
  if (openGame) { weekDetail(wrap, openGame, wk, live); return wrap; }

  /* ---- the biggest game of the week ---- */
  const sim = S.sim && S.sim.leverage && S.sim.leverage.some(x => x.week === wk) ? S.sim : null;
  if (sim) {
    /* The biggest game has to be a game that is still in the balance. A blowout
       already in progress has one empty branch, no measurable swing, and would

    const weekLev = sim.leverage.filter(x => x.week === wk);
    const g = weekLev.find(x => !x.thin) || weekLev[0];

        h('div.row', h('button.btn.sm', {

        }, 'See every game this week ranked →')))));
  } else {
    wrap.appendChild(card('The biggest game this week',

              h('span', { style: { color: !favA ? 'var(--s2)' : 'var(--text-muted)' } }, pct(g.pB, 0))),
            // the whole track is the two teams' colours meeting at the odds

              h('i', { style: { width: (g.pA * 100) + '%', background: 'var(--s1)' } })),
            h('div.cap', g.settled ? 'final' : 'win prob')),
          matchupSide(g.b, g.B, 'var(--s2)')),
        h('div.tiny.muted', { style: { borderTop: '1px solid var(--border)', paddingTop: '7px', textAlign: 'center' } },

        h('div.row', { style: { justifyContent: 'center' } }, h('button.btn.sm', {

      const c = card(null, null, body);

      c.addEventListener('click', (e) => {

    })));

  /* ---- everyone, ranked ---- */
  const rows = S.teams.map(t => {
    const l = liveRoster(t, wk);
    const g = games.find(x => x.A.rosterId === t.rosterId || x.B.rosterId === t.rosterId);
    const opp = !g ? null : (g.A.rosterId === t.rosterId ? g.B : g.A);
    const p = !g ? null : (g.A.rosterId === t.rosterId ? g.pA : g.pB);

  wrap.appendChild(card('Everyone this week',
    'scored the same way — banked where the games are over, projected where they are not',
    table([
      { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) },
      { k: 'opp', prio: 2, h: 'Opponent', sortable: false, f: r => r.opp ? h('span.tiny', r.opp.short) : h('span.muted.tiny', 'bye') },
      { k: 'total', h: 'Live total', num: true, sort: r => r.l.total, f: r => h('b.mono', fmt(r.l.total, 1)) },
      { k: 'banked', h: 'Scored', num: true, sort: r => r.l.banked, f: r => r.l.banked > 0.05 ? fmt(r.l.banked, 1) : h('span.muted', '—') },
      { k: 'left', prio: 2, h: 'Still to play', num: true, sort: r => r.l.leftN + r.l.liveN, f: r => h('span.mono', (r.l.leftN + r.l.liveN) + ' of ' + r.l.rows.length) },

    ], rows, { sortKey: 'total', sortDir: -1 })));
  return wrap;
}

/* A branch nobody's simulation visited has no odds to report. Drawing it as 0%

    { k: 'st', h: 'Status', sortable: false, f: r => badge(r.state) },
    { k: 'used', h: 'Counted', num: true, sort: r => r.used, f: r => h('b.mono', fmt(r.used, 1)) },
    { k: 'actual', prio: 2, h: 'Actual', num: true, sort: r => r.actual || 0, f: r => r.actual === null ? '—' : h('span.mono', fmt(r.actual, 1)) },
    { k: 'proj', prio: 2, h: 'Projected', num: true, sort: r => r.proj, f: r => h('span.mono.muted', fmt(r.proj, 1)) }
  ], rows, { sortKey: 'used', sortDir: -1 });
}

/** One matchup's detail: how the odds moved, and every starter on both sides. */

        : `Typical result: ${(g.med >= 0 ? g.A.short : g.B.short)} by ${fmt(Math.abs(g.med), 1)} · middle 80% from `
        + `${(g.lo >= 0 ? g.A.short : g.B.short)} by ${fmt(Math.abs(g.lo), 0)} to ${(g.hi >= 0 ? g.A.short : g.B.short)} by ${fmt(Math.abs(g.hi), 0)}`))));

  const chart = matchupProbChart(wk, g);
  if (chart) wrap.appendChild(chart);

/** ESPN-style win-probability trace for one matchup, cut into the week's slates.
 *  The path is rebuilt from the week itself — see probPath() — so it is there
 *  for any week, watched or not, and reads the same on every device. */
function matchupProbChart(wk, g) {
  // nothing has moved until somebody has played
  if (!weekStarted(wk)) return null;
  const CA = 'var(--s1)', CB = 'var(--s2)';
  const path = probPath(g.A, g.B, wk);
  const slates = weekSlates(wk);
  if (!path || !path.length || !slates.length) return null;

  /* Wall-clock time wastes most of its width on an empty Friday and crushes the
     three Sunday windows into a smudge. The axis is the week's slates instead:
     pregame, one equal column per kickoff window, and a post column for after
     the last whistle. Every window the week has is on the axis from the start,
     whatever day it is — the shape of the week is part of what the chart says,
     and an axis that grew as Sunday went on would make two readings of the same
     game impossible to compare. The line simply stops where the week has got to. */
  const bounds = [slates[0].start - 3 * 3600 * 1000].concat(slates.map(sl => sl.start));
  bounds.push(slates[slates.length - 1].start + 4 * 3600 * 1000);
  const nWin = bounds.length - 1;
  const slateX = (t) => {
    if (t <= bounds[0]) return 0;
    for (let i = 0; i < nWin; i++) {
      if (t < bounds[i + 1]) return i + (t - bounds[i]) / Math.max(1, bounds[i + 1] - bounds[i]);
    }
    return nWin;
  };
  const labels = ['Pre'].concat(slates.map(sl => sl.label)).concat(['Post']);

  const score = (p) => fmt(p.a, 1) + '–' + fmt(p.b, 1);
  const marks = path.map(p => ({
    // the pregame point belongs at the left edge, not a second before kickoff
    x: p.pre ? 0 : slateX(p.t), y: p.p * 100,
    label: p.pre ? 'Before kickoff · projected ' + fmt(p.ta, 1) + '–' + fmt(p.tb, 1) : p.label + ' · ' + score(p)
  }));
  const lastX = marks[marks.length - 1].x;
  const nowX = slateX(Date.now());
  // a finished week ends at its last whistle; only a live week has a "now"
  if (!weekFinished(wk) && nowX > lastX + 0.02) {
    marks.push({ x: nowX, y: g.pA * 100, label: 'now · ' + fmt(g.a.banked, 1) + '–' + fmt(g.b.banked, 1) + ' scored' });
  }
  if (marks.length < 2) return null;
  marks.sort((a, b) => a.x - b.x);
  /* Between one whistle and the next nothing is known, so nothing is claimed:
     the line holds its value across the empty stretch and moves at the moment
     the games actually ended. Sloping from one point to the next would invent a
     Friday afternoon drift that nobody observed. */
  const pts = [];
  marks.forEach((m, i) => {
    if (i) pts.push({ x: m.x, y: marks[i - 1].y, label: marks[i - 1].label });
    pts.push(m);
  });
  // the two sides are the same story told twice; drawing both says so, and the
  // crossing point is the moment the game turned
  const ptsB = pts.map(p => ({ x: p.x, y: 100 - p.y, label: p.label }));

  /* Drawn at a width it can live at rather than stretched across the monitor:
     the label text is part of the drawing, so a 760-wide chart pulled over
     2000px pulls its letters with it. */
  const W = isNarrow() ? 380 : clamp(Math.round((typeof window !== 'undefined' ? window.innerWidth : 1400) - 470), 700, 1060);
  const chart = lineChart([
    { name: g.A.short, color: CA, width: 2.4, points: pts },
    { name: g.B.short, color: CB, width: 2.4, points: ptsB }
  ], {
    w: W, maxW: W, h: isNarrow() ? 220 : 300, dots: false,
    y0: 0, y1: 100, yRule: 50, yTicks: 4, x0: 0, x1: nWin,
    yFmt: v => Math.round(v) + '%',
    xTickValues: labels.map((lb, i) => ({ x: i, label: lb, rule: i > 0 && i < labels.length - 1 })),
    aria: 'win probability through the week'
  });
  const moved = Math.max.apply(null, pts.map(p => Math.abs(p.y - pts[0].y)));
  const swung = pts.some(p => (p.y - 50) * (pts[0].y - 50) < 0);
  const windows = path.filter(p => !p.pre).length;
  const swatch = (c, nm) => h('div.row', { style: { gap: '7px' } },
    h('span', { style: { width: '16px', height: '9px', borderRadius: '2px', background: c, display: 'inline-block' } }),
    h('b.tiny', nm));
  return card('Win probability',
    `the two lines are the same game from each side · rebuilt from when each game was played`
    + (moved > 1 ? ` · biggest move ${moved.toFixed(0)} points` : '')
    + (swung ? ' · the lead has changed hands' : ''),
    h('div',
      h('div.row', { style: { gap: '18px', marginBottom: '6px', flexWrap: 'wrap' } },
        swatch(CA, g.A.name), swatch(CB, g.B.name)),
      chart,
      h('div.tiny.muted', { style: { marginTop: '8px' } },
        'One column per kickoff window' + (slates.length ? ' (' + slates.map(sl => sl.label + ' ×' + Math.round(sl.n)).join(', ') + ')' : '')
        + ', the whole week whether it has been played yet or not. Each point is the week paused at that whistle: everyone whose game had ended '
        + 'counted at what they really scored, everyone still to play counted at their projection'
        + (weekFinished(wk) ? ' — the whole week is in the books'
          : windows ? ' — ' + windows + (windows === 1 ? ' window of the week has' : ' windows of the week have') + ' finished so far' : '')
        + '. Nothing upstream keeps a record of what happened inside a game, so the line only moves when games end.')));
}


/** The two lineups of one matchup set against each other slot by slot, the way
 *  Head to Head draws them. Under each number is where that player's game is:
 *  final with how he did against his projection, the quarter and his points so
 *  far, still to play, or on bye. The number itself takes the team's colour when
 *  it wins its slot, so the colours never have to mean two things at once. */
function matchupLadder(g, wk) {
  const CA = 'var(--s1)', CB = 'var(--s2)';
  const la = liveLineupSlots(g.A, wk), lb = liveLineupSlots(g.B, wk);
  const counted = (p) => p ? liveValue(p, wk).used : 0;
  const rows = la.map((sa, i) => {
    const sb = lb[i] || {};
    return { slot: sa.slot, a: sa.player, b: sb.player || null, va: counted(sa.player), vb: counted(sb.player) };
  });
  const cell = (p, v, won, col) => {
    if (!p) return h('span.muted.tiny', '—');
    const lv = liveValue(p, wk);
    const ps = playedScore(p, wk);
    const status = lv.state === 'bye' ? h('span', 'bye week')
      : lv.state === 'upcoming' ? h('span', 'projected')
        : ps && ps.final
          ? h('span', { class: ps.actual >= ps.proj ? 'up' : 'down' },
            (ps.actual >= ps.proj ? '▲ ' : '▼ ') + fmt(Math.abs(ps.actual - ps.proj), 1) + ' vs proj')
          : h('span', (lv.quarter ? String(lv.quarter) + ' · ' : '') + 'live');
    const tip = lv.state === 'bye' ? `<div class="k">${p.name}</div>On bye this week`
      : lv.state === 'upcoming' ? `<div class="k">${p.name}</div>Has not played yet — counted at his projection, <b>${fmt(lv.proj, 1)}</b>`
        : ps && ps.final ? `<div class="k">${p.name} · final</div>Scored <b>${fmt(ps.actual, 1)}</b> against <b>${fmt(ps.proj, 1)}</b> projected`
          : `<div class="k">${p.name} · playing${lv.quarter ? ', ' + lv.quarter : ''}</div><b>${fmt(lv.banked, 1)}</b> so far, plus <b>${fmt(lv.open, 1)}</b> expected from the rest of the game`;
    return bindTT(h('div.lcell', { tabindex: 0 },
      h('b.mono', { style: { color: won ? col : 'var(--text-primary)', fontWeight: won ? 720 : 560 } }, fmt(v, 1)),
      h('div.lstat', status)), tip);
  };
  const aWon = rows.filter(r => r.va > r.vb).length;
  return h('div', { style: { display: 'grid', gap: '10px' } },
    slotLadder(rows, g.A, g.B, CA, CB, { wk, live: true, cell, head: 'Pts' }),
    h('div.tiny.muted', `${g.A.short} is ahead in ${aWon} of ${rows.length} slots.`));
}
/* ================= 14. HOME =================
   The landing page: which league you are looking at, where the season stands,
   and a way into every other page. It is the first thing a visit meets, so it
   answers "what is this and where do I go" before it answers anything else. */

/** One line each, so a tile says what the page is for rather than repeating its name. */
/** Two of these read differently once there is no next season to rank. */
function blurbFor(k) {
  if (!isDynasty()) {
    if (k === 'power') return 'The league ranked on this season, by projection and by results';
    if (k === 'scout') return 'Who needs what — every roster’s holes and surpluses right now';
    if (k === 'stock') return 'Redraft value over time, for a player or a whole franchise';
    if (k === 'trade') return 'Price a trade at redraft value and see what it does to the season';

  return VIEW_BLURB[k] || '';
}
const VIEW_BLURB = {

  trade: 'Price a trade and see what it does to the season',
  finder: 'Trades that fit both rosters, scanned across the league',

  power: 'The league ranked, by projection and by what has happened',
  standings: 'Wins, losses and points actually scored',
  scout: 'Who needs what — every roster’s holes and surpluses',
  sim: 'Playoff odds, seeds, and the games with most riding on them',
  draft: 'The draft board, shaded by value against slot par',
  stock: 'Value over time, for a player or a whole franchise'
};
/* The tiles, in the order someone would actually want them. */
const HOME_TILES = ['week', 'lineup', 'roster', 'players', 'trade', 'finder', 'h2h', 'power', 'standings', 'sim', 'scout', 'trades', 'draft', 'stock'];

function goView(k) { S.view = k; render(); window.scrollTo(0, 0); }

function viewHome() {
  const wrap = h('div.grid', { style: { gap: '20px' } });

  /* ---- where you stand ---- */
  if (me) {

    const simBy = S.sim && S.sim.by ? S.sim.by[me.rosterId] : null;
    wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(min(160px,100%),1fr))' } },
      kpi('Your record', rec, S.gamesPlayed ? fmt(me.avgPts, 1) + ' per week' : 'no games yet'),
      kpi('Power rank', '#' + me.powerRank, 'of ' + S.teams.length),
      dynOnly(kpi('Future rank', '#' + me.futureRank, 'two to three years out')),
      kpi(capitalLabel(), kfmt(Math.round(me.totalValue)), ord(me.valueRank) + ' in the league'),
      simBy ? kpi('Playoff odds', pct(simBy.playoff, 0), pct(simBy.title, 1) + ' title')
        : kpi('Playoff odds', '—', 'run the simulator')));
  }

  /* ---- the week, if there is one being played ---- */
  if (S.liveWeek && me) {
    const g = liveMatchups(S.liveWeek).find(x => x.A.rosterId === me.rosterId || x.B.rosterId === me.rosterId);
    if (g) {
      const mine = g.A.rosterId === me.rosterId;

      const them = mine ? g.B : g.A, p = mine ? g.pA : g.pB;

    kpi(isTeam ? 'Franchise value' : 'Trade value', kfmt(last), (isTeam ? subject.name : subject.name)),
    kpi(StockUI.range + '-day change', sgn(chg, 0), sgn(chgPct * 100, 1) + '%'),
    kpi('30-day trend', isTeam ? sgn(sum(subject.players.map(p => p.trend30 || 0)), 0) : sgn(subject.trend30 || 0, 0), 'from FantasyCalc'),
    kpi('Range', kfmt(lo) + '–' + kfmt(hi), 'low to high in window'),
    isTeam ? kpi('League rank', '#' + subject.valueRank, 'by ' + (isDynasty() ? 'dynasty capital' : 'roster value'))
      : kpi('Position rank', (subject.pos || '') + (subject.posRank || '—'), 'overall #' + (subject.rank || '—'))
  ));

  const chart = lineChart([{
    name: isTeam ? subject.name : subject.name, color: chg >= 0 ? 'var(--s1)' : 'var(--s8)', area: true,
    points: series.map((s, i) => ({ x: i, y: s.v, label: new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) }))
  }], {
    h: 260, dots: false, yFmt: v => kfmt(Math.round(v)),
    xFmt: i => { const s = series[clamp(Math.round(i), 0, series.length - 1)]; return s ? new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''; },
    aria: 'value over time'
  });
  const tbl = table([
    { k: 'd', h: 'Date', f: r => new Date(r.d).toLocaleDateString() },
    { k: 'v', h: 'Value', num: true, f: r => kfmt(r.v) },
    { k: 'src', h: 'Source', sortable: false, f: r => r.real ? h('span.tag', 'observed') : h('span.tag', { style: { opacity: .7 } }, 'modelled') }
  ], series.slice().reverse(), {});
  const wt = withTable(chart, tbl);
  wrap.appendChild(card((isTeam ? 'Franchise' : 'Player') + ' value — ' + subject.name,
    `${observed} observed snapshot${observed === 1 ? '' : 's'} · the rest is modelled from FantasyCalc's published 30-day trend`,
    wt.body, wt.btn));

  if (isTeam) wrap.appendChild(stockTeamLines(subject, series));

  // movers
  const pool = Object.values(S.index).filter(p => p.dv > 500 && p.trend30);
  const risers = pool.slice().sort((a, b) => b.trend30 - a.trend30).slice(0, 12);
  const fallers = pool.slice().sort((a, b) => a.trend30 - b.trend30).slice(0, 12);
  const ownerOf = {}; S.teams.forEach(t => t.players.forEach(p => ownerOf[p.id] = t));
  const moverCols = [
    { k: 'name', h: 'Player', sort: r => r.name, f: r => h('div.row', { style: { gap: '7px' } }, isSimple() ? playerFace(r) : posPill(r.pos), pname(r, { face: false, style: { fontWeight: 540 } })) },
    { k: 'owner', prio: 2, h: 'Roster', sort: r => (ownerOf[r.id] || {}).name || 'zz', f: r => ownerOf[r.id] ? h('span.tiny', ownerOf[r.id].short) : h('span.tiny.muted', 'FA') },
    { k: 'dv', h: 'Value', num: true, f: r => kfmt(Math.round(r.dv)) },
    { k: 'trend30', h: '30 days', num: true, f: r => deltaTag(r.trend30, 0) },
    { k: 'pctc', prio: 2, h: '%', num: true, sort: r => r.trend30 / Math.max(1, r.dv - r.trend30), f: r => h('span', { class: r.trend30 > 0 ? 'up mono' : 'down mono' }, sgn(r.trend30 / Math.max(1, r.dv - r.trend30) * 100, 1) + '%') },
    { k: 'spark', prio: 2, h: '', sortable: false, f: r => sparkline(playerSeries(r.id, 30), { w: 66, h: 20 }) }
  ];
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(340px,1fr))' } },
    card('Rising', 'biggest 30-day value gains league-wide', table(moverCols, risers, { sortKey: 'trend30', sortDir: -1 })),
    card('Falling', 'biggest 30-day value losses', table(moverCols, fallers, { sortKey: 'trend30', sortDir: 1 }))));

  const tv = S.teams.slice().sort((a, b) => b.totalValue - a.totalValue);
  wrap.appendChild(card('Franchise values', 'every team as a ticker — click a row to chart it',
    table([
      { k: 'name', h: 'Team', sort: r => r.name, f: r => teamCell(r) },
      { k: 'totalValue', h: 'Value', num: true, f: r => h('b.mono', kfmt(Math.round(r.totalValue))) },
      isDynasty() ? { k: 'rosterValue', prio: 2, h: 'Players', num: true, f: r => kfmt(Math.round(r.rosterValue)) } : null,
      isDynasty() ? { k: 'pickCapital', prio: 2, h: 'Picks', num: true, f: r => kfmt(Math.round(r.pickCapital)) } : null,
      { k: 'trend', h: '30 days', num: true, sort: r => sum(r.players.map(p => p.trend30 || 0)), f: r => deltaTag(sum(r.players.map(p => p.trend30 || 0)), 0) },
      isDynasty() ? { k: 'age', prio: 2, h: 'Avg age', num: true, f: r => r.age ? fmt(r.age, 1) : '—' } : null,
      { k: 'spark', prio: 2, h: '', sortable: false, f: r => sparkline(teamSeries(r.rosterId, 30), { w: 70, h: 20 }) }
    ], tv, {
      sortKey: 'totalValue', sortDir: -1,
      onRow: r => { StockUI.kind = 'team'; StockUI.id = r.rosterId; render(); window.scrollTo(0, 0); }
    })));
  return wrap;
}

/* ================= clickable player name ================= */
function openPlayer(id, back) {
  PlayerUI.id = String(id);
  PlayerUI.back = back || S.view;
  S.view = 'player';
  render(); window.scrollTo(0, 0);
}
/** A player's name, rendered as a link into the player page. In the default
 *  view it carries the player's headshot, so a face turns up wherever a name
 *  does — trades, the draft board, head to head, everywhere. Pass
 *  `face: false` where the surrounding row already shows one. */
function pname(p, opts) {
  opts = opts || {};
  if (!p || p.pos === 'PICK' || !p.id) return h('span', (p && (p.name || p.label)) || '—');
  const el = h('span.plink', {
    tabindex: 0, role: 'link',
    style: opts.style || null,
    onclick: (e) => { e.stopPropagation(); openPlayer(p.id); },
    onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openPlayer(p.id); } }
  }, p.name);
  if (!isSimple() || opts.face === false) return opts.mirror ? h('span.pnf.mir', el) : el;
  // mirrored puts the headshot on the outside, so two of these facing each other
  // read as a pair rather than as two left-aligned lists
  return h('span.pnf' + (opts.mirror ? '.mir' : ''), playerFace(p, { sm: true }), el);
}

/* ================= 9. PLAYER PAGE ================= */
const PlayerUI = { id: null, back: 'roster', range: 90 };
function viewPlayer() {
  const wrap = h('div.grid');
  const p = S.index[PlayerUI.id];
  if (!p) return wrap.appendChild(card('Player', null, h('div.empty', 'That player is no longer in the index.'))), wrap;
  const owner = ownerOfPlayer(p.id);
  const log = playerGameLog(p.id);
  const played = log.filter(g => g.pts !== null && g.rostered);
  const startedGames = log.filter(g => g.started && g.pts !== null);
  const posPeers = Object.values(S.index).filter(x => x.pos === p.pos && (x.dv || 0) > 0).sort((a, b) => b.dv - a.dv);
  const myIdx = posPeers.findIndex(x => x.id === p.id);
  const backLabel = (VIEWS.find(v => v.k === PlayerUI.back) || {}).label || 'Back';

  wrap.appendChild(h('div.row', { style: { justifyContent: 'space-between' } },
    h('button.btn', { onclick: () => { S.view = PlayerUI.back || 'roster'; render(); } }, '← ' + backLabel),
    h('div.row', { style: { gap: '7px' } },
      owner ? h('button.btn.sm', { onclick: () => { RosterUI.team = owner.rosterId; S.view = 'roster'; render(); } }, 'View ' + owner.name) : null,
      h('button.btn.sm', { onclick: () => { StockUI.kind = 'player'; StockUI.id = p.id; S.view = 'stock'; render(); } }, 'Open in Stock Mode'))));

  // ---- header ----
  const headshot = /^\d+$/.test(p.id) ? 'https://sleepercdn.com/content/nfl/players/thumb/' + p.id + '.jpg' : null;
  wrap.appendChild(card(null, null, h('div.row', { style: { gap: '15px', alignItems: 'center' } },
    headshot ? h('img', {
      src: headshot, alt: '', loading: 'lazy',
      style: { width: '66px', height: '66px', borderRadius: '12px', objectFit: 'cover', background: 'var(--surface-3)', flex: 'none' },
      onerror: e => e.target.style.visibility = 'hidden'
    }) : h('div', { style: { width: '66px', height: '66px', borderRadius: '12px', background: 'var(--surface-3)', flex: 'none' } }),
    h('div', { style: { minWidth: 0 } },
      h('div.row', { style: { gap: '8px' } }, posPill(p.pos),
        h('h2', { style: { fontSize: '22px', letterSpacing: '-.02em' } }, p.name),
        injuryTag(p.injury)),
      h('div.tiny.sec', { style: { marginTop: '2px' } },
        [p.team || 'Free agent', p.age ? fmt(p.age, 1) + ' years old' : null,
        p.exp !== null && p.exp !== undefined ? (p.exp === 0 ? 'rookie' : p.exp + ' yrs exp') : null,
        p.college || null,
        p.draft ? `${p.draft.year} round ${p.draft.round}, pick ${p.draft.pick}` : null].filter(Boolean).join(' · ')),
      h('div.tiny.muted', { style: { marginTop: '3px' } },
        owner ? `Rostered by ${owner.name}` + (owner.taxi.has(p.id) ? ' — taxi squad' : owner.ir.has(p.id) ? ' — injured reserve' : owner.starterIds.has(p.id) ? ' — projected starter' : ' — bench') : 'Not on any roster in this league')))));

  // ---- headline numbers ----
  const trendPct = p.trend30 && (p.dv - p.trend30) > 0 ? p.trend30 / (p.dv - p.trend30) : 0;
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(146px,1fr))' } },
    kpi(isDynasty() ? 'Dynasty value' : 'Redraft value', kfmt(Math.round(p.dv || 0)), p.rank ? 'overall #' + p.rank : 'unranked',
      `<div class="k">FantasyCalc ${valueWord()} value</div>Priced for this league's exact format — ${S.cfg.superflex ? 'superflex' : '1QB'}, ${S.cfg.numTeams}-team, ${S.cfg.ppr === 1 ? 'PPR' : S.cfg.ppr === 0.5 ? 'half-PPR' : 'standard'}.`),
    kpi('Position rank', (p.pos || '') + (p.posRank || (myIdx >= 0 ? myIdx + 1 : '—')), p.tier ? 'tier ' + p.tier : 'of ' + posPeers.length + ' ranked'),
    kpi('30-day trend', p.trend30 ? sgn(p.trend30, 0) : 'flat', p.trend30 ? sgn(trendPct * 100, 1) + '%' : 'no movement'),
    kpi('Projected', fmt(p.ppg || 0, 1), p.wk ? 'pts / week remaining' : 'pts / week now',
      p.wk
        ? `<div class="k">Sleeper weekly projections</div>Average over the weeks still to play, byes excluded. Each week's projected stat line is scored with this league's own settings, so custom scoring is respected.`
        : `<div class="k">Estimated</div>Sleeper publishes no weekly projection for this player, so this comes from the redraft value's positional rank adjusted for league scoring.` + (p.injury ? '<br>Discounted for the <b>' + p.injury + '</b> tag.' : '')),
    dynOnly(kpi('Projected 2–3 yrs', fmt(p.fppg || 0, 1), 'pts / week',
      `<div class="k">Future outlook</div>Dynasty-value rank run through the same curve, then aged with a ${p.pos}-specific decline profile.`)),
    // in a redraft league the dynasty price is the interesting comparison, not
    // the other way round: it says how much of his market is the years ahead
    isDynasty()
      ? kpi('Redraft value', kfmt(Math.round(p.rv || 0)), p.rv && p.dvDyn ? (p.rv > p.dvDyn ? 'win-now premium' : 'dynasty premium') : '—',
        '<div class="k">Redraft vs dynasty</div>A player worth more in redraft than dynasty is being paid for production now; the reverse means the market is paying for the years ahead.')
      : kpi('Dynasty market', kfmt(Math.round(p.dvDyn || 0)), p.rv && p.dvDyn ? (p.dvDyn > p.rv ? 'priced for the future' : 'priced for now') : '—',
        '<div class="k">What he is worth elsewhere</div>This league does not pay for it, but the dynasty market does. A player worth far more in dynasty than redraft is young, and in this league that premium buys you nothing.')
  ));

  // ---- weekly production ----
  const bars = [];
  log.forEach(g => bars.push({
    x: g.week, v: g.rostered ? g.pts : null, kind: 'actual',
    note: g.rostered ? (g.started ? 'Started' : 'On the bench') : 'Not rostered in this league'
  }));
  for (let w = S.lastWeek + 1; w <= S.regEnd; w++) {
    if (p.wk) {
      const r = p.wk[w];
      bars.push(r
        ? { x: w, v: Math.round(r.p * 10) / 10, kind: 'proj', note: 'Projected ' + (r.h ? 'vs ' : 'at ') + (r.o || '—') }
        : { x: w, v: null, kind: 'proj', bye: true, note: 'Bye week' });
    } else {
      bars.push({ x: w, v: Math.round((p.ppg || 0) * 10) / 10, kind: 'proj', note: 'Projection, not a result' });
    }
  }
  const logTable = table([
    { k: 'week', h: 'Week', num: true, f: r => r.x },
    { k: 'kind', h: 'Type', f: r => r.kind === 'proj' ? h('span.tag', 'projected') : h('span.tag', { style: { borderColor: 'var(--s1)', color: 'var(--s1)' } }, 'actual') },
    { k: 'v', h: 'Points', num: true, f: r => r.v === null ? '—' : h('b.mono', fmt(r.v, 1)) },
    { k: 'note', h: 'Note', f: r => h('span.tiny.muted', r.note || '') }
  ], bars, {});
  const byeList = (p.byeWeeks || []).filter(w => w <= S.regEnd);
  const wt = withTable(h('div', weeklyBars(bars, { aria: 'weekly points, actual then projected' }),
    h('div.legend', { style: { marginTop: '9px' } },
      h('span', h('i', { style: { background: 'var(--s1)' } }), 'Actual'),
      h('span', h('i', { style: { background: 'var(--seq-200)' } }), 'Projected'),
      played.length ? h('span.tiny.muted', `${fmt(mean(played.map(g => g.pts)), 1)} avg · ${fmt(Math.max(...played.map(g => g.pts)), 1)} best`
        + (startedGames.length ? ` · started ${startedGames.length} of ${played.length}` : '')) : h('span.tiny.muted', 'No games played yet this season'))), logTable);
  wrap.appendChild(card('Weekly scoring',
    (S.lastWeek ? `weeks 1–${S.lastWeek} actual, the rest projected` : 'all projected — the season has not started')
    + (p.wk ? ' · Sleeper weekly projections, scored with this league’s settings' : ' · no weekly projection published, so this is a flat estimate')
    + (byeList.length ? ' · bye week ' + byeList.join(', ') : ''),
    wt.body, wt.btn));

  // ---- value history ----
  const series = playerSeries(p.id, PlayerUI.range);
  if (series.length > 1) {
    const first = series[0].v, last = series[series.length - 1].v;
    wrap.appendChild(card('Value over time', `${series.filter(s => s.real).length} observed snapshot${series.filter(s => s.real).length === 1 ? '' : 's'} · earlier points modelled from the published 30-day trend`,
      h('div', lineChart([{
        name: p.name, color: last >= first ? 'var(--s1)' : 'var(--s8)', area: true,
        points: series.map((s, i) => ({ x: i, y: s.v, label: new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) }))
      }], {
        h: 220, dots: false, yFmt: v => kfmt(Math.round(v)),
        xFmt: i => { const s = series[clamp(Math.round(i), 0, series.length - 1)]; return s ? new Date(s.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''; },
        aria: 'value over time'
      })),
      segmented([{ k: 30, label: '30d' }, { k: 90, label: '90d' }, { k: 180, label: '6m' }], PlayerUI.range, r => { PlayerUI.range = r; render(); })));
  }

  // ---- comparables ----
  const lo = Math.max(0, myIdx - 4), peers = posPeers.slice(lo, lo + 9);
  wrap.appendChild(card('Around him at ' + p.pos, 'nearest players by ' + valueWord() + ' value — click any name',
    table([
      { k: 'rk', h: '#', num: true, sortable: false, f: (r) => posPeers.indexOf(r) + 1 },
      { k: 'name', h: 'Player', sort: r => r.name, f: r => h('div.row', { style: { gap: '6px' } }, pname(r, { style: r.id === p.id ? { fontWeight: '700' } : null }), r.id === p.id ? h('span.tag', 'this player') : null) },
      { k: 'team', prio: 2, h: 'NFL', f: r => r.team || '—' },
      { k: 'age', h: 'Age', num: true, f: r => r.age ? fmt(r.age, 1) : '—' },
      { k: 'dv', h: 'Value', num: true, f: r => h('b.mono', kfmt(Math.round(r.dv || 0))) },
      { k: 'ppg', h: 'Proj', num: true, f: r => fmt(r.ppg || 0, 1) },
      isDynasty() ? { k: 'fppg', prio: 2, h: 'Proj ’28', num: true, f: r => fmt(r.fppg || 0, 1) } : null,
      { k: 'trend30', prio: 2, h: '30d', num: true, f: r => r.trend30 ? deltaTag(r.trend30, 0) : h('span.flat.tiny', '–') },
      { k: 'own', prio: 2, h: 'Roster', sortable: false, f: r => { const o = ownerOfPlayer(r.id); return o ? h('span.tiny', o.short) : h('span.tiny.muted', 'FA'); } }
    ], peers, { onRow: r => openPlayer(r.id) })));
  return wrap;
}

  // ---- storylines ----

    A.nailBiter ? story('Closest game', `${nameOf(A.nailBiter.win)} by ${fmt(A.nailBiter.margin, 2)}`,
      `week ${A.nailBiter.week} — ${fmt(A.nailBiter.aPts, 1)} to ${fmt(A.nailBiter.bPts, 1)}`) : null,
    A.mostPF ? story('Most points scored', A.mostPF.team.name, `${fmt(A.mostPF.pf, 1)} for the season, ${fmt(A.mostPF.pf / S.regEnd, 1)} per week`) : null,
    A.longestStreak && A.longestStreak.streak > 1 ? story('Longest win streak', A.longestStreak.team.name, A.longestStreak.streak + ' straight wins') : null,
    A.unluckiest ? story('Best team to be let down', A.unluckiest.team.name, `${ord(A.unluckiest.pfRank)} in scoring but finished ${ord(A.unluckiest.seed)}`) : null
  ));

  // ---- final table ----
  wrap.appendChild(card('Final standings', 'division winners take the top seeds' + (sim.nDiv > 1 ? '' : ' — this league has no divisions'),
    table([
      { k: 'seed', h: 'Seed', num: true, f: r => h('b.mono', r.seed) },
      {
        k: 'name', h: 'Team', sort: r => r.team.name, f: r => h('div.row', { style: { gap: '6px' } }, teamCell(r.team),
          r.divWinner && !isNarrow() ? h('span.tag', 'div') : null,

      },
      { k: 'w', h: 'W', num: true, f: r => h('b.mono', r.w) },
      { k: 'l', h: 'L', num: true },

      { k: 'pa', prio: 2, h: 'PA', num: true, f: r => fmt(r.pa, 1) },
      { k: 'diff', prio: 2, h: 'Diff', num: true, sort: r => r.pf - r.pa, f: r => h('span', { class: r.pf - r.pa >= 0 ? 'up mono' : 'down mono' }, sgn(r.pf - r.pa, 1)) },
      { k: 'best', prio: 2, h: 'Best week', num: true, f: r => r.best ? h('span', fmt(r.best, 1), h('span.tiny.muted', ' wk' + r.bestWeek)) : '—' },

    ], sim.standings, { sortKey: 'seed', sortDir: 1 })));

   Analysis layer — free agents, roster scouting, trade history

/* ---------- free agents ---------- */
/** Everyone with a projection who is not on a roster in this league. */
function freeAgents() {
  if (S._fa) return S._fa;
  const owned = new Set();
  S.teams.forEach(t => t.players.forEach(p => owned.add(p.id)));
  S._fa = Object.values(S.index)
    .filter(p => !owned.has(p.id) && POS_ALL.indexOf(p.pos) >= 0)
    .sort((a, b) => (b.ppg || 0) - (a.ppg || 0));
  return S._fa;
}
const POS_ALL = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
/** What adding this player would add to a team's optimal lineup. */
function marginalAdd(players, taxi, ir, player, key) {
  const act = players.filter(p => !taxi.has(p.id) && !ir.has(p.id));
  return lineupPoints(act.concat([player]), key) - lineupPoints(act, key);
}

/* ---------- roster scouting ---------- */
/** How many lineup slots a position can occupy: dedicated slots plus a share of
 *  every flex that accepts it. */
function slotDemand() {
  if (S._slotDemand) return S._slotDemand;
  const rp = (S.cfg.rosterPositions || []).filter(p => !['BN', 'IR', 'TAXI'].includes(p));
  const d = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DEF: 0 };
  rp.forEach(slot => {
    const elig = SLOT_ELIG[slot] || [slot];
    if (elig.length === 1) { if (d[elig[0]] !== undefined) d[elig[0]] += 1; return; }
    elig.forEach(pos => { if (d[pos] !== undefined) d[pos] += 1 / elig.length; });
  });
  S._slotDemand = d;
  return d;
}
/** A player good enough to be worth starting over a waiver-wire replacement. */
function startable(p) { return (p.ppg || 0) > (STREAM[p.pos] !== undefined ? STREAM[p.pos] : 5) * 1.05; }

function scoutTeam(t) {
  const demand = slotDemand();
  const act = activePlayers(t);
  const zNow = {}, zVal = {};
  POS4.forEach(pos => {
    const arr = S.teams.map(x => x.posNow[pos]);
    const m = mean(arr), sd = sd_(arr) || 1;
    zNow[pos] = (t.posNow[pos] - m) / sd;
    const av = S.teams.map(x => x.posValue[pos]);
    const mv = mean(av), sv = sd_(av) || 1;
    zVal[pos] = (t.posValue[pos] - mv) / sv;
  });
  // kickers and defences are streamed, not built — nobody scouts a roster for
  // them and nobody trades for them, so they are left out of the scouting view
  const pos = POS4.filter(p => (demand[p] || 0) > 0).map(p => {
    const group = act.filter(x => x.pos === p).sort((a, b) => (b.ppg || 0) - (a.ppg || 0));
    const good = group.filter(startable);
    const need = demand[p] || 0;
    const depth = good.length - need;              // spare startable bodies
    return {
      pos: p, need: Math.round(need * 10) / 10, count: group.length, startable: good.length, depth,
      output: t.posNow[p] || 0, rank: (t.posNow[p + 'Rank'] || null),
      valueRank: (t.posValue[p + 'Rank'] || null),
      z: zNow[p] !== undefined ? zNow[p] : 0,
      best: group[0] || null,
      // a hole is thin bodies OR clearly below the league at that spot
      hole: depth < 0 || (zNow[p] !== undefined && zNow[p] < -0.85),
      surplus: depth >= 1 && (zNow[p] === undefined || zNow[p] > 0.25)
    };
  });
  const holes = pos.filter(p => p.hole).sort((a, b) => a.z - b.z);
  const surplus = pos.filter(p => p.surplus).sort((a, b) => b.z - a.z);
  const strengths = pos.slice().sort((a, b) => b.z - a.z).filter(p => p.z > 0.6).slice(0, 3);
  const weaknesses = pos.slice().sort((a, b) => a.z - b.z).filter(p => p.z < -0.6).slice(0, 3);
  const young = act.filter(p => p.age && p.age <= 25 && (p.dv || 0) > 1500).length;
  const old = act.filter(p => p.age && p.age >= 29 && (p.dv || 0) > 1500).length;
  return { team: t, pos, holes, surplus, strengths, weaknesses, young, old, demand };
}

/* ---------- trade history ---------- */
/** Turn Sleeper's transaction feed into two-sided trades with assets per team. */
function parseTrades() {
  if (S._trades) return S._trades;
  const out = [];
  (S.transactions || []).forEach(tx => {
    if (tx.type !== 'trade' || tx.status !== 'complete') return;
    const rosters = (tx.roster_ids || []).slice();
    if (rosters.length < 2) return;
    const sides = {};
    rosters.forEach(r => sides[r] = { rosterId: r, team: S.teamById[r] || null, got: [], sent: [] });
    for (const pid in (tx.adds || {})) {
      const to = tx.adds[pid];
      const p = S.index[pid] || ensurePlayer(pid);
      if (sides[to]) sides[to].got.push({ kind: 'player', id: pid, name: p.name, pos: p.pos, ref: p, value: p.dv || 0 });
    }
    for (const pid in (tx.drops || {})) {
      const from = tx.drops[pid];
      const p = S.index[pid] || ensurePlayer(pid);
      if (sides[from]) sides[from].sent.push({ kind: 'player', id: pid, name: p.name, pos: p.pos, ref: p, value: p.dv || 0 });
    }
    (tx.draft_picks || []).forEach(dp => {
      const season = +dp.season, round = +dp.round;
      const key = season + '|' + round + '|' + dp.roster_id;
      // price it the way the app prices any pick: off the original owner's outlook
      // a redraft league's picks buy nothing that carries, so they are recorded
      // as part of the trade but priced at nothing rather than at a rookie-pick rate
      let value = 0, slotLabel = null;
      if (isDynasty()) {
        try {
          const q = pickPricer(null)({ season, round, origRosterId: +dp.roster_id });
          value = q.value; slotLabel = round + '.' + String(q.slot).padStart(2, '0');
        } catch (e) { value = pickValue(season, round, 'Mid'); }
      }
      const orig = S.teamById[+dp.roster_id];
      const label = season + ' ' + (ROUND_WORD[round] || round + 'th') + (orig ? ' (' + orig.short + ')' : '');
      const asset = { kind: 'pick', id: 'PK|' + key, name: label, pos: 'PICK', value, slotLabel, season, round };
      if (sides[dp.owner_id]) sides[dp.owner_id].got.push(asset);
      if (sides[dp.previous_owner_id]) sides[dp.previous_owner_id].sent.push(asset);
    });
    (tx.waiver_budget || []).forEach(wb => {
      const a = { kind: 'faab', id: 'FAAB' + wb.amount + '-' + wb.sender + '-' + wb.receiver, name: '$' + wb.amount + ' FAAB', pos: 'NA', value: 0 };
      if (sides[wb.receiver]) sides[wb.receiver].got.push(a);
      if (sides[wb.sender]) sides[wb.sender].sent.push(a);
    });
    const list = Object.values(sides);
    if (!list.some(s => s.got.length || s.sent.length)) return;
    out.push({
      id: tx.transaction_id, when: tx.created ? new Date(tx.created) : null,
      week: tx._week || tx.leg || null, creator: tx.creator, sides: list
    });
  });
  out.sort((a, b) => (b.when ? b.when.getTime() : 0) - (a.when ? a.when.getTime() : 0));
  out.forEach(tr => gradeTrade(tr));
  S._trades = out;
  return out;
}

const GRADES = [
  [0.55, 'A+'], [0.38, 'A'], [0.24, 'A−'], [0.14, 'B+'], [0.05, 'B'], [-0.05, 'B−'],
  [-0.14, 'C+'], [-0.24, 'C'], [-0.38, 'C−'], [-0.55, 'D'], [-Infinity, 'F']
];
function gradeLetter(score) {
  for (const [thr, g] of GRADES) if (score >= thr) return g;
  return 'F';
}
/** Score each side on value swing and on how well the pieces fit the roster.
 *  Values are today's market, so this reads a trade with hindsight — it is not a
 *  verdict on the decision at the time it was made. */
function gradeTrade(tr) {
  const demand = slotDemand();
  tr.sides.forEach(s => {
    s.gotValue = sum(s.got.map(a => a.value));
    s.sentValue = sum(s.sent.map(a => a.value));
    s.net = s.gotValue - s.sentValue;
    const base = Math.max(400, (s.gotValue + s.sentValue) / 2);
    s.valueEdge = clamp(s.net / base, -1.6, 1.6);
    // need fit: did the incoming pieces land where this roster is thin, and did
    // the outgoing pieces come from a spot it could afford to sell from?
    let fit = 0, n = 0;
    if (s.team) {
      const sc = scoutTeam(s.team);
      const zOf = (p) => { const e = sc.pos.find(x => x.pos === p); return e ? e.z : 0; };
      s.got.filter(a => a.kind === 'player').forEach(a => { fit += clamp(-zOf(a.pos), -1, 1); n++; });
      s.sent.filter(a => a.kind === 'player').forEach(a => { fit += clamp(zOf(a.pos), -1, 1) * 0.6; n++; });
    }
    s.needFit = n ? fit / n : 0;
    s.score = s.valueEdge + 0.3 * s.needFit;
    s.grade = gradeLetter(s.score);
  });
  const best = tr.sides.slice().sort((a, b) => b.score - a.score);
  tr.winner = best.length > 1 && Math.abs(best[0].score - best[1].score) > 0.08 ? best[0] : null;
  tr.margin = best.length > 1 ? best[0].score - best[1].score : 0;
  tr.totalValue = sum(tr.sides.map(s => s.gotValue));
  return tr;
}
/** Per-manager trading record. */
function traderStats() {
  const trades = parseTrades();
  const by = {};
  S.teams.forEach(t => by[t.rosterId] = {
    team: t, n: 0, net: 0, scores: [], wins: 0, losses: 0, partners: {},
    playersIn: 0, playersOut: 0, picksIn: 0, picksOut: 0, ageIn: [], ageOut: [], valueIn: 0, valueOut: 0
  });
  trades.forEach(tr => tr.sides.forEach(s => {
    const b = by[s.rosterId]; if (!b) return;
    b.n++; b.net += s.net; b.scores.push(s.score);
    if (tr.winner === s) b.wins++; else if (tr.winner) b.losses++;
    tr.sides.forEach(o => { if (o !== s) b.partners[o.rosterId] = (b.partners[o.rosterId] || 0) + 1; });
    s.got.forEach(a => {
      if (a.kind === 'player') { b.playersIn++; b.valueIn += a.value; if (a.ref && a.ref.age) b.ageIn.push(a.ref.age); }
      if (a.kind === 'pick') { b.picksIn++; b.valueIn += a.value; }
    });
    s.sent.forEach(a => {
      if (a.kind === 'player') { b.playersOut++; b.valueOut += a.value; if (a.ref && a.ref.age) b.ageOut.push(a.ref.age); }
      if (a.kind === 'pick') { b.picksOut++; b.valueOut += a.value; }
    });
  }));
  const list = Object.values(by);
  list.forEach(b => {
    b.avgScore = b.scores.length ? mean(b.scores) : null;
    b.grade = b.scores.length ? gradeLetter(b.avgScore) : null;
    const pk = Object.keys(b.partners).sort((x, y) => b.partners[y] - b.partners[x])[0];
    b.topPartner = pk ? { team: S.teamById[+pk], n: b.partners[pk] } : null;
    b.pickFlow = b.picksIn - b.picksOut;
    b.ageFlow = (b.ageIn.length ? mean(b.ageIn) : null);
    b.ageSent = (b.ageOut.length ? mean(b.ageOut) : null);
  });

}
/** Which way a manager's actual moves point, independent of their roster. */
function tradeDirection(stat) {
  if (!stat || !stat.n) return { label: 'Quiet', detail: 'No completed trades to read.' };
  const bits = [];
  let score = 0;
  if (stat.pickFlow >= 2) { score -= 1; bits.push('collecting picks'); }
  else if (stat.pickFlow <= -2) { score += 1; bits.push('spending picks'); }
  if (stat.ageFlow !== null && stat.ageSent !== null) {
    const d = stat.ageFlow - stat.ageSent;
    if (d >= 1.2) { score += 1; bits.push('taking on older players'); }
    else if (d <= -1.2) { score -= 1; bits.push('getting younger'); }
  }
  const label = score >= 1 ? 'Buying' : score <= -1 ? 'Selling' : 'Balanced';
  return { label, detail: bits.length ? bits.join(', ') : 'no clear directional pattern yet', score };
}
/** Roster window plus actual behaviour, reconciled. */
function projectedStrategy(t, stat) {
  const dir = tradeDirection(stat);
  const win = t.window;
  // A redraft league has no window to be in, so the read is simpler and it is
  // about this season only: are they good, and are they buying or selling it?
  if (!isDynasty()) {
    const strong = t.powerZ > 0.35, weak = t.powerZ < -0.35;
    const inPlay = S.sim && S.sim.by[t.rosterId] ? S.sim.by[t.rosterId].playoff : null;
    let headline, detail;
    if (strong && dir.label === 'Buying') { headline = 'Going for it'; detail = 'A strong roster and they are still adding. Expect them to pay up for a difference-maker.'; }
    else if (strong && dir.label === 'Selling') { headline = 'Selling from strength'; detail = 'Good enough to win and still moving pieces out — usually depth for a starter, so they will want quality back.'; }
    else if (weak && dir.label === 'Selling') { headline = 'Punting the season'; detail = 'Out of it and shipping useful players. The best place in the league to buy production cheaply.'; }
    else if (weak && dir.label === 'Buying') { headline = 'Chasing it'; detail = 'Behind and still buying. Either they like their odds more than the table does, or they are a soft touch.'; }
    else if (strong) { headline = 'Standing pat'; detail = 'Strong roster, no trades yet. Likely to move only for a clear upgrade.'; }
    else if (weak) { headline = 'Stuck'; detail = 'Weak roster, not trading. Worth an offer — they may not have realised the season is gone.'; }
    else headline = 'In the pack', detail = 'Middle of the table and not committed either way — the hardest kind of team to read.';
    if (inPlay !== null && inPlay < 0.12 && !/Punting|Stuck/.test(headline)) detail += ' The simulator gives them ' + pct(inPlay, 0) + ' to make the playoffs.';
    return { headline, detail, direction: dir, window: null };
  }
  const contending = ['Contend', 'Win-now'].includes(win);
  const rebuilding = ['Rebuild', 'Retool'].includes(win);
  let headline, detail;
  if (contending && dir.label === 'Buying') { headline = 'All-in'; detail = 'A contending roster and they are spending future capital to push it further.'; }
  else if (contending && dir.label === 'Selling') { headline = 'Selling high'; detail = 'Good enough to win now, but cashing pieces in — either hedging or they do not rate their own window.'; }
  else if (rebuilding && dir.label === 'Selling') { headline = 'Committed rebuild'; detail = 'Weak roster, moving veterans out for picks and youth. Expect them to keep selling.'; }
  else if (rebuilding && dir.label === 'Buying') { headline = 'Buying against the window'; detail = 'Adding win-now pieces to a roster that is not close. Often a source of value if they overpay.'; }
  else if (contending) { headline = 'Standing pat'; detail = 'Contending roster, no directional trading yet. Likely to buy if the price is right.'; }
  else if (rebuilding) { headline = 'Rebuilding quietly'; detail = 'Bottom of the table and not yet trading. A candidate to start selling veterans.'; }
  else headline = 'Middling', detail = 'Neither clearly contending nor rebuilding — the hardest kind of team to read.';
  return { headline, detail, direction: dir, window: win };
}
/* ================= weekly outlook helpers ================= */
/** Floor / median / ceiling for one player in one week. Seeded per player so the
 *  numbers hold still between renders instead of jittering on every click. */
function weekOutlook(p, wk) {
  /* In the week being played, a finished game is a fact rather than a
     distribution, and a game in progress only has the part that is left to
     play still in doubt. */
  const lv = wk === S.liveWeek ? liveValue(p, wk) : null;
  if (lv && lv.state === 'done') {
    return {
      mean: lv.used, floor: lv.used, median: lv.used, ceil: lv.used, sd: 0,
      bye: false, opp: lv.opp, bust: 0, boom: 0, state: 'done', actual: lv.actual, final: true
    };
  }
  const banked = lv ? lv.banked : 0;
  const m = lv ? lv.open : pw(p, wk);
  if (!(m > 0.05)) return {
    mean: banked, floor: banked, median: banked, ceil: banked, bye: !lv || lv.state === 'bye',
    opp: lv ? lv.opp : null, state: lv ? lv.state : 'bye', final: !!lv && lv.state !== 'upcoming'
  };
  const sd = volFromMean(p.pos, m), n = 3000;
  seedRng(hashStr(p.id + '|' + wk));
  const s = new Array(n);
  for (let i = 0; i < n; i++) s[i] = banked + (rnd() < BUST_RATE ? 0 : drawScore(m, sd));
  s.sort((a, b) => a - b);
  const mean = banked + m;
  return {
    mean: mean, sd, bye: false, opp: lv ? lv.opp : pwOpp(p, wk),
    floor: s[Math.floor(n * 0.1)], median: s[n >> 1], ceil: s[Math.floor(n * 0.9)],
    bust: s.filter(x => x < mean * 0.5).length / n, boom: s.filter(x => x > mean * 1.5).length / n,
    state: lv ? lv.state : null, actual: lv ? lv.actual : null, quarter: lv ? lv.quarter : null

}
/** Probability a outscores b in a given week, from independent paired draws. */
function pBeats(a, b, wk) {
  const ma = pwShown(a, wk), mb = pwShown(b, wk);
  if (!(ma > 0.05) && !(mb > 0.05)) return 0.5;
  const sa = volFromMean(a.pos, ma), sb = volFromMean(b.pos, mb);
  const n = 12000; let w = 0;
  seedRng(hashStr(a.id + '|' + b.id + '|' + wk));
  for (let i = 0; i < n; i++) {
    const x = ma > 0.05 ? (rnd() < BUST_RATE ? 0 : drawScore(ma, sa)) : 0;
    const y = mb > 0.05 ? (rnd() < BUST_RATE ? 0 : drawScore(mb, sb)) : 0;
    if (x > y) w++; else if (x === y) w += 0.5;
  }
  return w / n;
}

/* ================= 10. START / SIT ================= */
const LineupUI = { team: null, week: null, compare: [], openSlot: null };
function viewLineup() {
  const wrap = h('div.grid');
  const teams = S.teams;

  if (LineupUI.week === null) LineupUI.week = clamp(S.lastWeek + 1, 1, S.regEnd);
  const T = S.teamById[LineupUI.team];
  const wk = LineupUI.week;
  const act = activePlayers(T);
  const isLive = wk === S.liveWeek;
  const val = (p) => pwShown(p, wk);
  /* In the week being played the lineup is not a suggestion — it is whatever the
     manager actually set, with some of it already locked in. Re-optimising it
     would be advice about a decision that is no longer available. */
  const lineup = isLive ? liveLineupSlots(T, wk) : optimalLineup(act, p => pw(p, wk));
  const startIds = new Set(lineup.filter(s => s.player).map(s => s.player.id));
  const bench = act.filter(p => !startIds.has(p.id)).sort((a, b) => val(b) - val(a));
  const total = sum(lineup.map(s => s.player ? val(s.player) : 0));
  const played = wk <= S.lastWeek;
  const lr = isLive ? liveRoster(T, wk) : null;

  const weeks = []; for (let w = 1; w <= S.regEnd; w++) weeks.push(w);
  wrap.appendChild(card('Week ' + wk, null, h('div.row', { style: { gap: '14px' } },
    h('label.fld', { style: { minWidth: '230px' } }, 'Team',
      h('select', { onchange: e => { LineupUI.team = +e.target.value; LineupUI.compare = []; render(); } },
        teams.map(t => h('option', { value: t.rosterId, selected: t.rosterId === T.rosterId }, t.name)))),
    h('label.fld', 'Week', h('select', { onchange: e => { LineupUI.week = +e.target.value; LineupUI.compare = []; render(); } },
      weeks.map(w => h('option', { value: w, selected: w === wk },
        'Week ' + w + (w === S.liveWeek ? ' (live)' : w <= S.lastWeek ? ' (played)' : w === S.lastWeek + 1 ? ' (next)' : ''))))),
    h('span', { style: { flex: 1 } }),
    isLive ? h('span.tag', { style: { borderColor: 'var(--s1)', color: 'var(--s1)' } },
      '● Live — ' + fmt(lr.banked, 1) + ' scored, ' + (lr.leftN + lr.liveN) + ' of ' + lr.rows.length + ' still to finish')
      : played ? h('span.tag', 'This week has already been played — projections are shown for reference') : null)));

  // ---- the optimal lineup ----

    const p = s.player;
    const o = p ? weekOutlook(p, wk) : null;

    // elsewhere is not a choice you get to make
    // a swap is only a real choice while both players still have a game to play
    const swappable = (x) => !isLive || livePlayerState(x, wk) === 'upcoming';
    const alts = p ? bench.filter(x => (SLOT_ELIG[s.slot] || [s.slot]).includes(x.pos) && swappable(x))
      .sort((a, b) => val(b) - val(a)).slice(0, 3) : [];

    + 'A manager who sold a player before he got hurt will grade badly here and was still right. Need fit is judged against each roster as it stands now, for the same reason.')));

  // ---- every trade ----
  const assetChip = (a, dim) => h('div.asset', { style: { cursor: 'default', opacity: dim ? .75 : 1 } },
    a.kind === 'faab' ? h('span.pill.pos-NA', 'FAAB') : posPill(a.pos),
    a.kind === 'player' && a.ref ? pname(a.ref, { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } })
      : h('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, a.name),
    a.kind === 'pick' && a.slotLabel ? h('span.tiny.muted', { style: { flex: 'none' } }, 'proj ' + a.slotLabel) : null,
    a.value ? h('span.v', kfmt(Math.round(a.value))) : null);

  const gradeChip = (g) => {
    const good = /^A/.test(g), bad = /^[DF]/.test(g);
    return h('span.tag', {
      style: {
        fontWeight: 700, fontSize: '12px', padding: '2px 8px',
        borderColor: good ? 'var(--good)' : bad ? 'var(--critical)' : 'var(--border-strong)',
        color: good ? 'var(--good-text)' : bad ? 'var(--bad-text)' : 'var(--text-secondary)'
      }
    }, g);
  };

  const cards = trades.map(tr => h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--r)', padding: '12px 14px', background: 'var(--surface-2)' } },
    h('div.row', { style: { justifyContent: 'space-between', marginBottom: '9px' } },
      h('div.row', { style: { gap: '8px' } },
        h('b.tiny', tr.when ? tr.when.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : 'date unknown'),
        tr.week ? h('span.tag', 'week ' + tr.week) : null),
      tr.winner
        ? h('span.tiny', h('b', tr.winner.team ? tr.winner.team.name : '?'), ' comes out ahead')
        : h('span.tiny.muted', 'too close to call')),
    h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(260px,1fr))', gap: '12px' } },
      tr.sides.map(s => h('div', { style: { minWidth: 0, display: 'grid', gap: '7px' } },
        h('div.row', { style: { justifyContent: 'space-between', gap: '8px' } },
          h('div.row', { style: { gap: '7px', minWidth: 0 } },
            h('b', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, s.team ? s.team.name : 'roster ' + s.rosterId),
            tr.winner === s ? h('span.tag', { style: { borderColor: 'var(--good)', color: 'var(--good-text)' } }, 'won') : null),
          gradeChip(s.grade)),
        h('div', h('div.lbl', { style: { fontSize: '10px' } }, 'received · ' + kfmt(Math.round(s.gotValue))),
          h('div', { style: { display: 'grid', gap: '4px', marginTop: '3px' } }, s.got.length ? s.got.map(a => assetChip(a)) : h('span.tiny.muted', 'nothing'))),
        h('div', h('div.lbl', { style: { fontSize: '10px' } }, 'gave up · ' + kfmt(Math.round(s.sentValue))),
          h('div', { style: { display: 'grid', gap: '4px', marginTop: '3px' } }, s.sent.length ? s.sent.map(a => assetChip(a, true)) : h('span.tiny.muted', 'nothing'))),
        h('div.row', { style: { gap: '12px', borderTop: '1px solid var(--border)', paddingTop: '6px' } },
          h('span.tiny.sec', 'Value ', deltaTag(s.net, 0)),
          h('span.tiny.sec', 'Need fit ', h('b', { class: s.needFit > 0.1 ? 'up' : s.needFit < -0.1 ? 'down' : 'flat' },
            s.needFit > 0.35 ? 'strong' : s.needFit > 0.1 ? 'good' : s.needFit < -0.35 ? 'poor' : s.needFit < -0.1 ? 'weak' : 'neutral'))))))));
  wrap.appendChild(card('Every completed trade', trades.length + ' in this league, newest first', h('div', { style: { display: 'grid', gap: '10px' } }, cards)));

  // ---- manager table ----
  wrap.appendChild(card('Managers', 'value figures are at today’s prices', table([
    { k: 'name', h: 'Manager', sort: r => r.team.name, f: r => teamCell(r.team) },
    { k: 'n', h: 'Trades', num: true, f: r => h('b.mono', r.n) },
    { k: 'grade', h: 'Avg grade', sort: r => r.avgScore === null ? -99 : r.avgScore, f: r => r.grade ? gradeChip(r.grade) : h('span.muted.tiny', '—') },
    { k: 'net', h: 'Net value', num: true, f: r => r.n ? deltaTag(r.net, 0) : h('span.muted.tiny', '—') },
    { k: 'record', prio: 2, h: 'Won / lost', sortable: false, f: r => r.n ? h('span.mono', r.wins + ' – ' + r.losses) : '—' },
    { k: 'flow', prio: 2, h: 'Picks in/out', sortable: false, f: r => r.n ? h('span.mono.tiny', r.picksIn + ' / ' + r.picksOut) : '—' },
    { k: 'ageIn', prio: 2, h: 'Age acquired', num: true, sort: r => r.ageFlow || 0, f: r => r.ageFlow ? fmt(r.ageFlow, 1) : '—' },
    { k: 'ageOut', prio: 2, h: 'Age sent', num: true, sort: r => r.ageSent || 0, f: r => r.ageSent ? fmt(r.ageSent, 1) : '—' },
    { k: 'partner', prio: 2, h: 'Trades most with', sortable: false, f: r => r.topPartner && r.topPartner.team ? h('span.tiny', r.topPartner.team.name + ' (' + r.topPartner.n + ')') : h('span.muted.tiny', '—') }
  ], list, { sortKey: 'n', sortDir: -1 })));
  return wrap;
}
/* ==================================================================
   Expanded simulation surfaces + head-to-head
   ================================================================== */

/* ---------- leverage: which games actually decide the season ---------- */
const LevUI = { week: 'all', n: 6 };
function simLeverageCard(res) {
  if (!res.leverage || !res.leverage.length) return null;
  const weeks = []; for (let w = res.fromWeek; w <= S.regEnd; w++) if (res.leverage.some(g => g.week === w)) weeks.push(w);
  if (LevUI.week !== 'all' && !weeks.includes(LevUI.week)) LevUI.week = 'all';
  const picked = LevUI.week === 'all' ? res.leverage : res.leverage.filter(g => g.week === LevUI.week);
  const shown = picked.slice(0, LevUI.n);

  const opts = [{ k: 'all', label: 'Rest of season' }].concat(weeks.map(w => ({ k: w, label: 'Wk ' + w })));
  const controls = h('div.row', { style: { gap: '12px', marginBottom: '12px' } },
    segmented(opts, LevUI.week, k => { LevUI.week = k; LevUI.n = 6; render(); }),
    h('span', { style: { flex: 1 } }),
    h('span.tiny.muted', picked.length + ' game' + (picked.length === 1 ? '' : 's') + ' weighed'));

  const body = h('div', { style: { display: 'grid', gap: '12px' } }, shown.map((g, i) => {
    const A = g.a.team, B = g.b.team;
    // the two worlds this game leaves behind. Exactly one of them happens, so
    // "if A wins" is A's win-branch and B's lose-branch, and vice versa.
    const worlds = [
      { win: A, rows: [{ t: A, po: g.a.poWin, ti: g.a.tiWin, won: true }, { t: B, po: g.b.poLose, ti: g.b.tiLose, won: false }] },
      { win: B, rows: [{ t: A, po: g.a.poLose, ti: g.a.tiLose, won: false }, { t: B, po: g.b.poWin, ti: g.b.tiWin, won: true }] }
    ];
    const worldBox = (wd) => h('div', {
      style: {
        minWidth: 0, border: '1px solid var(--border)', borderRadius: 'var(--r-sm)',
        padding: '9px 11px', background: 'var(--surface-1)'
      }
    },
      h('div.tiny', { style: { fontWeight: 700, marginBottom: '7px', color: 'var(--text-primary)' } },
        'If ', h('span', { style: { color: 'var(--s1)' } }, wd.win.name), ' wins'),
      h('div', { style: { display: 'grid', gap: '6px' } }, wd.rows.map(r2 => h('div', {
        style: { display: 'grid', gridTemplateColumns: 'minmax(0,1fr) auto auto', gap: '8px', alignItems: 'center' }
      },
        h('span.tiny', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontWeight: r2.won ? 640 : 500, color: r2.won ? 'var(--text-primary)' : 'var(--text-secondary)' } }, r2.t.short),
        h('div.bar-track', { style: { width: isNarrow() ? '52px' : '74px', height: '8px' } },
          h('div.bar-fill', { style: { width: (clamp(r2.po, 0, 1) * 100) + '%', background: r2.won ? 'var(--s1)' : 'var(--text-muted)' } })),
        h('span.mono.tiny', { style: { minWidth: '92px', textAlign: 'right' } },
          h('b', pct(r2.po, 0)), h('span.muted', ' playoffs · '), h('b', pct(r2.ti, 1)), h('span.muted', ' title'))))));

    const tag = g.swing > 0.22 ? ['season-defining', 'var(--critical)'] : g.swing > 0.12 ? ['big one', 'var(--s4)'] : g.swing < 0.04 ? ['low stakes', 'var(--text-muted)'] : null;
    const lead = Math.abs(g.a.swing) >= Math.abs(g.b.swing) ? g.a : g.b;
    const sentence = `${lead.team.name} ${lead.swing >= 0.005 ? 'go from ' + pct(lead.poLose, 0) + ' to ' + pct(lead.poWin, 0) + ' to make the playoffs' : 'barely move either way'}`
      + (Math.abs(lead.titleSwing) > 0.004 ? `, and from ${pct(lead.tiLose, 1)} to ${pct(lead.tiWin, 1)} to win it` : '')
      + '.';

    return h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--r)', padding: '11px 13px', background: 'var(--surface-2)' } },
      h('div.row', { style: { justifyContent: 'space-between', marginBottom: '8px', gap: '8px' } },
        h('div.row', { style: { gap: '8px', minWidth: 0 } },
          h('b.mono.tiny', '#' + (i + 1)),
          h('span.tag', { style: { flex: 'none', borderColor: g.week === res.fromWeek ? 'var(--s1)' : null, color: g.week === res.fromWeek ? 'var(--s1)' : null } },
            'Week ' + g.week + (g.week === res.fromWeek ? ' · next up' : '')),
          h('b', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, A.name + '  v  ' + B.name),
          tag ? h('span.tag', { style: { borderColor: tag[1], color: tag[1], flex: 'none' } }, tag[0]) : null),
        h('span.tiny.muted', { style: { flex: 'none' } }, 'up to ' + pct(g.swing, 0) + ' of playoff odds on the line')),
      h('div.grid.split2', worldBox(worlds[0]), h('div.tiny.muted', { style: { textAlign: 'center', alignSelf: 'center' } }, 'or'), worldBox(worlds[1])),
      h('div.tiny.sec', { style: { marginTop: '8px', borderTop: '1px solid var(--border)', paddingTop: '7px' } }, sentence));
  }));

  const more = picked.length > shown.length
    ? h('div.row', { style: { marginTop: '11px', justifyContent: 'center' } },
      h('button.btn.sm', { onclick: () => { LevUI.n += 6; render(); } }, 'Show ' + Math.min(6, picked.length - shown.length) + ' more'))
    : null;

  // the whole remaining season at a glance, so nothing is hidden behind the top six
  const allTbl = table([
    { k: 'week', h: 'Week', num: true, sort: g => g.week, f: g => h('b.mono', g.week) },
    { k: 'game', h: 'Matchup', sortable: false, f: g => h('div.row', { style: { gap: '5px', minWidth: 0 } }, h('span.tiny', g.a.team.short), h('span.tiny.muted', 'v'), h('span.tiny', g.b.team.short)) },
    { k: 'swing', h: 'Playoff swing', num: true, sort: g => g.swing, f: g => h('div.meter', { style: { justifyContent: 'flex-end' } },
      isNarrow() ? null : h('div.bar-track', { style: { width: '64px' } }, h('div.bar-fill', { style: { width: (clamp(g.swing / 0.35, 0, 1) * 100) + '%', background: g.swing > 0.22 ? 'var(--critical)' : g.swing > 0.12 ? 'var(--s4)' : 'var(--seq-300)' } })),
      h('b.mono', pct(g.swing, 0))) },
    { k: 'title', prio: 2, h: 'Title swing', num: true, sort: g => Math.max(Math.abs(g.a.titleSwing), Math.abs(g.b.titleSwing)), f: g => pct(Math.max(Math.abs(g.a.titleSwing), Math.abs(g.b.titleSwing)), 1) },
    { k: 'fav', prio: 2, h: 'Most at stake', sortable: false, f: g => h('span.tiny', (Math.abs(g.a.swing) >= Math.abs(g.b.swing) ? g.a : g.b).team.name) }
  ], picked, { sortKey: 'swing', sortDir: -1 });
  const wt = withTable(h('div', controls, body, more), allTbl);

  return card(LevUI.week === 'all' ? 'Games that matter most — rest of season' : 'Games that matter most — week ' + LevUI.week,
    'every simulated season is split by who won each game, then read back. Each box is one of the two worlds the game leaves behind: where both teams stand if it goes that way.',
    wt.body, wt.btn);
}

/* ---------- playoff odds through the season ---------- */
function simTrajectoryCard(res) {
  const start = res.fromWeek, end = S.regEnd;
  if (end - start < 1) return null;
  const teams = S.teams.slice().sort((a, b) => res.by[b.rosterId].playoff - res.by[a.rosterId].playoff);
  const colors = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s7)'];
  const featured = teams.slice(0, 5).concat(teams.slice(-1));
  const colorOf = {}; featured.forEach((t, i) => colorOf[t.rosterId] = colors[i % colors.length]);
  // anchor the line on where the table actually stands right now, so the chart
  // reads as a race in progress rather than starting from nowhere
  const nowField = new Set(S.teams.slice()
    .sort((a, b) => (b.wins + 0.5 * b.ties) - (a.wins + 0.5 * a.ties) || b.fpts - a.fpts)
    .slice(0, res.playoffTeams).map(t => t.rosterId));
  const anchor = S.lastWeek >= 1 ? S.lastWeek : null;
  const pts = (t) => {
    const a = [];
    if (anchor) a.push({ x: anchor, y: nowField.has(t.rosterId) ? 100 : 0, label: 'Week ' + anchor + ' (actual)' });
    for (let w = start; w <= end; w++) a.push({ x: w, y: res.by[t.rosterId].fieldAt[w] * 100, label: 'Week ' + w });
    return a;
  };
  const bg = teams.filter(t => !colorOf[t.rosterId]).map(t => ({ name: t.name, color: 'var(--text-muted)', width: 1, opacity: .28, points: pts(t) }));
  const fg = featured.map(t => ({ name: t.name, color: colorOf[t.rosterId], width: 2, points: pts(t) }));
  const chart = lineChart(bg.concat(fg), {
    h: 250, dots: false, maxTip: 12, y0: 0, y1: 100, floorAtZero: true,
    yFmt: v => Math.round(v) + '%', xFmt: v => 'Wk ' + Math.round(v), xTicks: Math.min(6, end - start + (anchor ? 1 : 0)),
    aria: 'odds of sitting in the playoff field after each week'
  });
  const legend = h('div.legend', { style: { marginTop: '8px' } },
    featured.map(t => h('span', h('i', { style: { background: colorOf[t.rosterId] } }), t.name))
      .concat(bg.length ? [h('span', h('i', { style: { background: 'var(--text-muted)', opacity: .3 } }), bg.length + ' more')] : []));
  const tbl = table([
    { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) }
  ].concat(Array.from({ length: end - start + 1 }, (_, i) => ({
    k: 'w' + (start + i), h: 'W' + (start + i), num: true,
    sort: r => res.by[r.t.rosterId].fieldAt[start + i],
    f: r => pct(res.by[r.t.rosterId].fieldAt[start + i], 0)
  }))), teams.map(t => ({ t })), {});
  const wt = withTable(h('div', chart, legend), tbl);
  return card('Playoff position, week by week',
    'the share of simulated seasons in which each team is inside the cut with the season paused at that week'
    + (anchor ? ' — week ' + anchor + ' is where the real table stands today' : ''),
    wt.body, wt.btn);
}

/* ---------- seed distribution ---------- */
function simSeedCard(res) {
  const n = S.teams.length;
  const teams = S.teams.slice().sort((a, b) => res.by[a.rosterId].seed - res.by[b.rosterId].seed);
  const cols = Array.from({ length: n }, (_, i) => String(i + 1));
  const grid = heat(teams, cols, (t, c) => res.by[t.rosterId].seedDist[+c] * 100, {
    rowLabel: t => t.name,
    fmt: v => v < 0.5 ? '·' : Math.round(v) + '',
    tip: (t, c, v) => `<div class="k">${t.name} · ${ord(+c)} seed</div><b>${fmt(v, 1)}%</b> of simulated seasons`
      + (+c <= res.playoffTeams ? '<br>inside the playoff cut' : '<br>missed the playoffs')
  });
  return card('Where everyone finishes', 'percentage of simulated seasons ending at each seed — ' + res.playoffTeams + ' make the bracket',
    h('div', grid, h('div', { style: { marginTop: '10px' } }, seqLegend('never', 'often', 'Share of seasons'))));
}

/* ---------- schedule luck and strength ---------- */
function simLuckCard(res) {
  if (!res.simWeeks) return null;
  const rows = S.teams.map(t => ({ t, s: res.by[t.rosterId] })).filter(r => r.s.allPlayPct !== null);
  if (!rows.length) return null;
  const sos = rows.map(r => r.s.sos).filter(v => v !== null);
  const sosMean = sos.length ? mean(sos) : 0;
  const bars = rows.slice().sort((a, b) => b.s.luck - a.s.luck).map(r => ({
    label: r.t.name, v: r.s.luck,
    tip: `<div class="k">${r.t.name}</div>Projected to win <b>${fmt(r.s.simWins, 1)}</b> of the remaining ${res.simWeeks}<br>`
      + `Beats <b>${pct(r.s.allPlayPct, 0)}</b> of the league in a typical week, which is worth ${fmt(r.s.allPlayPct * res.simWeeks, 1)} wins<br>`
      + `Schedule is worth <b>${sgn(r.s.luck, 2)}</b> wins`
  }));
  return card('What the schedule is worth',
    'simulated wins minus the wins that scoring alone earns — blue means the remaining fixtures are doing a team a favour',
    h('div',
      divBar(bars, { labelW: isNarrow() ? '110px' : '170px', dec: 2 }),
      h('div.tiny.muted', { style: { marginTop: '10px' } },
        'A team that beats 60% of the league each week "deserves" 0.6 wins a week. The gap between that and the games it is actually projected to win is the schedule.'),
      table([
        { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) },
        { k: 'allplay', h: 'Beats', num: true, tip: 'Share of the league this team outscores in a typical remaining week', sort: r => r.s.allPlayPct, f: r => pct(r.s.allPlayPct, 0) },
        { k: 'w', h: 'Proj W', num: true, sort: r => r.s.simWins, f: r => h('b.mono', fmt(r.s.simWins, 1)) },
        { k: 'luck', h: 'Schedule', num: true, sort: r => r.s.luck, f: r => deltaTag(r.s.luck, 2, ' W') },
        { k: 'sos', prio: 2, h: 'Opponent PPG', num: true, tip: 'Average score the remaining opponents are projected to post', sort: r => r.s.sos || 0, f: r => r.s.sos === null ? '—' : h('span', { class: r.s.sos > sosMean ? 'down mono' : 'up mono' }, fmt(r.s.sos, 1)) },
        { k: 'pf', prio: 2, h: 'Season PF range', num: true, sortable: false, f: r => h('span.tiny.mono.muted', fmt(r.s.ptsP10, 0) + '–' + fmt(r.s.ptsP90, 0)) }
      ], rows, { sortKey: 'luck', sortDir: -1 })));
}

/* ---------- still alive ---------- */
function simAliveCard(res) {
  const start = res.fromWeek, end = S.regEnd;
  if (end - start < 2) return null;
  const rows = S.teams.map(t => {
    const s = res.by[t.rosterId];
    let outWeek = null;
    for (let w = start; w <= end; w++) if (s.aliveAt[w] < 0.5) { outWeek = w; break; }
    return { t, s, outWeek };
  }).sort((a, b) => (b.outWeek === null ? 99 : b.outWeek) - (a.outWeek === null ? 99 : a.outWeek) || b.s.playoff - a.s.playoff);
  const anyOut = rows.some(r => r.outWeek !== null);
  if (!anyOut) return null;
  return card('When the maths runs out',
    'the first week by which more than half the simulations have a team unable to reach the cut line on wins alone',
    table([
      { k: 'name', h: 'Team', sort: r => r.t.name, f: r => teamCell(r.t) },
      { k: 'out', h: 'Out of it by', sort: r => r.outWeek === null ? 99 : r.outWeek, f: r => r.outWeek === null ? h('span.tag', { style: { borderColor: 'var(--good)', color: 'var(--good-text)' } }, 'alive all season') : h('b', 'week ' + r.outWeek) },
      { k: 'playoff', h: 'Playoffs', num: true, sort: r => r.s.playoff, f: r => pct(r.s.playoff, 0) },
      { k: 'alive', prio: 2, h: 'Alive at the end', num: true, sort: r => r.s.aliveAt[S.regEnd], f: r => pct(r.s.aliveAt[S.regEnd], 0) }
    ], rows, { sortKey: 'out', sortDir: -1 }));
}

/* ---------- the week ranked: close games, mismatches, upsets ---------- */
function simWeekRankCard(res) {
  const games = (schedule()[res.onlyWeek - 1] || []);
  if (games.length < 2) return null;
  const rows = games.map(([a, b]) => {
    const A = S.teamById[a], B = S.teamById[b], ra = res.by[a], rb = res.by[b];
    if (!A || !B || !ra || !rb) return null;
    // the two score arrays are run-for-run aligned, so the margin needs no extra simulation
    const n = Math.min(ra.weekScores.length, rb.weekScores.length);
    const m = new Array(n);
    for (let i = 0; i < n; i++) m[i] = ra.weekScores[i] - rb.weekScores[i];
    m.sort((x, y) => x - y);
    const q = (p) => m[clamp(Math.floor(p * (n - 1)), 0, n - 1)];
    const favA = ra.weekWin >= rb.weekWin;
    return {
      A, B, ra, rb, favA,
      fav: favA ? A : B, dog: favA ? B : A,
      favP: Math.max(ra.weekWin, rb.weekWin),
      margin: Math.abs(q(0.5)),
      close: m.filter(x => Math.abs(x) <= 10).length / n,
      swing: Math.abs(ra.weekWin - rb.weekWin)
    };
  }).filter(Boolean);
  if (!rows.length) return null;
  const tightest = rows.slice().sort((x, y) => x.swing - y.swing)[0];
  const widest = rows.slice().sort((x, y) => y.swing - x.swing)[0];
  return card('The week at a glance',
    `closest game: ${tightest.A.short} v ${tightest.B.short} · biggest mismatch: ${widest.fav.short} over ${widest.dog.short}`,
    table([
      { k: 'game', h: 'Matchup', sortable: false, f: r => h('div.row', { style: { gap: '5px', minWidth: 0 } },
        h('b.tiny', r.fav.short), h('span.tiny.muted', 'v'), h('span.tiny', r.dog.short)) },
      { k: 'fav', h: 'Favourite', sortable: false, prio: 2, f: r => teamCell(r.fav, { sub: false }) },
      { k: 'p', h: 'Win prob', num: true, sort: r => r.favP, f: r => h('b.mono', pct(r.favP, 0)) },
      { k: 'margin', h: 'Median margin', num: true, sort: r => r.margin, f: r => h('span.mono', fmt(r.margin, 1)) },
      { k: 'close', h: 'One-score', num: true, tip: 'Chance the game finishes within ten points', sort: r => r.close, f: r => pct(r.close, 0) },
      { k: 'upset', h: 'Upset', num: true, sort: r => 1 - r.favP, f: r => {
        const u = 1 - r.favP;
        return h('span', { class: u > 0.4 ? 'up mono' : 'mono muted' }, pct(u, 0));
      } }
    ], rows, { sortKey: 'p', sortDir: 1 }));
}

/* ================= 12. HEAD TO HEAD ================= */
const H2HUI = { a: null, b: null, week: null, sims: 4000, res: null };

/** One week, both teams, many times: the distribution of the margin between them. */
function h2hSim(A, B, wk, n) {
  /* A week already under way is part settled: the finished games are banked and
     only the open slots are drawn, which is what makes the odds move as Sunday runs. */
  const live = wk === S.liveWeek;
  const lineup = (T) => {
    if (live) {
      const lr = liveRoster(T, wk);
      return { banked: lr.banked, arr: lr.open.map(r => ({ m: r.used, sd: volFromMean(r.p.pos, r.used) })) };
    }
    return {
      banked: 0,
      arr: optimalLineup(activePlayers(T), p => pw(p, wk))
        .map(s => {
          const pos = s.player ? s.player.pos : (SLOT_ELIG[s.slot] || [s.slot])[0];
          let m = s.player ? pw(s.player, wk) : 0;
          if (m <= 0.05) m = STREAM[pos] !== undefined ? STREAM[pos] : 0;
          return { m, sd: volFromMean(pos, m) };
        }).filter(x => x.m > 0.05)
    };
  };
  const la = lineup(A), lb = lineup(B);
  const draw = (l) => {
    let s = 0;
    for (let k = 0; k < l.arr.length; k++) { if (rnd() < BUST_RATE) continue; s += drawScore(l.arr[k].m, l.arr[k].sd); }
    return l.banked + Math.max(0, s * Math.max(0.55, 1 + 0.05 * gauss()));
  };
  seedRng(hashStr(A.rosterId + '|' + B.rosterId + '|' + wk) >>> 0);
  const margins = new Float64Array(n), sa = new Float64Array(n), sb = new Float64Array(n);
  let wins = 0, ties = 0;
  for (let i = 0; i < n; i++) {
    const x = draw(la), y = draw(lb);
    sa[i] = x; sb[i] = y; margins[i] = x - y;
    if (x > y) wins++; else if (x === y) ties++;
  }
  const q = (arr, p) => { const a = Array.from(arr).sort((x, y) => x - y); return a[clamp(Math.floor(p * (a.length - 1)), 0, a.length - 1)]; };
  const marr = Array.from(margins);
  return {
    n, pA: wins / n, pB: (n - wins - ties) / n, tie: ties / n,
    meanA: mean(Array.from(sa)), meanB: mean(Array.from(sb)),
    medMargin: q(margins, .5), loMargin: q(margins, .1), hiMargin: q(margins, .9),
    blowoutA: marr.filter(m => m > 30).length / n, blowoutB: marr.filter(m => m < -30).length / n,
    closeGame: marr.filter(m => Math.abs(m) <= 10).length / n,
    margins: marr, aScores: Array.from(sa), bScores: Array.from(sb)
  };
}

/** The weeks these two are scheduled against each other. */
function weeksBetween(A, B) {
  const sched = schedule(), out = [];
  for (let w = 1; w <= S.regEnd; w++) {
    const games = sched[w - 1] || [];
    if (games.some(g => (g[0] === A.rosterId && g[1] === B.rosterId) || (g[1] === A.rosterId && g[0] === B.rosterId))) out.push(w);
  }
  return out;
}

/** Every time these two have actually played. */
function h2hHistory(A, B) {
  const out = [];
  for (let w = 1; w <= S.lastWeek; w++) {
    const ms = S.matchups[w] || [];
    const ma = ms.find(m => m.roster_id === A.rosterId), mb = ms.find(m => m.roster_id === B.rosterId);
    if (!ma || !mb) continue;
    if (ma.matchup_id === null || ma.matchup_id === undefined || ma.matchup_id !== mb.matchup_id) continue;
    out.push({ week: w, a: ma.points || 0, b: mb.points || 0 });
  }
  return out;
}

function viewH2H() {
  const wrap = h('div.grid');
  const teams = S.teams;
  if (teams.length < 2) return wrap.appendChild(card('Head to head', null, h('div.empty', 'Need at least two teams.'))), wrap;
  if (H2HUI.a === null || !S.teamById[H2HUI.a]) H2HUI.a = S.myRosterId || teams[0].rosterId;
  if (H2HUI.b === null || !S.teamById[H2HUI.b] || H2HUI.b === H2HUI.a) H2HUI.b = (teams.find(t => t.rosterId !== H2HUI.a) || teams[0]).rosterId;
  const A = S.teamById[H2HUI.a], B = S.teamById[H2HUI.b];
  // one colour per team, held across every card on the page, so "blue" always
  // means the same franchise rather than "good"
  const CA = 'var(--s1)', CB = 'var(--s2)';
  /* Only offer the weeks these two actually play. Simulating week 4 between two
     teams who meet in weeks 2 and 11 is an answer to a question nobody asked. */
  const meet = A.rosterId === B.rosterId ? [] : weeksBetween(A, B);
  const allWeeks = []; for (let w = 1; w <= S.regEnd; w++) allWeeks.push(w);
  const weeks = meet.length ? meet : allWeeks;
  const next = meet.find(w => w > S.lastWeek);
  if (H2HUI.week === null || !weeks.includes(H2HUI.week)) {
    H2HUI.week = next || weeks[weeks.length - 1] || clamp(S.lastWeek + 1, 1, S.regEnd);
    H2HUI.res = null;
  }
  const wk = H2HUI.week;
  const isLive = wk === S.liveWeek;

  wrap.appendChild(card('Pick two teams', null, h('div.row', { style: { gap: '14px' } },
    h('label.fld', { style: { minWidth: '210px' } }, 'Team A',
      h('select', { onchange: e => { H2HUI.a = +e.target.value; H2HUI.res = null; render(); } },
        teams.map(t => h('option', { value: t.rosterId, selected: t.rosterId === A.rosterId }, t.name)))),
    h('label.fld', { style: { minWidth: '210px' } }, 'Team B',
      h('select', { onchange: e => { H2HUI.b = +e.target.value; H2HUI.res = null; render(); } },
        teams.map(t => h('option', { value: t.rosterId, selected: t.rosterId === B.rosterId }, t.name)))),
    h('label.fld', meet.length ? (meet.length === 1 ? 'They meet once' : 'They meet ' + meet.length + ' times') : 'Neutral week',
      h('select', { onchange: e => { H2HUI.week = +e.target.value; H2HUI.res = null; render(); } },

    h('label.fld', ' ', h('button.btn', { onclick: () => { const t = H2HUI.a; H2HUI.a = H2HUI.b; H2HUI.b = t; H2HUI.res = null; render(); } }, '⇄ Swap')),
    h('span', { style: { flex: 1 } }),
    meet.length
      ? h('span.tiny.muted', { style: { maxWidth: '300px' } },
        meet.length === 1
          ? 'Week ' + meet[0] + ' is the only week these two play each other.'
          : 'Weeks ' + meet.slice(0, -1).join(', ') + ' and ' + meet[meet.length - 1] + ' are the only weeks these two play each other.')
      : h('span.tiny.muted', { style: { maxWidth: '320px', color: 'var(--text-secondary)' } },
        A.short + ' and ' + B.short + ' never meet this season, so this is a neutral matchup — pick any week and both lineups are set for it.')
  )));
  if (A.rosterId === B.rosterId) return wrap.appendChild(card(null, null, h('div.empty', 'Pick two different teams.'))), wrap;

  /* ---- the headline: this week, straight up ---- */
  if (!H2HUI.res || H2HUI.res.key !== A.rosterId + '|' + B.rosterId + '|' + wk) {
    H2HUI.res = Object.assign(h2hSim(A, B, wk, H2HUI.sims), { key: A.rosterId + '|' + B.rosterId + '|' + wk });
  }
  const r = H2HUI.res;
  const favA = r.pA >= r.pB;
  wrap.appendChild(h('div.grid', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } },
    kpi(A.short + ' win', pct(r.pA, 0), (isLive ? 'live ' : 'projected ') + fmt(r.meanA, 1) + ' pts'),
    kpi(B.short + ' win', pct(r.pB, 0), (isLive ? 'live ' : 'projected ') + fmt(r.meanB, 1) + ' pts'),
    kpi('Typical margin', (favA ? A.short : B.short) + ' by ' + fmt(Math.abs(r.medMargin), 1), 'median across ' + kfmt(r.n) + ' runs'),
    kpi('One-score game', pct(r.closeGame, 0), 'within 10 points'),
    kpi('Blowout', pct(Math.max(r.blowoutA, r.blowoutB), 0), (r.blowoutA > r.blowoutB ? A.short : B.short) + ' by 30+')
  ));

  const NB = 25;
  const sortedM = r.margins.slice().sort((x, y) => x - y);
  const mq = (q) => sortedM[clamp(Math.floor(q * (sortedM.length - 1)), 0, sortedM.length - 1)];
  // run the axis to the half-percentile so the end bars are not a pile of clipped tail
  let lo = mq(0.004), hi = mq(0.996);
  const span = Math.max(1, hi - lo); lo = Math.min(lo, -span * 0.04); hi = Math.max(hi, span * 0.04);
  const bw = (hi - lo) / NB;
  const bins = Array.from({ length: NB }, (_, i) => {
    const x0 = lo + i * bw;
    return { x: Math.round(x0 + bw / 2), v: 0, color: x0 + bw / 2 >= 0 ? CA : CB, label: (x0 >= 0 ? A.short : B.short) + ' by ' + fmt(Math.abs(x0 + bw / 2), 0) };
  });
  r.margins.forEach(m => { const i = clamp(Math.floor((m - lo) / bw), 0, NB - 1); bins[i].v++; });
  bins.forEach(b => b.v /= r.n);
  wrap.appendChild(card('Margin, week ' + wk, A.name + ' to the right, ' + B.name + ' to the left — '
    + (isLive ? 'points already scored are banked; only the open slots are drawn' : 'both lineups set optimally for this week'),
    h('div', histogram(bins, { h: 190, w: chartW(1040, 360), stretch: true, rule: 0, aria: 'margin distribution' }),
      h('div.tiny.muted', { style: { marginTop: '8px' } },
        `Middle 80% of outcomes run from ${(r.loMargin >= 0 ? A.short + ' by ' : B.short + ' by ')}${fmt(Math.abs(r.loMargin), 0)} to `
        + `${(r.hiMargin >= 0 ? A.short + ' by ' : B.short + ' by ')}${fmt(Math.abs(r.hiMargin), 0)}.`))));

  /* ---- slot by slot ---- */
  // laid out as a mirror: each side's player on the outside, their number just
  // inside it, and the slot itself down the middle. Reading across a row you get
  // "this player, this many, at this spot, this many, that player".
  function slotLadder(rows, A, B, CA, CB, isLive, wk) {
    const cw = 'minmax(0,1fr) 64px 74px 64px minmax(0,1fr)';
    const head = h('div.ladderrow.ladderhd', { style: { gridTemplateColumns: cw } },
      h('b.tiny', { style: { textAlign: 'right', color: CA } }, A.short),
      h('span.tiny.muted', { style: { textAlign: 'right' } }, isLive ? 'Pts' : 'Proj'),
      h('span.tiny.muted', { style: { textAlign: 'center' } }, 'Slot'),
      h('span.tiny.muted', isLive ? 'Pts' : 'Proj'),
      h('b.tiny', { style: { color: CB } }, B.short));
    const num = (v, won, col) => h('span.mono', {
      style: { fontWeight: won ? 700 : 500, color: won ? col : 'var(--text-secondary)' }
    }, fmt(v, 1));
    // a fixed slot already names the position, so the pill only earns its place
    // where the slot accepts more than one — flex and superflex
    const flexy = (slot, pl) => pl && (SLOT_ELIG[slot] || [slot]).length > 1 ? posPill(pl.pos) : null;
    return h('div', { style: { display: 'grid' } }, [head].concat(rows.map(r2 => h('div.ladderrow', { style: { gridTemplateColumns: cw } },
      h('div.pl.l', r2.a
        ? [isLive ? liveBadge(r2.a, wk) : null, flexy(r2.slot, r2.a), pname(r2.a, { mirror: true, style: { fontWeight: r2.d > 0 ? 640 : 500 } })]
        : h('span.muted.tiny', 'empty')),
      h('div', { style: { textAlign: 'right' } }, num(r2.va, r2.d > 0, CA)),
      h('div', { style: { textAlign: 'center' } }, h('span.tag', { style: { minWidth: '46px', textAlign: 'center' } }, SLOT_LABEL[r2.slot] || r2.slot)),
      h('div', num(r2.vb, r2.d < 0, CB)),
      h('div.pl.r', r2.b
        ? [pname(r2.b, { style: { fontWeight: r2.d < 0 ? 640 : 500 } }), flexy(r2.slot, r2.b), isLive ? liveBadge(r2.b, wk) : null]
        : h('span.muted.tiny', 'empty'))))));
  }

  const la = isLive ? liveLineupSlots(A, wk) : optimalLineup(activePlayers(A), p => pw(p, wk));
  const lb = isLive ? liveLineupSlots(B, wk) : optimalLineup(activePlayers(B), p => pw(p, wk));
  const slotRows = la.map((sa, i) => {
    const sb = lb[i] || {};
    const va = sa.player ? pwShown(sa.player, wk) : 0, vb = sb.player ? pwShown(sb.player, wk) : 0;
    return { slot: sa.slot, a: sa.player, b: sb.player, va, vb, d: va - vb };
  });
  const aWon = slotRows.filter(x => x.d > 0).length;
  // a five-column table with two player names in it does not fit a phone, so on
  // narrow screens each slot becomes two stacked lines instead
  const slotStack = h('div', { style: { display: 'grid', gap: '2px' } }, slotRows.map(r2 => {
    const line = (pl, v, won, col) => h('div.row', { style: { gap: '6px', minWidth: 0 } },
      pl ? posPill(pl.pos) : h('span.pill.pos-NA', '—'),
      pl ? pname(pl, { style: { fontWeight: won ? 640 : 500 } }) : h('span.muted.tiny', 'empty'),
      pl && isLive ? liveBadge(pl, wk) : null,
      h('span', { style: { flex: 1 } }),
      h('span.mono.tiny', { style: { fontWeight: won ? 700 : 500, color: won ? col : 'var(--text-muted)' } }, fmt(v, 1)));
    return h('div', { style: { borderBottom: '1px solid var(--grid)', padding: '7px 0' } },
      h('div.row', { style: { gap: '7px', marginBottom: '3px' } },
        h('span.tag', { style: { minWidth: '44px', textAlign: 'center' } }, SLOT_LABEL[r2.slot] || r2.slot),
        h('span', { style: { flex: 1 } }),
        h('span.tiny.mono', { class: r2.d > 0 ? 'up' : r2.d < 0 ? 'down' : 'flat' }, sgn(r2.d, 1))),
      line(r2.a, r2.va, r2.d > 0, CA), line(r2.b, r2.vb, r2.d < 0, CB));
  }));
  wrap.appendChild(card('Slot by slot — week ' + wk,
    `${A.short} wins ${aWon} of ${slotRows.length} slots ${isLive ? 'so far' : 'on projection'} · totals ${fmt(sum(slotRows.map(x => x.va)), 1)} to ${fmt(sum(slotRows.map(x => x.vb)), 1)}`
    + (isLive ? ' · points already scored are shown as scored' : ''),
    isNarrow() ? slotStack : slotLadder(slotRows, A, B, CA, CB, isLive, wk)));

  /* ---- the franchises, not just this week ---- */
  const metrics = [
    { k: 'Starting lineup now', a: A.now, b: B.now, d: 1, tip: 'Projected points per week from the optimal lineup' },
    isDynasty() ? { k: 'Future lineup', a: A.future, b: B.future, d: 1, tip: 'Age-adjusted projection two to three seasons out' } : null,
    { k: capitalLabel(), a: A.totalValue, b: B.totalValue, d: 0, tip: isDynasty() ? 'Players plus draft picks at today’s market' : 'Every rostered player at today’s redraft market' },
    isDynasty() ? { k: 'Roster value', a: A.rosterValue, b: B.rosterValue, d: 0 } : null,
    isDynasty() ? { k: 'Pick capital', a: A.pickCapital, b: B.pickCapital, d: 0 } : null,
    { k: 'Points for', a: A.fpts, b: B.fpts, d: 1 },
    { k: 'Points against', a: A.fptsAgainst, b: B.fptsAgainst, d: 1, invert: true, tip: 'What their opponents have scored on them — lower is a kinder draw' },
    isDynasty() ? { k: 'Average age', a: A.age || 0, b: B.age || 0, d: 1, invert: true, tip: 'Value-weighted — younger is usually the more valuable asset base' } : null
  ].filter(Boolean);
  const scaleOf = (m) => { const mx = Math.max(Math.abs(m.a), Math.abs(m.b), 0.0001); return (m.a - m.b) / mx; };
  const cw = isNarrow() ? '62px 1fr 62px' : '92px 1fr 92px';
  const aWins = metrics.filter(m => m.invert ? m.a < m.b : m.a > m.b).length;
  wrap.appendChild(card('The two franchises', `${A.short} leads ${aWins} of these ${metrics.length}`,
    h('div', { style: { display: 'grid', gap: '7px' } }, [
      h('div', { style: { display: 'grid', gridTemplateColumns: cw, gap: '10px', alignItems: 'center', paddingBottom: '2px' } },
        h('b.tiny', { style: { textAlign: 'right', color: CA } }, A.short),
        h('div'),
        h('b.tiny', { style: { color: CB } }, B.short))
    ].concat(metrics.map(m => {
      const lead = m.invert ? (m.a < m.b) : (m.a > m.b);
      const row = h('div', { style: { display: 'grid', gridTemplateColumns: cw, gap: '10px', alignItems: 'center' } },
        h('span.mono.tiny', { style: { textAlign: 'right', fontWeight: lead ? 700 : 500, color: lead ? CA : 'var(--text-muted)' } }, m.d ? fmt(m.a, m.d) : kfmt(Math.round(m.a))),
        h('div',
          h('div.tiny.muted', { style: { textAlign: 'center', marginBottom: '2px' } }, m.k),
          h('div', { style: { position: 'relative', height: '9px', background: 'var(--div-neutral)', borderRadius: '3px' } },
            h('div', {
              style: {
                position: 'absolute', top: 0, bottom: 0, borderRadius: '3px',
                left: scaleOf(m) >= 0 ? '50%' : (50 + scaleOf(m) * 50) + '%',
                width: Math.abs(scaleOf(m)) * 50 + '%',

        h('span.mono.tiny', { style: { fontWeight: !lead ? 700 : 500, color: !lead ? CB : 'var(--text-muted)' } }, m.d ? fmt(m.b, m.d) : kfmt(Math.round(m.b))));
      if (m.tip) bindTT(row, `<div class="k">${m.k}</div>${m.tip}`);
      return row;
    })))));

  /* ---- positional edge ---- */
  const posRows = POS4.map(p => ({
    pos: p, aNow: A.posNow[p] || 0, bNow: B.posNow[p] || 0,
    aVal: A.posValue[p] || 0, bVal: B.posValue[p] || 0
  }));
  wrap.appendChild(h('div.grid.split',
    card('Positional edge — this season', 'starting output per week · right is ' + A.short + ', left is ' + B.short,
      divBar(posRows.map(x => ({ label: x.pos, v: x.aNow - x.bNow, tip: `<div class="k">${x.pos}</div>${A.short} ${fmt(x.aNow, 1)} · ${B.short} ${fmt(x.bNow, 1)}` })), { labelW: '48px', dec: 1, posColor: CA, negColor: CB })),
    card('Positional edge — ' + valueWord() + ' value', 'market value at each position',
      divBar(posRows.map(x => ({ label: x.pos, v: x.aVal - x.bVal, vl: sgn((x.aVal - x.bVal) / 1000, 1) + 'k', tip: `<div class="k">${x.pos}</div>${A.short} ${kfmt(Math.round(x.aVal))} · ${B.short} ${kfmt(Math.round(x.bVal))}` })), { labelW: '48px', dec: 0, posColor: CA, negColor: CB }))));

  /* ---- season outlook, if a sim exists ---- */
  if (S.sim && S.sim.by[A.rosterId] && S.sim.by[B.rosterId]) {
    const sa = S.sim.by[A.rosterId], sb = S.sim.by[B.rosterId];
    const row = (label, va, vb, f) => h('div', { style: { display: 'grid', gridTemplateColumns: isNarrow() ? '58px 1fr 58px' : '74px 1fr 74px', gap: '10px', alignItems: 'center' } },
      h('span.mono.tiny', { style: { textAlign: 'right', fontWeight: va >= vb ? 700 : 500 } }, f(va)),
      h('div', h('div.tiny.muted', { style: { textAlign: 'center', marginBottom: '2px' } }, label),
        oddsBar([{ v: va, color: CA }, { v: Math.max(0.0001, vb), color: CB }], { h: 8 })),
      h('span.mono.tiny', { style: { fontWeight: vb > va ? 700 : 500 } }, f(vb)));
    wrap.appendChild(card('Season outlook', 'from the last full-season simulation you ran',
      h('div', { style: { display: 'grid', gap: '8px' } },
        row('Projected wins', sa.wins, sb.wins, v => fmt(v, 1)),
        row('Playoff odds', sa.playoff, sb.playoff, v => pct(v, 0)),
        row('Title odds', sa.title, sb.title, v => pct(v, 1)),
        row('Average seed', S.teams.length + 1 - sa.seed, S.teams.length + 1 - sb.seed, v => ord(Math.round(S.teams.length + 1 - v))))));
  }

  else {
    wrap.appendChild(card('Season outlook', 'needs a full-season simulation to compare playoff and title odds',
      h('div.row', { style: { gap: '12px' } },
        h('button.btn.pri', {
          onclick: () => { S.sim = simulate(2000); SimUI.res = S.sim; SimUI.mode = 'season'; render(); }
        }, 'Run 2,000 seasons'),
        h('span.tiny.muted', 'the Simulator tab keeps the full result'))));
  }

  /* ---- what they have actually done to each other ---- */
  const hist = h2hHistory(A, B);
  if (hist.length) {

    hist.forEach(g => { if (g.a > g.b) aw++; else if (g.b > g.a) bw++; });
    wrap.appendChild(card('When they have actually met', `${aw}–${bw} to ${aw >= bw ? A.name : B.name} this season`,
      table([
        { k: 'week', h: 'Week', num: true, f: g => h('b.mono', g.week) },

/* ================= next year's draft order ================= */
/** The soonest draft any roster still holds a pick in. */
function nextDraftSeason() {
  let best = null;
  S.teams.forEach(t => (t.pickAssets || []).forEach(pk => { if (best === null || pk.season < best) best = pk.season; }));
  return best;
}
/** Who actually holds the pick a given team originally owned. */
function pickHolder(origRosterId, season, round) {
  for (const t of S.teams) {
    const hit = (t.pickAssets || []).find(pk => pk.origRosterId === origRosterId && pk.season === season && pk.round === round);
    if (hit) return t;
  }
  return null;   // not held by anyone in this league — already used, or outside the window

/** Where each team is heading in the next draft, and who will actually be making
 *  the pick. The order comes out of the same simulation as everything else. */
function simDraftCard(res) {
  const rows = S.teams.map(t => ({ t, s: res.by[t.rosterId] }))
    .filter(r => r.s && r.s.draftSlot > 0);
  if (!rows.length) return null;
  rows.sort((a, b) => a.s.draftSlot - b.s.draftSlot);
  const season = nextDraftSeason();
  // the rounds this league actually drafts, as far as anyone still holds picks
  const rounds = [];
  if (season !== null) {
    S.teams.forEach(t => (t.pickAssets || []).forEach(pk => {
      if (pk.season === season && !rounds.includes(pk.round)) rounds.push(pk.round);
    }));
    rounds.sort((a, b) => a - b);
  }
  const slotLabel = (v) => Math.round(v * 10) / 10;
  const modal = (d) => { let b = 1; for (let i = 1; i < d.length; i++) if (d[i] > d[b]) b = i; return b; };
  // the slots holding the middle 80% of the outcomes
  const band = (d) => {
    const cum = []; let run = 0;
    for (let i = 1; i < d.length; i++) { run += d[i]; cum[i] = run; }
    let lo = 1, hi = d.length - 1;
    for (let i = 1; i < d.length; i++) if (cum[i] >= 0.1) { lo = i; break; }
    for (let i = 1; i < d.length; i++) if (cum[i] >= 0.9) { hi = i; break; }
    return { lo, hi };

    if (!isDynasty() || season === null) return h('span.muted.tiny', '—');
    const away = [];
    rounds.forEach(rd => {
      const holder = pickHolder(r.t.rosterId, season, rd);
      if (holder && holder.rosterId !== r.t.rosterId) away.push({ rd, holder });
    });
    if (!away.length) return h('span.tiny.muted', 'all their own');
    return h('div.row', { style: { gap: '4px' } }, away.map(x =>
      bindTT(h('span.tag.traded', (ROUND_WORD[x.rd] || x.rd + 'th') + ' → ' + x.holder.short),

    (t.pickAssets || []).some(pk => pk.origRosterId !== t.rosterId && pk.season === season));
